<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Travessia Pantaneira</title>
<style>
:root{--main:#558b2f;--deep:#33691e;--soft:#f1f8e9;--line:#dcedc8;--ink:#1f2a17;--mut:#56634c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:var(--ink);line-height:1.45}
.wrap{max-width:780px;margin:0 auto;padding:12px 14px 40px}
a.hub{color:var(--deep);font-weight:700;text-decoration:none;font-size:.9rem}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
h1{font-size:1.4rem;color:var(--deep)}h2{font-size:1.15rem;color:var(--deep);margin-bottom:6px}
.hud{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--soft);color:var(--deep);border-radius:99px;padding:5px 11px;font-weight:700;font-size:.86rem}
.card{border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;background:#fff}
.btn{background:var(--main);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--deep)}.btn.ghost{background:#fff;color:var(--deep);border:2px solid var(--main)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.small{font-size:.86rem;color:var(--mut)}
canvas{width:100%;max-width:620px;margin:0 auto;display:block;border:2px solid var(--line);border-radius:16px;touch-action:none;background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:6px;justify-content:center;margin-top:10px}
.pad button{border:2px solid var(--line);background:var(--soft);border-radius:12px;font-size:1.4rem;cursor:pointer;color:var(--deep);touch-action:manipulation}
.pad button:active{background:#dcedc8}
.tab{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:8px}.tab td{border-bottom:1px solid var(--line);padding:5px 4px;vertical-align:top}
.ops{display:grid;gap:8px;margin-top:10px}
.ops button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-size:.95rem;cursor:pointer;font-family:inherit;text-align:left;color:var(--ink)}
.ops button:hover{border-color:var(--main)}.ops button:disabled{opacity:.5;cursor:default}
.fb{margin-top:10px;padding:11px 13px;border-radius:12px;font-size:.93rem}
.fb.good{background:#e8f5e9;color:#1b5e20}.fb.bad{background:#ffebee;color:#8e1b1b}
.big{font-size:2.3rem;font-weight:800;color:var(--deep)}
.ranking{border:3px solid var(--main);border-radius:18px;padding:0 16px 12px;overflow:hidden;margin-top:12px}
.ranking h3{font-size:1rem;margin:0 -16px 8px;padding:10px 16px;background:var(--main);color:#fff}
.ranking ol{list-style:none}.ranking li{display:flex;justify-content:space-between;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:.92rem}
.ranking li:last-child{border-bottom:0}.rp{display:inline-block;min-width:2.1em;font-weight:800;color:var(--deep)}
.savebox{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.savebox input{flex:1;min-width:160px;border:2px solid var(--line);border-radius:12px;padding:11px;font-size:1rem;font-family:inherit}
</style>
</head>
<body>
<div class="wrap">
<a class="hub" href="https://ernandes-sobreira.github.io/jogos-ambientais/">← Todos os jogos</a>
<header>
  <h1><svg viewBox="0 0 210 130" width="44" height="28" style="vertical-align:-5px" aria-label="capivara"><defs><linearGradient id="cp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a5754f"/><stop offset="1" stop-color="#7d5536"/></linearGradient></defs><ellipse cx="105" cy="122" rx="80" ry="6" fill="#000" opacity=".12"/><rect x="44" y="94" width="15" height="26" rx="6" fill="#6e4a2f"/><rect x="66" y="96" width="14" height="24" rx="6" fill="#5e3f28"/><rect x="118" y="96" width="15" height="24" rx="6" fill="#6e4a2f"/><rect x="137" y="98" width="14" height="22" rx="6" fill="#5e3f28"/><path d="M26 72 C24 44 52 30 96 30 C124 30 142 36 150 48 L154 98 C130 108 90 108 56 104 C36 100 28 90 26 72 Z" fill="url(#cp)"/><path d="M136 42 C146 34 164 32 182 36 C194 39 202 44 204 52 L206 80 C206 88 200 94 190 95 L158 96 C146 96 140 88 138 76 Z" fill="url(#cp)"/><path d="M196 46 C202 48 205 52 205 58 L195 60 C193 54 193 49 196 46 Z" fill="#5e3f28"/><ellipse cx="200" cy="52" rx="2.6" ry="1.8" fill="#24170e"/><path d="M186 82 C192 84 198 84 204 82" stroke="#5e3f28" stroke-width="2" fill="none"/><ellipse cx="143" cy="34" rx="7" ry="5.5" fill="#7d5536"/><ellipse cx="143" cy="35" rx="3.5" ry="2.6" fill="#4b301e"/><circle cx="163" cy="45" r="3.8" fill="#1a110b"/><circle cx="164.2" cy="43.8" r="1.2" fill="#fff"/></svg> Travessia Pantaneira</h1>
  <div class="hud" id="hud" style="display:none"><span class="pill" id="hF">Fase 1/3</span><span class="pill" id="hP">0 pts</span><span class="pill" id="hV">❤️ 3</span><span class="pill" id="hR">🏡 0</span><span class="pill" id="hT">⏱ 0</span></div>
</header>
<main id="tela"></main>
<div class="ranking" id="rankBox"><h3>Ranking Global</h3><ol id="rankList"><li><span>Carregando o ranking...</span></li></ol><p class="small" id="rankNote"></p></div>
</div>
<script>
const $=id=>document.getElementById(id);
const CAP=new Image();CAP.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 130"><defs><linearGradient id="cp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a5754f"/><stop offset="1" stop-color="#7d5536"/></linearGradient></defs><ellipse cx="105" cy="122" rx="80" ry="6" fill="#000" opacity=".12"/><rect x="44" y="94" width="15" height="26" rx="6" fill="#6e4a2f"/><rect x="66" y="96" width="14" height="24" rx="6" fill="#5e3f28"/><rect x="118" y="96" width="15" height="24" rx="6" fill="#6e4a2f"/><rect x="137" y="98" width="14" height="22" rx="6" fill="#5e3f28"/><path d="M26 72 C24 44 52 30 96 30 C124 30 142 36 150 48 L154 98 C130 108 90 108 56 104 C36 100 28 90 26 72 Z" fill="url(#cp)"/><path d="M136 42 C146 34 164 32 182 36 C194 39 202 44 204 52 L206 80 C206 88 200 94 190 95 L158 96 C146 96 140 88 138 76 Z" fill="url(#cp)"/><path d="M196 46 C202 48 205 52 205 58 L195 60 C193 54 193 49 196 46 Z" fill="#5e3f28"/><ellipse cx="200" cy="52" rx="2.6" ry="1.8" fill="#24170e"/><path d="M186 82 C192 84 198 84 204 82" stroke="#5e3f28" stroke-width="2" fill="none"/><ellipse cx="143" cy="34" rx="7" ry="5.5" fill="#7d5536"/><ellipse cx="143" cy="35" rx="3.5" ry="2.6" fill="#4b301e"/><circle cx="163" cy="45" r="3.8" fill="#1a110b"/><circle cx="164.2" cy="43.8" r="1.2" fill="#fff"/></svg>');
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let actx=null;function beep(f,d,v){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.setValueAtTime(v||.05,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(e){}}

/* Linhas: 0 banhado com abrigos, 1-3 pista de cima, 4 canteiro, 5-7 pista de baixo, 8 campo de partida.
   Velocidades e quantidade de veículos são regras do jogo. */
const COLS=11,ROWS=9,ABRIGOS=[1,3,5,7,9];
const VEIC={carro:{ic:'🚗',len:1},pick:{ic:'🛻',len:1},onibus:{ic:'🚌',len:2},boi:{ic:'🚛',len:2}};
const FASES=[
 {nome:'Estrada de terra',meta:3,dur:90,mult:1,radar:-1,tunel:false,
  faixas:{1:['carro',1.4,3],2:['pick',-1.1,3],3:['carro',1.7,3],5:['pick',-1.3,3],6:['onibus',1.0,2],7:['carro',-1.5,3]},
  txt:'Leve as capivaras do campo até o banhado do outro lado. Elas precisam atravessar duas pistas.'},
 {nome:'Rodovia movimentada',meta:4,dur:90,mult:1.3,radar:6,tunel:false,
  faixas:{1:['boi',1.6,2],2:['carro',-2.0,3],3:['pick',1.8,3],5:['carro',-2.2,3],6:['boi',1.5,2],7:['pick',-1.9,3]},
  txt:'Mais carros e caminhões boiadeiros. Numa das faixas há um radar 📸: ali os carros andam mais devagar.'},
 {nome:'Fim de semana na pista',meta:5,dur:100,mult:1.8,radar:2,tunel:true,
  faixas:{1:['carro',2.4,3],2:['boi',-1.9,2],3:['carro',2.6,3],5:['boi',-2.1,2],6:['carro',2.6,3],7:['onibus',-2.0,2]},
  txt:'O trânsito ficou pesado. Agora há passagens de fauna 🕳️ com cerca: elas levam a capivara por baixo da pista de baixo.'}
];
const TUNEIS=[2,8];
const PERG=[
 {q:'Segundo estimativa do Centro Brasileiro de Estudos em Ecologia de Estradas (UFLA), quantos animais silvestres morrem atropelados por ano no Brasil?',o:['Cerca de 475 milhões','Cerca de 4 mil','Cerca de 5 bilhões']},
 {q:'Por que controlar a velocidade na estrada ajuda a fauna?',o:['Com o carro mais devagar, o motorista tem tempo de frear e desviar','O flash do radar espanta os bichos para longe da pista','O radar avisa os bichos de que um carro está vindo']},
 {q:'Para que serve a cerca ao lado de uma passagem de fauna?',o:['Guiar os animais até a passagem por baixo da pista','Impedir que os animais cheguem à água do outro lado','Marcar o limite da fazenda vizinha']}
];
let S,cv,cx,raf=null,last=0,T=48;
function hud(){$('hud').style.display='flex';$('hF').textContent='Fase '+(S.f+1)+'/3';$('hP').textContent=(S.tot+S.fp)+' pts';
 if(S.g){$('hV').textContent='❤️ '+S.g.vidas;$('hR').textContent='🏡 '+S.g.salvas+'/'+FASES[S.f].meta;$('hT').textContent='⏱ '+Math.max(0,Math.ceil(S.g.dur-S.g.t))+' s';}}
function inicio(){
 parar();$('hud').style.display='none';$('rankBox').style.display='block';
 $('tela').innerHTML=`<div class="card"><h2>Ajude as capivaras a atravessar a estrada</h2>
 <table class="tab"><tr><td><img src="${CAP.src}" width="56" alt="capivara"></td><td>A capivara anda uma casa por vez. Leve cada uma até um abrigo vazio no banhado, lá em cima.</td></tr>
 <tr><td>🚗 🚛</td><td>Encostar num veículo custa uma vida e 20 pontos.</td></tr>
 <tr><td>📸</td><td>Na faixa amarela, com radar, os veículos andam mais devagar.</td></tr>
 <tr><td>🕳️</td><td>Passagem de fauna: entre nela no campo e saia no canteiro do meio, por baixo da pista.</td></tr>
 <tr><td>⌨️ 👆</td><td>Setas do teclado, deslize o dedo na estrada ou use os botões.</td></tr></table>
 <p class="small" style="margin-top:8px">Cada capivara salva vale +50. 🎯 Meta: salvar as capivaras da fase antes de o tempo acabar e sem perder as 3 vidas.</p>
 <div class="row" style="margin-top:12px"><button class="btn" onclick="novo()">Começar →</button></div></div>`;
}
function novo(){S={f:0,tot:0,fp:0};salvo=false;$('rankBox').style.display='none';fase();}
function fase(){const F=FASES[S.f];S.fp=0;S.g=null;hud();
 $('tela').innerHTML=`<div class="card"><h2>Fase ${S.f+1}: ${F.nome}</h2><p>${F.txt}</p><p class="small" style="margin-top:6px">🎯 Meta: salvar ${F.meta} capivaras em ${F.dur} s.</p><div class="row" style="margin-top:12px"><button class="btn" id="bg">Jogar →</button></div></div>`;
 $('bg').onclick=jogar;}
function montarFaixas(){const F=FASES[S.f],g=S.g;g.faixas={};
 for(const r in F.faixas){const [tipo,v,n]=F.faixas[r];const V=VEIC[tipo];const vel=v*(+r===F.radar?.5:1);const esp=(COLS+3)/n;
  g.faixas[r]={tipo,vel,carros:Array.from({length:n},(_,i)=>({x:i*esp+Math.random()*esp*.35-1}))};}}
function jogar(){
 S.g={t:0,dur:FASES[S.f].dur,vidas:3,salvas:0,ocup:{},fim:false,msg:'',msgT:0,cd:0,maxRow:8,morto:0};montarFaixas();resetCap();
 $('tela').innerHTML=`<div class="card"><canvas id="cv"></canvas>
 <div class="pad"><span></span><button data-d="u">⬆️</button><span></span><button data-d="l">⬅️</button><button data-d="d">⬇️</button><button data-d="r">➡️</button></div></div>`;
 cv=$('cv');T=cv.clientWidth<500?36:52;cv.width=COLS*T;cv.height=ROWS*T;cx=cv.getContext('2d');
 document.querySelectorAll('.pad button').forEach(b=>b.onpointerdown=e=>{e.preventDefault();mover(b.dataset.d);});
 let t0=null;cv.onpointerdown=e=>{t0=[e.clientX,e.clientY];};
 cv.onpointerup=e=>{if(!t0)return;const dx=e.clientX-t0[0],dy=e.clientY-t0[1];if(Math.max(Math.abs(dx),Math.abs(dy))>16)mover(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'));else mover('u');t0=null;};
 hud();last=performance.now();parar();raf=requestAnimationFrame(loop);
}
document.addEventListener('keydown',e=>{if(!S||!S.g||S.g.fim)return;const m={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',w:'u',s:'d',a:'l',d:'r'}[e.key];if(m){mover(m);e.preventDefault();}});
function resetCap(){const g=S.g;g.c={x:5,y:8,dx:5,dy:8};g.maxRow=8;}
function msg(t){S.g.msg=t;S.g.msgT=2;}
function mover(d){const g=S.g;if(!g||g.fim||g.morto>0||g.cd>0)return;const c=g.c,F=FASES[S.f];
 let nx=c.x+({l:-1,r:1}[d]||0),ny=c.y+({u:-1,d:1}[d]||0);
 if(nx<0||nx>=COLS||ny>8)return;
 if(F.tunel&&d==='u'&&c.y===8&&TUNEIS.includes(c.x)){ny=4;msg('🕳️ Passagem de fauna: por baixo da pista!');beep(700,.12);}
 if(ny===0){if(!ABRIGOS.includes(nx))return;if(g.ocup[nx])return;}
 if(d==='l')g.olha=-1;if(d==='r')g.olha=1;
 c.x=nx;c.y=ny;g.cd=.11;beep(440,.03,.02);
 if(ny<g.maxRow){S.fp+=5*(g.maxRow-ny);g.maxRow=ny;}
 if(ny===0){g.ocup[nx]=true;g.salvas++;S.fp+=50;beep(990,.2);msg('🏡 Capivara salva! +50.');
  if(g.salvas>=F.meta){terminar();return;}
  if(ABRIGOS.every(a=>g.ocup[a]))g.ocup={};
  resetCap();}
 hud();}
function bate(){const g=S.g,c=g.c,f=g.faixas[c.y];if(!f)return false;const L=VEIC[f.tipo].len;
 return f.carros.some(v=>c.dx+.78>v.x&&c.dx+.22<v.x+L);}
function update(dt){const g=S.g;if(!g||g.fim)return;
 g.t+=dt;g.msgT-=dt;g.cd-=dt;
 for(const r in g.faixas){const f=g.faixas[r],L=VEIC[f.tipo].len;for(const v of f.carros){v.x+=f.vel*FASES[S.f].mult*dt*.9;
  if(f.vel>0&&v.x>COLS+.5)v.x-=COLS+3;if(f.vel<0&&v.x<-L-.5)v.x+=COLS+3;}}
 const c=g.c;c.dx+=(c.x-c.dx)*Math.min(1,dt*18);c.dy+=(c.y-c.dy)*Math.min(1,dt*18);
 if(g.morto>0){g.morto-=dt;if(g.morto<=0)resetCap();return;}
 if(bate()){g.vidas--;S.fp-=20;g.morto=.8;beep(120,.4,.08);msg('💥 Atropelada! −20. Espere a brecha.');if(g.vidas<=0){terminar();return;}}
 if(g.t>=g.dur)terminar();
}
function desenha(){const g=S.g;if(!g||!cx)return;const F=FASES[S.f];
 cx.clearRect(0,0,cv.width,cv.height);
 for(let r=0;r<ROWS;r++){const y=r*T;
  if(r===0){cx.fillStyle='#b2dfdb';cx.fillRect(0,y,cv.width,T);}
  else if(r===4||r===8){cx.fillStyle='#dcedc8';cx.fillRect(0,y,cv.width,T);}
  else{cx.fillStyle=r===F.radar?'#fff3c4':'#e0e0e0';cx.fillRect(0,y,cv.width,T);cx.strokeStyle='#fff';cx.setLineDash([T*.3,T*.3]);cx.lineWidth=2;if(r!==3&&r!==7){cx.beginPath();cx.moveTo(0,y+T);cx.lineTo(cv.width,y+T);cx.stroke();}cx.setLineDash([]);}
 }
 cx.textAlign='center';cx.textBaseline='middle';
 for(let c=0;c<COLS;c++){const x=c*T+T/2;
  if(ABRIGOS.includes(c)){cx.fillStyle='#80cbc4';cx.beginPath();cx.roundRect(c*T+4,4,T-8,T-8,10);cx.fill();if(g.ocup[c]&&CAP.complete){cx.drawImage(CAP,c*T+4,T*.2,T-8,(T-8)*.62);}}
  else{cx.font=(T*.6)+'px system-ui';cx.fillText('🌿',x,T/2);}}
 cx.font=(T*.45)+'px system-ui';for(const c of [0,10]){cx.fillText('🌳',c*T+T/2,4*T+T/2);cx.fillText('🌳',c*T+T/2,8*T+T/2);}
 if(F.radar>0){cx.font=(T*.42)+'px system-ui';cx.fillText('📸',T*.25,F.radar*T+T*.25);}
 if(F.tunel){for(const c of TUNEIS){cx.fillStyle='#8d6e63';cx.beginPath();cx.arc(c*T+T/2,8*T+T*.62,T*.34,Math.PI,0);cx.fill();cx.font=(T*.4)+'px system-ui';cx.fillText('🕳️',c*T+T/2,8*T+T*.3);
  cx.fillStyle='#8d6e63';cx.beginPath();cx.arc(c*T+T/2,4*T+T*.62,T*.3,Math.PI,0);cx.fill();}}
 for(const r in g.faixas){const f=g.faixas[r],V=VEIC[f.tipo];cx.font=(T*.8)+'px system-ui';
  for(const v of f.carros){const x=(v.x+V.len/2)*T,y=r*T+T/2;cx.save();cx.translate(x,y);if(f.vel>0)cx.scale(-1,1);if(V.len===2){cx.scale(1.6,1);}cx.fillText(V.ic,0,0);cx.restore();}}
 const c=g.c;if(CAP.complete){cx.save();cx.globalAlpha=g.morto>0?.35:1;const w=T*.95,h=w*.62;cx.translate(c.dx*T+T/2,c.dy*T+T/2);cx.scale(g.olha||1,1);cx.drawImage(CAP,-w/2,-h/2,w,h);cx.restore();}
 if(g.msgT>0){cx.font='bold '+(T*.32)+'px system-ui';cx.fillStyle='rgba(255,255,255,.88)';cx.fillRect(0,4*T+T*.15,cv.width,T*.7);cx.fillStyle='#33691e';cx.fillText(g.msg,cv.width/2,4*T+T/2);}
}
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);desenha();hud();if(S.g&&!S.g.fim)raf=requestAnimationFrame(loop);}
function parar(){if(raf)cancelAnimationFrame(raf);raf=null;}
function terminar(){const g=S.g;if(g.fim)return;g.fim=true;parar();const F=FASES[S.f],ok=g.salvas>=F.meta&&g.vidas>0;
 const sobra=Math.max(0,Math.ceil(g.dur-g.t));if(ok){S.fp+=30+2*sobra;beep(880,.2);}hud();
 $('tela').innerHTML=`<div class="card"><h2>${ok?'Todas atravessaram':'Ainda faltam capivaras'}</h2>
 <p>Capivaras salvas: <b>${g.salvas}</b> de ${F.meta}. Vidas restantes: <b>${g.vidas}</b>.</p>
 ${ok?`<div class="fb good">🎯 Meta cumprida! +30 e +${2*sobra} pelo tempo que sobrou.</div>`:'<div class="fb bad">A meta não foi cumprida. Espere a brecha entre os veículos e use o canteiro do meio para descansar.</div>'}
 <div class="row" style="margin-top:12px">${ok?'<button class="btn" id="bq">Pergunta da fase →</button>':'<button class="btn" id="br">Tentar de novo</button><button class="btn ghost" id="be">Encerrar</button>'}</div></div>`;
 if(ok)$('bq').onclick=pergunta;else{$('br').onclick=fase;$('be').onclick=()=>{S.tot+=Math.max(0,S.fp);S.fp=0;final(false);};}
}
function pergunta(){
 const P=PERG[S.f],ops=shuf(P.o.map((t,i)=>({t,c:i===0})));
 $('tela').innerHTML=`<div class="card"><h2>Pergunta da fase</h2><p style="margin:6px 0 4px">${P.q}</p><p class="small">Acerto +20, erro −10.</p><div class="ops">${ops.map((o,i)=>`<button data-i="${i}">${o.t}</button>`).join('')}</div><div id="pf"></div></div>`;
 document.querySelectorAll('#tela .ops button').forEach(b=>b.onclick=()=>{const o=ops[+b.dataset.i];S.fp+=o.c?20:-10;beep(o.c?880:170,.15);hud();
  document.querySelectorAll('#tela .ops button').forEach((x,j)=>{x.disabled=true;if(ops[j].c){x.style.borderColor='#2e7d32';x.style.opacity=1;}});
  $('pf').innerHTML=`<div class="fb ${o.c?'good':'bad'}">${o.c?'✅ +20.':'❌ −10. A resposta certa está marcada em verde.'}<div class="row" style="margin-top:10px"><button class="btn" id="bn">${S.f===FASES.length-1?'Ver resultado →':'Próxima fase →'}</button></div></div>`;
  $('bn').onclick=()=>{S.tot+=S.fp;S.fp=0;if(S.f===FASES.length-1)final(true);else{S.f++;fase();}};});
}
function final(tudo){
 S.g=null;$('rankBox').style.display='block';const nivel=tudo?'3 fases':'Fase '+(S.f+1);
 $('tela').innerHTML=`<div class="card" style="text-align:center"><div class="big">${tudo?'🏆':'<img src="'+CAP.src+'" width="110" alt="capivara">'}</div><h2>${tudo?'As capivaras chegaram ao banhado!':'Fim de jogo'}</h2><div class="big">${S.tot} pts</div>
 <div class="savebox"><input id="pName" maxlength="20" placeholder="Seu nome"><button class="btn" id="bS">Salvar no ranking</button></div><p class="small" id="sSt"></p>
 <div class="row" style="justify-content:center;margin-top:12px"><button class="btn ghost" onclick="inicio()">Jogar de novo</button></div>
 <div class="small" style="margin-top:12px;text-align:left">📚 Fontes: Centro Brasileiro de Estudos em Ecologia de Estradas (CBEE/UFLA), estimativa de 475 milhões de vertebrados silvestres atropelados por ano no Brasil; registros de atropelamento na BR-262 no Pantanal, com capivara, anta e tamanduá-bandeira entre as espécies mais atingidas; IMASUL e SEINFRA-MS, manual de mitigação com cercas associadas a passagens de fauna. Velocidade e número de veículos são regras do jogo.</div></div>`;
 $('bS').onclick=()=>salvar(nivel);
}

const GAME_ID="travessia-pantaneira";let db=null,fs=null,salvo=false;
(async()=>{try{const a=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");const f=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");db=f.getFirestore(a.initializeApp(firebaseConfig));fs=f;carregar();}catch(e){$('rankList').innerHTML='<li><span>Ranking indisponível sem internet.</span></li>';$('rankNote').textContent='O jogo funciona normalmente. O ranking volta quando houver conexão.';}})();

async function salvar(nivel){if(salvo)return;const nome=$('pName').value.trim(),st=$('sSt');if(!nome){st.textContent='Digite seu nome primeiro.';return;}if(!db){st.textContent='Sem conexão com o ranking. O resultado não foi enviado.';return;}
 $('bS').disabled=true;try{await fs.addDoc(fs.collection(db,'games',GAME_ID,'scores'),{name:nome.slice(0,20),score:Math.max(0,S.tot),level:nivel,ts:fs.serverTimestamp()});salvo=true;st.textContent='Salvo no Ranking Global!';carregar();}catch(e){$('bS').disabled=false;st.textContent='Erro ao salvar. Tente de novo.';}}
