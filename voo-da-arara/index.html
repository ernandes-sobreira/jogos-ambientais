<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voo da Arara-Azul</title>
<style>
:root{--main:#283593;--deep:#1a237e;--soft:#e8eaf6;--line:#c5cae9;--ink:#1b1f33;--mut:#555b7a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:var(--ink);line-height:1.45}
.wrap{max-width:780px;margin:0 auto;padding:12px 14px 40px}
a.hub{color:var(--deep);font-weight:700;text-decoration:none;font-size:.9rem}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
h1{font-size:1.4rem;color:var(--deep)}h2{font-size:1.15rem;color:var(--deep);margin-bottom:6px}
.hud{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--soft);color:var(--deep);border-radius:99px;padding:5px 11px;font-weight:700;font-size:.86rem}
.card{border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;background:#fff}
.btn{background:var(--main);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--deep)}.btn.ghost{background:#fff;color:var(--deep);border:2px solid var(--main)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.small{font-size:.86rem;color:var(--mut)}
canvas{width:100%;max-width:760px;margin:0 auto;display:block;border:2px solid var(--line);border-radius:16px;touch-action:none;background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:6px;justify-content:center;margin-top:10px}
.pad button{border:2px solid var(--line);background:var(--soft);border-radius:12px;font-size:1.4rem;cursor:pointer;color:var(--deep);touch-action:manipulation}
.pad button:active{background:#dcedc8}
.tab{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:8px}.tab td{border-bottom:1px solid var(--line);padding:5px 4px;vertical-align:top}
.ops{display:grid;gap:8px;margin-top:10px}
.ops button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-size:.95rem;cursor:pointer;font-family:inherit;text-align:left;color:var(--ink)}
.ops button:hover{border-color:var(--main)}.ops button:disabled{opacity:.5;cursor:default}
.fb{margin-top:10px;padding:11px 13px;border-radius:12px;font-size:.93rem}
.fb.good{background:#e8f5e9;color:#1b5e20}.fb.bad{background:#ffebee;color:#8e1b1b}
.big{font-size:2.3rem;font-weight:800;color:var(--deep)}
.ranking{border:3px solid var(--main);border-radius:18px;padding:0 16px 12px;overflow:hidden;margin-top:12px}
.ranking h3{font-size:1rem;margin:0 -16px 8px;padding:10px 16px;background:var(--main);color:#fff}
.ranking ol{list-style:none}.ranking li{display:flex;justify-content:space-between;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:.92rem}
.ranking li:last-child{border-bottom:0}.rp{display:inline-block;min-width:2.1em;font-weight:800;color:var(--deep)}
.savebox{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.savebox input{flex:1;min-width:160px;border:2px solid var(--line);border-radius:12px;padding:11px;font-size:1rem;font-family:inherit}
</style>
</head>
<body>
<div class="wrap">
<a class="hub" href="https://ernandes-sobreira.github.io/jogos-ambientais/">← Todos os jogos</a>
<header>
  <h1 id="tit">Voo da Arara-Azul</h1>
  <div class="hud" id="hud" style="display:none"><span class="pill" id="hF">Fase 1/3</span><span class="pill" id="hP">0 pts</span><span class="pill" id="hR">🥚 100%</span><span class="pill" id="hV">❤️ 3</span><span class="pill" id="hT">⏱ 0</span></div>
</header>
<main id="tela"></main>
<div class="ranking" id="rankBox"><h3>Ranking Global</h3><ol id="rankList"><li><span>Carregando o ranking...</span></li></ol><p class="small" id="rankNote"></p></div>
</div>
<script>
const $=id=>document.getElementById(id);
const rr=(a,b)=>a+Math.random()*(b-a);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let actx=null;function beep(f,d,v){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.setValueAtTime(v||.05,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(e){}}

/* Regras do jogo: tempos, gasto de energia e distâncias são escolhas do jogo. */
const MUNDO=2200;
const FASES=[
 {nome:'Período de choco',dur:70,gasto:2.6,palmeiras:7,redes:0,fogo:0,txt:'A fêmea choca os ovos no oco do manduvi e quase não sai do ninho. O macho, que é você, leva comida para ela. Pegue castanhas de bocaiuva no cacho e de acuri no chão, embaixo da palmeira.'},
 {nome:'Rede de traficante',dur:80,gasto:2.9,palmeiras:6,redes:3,fogo:0,txt:'Traficantes armaram redes entre as árvores. Encostar numa rede custa uma vida e a castanha que você levava.'},
 {nome:'Seca e fogo',dur:90,gasto:2.4,palmeiras:5,redes:3,fogo:2,txt:'Na seca, focos de fogo soltam fumaça e há menos palmeiras perto do ninho. Desvie da fumaça e não deixe a fêmea com fome.'}
];
const PERG=[
 {q:'Em que árvore estavam 95% dos ninhos de arara-azul encontrados no estudo de Neiva Guedes no Pantanal?',o:['Manduvi','Ipê-amarelo','Figueira-mata-pau']},
 {q:'De que se alimenta basicamente a arara-azul no Pantanal?',o:['Castanhas dos cocos de acuri e de bocaiuva','Insetos que pega no voo sobre os campos','Peixes pequenos dos corixos e baías']},
 {q:'Durante o choco, quem alimenta a fêmea que fica no ninho?',o:['O macho','Os filhotes do ano anterior','Ninguém, ela não come no período']}
];
let S,cv,cx,raf=null,last=0,W=760,H=440,inp={x:null,y:null,u:0,d:0,l:0,r:0};
function hud(){$('hud').style.display='flex';$('hF').textContent='Fase '+(S.f+1)+'/3';$('hP').textContent=(S.tot+S.fp)+' pts';
 if(S.g){$('hV').textContent='❤️ '+S.g.vidas;$('hR').textContent='🥚 '+Math.round(S.g.energia)+'%';$('hT').textContent='⏱ '+Math.max(0,Math.ceil(S.g.dur-S.g.t))+' s';}}
function svgArara(w){return `<svg viewBox="0 0 80 50" width="${w}" height="${w*5/8}" aria-label="arara-azul" style="vertical-align:-6px"><path d="M10 34 L-2 46 L16 38 Z" fill="#1a237e"/><ellipse cx="34" cy="28" rx="20" ry="11" fill="#283593"/><path d="M22 22 Q34 4 50 20 Q36 26 22 22 Z" fill="#3949ab"/><circle cx="56" cy="20" r="10" fill="#283593"/><circle cx="58" cy="17" r="3.6" fill="#ffd600"/><circle cx="58.6" cy="17" r="1.6" fill="#111"/><path d="M63 16 Q76 16 72 30 Q66 26 62 24 Z" fill="#263238"/><path d="M60 26 Q64 30 69 29" stroke="#ffd600" stroke-width="3" fill="none"/></svg>`;}
function inicio(){
 parar();$('hud').style.display='none';$('rankBox').style.display='block';
 $('tela').innerHTML=`<div class="card"><h2>Alimente a fêmea que choca no manduvi</h2>
 <table class="tab"><tr><td>${svgArara(46)}</td><td>Você é o macho da arara-azul. A fêmea fica no ninho, no oco do manduvi, chocando os ovos.</td></tr>
 <tr><td>🌴</td><td>Pegue castanhas de bocaiuva no cacho, no alto da palmeira, e de acuri no chão, embaixo dela. Leve uma por vez até o ninho: +10.</td></tr>
 <tr><td>🥚</td><td>A energia da fêmea cai com o tempo. Se zerar, ela sai do ninho para buscar comida e os ovos ficam sozinhos.</td></tr>
 <tr><td>🕸️</td><td>Rede de traficante e fumaça de queimada custam uma vida.</td></tr>
 <tr><td>🖱️ 👆 ⌨️</td><td>Aponte o dedo ou o mouse para onde a arara deve voar, ou use as setas.</td></tr></table>
 <p class="small" style="margin-top:8px">🎯 Meta: manter a fêmea no ninho até o fim do choco.</p>
 <div class="row" style="margin-top:12px"><button class="btn" onclick="novo()">Começar →</button></div></div>`;
}
function novo(){S={f:0,tot:0,fp:0};salvo=false;$('rankBox').style.display='none';fase();}
function fase(){const F=FASES[S.f];S.fp=0;S.g=null;hud();
 $('tela').innerHTML=`<div class="card"><h2>Fase ${S.f+1}: ${F.nome}</h2><p>${F.txt}</p><p class="small" style="margin-top:6px">🎯 Meta: a energia da fêmea não pode zerar durante ${F.dur} s.</p><div class="row" style="margin-top:12px"><button class="btn" id="bg">Voar →</button></div></div>`;
 $('bg').onclick=jogar;}
const CHAO=()=>H-40,NX=110;
function jogar(){const F=FASES[S.f];
 $('tela').innerHTML=`<div class="card"><canvas id="cv"></canvas><p class="small" style="margin-top:8px">Aponte para onde voar. No teclado, use as setas.</p></div>`;
 cv=$('cv');if(cv.clientWidth<520){W=440;H=520;}else{W=760;H=440;}cv.width=W;cv.height=H;cx=cv.getContext('2d');
 const palms=[];const gap=(MUNDO-500)/F.palmeiras;for(let i=0;i<F.palmeiras;i++){const x=420+i*gap+rr(-40,40)+S.f*40;palms.push({x,tipo:i%2?'acuri':'bocaiuva',cacho:0,chao:0,cd:rr(0,3)});}
 const redes=[];for(let i=0;i<F.redes;i++){const x=300+((i+.5)/F.redes)*(MUNDO-500);redes.push({x,y:rr(H*.25,H*.6),h:rr(70,120),vy:S.f>1?rr(-14,14):0});}
 S.g={t:0,dur:F.dur,vidas:3,energia:100,px:NX+60,py:H*.4,vx:0,vy:0,carga:null,cam:0,palms,redes,fogos:Array.from({length:F.fogo},(_,i)=>{const a=palms[1+i*2]||palms[palms.length-1],b=palms[2+i*2]||{x:a.x+300};return {x:(a.x+b.x)/2+20,r:rr(60,80),fase:Math.random()*6};}),entregas:0,inv:0,fim:false,msg:'',msgT:0,olha:1};
 const pos=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height];};
 cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);[inp.x,inp.y]=pos(e);e.preventDefault();};
 cv.onpointermove=e=>{if(e.buttons||e.pointerType==='mouse')[inp.x,inp.y]=pos(e);};
 cv.onpointerup=cv.onpointercancel=e=>{if(e.pointerType!=='mouse'){inp.x=null;inp.y=null;}};
 cv.onpointerleave=()=>{inp.x=null;inp.y=null;};
 hud();last=performance.now();parar();raf=requestAnimationFrame(loop);}
const K={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r'};
document.addEventListener('keydown',e=>{if(K[e.key]&&S&&S.g){inp[K[e.key]]=1;e.preventDefault();}});
document.addEventListener('keyup',e=>{if(K[e.key])inp[K[e.key]]=0;});
function msg(t){S.g.msg=t;S.g.msgT=2.2;}
function perde(t){if(window.__log)__log.push(t);const g=S.g;if(g.inv>0)return;g.vidas--;S.fp-=15;g.carga=null;g.inv=2;beep(140,.35,.07);msg(t+' −15.');if(g.vidas<=0)terminar();}
function update(dt){const g=S.g;if(!g||g.fim)return;const F=FASES[S.f];
 g.t+=dt;g.msgT-=dt;g.inv-=dt;
 g.energia-=F.gasto*dt;if(g.energia<=0){g.energia=0;terminar();return;}
 // voo
 let ax=0,ay=0;const sp=260;
 if(inp.x!=null){const tx=inp.x+g.cam,ty=inp.y;const dx=tx-g.px,dy=ty-g.py,d=Math.hypot(dx,dy);if(d>6){ax=dx/d;ay=dy/d;}}
 ax+=inp.r-inp.l;ay+=inp.d-inp.u;const n=Math.hypot(ax,ay);if(n>1){ax/=n;ay/=n;}
 g.vx+=(ax*sp-g.vx)*Math.min(1,dt*5);g.vy+=(ay*sp-g.vy)*Math.min(1,dt*5);
 g.px+=g.vx*dt;g.py+=g.vy*dt;if(Math.abs(g.vx)>20)g.olha=Math.sign(g.vx);
 g.px=Math.max(40,Math.min(MUNDO-30,g.px));g.py=Math.max(30,Math.min(CHAO()-14,g.py));
 g.cam+=((g.px-W*.4)-g.cam)*Math.min(1,dt*4);g.cam=Math.max(0,Math.min(MUNDO-W,g.cam));
 // palmeiras produzem castanhas
 for(const p of g.palms){p.cd-=dt;if(p.cd<=0){if(p.tipo==='bocaiuva'&&p.cacho<2)p.cacho++;if(p.tipo==='acuri'&&p.chao<2)p.chao++;p.cd=rr(3,6);}
  if(!g.carga){if(p.tipo==='bocaiuva'&&p.cacho>0&&Math.hypot(g.px-(p.x+14),g.py-(CHAO()-190))<30){p.cacho--;g.carga='bocaiuva';beep(700,.06);}
   if(p.tipo==='acuri'&&p.chao>0&&Math.abs(g.px-(p.x+30))<30&&g.py>CHAO()-40){p.chao--;g.carga='acuri';beep(700,.06);}}}
 // ninho
 if(g.carga&&Math.hypot(g.px-NX,g.py-(CHAO()-170))<38){g.carga=null;g.entregas++;g.energia=Math.min(100,g.energia+12);S.fp+=10;beep(990,.15);msg('🥚 Castanha entregue à fêmea! +10.');}
 // redes
 for(const r of g.redes){r.y+=r.vy*dt;if(r.y<H*.15||r.y>H*.65)r.vy*=-1;if(Math.abs(g.px-r.x)<14&&g.py>r.y-6&&g.py<r.y+r.h+6)perde('🕸️ A arara bateu na rede de traficante.');}
 for(const f of g.fogos){f.fase+=dt;const fy=CHAO()-f.r*.6-Math.sin(f.fase)*20;if(Math.hypot(g.px-f.x,g.py-fy)<f.r*.55)perde('🔥 A fumaça da queimada atingiu a arara.');}
 if(g.t>=g.dur)terminar();}
function desenhaArara(x,y,s,olha,bat,carga){cx.save();cx.translate(x,y);cx.scale(olha,1);const k=s/80;cx.scale(k,k);cx.translate(-40,-28);
 cx.fillStyle='#1a237e';cx.beginPath();cx.moveTo(14,32);cx.lineTo(-14,50);cx.lineTo(-4,40);cx.lineTo(18,38);cx.closePath();cx.fill();
 cx.fillStyle='#283593';cx.beginPath();cx.ellipse(34,30,21,11,0,0,7);cx.fill();
 cx.fillStyle='#3949ab';cx.beginPath();cx.moveTo(22,26);cx.quadraticCurveTo(32,6-bat*14,52,22);cx.quadraticCurveTo(36,28,22,26);cx.fill();
 cx.fillStyle='#283593';cx.beginPath();cx.arc(57,21,11,0,7);cx.fill();
 cx.fillStyle='#ffd600';cx.beginPath();cx.arc(59,18,3.8,0,7);cx.fill();cx.fillStyle='#111';cx.beginPath();cx.arc(59.6,18,1.7,0,7);cx.fill();
 cx.fillStyle='#263238';cx.beginPath();cx.moveTo(64,16);cx.quadraticCurveTo(78,16,74,32);cx.quadraticCurveTo(68,27,63,25);cx.closePath();cx.fill();
 cx.strokeStyle='#ffd600';cx.lineWidth=3;cx.beginPath();cx.moveTo(61,27);cx.quadraticCurveTo(65,31,70,30);cx.stroke();
 if(carga){cx.fillStyle=carga==='acuri'?'#8d6e63':'#c0a062';cx.beginPath();cx.ellipse(72,34,5,4,0,0,7);cx.fill();}
 cx.restore();}
function palmeira(x,tipo,p){const base=CHAO();cx.strokeStyle='#8d6e63';cx.lineWidth=10;cx.beginPath();cx.moveTo(x,base);cx.quadraticCurveTo(x+10,base-110,x+14,base-200);cx.stroke();
 cx.strokeStyle='#558b2f';cx.lineWidth=5;for(let i=0;i<7;i++){const a=-Math.PI+i*Math.PI/6;cx.beginPath();cx.moveTo(x+14,base-200);cx.quadraticCurveTo(x+14+Math.cos(a)*40,base-230+Math.sin(a)*10,x+14+Math.cos(a)*70,base-190+Math.abs(Math.sin(a))*-10+ (i%2?18:6));cx.stroke();}
 if(tipo==='bocaiuva'){for(let i=0;i<p.cacho;i++){cx.fillStyle='#c0a062';for(let j=0;j<5;j++){cx.beginPath();cx.arc(x+8+i*12+(j%2)*5,base-186+j*4,4,0,7);cx.fill();}}}
 if(tipo==='acuri'){for(let i=0;i<p.chao;i++){cx.fillStyle='#8d6e63';cx.beginPath();cx.ellipse(x+24+i*14,base-5,6,5,0,0,7);cx.fill();}}
 cx.fillStyle='#33691e';cx.font='bold 11px system-ui';cx.textAlign='center';cx.fillText(tipo,x+14,base+16);}
function desenha(){const g=S.g;if(!g||!cx)return;const F=FASES[S.f];
 cx.clearRect(0,0,W,H);const sky=cx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#e3f2fd');sky.addColorStop(1,'#f9fbe7');cx.fillStyle=sky;cx.fillRect(0,0,W,H);
 cx.save();cx.translate(-g.cam,0);
 cx.fillStyle='#dcedc8';cx.fillRect(0,CHAO(),MUNDO,H-CHAO());
 // manduvi com o ninho
 const base=CHAO();cx.fillStyle='#795548';cx.beginPath();cx.moveTo(NX-26,base);cx.lineTo(NX-16,base-230);cx.lineTo(NX+16,base-230);cx.lineTo(NX+26,base);cx.fill();
 cx.fillStyle='#689f38';for(const [dx,dy,r] of [[-50,-250,50],[10,-280,60],[60,-245,48],[0,-225,55]]){cx.beginPath();cx.arc(NX+dx,base+dy,r,0,7);cx.fill();}
 cx.fillStyle='#3e2723';cx.beginPath();cx.ellipse(NX,base-170,15,20,0,0,7);cx.fill();
 const fome=g.energia<30;desenhaArara(NX+2,base-172,34,1,0,null);
 cx.fillStyle='#4e342e';cx.font='bold 12px system-ui';cx.textAlign='center';cx.fillText('manduvi (ninho)',NX,base+16);
 cx.fillStyle='#eee';cx.fillRect(NX-40,base-345,80,9);cx.fillStyle=fome?'#e53935':'#43a047';cx.fillRect(NX-40,base-345,.8*g.energia,9);cx.fillStyle='#33691e';cx.font='bold 11px system-ui';cx.fillText('energia da fêmea',NX,base-350);
 for(const p of g.palms)palmeira(p.x,p.tipo,p);
 for(const r of g.redes){cx.strokeStyle='#546e7a';cx.lineWidth=1;for(let i=0;i<=6;i++){cx.beginPath();cx.moveTo(r.x-10,r.y+i*r.h/6);cx.lineTo(r.x+10,r.y+i*r.h/6);cx.stroke();}for(let i=0;i<=2;i++){cx.beginPath();cx.moveTo(r.x-10+i*10,r.y);cx.lineTo(r.x-10+i*10,r.y+r.h);cx.stroke();}
  cx.strokeStyle='#5d4037';cx.lineWidth=3;cx.beginPath();cx.moveTo(r.x-12,r.y-10);cx.lineTo(r.x-12,r.y+r.h+10);cx.stroke();}
 for(const f of g.fogos){const fy=CHAO()-f.r*.6-Math.sin(f.fase)*20;const gr=cx.createRadialGradient(f.x,fy,0,f.x,fy,f.r);gr.addColorStop(0,'rgba(120,120,120,.55)');gr.addColorStop(1,'rgba(160,160,160,0)');cx.fillStyle=gr;cx.beginPath();cx.arc(f.x,fy,f.r,0,7);cx.fill();
  cx.font='26px system-ui';cx.fillText('🔥',f.x,CHAO()-4);}
 cx.save();cx.globalAlpha=g.inv>0&&Math.floor(g.inv*8)%2?0.4:1;desenhaArara(g.px,g.py,56,g.olha,Math.sin(performance.now()/90),g.carga);cx.restore();
 cx.restore();
 if(g.msgT>0){cx.font='bold 14px system-ui';cx.textAlign='center';cx.fillStyle='rgba(255,255,255,.9)';cx.fillRect(0,4,W,24);cx.fillStyle='#1a237e';cx.fillText(g.msg,W/2,21);}
 // minimapa
 cx.fillStyle='rgba(255,255,255,.8)';cx.fillRect(W-170,H-22,160,12);cx.fillStyle='#795548';cx.fillRect(W-170+160*NX/MUNDO-2,H-22,4,12);cx.fillStyle='#283593';cx.fillRect(W-170+160*g.px/MUNDO-2,H-22,4,12);
}
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);desenha();hud();if(S.g&&!S.g.fim)raf=requestAnimationFrame(loop);}
function parar(){if(raf)cancelAnimationFrame(raf);raf=null;}
function terminar(){const g=S.g;if(g.fim)return;g.fim=true;parar();const ok=g.t>=g.dur&&g.energia>0&&g.vidas>0;
 if(ok){const b=30+Math.round(g.energia/2);S.fp+=b;g.bonus=b;beep(880,.2);}hud();
 $('tela').innerHTML=`<div class="card"><h2>${ok?'Os ovos foram chocados!':g.energia<=0?'A fêmea saiu do ninho para comer':'O macho não voltou'}</h2>
 <p>Castanhas entregues: <b>${g.entregas}</b>. Energia final da fêmea: <b>${Math.round(g.energia)}%</b>.</p>
 ${ok?`<div class="fb good">🎯 Meta cumprida! +${g.bonus}.</div>`:'<div class="fb bad">A meta não foi cumprida. Use as palmeiras mais perto do ninho e volte logo com cada castanha.</div>'}
 <div class="row" style="margin-top:12px">${ok?'<button class="btn" id="bq">Pergunta da fase →</button>':'<button class="btn" id="br">Tentar de novo</button><button class="btn ghost" id="be">Encerrar</button>'}</div></div>`;
 if(ok)$('bq').onclick=pergunta;else{$('br').onclick=fase;$('be').onclick=()=>{S.tot+=Math.max(0,S.fp);S.fp=0;final(false);};}}
function pergunta(){
 const P=PERG[S.f],ops=shuf(P.o.map((t,i)=>({t,c:i===0})));
 $('tela').innerHTML=`<div class="card"><h2>Pergunta da fase</h2><p style="margin:6px 0 4px">${P.q}</p><p class="small">Acerto +20, erro −10.</p><div class="ops">${ops.map((o,i)=>`<button data-i="${i}">${o.t}</button>`).join('')}</div><div id="pf"></div></div>`;
 document.querySelectorAll('#tela .ops button').forEach(b=>b.onclick=()=>{const o=ops[+b.dataset.i];S.fp+=o.c?20:-10;beep(o.c?880:170,.15);hud();
  document.querySelectorAll('#tela .ops button').forEach((x,j)=>{x.disabled=true;if(ops[j].c){x.style.borderColor='#2e7d32';x.style.opacity=1;}});
  $('pf').innerHTML=`<div class="fb ${o.c?'good':'bad'}">${o.c?'✅ +20.':'❌ −10. A resposta certa está marcada em verde.'}<div class="row" style="margin-top:10px"><button class="btn" id="bn">${S.f===FASES.length-1?'Ver resultado →':'Próxima fase →'}</button></div></div>`;
  $('bn').onclick=()=>{S.tot+=S.fp;S.fp=0;if(S.f===FASES.length-1)final(true);else{S.f++;fase();}};});
}
function final(tudo){
 S.g=null;$('rankBox').style.display='block';const nivel=tudo?'3 fases':'Fase '+(S.f+1);
 $('tela').innerHTML=`<div class="card" style="text-align:center"><div class="big">${tudo?'🏆':svgArara(90)}</div><h2>${tudo?'Nasceram os filhotes de arara-azul!':'Fim de jogo'}</h2><div class="big">${S.tot} pts</div>
 <div class="savebox"><input id="pName" maxlength="20" placeholder="Seu nome"><button class="btn" id="bS">Salvar no ranking</button></div><p class="small" id="sSt"></p>
 <div class="row" style="justify-content:center;margin-top:12px"><button class="btn ghost" onclick="inicio()">Jogar de novo</button></div>
 <div class="small" style="margin-top:12px;text-align:left">📚 Fonte: Guedes, N. M. R. (1993), Biologia reprodutiva da arara-azul (Anodorhynchus hyacinthinus) no Pantanal, dissertação de mestrado, ESALQ/USP: 95% dos 94 ninhos no manduvi; alimentação basicamente de castanhas de bocaiuva e acuri; incubação feita pela fêmea, alimentada pelo macho. Tempos, energia e posições são regras do jogo.</div></div>`;
 $('bS').onclick=()=>salvar(nivel);
}

const GAME_ID="voo-da-arara";let db=null,fs=null,salvo=false;
(async()=>{try{const a=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");const f=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");db=f.getFirestore(a.initializeApp(firebaseConfig));fs=f;carregar();}catch(e){$('rankList').innerHTML='<li><span>Ranking indisponível sem internet.</span></li>';$('rankNote').textContent='O jogo funciona normalmente. O ranking volta quando houver conexão.';}})();

async function salvar(nivel){if(salvo)return;const nome=$('pName').value.trim(),st=$('sSt');if(!nome){st.textContent='Digite seu nome primeiro.';return;}if(!db){st.textContent='Sem conexão com o ranking. O resultado não foi enviado.';return;}
 $('bS').disabled=true;try{await fs.addDoc(fs.collection(db,'games',GAME_ID,'scores'),{name:nome.slice(0,20),score:Math.max(0,S.tot),level:nivel,ts:fs.serverTimestamp()});salvo=true;st.textContent='Salvo no Ranking Global!';carregar();}catch(e){$('bS').disabled=false;st.textContent='Erro ao salvar. Tente de novo.';}}
