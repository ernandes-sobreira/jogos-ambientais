<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Termômetro de Mato Grosso</title>
<style>
:root{--main:#c2410c;--deep:#7c2d12;--soft:#fdf3ee;--line:#e3dfdb;--ink:#10212b;--mut:#4d6370;--co2:#e53935;--ch4:#ef6c00;--ok:#2e7d32;--bad:#c62828}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:var(--ink);line-height:1.45}
.wrap{max-width:820px;margin:0 auto;padding:12px 14px 40px}
a.hub{color:var(--deep);font-weight:700;text-decoration:none;font-size:.9rem}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
h1{font-size:1.4rem;color:var(--deep);letter-spacing:-.01em}
h2{font-size:1.2rem;color:var(--deep);margin-bottom:6px;letter-spacing:-.01em}
h3{font-size:1rem;color:var(--deep);margin:14px 0 6px}
.hud{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--soft);color:var(--deep);border-radius:99px;padding:5px 12px;font-weight:700;font-size:.86rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.card{border:2px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px;background:#fff}
.btn{background:var(--main);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;touch-action:manipulation}
.btn:hover{background:var(--deep)}.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:#fff;color:var(--deep);border:2px solid var(--main)}
.btn.sm{padding:9px 14px;font-size:.92rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.small{font-size:.86rem;color:var(--mut)}
canvas.cena{width:100%;height:auto;display:block;border:2px solid var(--line);border-radius:16px;touch-action:none;background:#fff;margin-top:10px}
.top{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--main);color:#fff;border-radius:14px;padding:8px 14px;font-weight:800;font-size:1.05rem}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.tool{border:2px solid var(--line);background:#fff;color:var(--deep);border-radius:12px;padding:9px 12px;font-weight:700;font-family:inherit;font-size:.92rem;cursor:pointer;touch-action:manipulation}
.tool.on{border-color:var(--main);background:var(--soft)}
.tool:disabled{opacity:.4}
.mets{display:grid;gap:8px;margin-top:10px}
.met{display:grid;grid-template-columns:92px 1fr 52px;gap:8px;align-items:center;font-weight:700;font-size:.9rem}
.met .bar{position:relative;height:18px;background:#f1f4f5;border-radius:99px;overflow:hidden}
.met .fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;transition:width .15s}
.met .alvo{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--ink);border-radius:2px}
.met .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--mut)}
.met.co2 .fill{background:var(--co2)}.met.ch4 .fill{background:var(--ch4)}
.saldo .bar{background:linear-gradient(90deg,#e8f5e9 50%,#ffebee 50%)}
.saldo .zero{position:absolute;left:50%;top:-3px;bottom:-3px;width:3px;background:var(--ink)}
.saldo .fill{border-radius:0}
.obj{display:flex;gap:10px;align-items:flex-start;background:#fff8e1;border:2px solid #ffe082;border-radius:14px;padding:10px 12px;margin-top:10px;font-size:.95rem}
.obj b{color:#8d6e00;white-space:nowrap}
.acao{display:flex;gap:10px;align-items:center;background:var(--soft);border-left:5px solid var(--main);border-radius:0 12px 12px 0;padding:9px 12px;margin-top:8px;font-weight:600;font-size:.95rem;min-height:64px}@media(max-width:640px){.acao{min-height:5.4em}}
.acao .dedo{font-size:1.25rem;animation:pulo 1s ease-in-out infinite}
@keyframes pulo{50%{transform:translateX(4px)}}
.help{width:34px;height:34px;border-radius:50%;border:2px solid var(--main);background:#fff;color:var(--deep);font-weight:800;font-size:1rem;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(16,33,43,.35);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal .card{max-width:460px;width:100%}
.intro{text-align:center;padding:26px 18px}
.intro .ic{font-size:3rem;line-height:1}
.intro .n{color:var(--mut);font-weight:700;font-size:.85rem;margin-top:8px}
.passos{display:grid;gap:8px;margin:16px auto;max-width:420px;text-align:left}
.passos div{display:flex;gap:12px;align-items:center;background:var(--soft);border-radius:12px;padding:10px 14px;font-weight:600}
.passos b{font-size:1.3rem;min-width:1.6em;text-align:center}
.res{text-align:center}
.res .big{font-size:2.6rem;font-weight:800;color:var(--deep);line-height:1.1}
.res .ok{color:var(--ok);font-weight:800}.res .no{color:var(--bad);font-weight:800}
.pensa{background:var(--soft);border-radius:14px;padding:12px 14px;margin:14px auto;max-width:520px;text-align:left}
.pensa b{color:var(--deep)}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.box{border:2px dashed var(--line);border-radius:14px;padding:10px;min-height:110px;cursor:pointer}
.box h4{font-size:.92rem;color:var(--deep);margin-bottom:6px}
.box.alvo{border-color:var(--main);background:var(--soft)}
.cards{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;min-height:48px}
.ct{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 11px;font-weight:700;font-size:.9rem;cursor:pointer;box-shadow:0 2px 0 var(--line);font-family:inherit;color:var(--ink);transition:transform .5s}
.ct.sel{border-color:var(--main);background:var(--soft);transform:translateY(-2px)}
.ct.certo{border-color:var(--ok);background:#e8f5e9}.ct.errado{border-color:var(--bad);background:#ffebee}
.ct.movido{animation:voa .8s ease}
@keyframes voa{0%{transform:translateY(-30px) scale(1.1);opacity:.3}100%{transform:none;opacity:1}}
.capa{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:center}
.capa canvas{width:100%;height:auto;display:block;border-radius:16px;background:var(--soft)}
.opts{display:grid;gap:8px;margin-top:6px}
.opts .l{font-size:.8rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer}
.sw button.on{box-shadow:0 0 0 3px var(--deep)}
.sw .tx{width:auto;height:auto;border-radius:10px;padding:6px 10px;font-weight:700;font-size:.85rem;background:#fff;color:var(--deep);font-family:inherit;border:0}
input.nome{border:2px solid var(--line);border-radius:12px;padding:11px;font-size:1rem;font-family:inherit;width:100%}
input[type=range]{width:100%;accent-color:var(--main)}
.tab{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:6px}
.tab th{text-align:left;background:var(--soft);color:var(--deep);padding:7px 6px}
.tab td{border-bottom:1px solid var(--line);padding:7px 6px;vertical-align:top}
.guia p,.guia li{font-size:.95rem;margin-bottom:6px}
.guia ul,.guia ol{padding-left:20px}
.hab{border-left:5px solid var(--main);background:var(--soft);padding:10px 14px;border-radius:0 12px 12px 0;font-size:.95rem}
.ref li{font-size:.86rem;color:var(--mut)}
.ranking{border:3px solid var(--main);border-radius:18px;padding:0 16px 12px;overflow:hidden;margin-top:12px}
.ranking h3{font-size:1rem;margin:0 -16px 8px;padding:10px 16px;background:var(--main);color:#fff}
.ranking ol{list-style:none}.ranking li{display:flex;justify-content:space-between;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:.92rem}
.ranking li:last-child{border-bottom:0}.rp{display:inline-block;min-width:2.1em;font-weight:800;color:var(--deep)}
.savebox{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.savebox input{flex:1;min-width:160px;border:2px solid var(--line);border-radius:12px;padding:11px;font-size:1rem;font-family:inherit}
.rel{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.rel canvas{width:120px;height:120px;border-radius:50%;background:var(--soft)}
.mini{width:100%;max-width:420px;height:auto;display:block;margin:10px auto 0}
@media (max-width:620px){.wrap{padding:10px 8px 30px}.card{padding:12px;border-radius:16px}.capa{grid-template-columns:1fr}.met{grid-template-columns:70px 1fr 44px;font-size:.82rem}.chip{font-size:.95rem}.rel{grid-template-columns:80px 1fr}.rel canvas{width:80px;height:80px}}
@media print{a.hub,header .hud,.ranking,.noprint{display:none!important}.card{border:1px solid #ccc;break-inside:avoid}body{font-size:12px}}

/* ===== pele profissional ===== */
:root{--main:#c2410c;--deep:#7c2d12;--soft:#fdf3ee;--line:#e3dfdb;--ink:#1f2421;--mut:#5f6b66;--ok:#2f6b3a;--bad:#b3261e}
body{background:#f6f7f5;color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{max-width:860px}
h1{font-size:1.35rem;font-weight:750;letter-spacing:-.015em;color:var(--ink)}
h2{color:var(--ink);font-weight:750}
h3{color:var(--deep);font-size:.95rem;text-transform:uppercase;letter-spacing:.04em}
a.hub{color:var(--mut);font-weight:600}
.card{border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 2px rgba(16,24,20,.05)}
.pill{border-radius:4px;background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:600}
.btn{border-radius:6px;font-weight:650;padding:11px 20px;letter-spacing:.01em}
.btn.ghost{border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--soft)}
.tool{border:1px solid var(--line);border-radius:6px;font-weight:600;color:var(--ink)}
.tool.on{border-color:var(--main);background:var(--soft);box-shadow:inset 0 0 0 1px var(--main)}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.titulo{font-size:1.15rem;font-weight:750;color:var(--ink);letter-spacing:-.01em}
.obj{background:#fafbfa;border:1px solid var(--line);border-left:3px solid var(--main);border-radius:6px;font-size:.92rem}
.obj b{color:var(--deep);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;padding-top:2px}
.acao{background:#fff;border:1px solid var(--line);border-left:3px solid var(--ink);border-radius:6px;font-weight:500;font-size:.93rem}
canvas.cena{border:1px solid var(--line);border-radius:8px;background:#fbfcfb}
.help{border:1px solid var(--line);color:var(--ink);font-weight:700}
.intro .ic{font-size:2.6rem;font-weight:800;color:var(--main);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.passos div{background:#fafbfa;border:1px solid var(--line);border-radius:6px;font-weight:500}
.passos b{font-size:.85rem;color:#fff;background:var(--main);border-radius:4px;min-width:1.7em;padding:2px 0}
.res .big{color:var(--ink)}
.pensa{background:#fafbfa;border:1px solid var(--line);border-radius:6px}
.pensa b{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
.hab{border-left:3px solid var(--main);border-radius:0 6px 6px 0}
.tab th{background:#f2f5f3;color:var(--ink);font-size:.82rem}
.ranking{border:1px solid var(--line);border-radius:10px}
.ranking h3{background:var(--ink);text-transform:none;letter-spacing:0}
</style>
</head>
<body>
<div class="wrap">
<a class="hub" href="https://ernandes-sobreira.github.io/jogos-ambientais/">← Todos os jogos</a>
<header>
  <h1>Termômetro de Mato Grosso</h1>
  <div class="hud" id="hud" style="display:none"><span class="pill" id="hF"></span><span class="pill" id="hP"></span></div>
</header>
<main id="tela"></main>
<div class="ranking" id="rankBox"><h3>Ranking Global</h3><ol id="rankList"><li><span>Carregando o ranking...</span></li></ol><p class="small" id="rankNote"></p></div>
</div>
<script>
const $=id=>document.getElementById(id);
const rr=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const W=760,H=372;
function hex(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function mix(a,b,t){const A=hex(a),B=hex(b);return`rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`;}

/* ================= AVATAR ================= */
const PELES=['#f6d3b8','#e3b18b','#c68a5e','#94603e','#5d3b26'];
const CABS=['#1b1b1b','#4e342e','#8d6e63','#d4a85a','#b5532f'];
const CAMISAS=['#00838f','#2e7d32','#f9a825','#c62828','#6a1b9a','#37474f'];
const ESTILOS=[['curto','Curto'],['cacheado','Cacheado'],['longo','Longo'],['coque','Coque'],['raspado','Raspado']];
const CHAPEUS=[['nenhum','Sem'],['bone','Boné'],['campo','Chapéu']];
let A={pele:2,cab:0,estilo:'cacheado',camisa:0,chapeu:'campo',nome:''};
try{const s=JSON.parse(localStorage.getItem('bc_avatar')||'null');if(s)A=Object.assign(A,s);}catch(e){}
function salvaA(){try{localStorage.setItem('bc_avatar',JSON.stringify(A));}catch(e){}}
function avatar(c,x,y,s,a,prancheta){
 c.save();c.translate(x,y);c.scale(s,s);
 const pele=PELES[a.pele],cab=CABS[a.cab],cam=CAMISAS[a.camisa];
 if(a.estilo==='longo'){c.fillStyle=cab;c.beginPath();c.ellipse(0,-39,12.5,15,0,0,7);c.fill();c.fillRect(-12.5,-40,25,22);}
 if(a.estilo==='cacheado'){c.fillStyle=cab;c.beginPath();c.ellipse(0,-40,15,14.5,0,0,7);c.fill();}
 c.fillStyle=cam;c.beginPath();c.moveTo(-16,0);c.quadraticCurveTo(-17,-21,-6,-25);c.lineTo(6,-25);c.quadraticCurveTo(17,-21,16,0);c.closePath();c.fill();
 c.fillStyle='rgba(0,0,0,.12)';c.fillRect(-1,-24,2,24);
 c.fillStyle=pele;c.fillRect(-3.5,-29,7,6);
 if(prancheta){c.fillStyle='#8d6e63';c.fillRect(4,-19,13,16);c.fillStyle='#fff';c.fillRect(5.5,-17,10,12);c.strokeStyle='#90a4ae';c.lineWidth=.8;for(let i=0;i<4;i++){c.beginPath();c.moveTo(7,-14+i*2.6);c.lineTo(14,-14+i*2.6);c.stroke();}}
 c.strokeStyle=cam;c.lineWidth=6;c.lineCap='round';c.beginPath();c.moveTo(-11,-20);c.lineTo(-4,-9);c.stroke();
 c.fillStyle=pele;c.beginPath();c.arc(-3,-8,3,0,7);c.fill();
 c.fillStyle=pele;c.beginPath();c.ellipse(0,-39,9.5,11,0,0,7);c.fill();
 c.beginPath();c.arc(-9.4,-38,2.3,0,7);c.arc(9.4,-38,2.3,0,7);c.fill();
 c.fillStyle=cab;
 if(a.estilo==='curto'){c.beginPath();c.ellipse(0,-44.5,10,6.8,0,Math.PI,0);c.fill();c.fillRect(-10,-46,2.8,7);c.fillRect(7.2,-46,2.8,7);}
 if(a.estilo==='cacheado'){for(let i=0;i<13;i++){const an=Math.PI*(.8+i*1.4/12);c.beginPath();c.arc(Math.cos(an)*12,-41+Math.sin(an)*11.5,4.2,0,7);c.fill();}}
 if(a.estilo==='longo'){c.beginPath();c.ellipse(0,-44.5,10.6,7.2,0,Math.PI,0);c.fill();}
 if(a.estilo==='coque'){c.beginPath();c.ellipse(0,-44.5,10,6.4,0,Math.PI,0);c.fill();c.beginPath();c.arc(0,-53,5.2,0,7);c.fill();}
 if(a.estilo==='raspado'){c.globalAlpha=.5;c.beginPath();c.ellipse(0,-44,9.8,6.2,0,Math.PI,0);c.fill();c.globalAlpha=1;}
 c.fillStyle='#2b2a26';c.beginPath();c.arc(-3.4,-39,1.25,0,7);c.arc(3.4,-39,1.25,0,7);c.fill();
 c.strokeStyle='#2b2a26';c.lineWidth=1;c.beginPath();c.arc(0,-35.6,2.6,.25,Math.PI-.25);c.stroke();
 if(a.chapeu==='bone'){c.fillStyle=cam;c.beginPath();c.ellipse(0,-46,10.6,5.8,0,Math.PI,0);c.fill();c.fillRect(-10.6,-47,21.2,2.6);c.beginPath();c.ellipse(8.5,-46.2,8,2.2,0,0,7);c.fill();}
 if(a.chapeu==='campo'){c.fillStyle='#d7c49e';c.beginPath();c.ellipse(0,-46,16.5,3.6,0,0,7);c.fill();c.beginPath();c.ellipse(0,-48,9.2,6.4,0,Math.PI,0);c.fill();c.fillStyle='#8d6e63';c.fillRect(-9.2,-49,18.4,1.9);}
 c.restore();
}
function pernas(c,x,y,s,a){c.save();c.translate(x,y);c.scale(s,s);c.fillStyle='#455a64';c.fillRect(-11,0,9,20);c.fillRect(2,0,9,20);c.fillStyle='#3e2723';c.fillRect(-12,18,11,4);c.fillRect(1,18,11,4);c.restore();}

/* ================= CENA ================= */
const CORES={main:'#c2410c',deep:'#7c2d12'};
function sr(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function syncMol(){}function partic(){}
function drawCena(c,G){if(G.desenha)G.desenha(c);}
/* ================= TELA / LOOP ================= */
let G=null,S=null,raf=0,ultimo=0,cx=null;
function laco(ts){const dt=Math.min(.05,(ts-ultimo)/1000||0);ultimo=ts;if(G){G.t+=dt;if(G.upd)G.upd(dt);syncMol(G,dt);partic(G,dt);if(cx)drawCena(cx,G);if(G.extra)G.extra(cx);}raf=requestAnimationFrame(laco);}
function parar(){cancelAnimationFrame(raf);raf=0;}
function rodar(){parar();ultimo=performance.now();raf=requestAnimationFrame(laco);}
function hud(){$('hud').style.display='flex';$('hF').textContent=`Fase ${S.f+1} de ${FASES.length}`;$('hP').textContent=`${Math.max(0,S.tot+S.fp)} pts`;}
function telaJogo(chip,info){
 const F=FASES[S.f];
 $('tela').innerHTML=`<div class="card"><div class="row top"><span class="chip" id="chip">${chip}</span><div class="row"><span class="pill" id="info">${info||''}</span><button class="help" id="bAj" aria-label="Como jogar">?</button></div></div>
 <div class="obj"><b>🎯 Objetivo</b><span>${F.obj}</span></div><div class="acao"><span class="dedo">👉</span><span id="acao"></span></div>
 <canvas class="cena" id="cv"></canvas><div class="ctrl" id="ctrl"></div><div class="mets" id="mets"></div></div>`;
 $('bAj').onclick=ajuda;
 const cv=$('cv'),dpr=Math.min(2,window.devicePixelRatio||1);cv.width=W*dpr;cv.height=H*dpr;cx=cv.getContext('2d');cx.setTransform(dpr,0,0,dpr,0,0);
 cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;if(G&&G.tap)G.tap(x,y);});
}
function acao(t){const e=$('acao');if(e&&e.innerHTML!==t)e.innerHTML=t;}
function ajuda(){const F=FASES[S.f],d=document.createElement('div');d.className='modal';
 d.innerHTML=`<div class="card intro"><div class="ic">${F.ic}</div><h2>${F.nome}</h2><div class="obj" style="text-align:left"><b>🎯 Objetivo</b><span>${F.obj}</span></div><div class="passos">${F.passos.map(p=>`<div><b>${p[0]}</b><span>${p[1]}</span></div>`).join('')}</div><button class="btn">Entendi</button></div>`;
 d.onclick=e=>{if(e.target===d||e.target.tagName==='BUTTON')d.remove();};document.body.appendChild(d);}
function medidor(id,rot,cls,max,alvo){const a=alvo!=null?`<span class="alvo" style="left:${alvo/max*100}%"></span>`:'';return`<div class="met ${cls}" id="${id}" data-max="${max}"><span>${rot}</span><div class="bar"><span class="fill"></span>${a}</div><span class="v"></span></div>`;}
function poeMed(id,v){const e=$(id);if(!e)return;const m=+e.dataset.max;e.querySelector('.fill').style.width=clamp(v/m*100,0,100)+'%';e.querySelector('.v').textContent=Math.round(v);}
function poeSaldo(v,max){const e=$('mSaldo');if(!e)return;const f=e.querySelector('.fill'),p=clamp(Math.abs(v)/max*50,0,50);if(v<0){f.style.left=(50-p)+'%';f.style.width=p+'%';f.style.background='#43a047';}else{f.style.left='50%';f.style.width=p+'%';f.style.background='#e53935';}e.querySelector('.v').textContent=(v>0?'+':'')+Math.round(v);}

/* ================= FASES ================= */
const FASES=[

function f1(){G={t:0,h:8,etapa:0,drag:false,tent:0,pts:0,fim:0};telaJogo('Anatomia de um dia extremo','hora mais quente');
 const O={x0:56,y0:38,w:400,h:270,xmin:0,xmax:23,ymin:24,ymax:46,xt:[0,3,6,9,12,15,18,21],yt:[24,28,32,36,40,44],xf:v=>v+'h',yf:v=>v+'°',titulo:'Temperatura do ar, °C · Cuiabá, 30 set 2020'};

function f2(){const fit=ajuste(ANOS,TMAX),F0=fit.a+fit.b*1981,F1=fit.a+fit.b*2024;G={t:0,h0:31.5,h1:30.0,drag:0,tent:0,fim:0};telaJogo('Linha de tendência','ajuste');

 <tr><td>3. Dias acima de 35 °C</td><td>Estima e compara os dias muito quentes por década</td><td>Que atividades sofrem com mais dias extremos?</td><td>Extremos, média e distribuição.</td></tr>

 <h3>Avaliação</h3>
 <p>Use o relatório de campo impresso e a frase escrita por cada dupla. Todos os instrumentos têm o mesmo peso. Observe se o aluno sustenta a afirmação sobre o clima com um número lido nos gráficos.</p>
 <h3>Sequência de 3 aulas</h3>
 <ol><li><b>Aula 1.</b> Jogo completo e discussão.</li><li><b>Aula 2.</b> Leitura de temperatura no pátio, de hora em hora, durante um dia letivo, e comparação com a curva da fase 1.</li><li><b>Aula 3.</b> Proposta da turma: uma ação de mitigação e uma de adaptação para a escola, com justificativa.</li></ol>
 <h3>De onde vêm os números</h3>
 <p><b>Fase 1.</b> Dados horários da estação automática do INMET em Cuiabá (A901), dia 30 de setembro de 2020, no horário de Cuiabá. Foi o dia com a maior temperatura horária entre os dias completos de 2019 a 2024 do arquivo usado.</p>
 <p><b>Fases 2 a 4.</b> Médias anuais para o município de Cáceres calculadas a partir da reanálise ERA5-Land (Muñoz-Sabater et al., 2021), de 1981 a 2024, organizadas pelo professor Ernandes Sobreira (UNEMAT). Reanálise combina modelo e observações; não é a leitura de um termômetro único. Noite quente, aqui, é a noite em que a mínima ficou acima de 25 °C. As tendências são retas de mínimos quadrados calculadas no próprio jogo: +0,54 °C por década na máxima média e +0,27 °C por década na mínima média.</p>
 <p><b>Fase 5.</b> As definições de mitigação e adaptação seguem o glossário do IPCC. O efeito das árvores em resfriar o entorno é sustentado por revisão sistemática de estudos urbanos (Bowler et al., 2010).</p>
