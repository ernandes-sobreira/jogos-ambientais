<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quarteirão Fresco · Ilha de calor</title>
<style>
:root{--main:#0277bd;--deep:#01579b;--soft:#e1f5fe;--line:#cfe6f3;--ink:#1d2a33;--mut:#5a6b76;--bad:#c62828;--good:#2e7d32}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:var(--ink);line-height:1.45}
.wrap{max-width:780px;margin:0 auto;padding:12px 14px 40px}
.wrap>*{min-width:0}
a.hub{color:var(--deep);font-weight:700;text-decoration:none;font-size:.9rem}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
h1{font-size:1.4rem;color:var(--deep)}
h2{font-size:1.15rem;color:var(--deep);margin-bottom:6px}
.hud{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--soft);color:var(--deep);border-radius:99px;padding:5px 11px;font-weight:700;font-size:.86rem}
.card{border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;background:#fff}
.btn{background:var(--main);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--deep)}.btn.ghost{background:#fff;color:var(--deep);border:2px solid var(--main)}
.btn:disabled{background:#b0c4d0;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.small{font-size:.86rem;color:var(--mut)}
.meter .lab{display:flex;justify-content:space-between;font-weight:700;font-size:.92rem}
.track{position:relative;height:18px;border-radius:10px;background:#eef4f8;overflow:hidden;margin:4px 0 2px}
.track i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#4fc3f7,#ffb74d,#e53935);transition:width .3s}
.track b{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--deep)}
.grid{display:grid;gap:4px;margin-top:10px;max-width:520px}
.t{aspect-ratio:1;border-radius:9px;border:2px solid transparent;display:flex;align-items:center;justify-content:center;font-size:clamp(16px,4.6vw,26px);cursor:pointer;position:relative;transition:transform .1s}
.t:hover{transform:scale(1.05)}.t.sel{border-color:#ff6f00;box-shadow:0 0 0 2px #ffe0b2}
.t .sh{position:absolute;inset:0;border-radius:7px;background:rgba(27,94,32,.28);pointer-events:none}
.t.rua{cursor:default}
.painel{border:2px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:#fbfdff}
.opt{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;margin-top:8px;font-size:.95rem;cursor:pointer;font-family:inherit;color:var(--ink)}
.opt:hover{border-color:var(--main)}.opt:disabled{opacity:.45;cursor:default}
.opt b.c{color:var(--deep);white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.8rem;color:var(--mut);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:4px}.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.fb{margin-top:10px;padding:11px 13px;border-radius:12px;font-size:.93rem;display:none}
.fb.good{display:block;background:#e8f5e9;color:#1b5e20}.fb.bad{display:block;background:#ffebee;color:#8e1b1b}
.opts2{display:grid;gap:10px;margin-top:12px}
.q2{text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:13px 15px;font-size:1rem;cursor:pointer;font-family:inherit;color:var(--ink)}
.q2:hover{border-color:var(--main)}.q2.right{border-color:var(--good);background:#e8f5e9}.q2.wrong{border-color:var(--bad);background:#ffebee}
.big{font-size:2.3rem;font-weight:800;color:var(--deep)}
.qm{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;border:2px solid var(--main);color:var(--deep);background:#fff;font-weight:800;cursor:pointer;font-size:.85rem;margin-left:6px}
.memo{display:none;background:#f3f9fc;border-radius:12px;padding:10px 12px;margin-top:8px;font-size:.88rem;color:var(--mut)}.memo.on{display:block}
.ranking{border:3px solid var(--main);border-radius:18px;padding:0 16px 12px;overflow:hidden;margin-top:12px}
.ranking h3{font-size:1rem;margin:0 -16px 8px;padding:10px 16px;background:var(--main);color:#fff}
.ranking ol{list-style:none}.ranking li{display:flex;justify-content:space-between;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:.92rem}
.ranking li:last-child{border-bottom:0}.rp{display:inline-block;min-width:2.1em;font-weight:800;color:var(--deep)}
.savebox{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.savebox input{flex:1;min-width:160px;border:2px solid var(--line);border-radius:12px;padding:11px;font-size:1rem;font-family:inherit}
</style>
</head>
<body>
<div class="wrap">
<a class="hub" href="https://ernandes-sobreira.github.io/jogos-ambientais/">← Todos os jogos</a>
<header>
  <h1>🏘️ Quarteirão Fresco</h1>
  <div class="hud" id="hud" style="display:none"><span class="pill" id="hF">Fase 1/3</span><span class="pill" id="hP">0 pts</span><span class="pill" id="hM">🪙 0</span></div>
</header>
<main id="tela"></main>
<div class="ranking" id="rankBox"><h3>Ranking Global</h3><ol id="rankList"><li><span>Carregando o ranking...</span></li></ol><p class="small" id="rankNote"></p></div>
</div>
<script>
const $=id=>document.getElementById(id);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let actx=null;function beep(f,d){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.setValueAtTime(.07,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(e){}}

/* Refletância solar (fração da luz do sol refletida), faixas publicadas:
   telhado escuro 5 a 15% e telhado frio acima de 65% (EPA, Cool Roofs Compendium);
   asfalto novo 5 a 10%, asfalto envelhecido 10 a 15%, concreto cinza novo 35 a 40%,
   concreto cinza envelhecido 20 a 30%, concreto branco novo 70 a 80% (Caltrans, Cool Pavements, a partir de EPA e LBNL).
   O jogo usa o meio de cada faixa. */
const MAT={
 telhadoEscuro:{n:'Telhado escuro',ic:'🏠',cor:'#8d6e63',ref:10,faixa:'5 a 15%'},
 telhadoFrio:{n:'Telhado frio (branco)',ic:'🏠',cor:'#eceff1',ref:65,faixa:'acima de 65%'},
 asfaltoVelho:{n:'Asfalto envelhecido',ic:'',cor:'#757575',ref:12.5,faixa:'10 a 15%'},
 asfaltoNovo:{n:'Asfalto novo',ic:'',cor:'#424242',ref:7.5,faixa:'5 a 10%'},
 concretoVelho:{n:'Calçada de concreto velha',ic:'',cor:'#bdbdbd',ref:25,faixa:'20 a 30%'},
 concretoCinza:{n:'Concreto cinza novo',ic:'',cor:'#d6d6d6',ref:37.5,faixa:'35 a 40%'},
 concretoBranco:{n:'Concreto branco novo',ic:'',cor:'#fafafa',ref:75,faixa:'70 a 80%'},
 arvore:{n:'Árvore',ic:'🌳',cor:'#c5e1a5',ref:null,faixa:'faz sombra'}
};
/* Opções por material: custo em moedas. As que trocam por algo mais escuro são armadilhas. */
const OPC={
 telhadoEscuro:[['telhadoFrio',2]],
 asfaltoVelho:[['concretoCinza',2],['arvore',3],['asfaltoNovo',1]],
 concretoVelho:[['arvore',3],['concretoBranco',3],['asfaltoNovo',1]],
 concretoCinza:[['arvore',3]]
};
/* Calor do jogo por quadrado = 100 − refletância. Quadrado com árvore, ou vizinho de árvore, recebe sombra e conta metade.
   O índice é a média do quarteirão. É uma simplificação do jogo, não uma temperatura medida. */
const L='telhadoEscuro',A='asfaltoVelho',C='concretoVelho',R='rua';
const MAPAS=[
 {nome:'Rua da escola',ico:'🏫',moedas:14,meta:62,m:[[L,L,L,L,L],[C,C,C,C,C],[R,R,R,R,R],[C,C,C,C,C],[L,L,A,A,L]]},
 {nome:'Centro comercial',ico:'🏬',moedas:16,meta:61,m:[[L,L,L,L,L,L],[C,C,C,C,C,C],[R,R,R,R,R,R],[C,C,C,C,C,C],[A,A,A,L,L,L],[A,A,A,L,L,L]]},
 {nome:'Bairro inteiro',ico:'🏘️',moedas:20,meta:56,m:[[L,L,C,R,C,L],[L,L,C,R,C,L],[C,C,C,R,C,C],[R,R,R,R,R,R],[A,A,C,R,C,L],[A,A,C,R,C,L]]}
];
const Q=[
 {p:'Por que o telhado branco esquenta menos que o escuro?',o:[{t:'Ele reflete mais luz do sol e absorve menos calor',ok:1},{t:'A tinta branca produz frio quando o sol bate',ok:0},{t:'Ele deixa o vento passar por dentro do telhado',ok:0}],e:'Telhados escuros refletem só de 5 a 15% da luz. Os telhados frios refletem mais de 65% e por isso absorvem bem menos calor (EPA).'},
 {p:'Como a árvore deixa a rua mais fresca?',o:[{t:'Faz sombra e solta vapor de água pelas folhas',ok:1},{t:'Puxa o calor do asfalto pelas raízes',ok:0},{t:'Bloqueia todo o vento quente que vem da cidade',ok:0}],e:'Superfícies na sombra podem ficar de 11 a 25 °C mais frias que as expostas ao sol forte. A água que sai pelas folhas também esfria o ar (EPA).'},
 {p:'Qual destes pisos reflete mais a luz do sol?',o:[{t:'Concreto branco novo',ok:1},{t:'Asfalto novo',ok:0},{t:'Asfalto envelhecido',ok:0}],e:'O concreto branco novo reflete de 70 a 80% da luz. O asfalto novo reflete de 5 a 10%, e o envelhecido de 10 a 15%.'}
];
let S;
function hud(){$('hud').style.display='flex';$('hF').textContent=MAPAS[S.f].ico+' Fase '+(S.f+1)+'/3';$('hP').textContent=(S.tot+S.fp)+' pts';$('hM').textContent='🪙 '+S.moedas;}
function memo(id,t){return `<button class="qm" onclick="$('${id}').classList.toggle('on')">?</button><div class="memo" id="${id}">${t}</div>`;}
function sombra(r,c){const g=S.g;for(const[dr,dc]of[[0,0],[1,0],[-1,0],[0,1],[0,-1]]){const x=g[r+dr]&&g[r+dr][c+dc];if(x==='arvore')return true;}return false;}
function calorQ(r,c){const k=S.g[r][c];const ref=k===R?MAT.asfaltoVelho.ref:k==='arvore'?MAT.concretoVelho.ref:MAT[k].ref;const base=100-ref;return sombra(r,c)?base/2:base;}
function indice(){let s=0,n=0;S.g.forEach((l,r)=>l.forEach((_,c)=>{s+=calorQ(r,c);n++;}));return s/n;}
function inicio(){
 $('hud').style.display='none';$('rankBox').style.display='block';
 $('tela').innerHTML=`<div class="card"><h2>Esfrie o quarteirão</h2>
 <p>Superfícies escuras absorvem o sol e esquentam a cidade. Você tem moedas para trocar telhados, pisos e plantar árvores. Toque num quadrado e escolha a reforma.</p>
 <p class="small" style="margin-top:6px">🎯 Meta: deixar o índice de calor abaixo da linha antes de acabar o dinheiro. Cuidado: asfalto novo é barato, mas esquenta mais e tira 10 pontos.</p>
 <div class="row" style="margin-top:12px"><button class="btn" onclick="novo()">Começar →</button></div></div>`;
}
function novo(){S={f:0,tot:0,fp:0,erros:0};salvo=false;$('rankBox').style.display='none';fase();}
function fase(){const M=MAPAS[S.f];S.g=M.m.map(l=>l.slice());S.moedas=M.moedas;S.fp=0;S.sel=null;S.i0=indice();hud();desenha();}
function desenha(msg){
 const M=MAPAS[S.f],v=indice(),cols=S.g[0].length;
 let h=`<div class="card"><h2>Fase ${S.f+1}: ${M.nome}</h2>
 <div class="meter"><div class="lab"><span>🌡️ Índice de calor ${memo('m1','Cada quadrado vale 100 menos a porcentagem de sol que ele reflete. Quadrados com árvore ou ao lado de uma ficam na sombra e contam metade. O índice é a média do quarteirão. É uma simplificação do jogo, não uma temperatura. As porcentagens de reflexão vêm da EPA e do Caltrans.')}</span><span id="iv">${v.toFixed(0)}</span></div>
 <div class="track"><i style="width:${v}%"></i><b style="left:${M.meta}%"></b></div><div class="small">Meta: abaixo de ${M.meta}. Começou em ${S.i0.toFixed(0)}.</div></div>
 <div class="grid" style="grid-template-columns:repeat(${cols},1fr)">`;
 S.g.forEach((l,r)=>l.forEach((k,c)=>{const m=k===R?{cor:'#616161',ic:''}:MAT[k];const sel=S.sel&&S.sel[0]===r&&S.sel[1]===c;
  h+=`<div class="t ${k===R?'rua':''} ${sel?'sel':''}" data-r="${r}" data-c="${c}" style="background:${k===R?'#616161':m.cor}">${k===R?'<span style="font-size:.6em;color:#fff">═</span>':m.ic}${sombra(r,c)&&k!=='arvore'?'<span class="sh"></span>':''}</div>`;}));
 h+=`</div><div class="legend"><span><i style="background:#8d6e63"></i>telhado escuro</span><span><i style="background:#eceff1;border:1px solid #ccc"></i>telhado frio</span><span><i style="background:#757575"></i>asfalto</span><span><i style="background:#bdbdbd"></i>calçada</span><span><i style="background:rgba(27,94,32,.35)"></i>sombra</span></div>`;
 h+=`<div class="painel" id="pn">${painel()}</div>${msg||''}
 <div class="row" style="margin-top:12px"><button class="btn" id="bf">Concluir a fase</button></div></div>`;
 $('tela').innerHTML=h;
 document.querySelectorAll('.t').forEach(t=>t.onclick=()=>{const r=+t.dataset.r,c=+t.dataset.c;if(S.g[r][c]===R)return;S.sel=[r,c];desenha();});
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>reforma(b.dataset.k,+b.dataset.c));
 $('bf').onclick=fimFase;
}
function painel(){
 if(!S.sel)return '<span class="small">Toque num telhado, numa calçada ou no estacionamento para ver as reformas.</span>';
 const[r,c]=S.sel,k=S.g[r][c],m=MAT[k],ops=OPC[k]||[];
 let h=`<b>${m.n}</b> <span class="small">· reflete ${m.faixa} do sol</span>`;
 if(!ops.length)h+='<p class="small" style="margin-top:6px">Este quadrado já foi reformado.</p>';
 ops.forEach(([d,custo])=>{const md=MAT[d];h+=`<button class="opt" data-k="${d}" data-c="${custo}" ${custo>S.moedas?'disabled':''}><span>${md.ic||'▪️'} ${md.n} <span class="small">· ${d==='arvore'?'faz sombra aqui e ao redor':'reflete '+md.faixa}</span></span><b class="c">🪙 ${custo}</b></button>`;});
 return h;
}
function reforma(d,custo){
 const[r,c]=S.sel;const antes=indice();S.g[r][c]=d;S.moedas-=custo;const depois=indice();
 let msg;
 if(depois>antes+0.01){S.fp-=10;S.erros++;beep(170,.3);msg=`<div class="fb bad">❌ −10. ${MAT[d].n} reflete só ${MAT[d].faixa} do sol. Ficou mais quente.</div>`;}
 else{const g=Math.round((antes-depois)*10);S.fp+=g;beep(760,.1);msg=`<div class="fb good">✅ O índice caiu ${(antes-depois).toFixed(1)}. +${g} pontos.</div>`;}
 S.sel=null;hud();desenha(msg);
}
function fimFase(){
 const M=MAPAS[S.f],v=indice(),ok=v<M.meta,bonus=ok?30+S.moedas*5:0;S.fp+=bonus;hud();const q=Q[S.f];
 $('tela').innerHTML=`<div class="card"><h2>${ok?'✅ Quarteirão mais fresco':'⚠️ Ainda quente demais'}</h2><p>Índice final ${v.toFixed(0)}. A meta era abaixo de ${M.meta}. ${ok?`+30 pela meta e +${S.moedas*5} pelas moedas que sobraram.`:''}</p>
 <p style="margin-top:12px"><b>${q.p}</b></p><div class="opts2">${shuf(q.o).map(o=>`<button class="q2" data-ok="${o.ok}">${o.t}</button>`).join('')}</div><div class="fb" id="fb"></div></div>`;
 const bs=[...document.querySelectorAll('.q2')];
 bs.forEach(b=>b.onclick=()=>{bs.forEach(x=>{x.disabled=true;if(x.dataset.ok==='1')x.classList.add('right');});const c=b.dataset.ok==='1';if(!c){b.classList.add('wrong');S.erros++;}S.fp+=c?20:-10;hud();
  const ult=S.f===MAPAS.length-1;$('fb').className='fb '+(c?'good':'bad');
  $('fb').innerHTML=(c?'Certo! +20. ':'Não foi dessa vez. −10. ')+q.e+`<div class="row" style="margin-top:10px">${ok?`<button class="btn" id="bp">${ult?'Ver resultado →':'Próxima fase →'}</button>`:'<button class="btn" id="bp">Tentar a fase de novo</button><button class="btn ghost" id="bq">Encerrar</button>'}</div>`;
  $('bp').onclick=()=>{if(ok){S.tot+=S.fp;S.fp=0;if(ult)final();else{S.f++;fase();}}else fase();};
  if($('bq'))$('bq').onclick=()=>final(true);});
}
function final(parou){
 $('rankBox').style.display='block';const nivel=parou?'Fase '+(S.f+1):'Bairro fresco';S.fp=0;hud();
 $('tela').innerHTML=`<div class="card" style="text-align:center"><div class="big">${parou?'🌡️':'🏆'}</div><h2>${parou?'Fim de jogo':'Você esfriou o bairro!'}</h2><div class="big">${S.tot} pts</div><p class="small">${S.erros} erro(s) · chegou até: ${nivel}</p>
 <div class="savebox"><input id="pName" maxlength="20" placeholder="Seu nome"><button class="btn" id="bS">Salvar no ranking</button></div><p class="small" id="sSt"></p>
 <div class="row" style="justify-content:center;margin-top:12px"><button class="btn ghost" onclick="inicio()">Jogar de novo</button></div>
 <details style="text-align:left;margin-top:14px"><summary class="small" style="cursor:pointer">📚 Fontes</summary><ul class="small" style="margin:6px 0 0 18px">
 <li>EPA. Reducing Urban Heat Islands: Compendium of Strategies, capítulos Cool Roofs, Cool Pavements e Trees and Vegetation.</li>
 <li>Caltrans. Cool Pavements, Preliminary Investigation, tabela de albedo de pavimentos.</li>
 <li>Lawrence Berkeley National Laboratory, Heat Island Group.</li></ul></details></div>`;
 $('bS').onclick=()=>salvar(nivel);
}
const firebaseConfig={apiKey:"AIzaSyCbXi3UCVl8oLleBzGb6DqWSxbZmZU2yDQ",authDomain:"jogos-ranking.firebaseapp.com",projectId:"jogos-ranking",storageBucket:"jogos-ranking.firebasestorage.app",messagingSenderId:"958784915420",appId:"1:958784915420:web:4212d3ad278f02d600f119"};
const GAME_ID="quarteirao-fresco";let db=null,fs=null,salvo=false;
(async()=>{try{const a=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");const f=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");db=f.getFirestore(a.initializeApp(firebaseConfig));fs=f;carregar();}catch(e){$('rankList').innerHTML='<li><span>Ranking indisponível sem internet.</span></li>';$('rankNote').textContent='O jogo funciona normalmente. O ranking volta quando houver conexão.';}})();
async function carregar(){if(!db)return;try{const q=fs.query(fs.collection(db,'games',GAME_ID,'scores'),fs.orderBy('score','desc'),fs.limit(10));const sn=await fs.getDocs(q);const r=[];sn.forEach(d=>r.push(d.data()));$('rankNote').textContent='Maior pontuação primeiro.';$('rankList').innerHTML=r.length?r.map((x,i)=>`<li><span><span class="rp">${i+1}º</span>${esc(x.name||'?')}</span><span>${(Number(x.score)||0).toLocaleString('pt-BR')} pts · ${esc(x.level||'')}</span></li>`).join(''):'<li><span>Seja o primeiro do ranking!</span></li>';}catch(e){$('rankList').innerHTML='<li><span>Não foi possível carregar o ranking.</span></li>';}}
async function salvar(nivel){if(salvo)return;const nome=$('pName').value.trim(),st=$('sSt');if(!nome){st.textContent='Digite seu nome primeiro.';return;}if(!db){st.textContent='Sem conexão com o ranking. O resultado não foi enviado.';return;}
 $('bS').disabled=true;try{await fs.addDoc(fs.collection(db,'games',GAME_ID,'scores'),{name:nome.slice(0,20),score:Math.max(0,S.tot),level:nivel,ts:fs.serverTimestamp()});salvo=true;st.textContent='Salvo no Ranking Global!';carregar();}catch(e){$('bS').disabled=false;st.textContent='Erro ao salvar. Tente de novo.';}}
window.__qf={get S(){return S},indice,MAPAS,OPC,MAT};
inicio();
</script>
</body>
</html>
