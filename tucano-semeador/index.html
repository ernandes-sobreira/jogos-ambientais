<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tucano Semeador</title>
<style>
:root{--main:#ef6c00;--deep:#bf360c;--soft:#fff3e0;--line:#ffe0b2;--ink:#2b1a0e;--mut:#6d5443}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:var(--ink);line-height:1.45}
.wrap{max-width:780px;margin:0 auto;padding:12px 14px 40px}
a.hub{color:var(--deep);font-weight:700;text-decoration:none;font-size:.9rem}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
h1{font-size:1.4rem;color:var(--deep)}h2{font-size:1.15rem;color:var(--deep);margin-bottom:6px}
.hud{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--soft);color:var(--deep);border-radius:99px;padding:5px 11px;font-weight:700;font-size:.86rem}
.card{border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;background:#fff}
.btn{background:var(--main);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--deep)}.btn.ghost{background:#fff;color:var(--deep);border:2px solid var(--main)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.small{font-size:.86rem;color:var(--mut)}
canvas{width:100%;max-width:760px;margin:0 auto;display:block;border:2px solid var(--line);border-radius:16px;touch-action:none;background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:6px;justify-content:center;margin-top:10px}
.pad button{border:2px solid var(--line);background:var(--soft);border-radius:12px;font-size:1.4rem;cursor:pointer;color:var(--deep);touch-action:manipulation}
.pad button:active{background:#dcedc8}
.tab{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:8px}.tab td{border-bottom:1px solid var(--line);padding:5px 4px;vertical-align:top}
.ops{display:grid;gap:8px;margin-top:10px}
.ops button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-size:.95rem;cursor:pointer;font-family:inherit;text-align:left;color:var(--ink)}
.ops button:hover{border-color:var(--main)}.ops button:disabled{opacity:.5;cursor:default}
.fb{margin-top:10px;padding:11px 13px;border-radius:12px;font-size:.93rem}
.fb.good{background:#e8f5e9;color:#1b5e20}.fb.bad{background:#ffebee;color:#8e1b1b}
.big{font-size:2.3rem;font-weight:800;color:var(--deep)}
.ranking{border:3px solid var(--main);border-radius:18px;padding:0 16px 12px;overflow:hidden;margin-top:12px}
.ranking h3{font-size:1rem;margin:0 -16px 8px;padding:10px 16px;background:var(--main);color:#fff}
.ranking ol{list-style:none}.ranking li{display:flex;justify-content:space-between;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:.92rem}
.ranking li:last-child{border-bottom:0}.rp{display:inline-block;min-width:2.1em;font-weight:800;color:var(--deep)}
.savebox{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.savebox input{flex:1;min-width:160px;border:2px solid var(--line);border-radius:12px;padding:11px;font-size:1rem;font-family:inherit}
</style>
</head>
<body>
<div class="wrap">
<a class="hub" href="https://ernandes-sobreira.github.io/jogos-ambientais/">← Todos os jogos</a>
<header>
  <h1>🌱 Tucano Semeador</h1>
  <div class="hud" id="hud" style="display:none"><span class="pill" id="hF">Fase 1/3</span><span class="pill" id="hP">0 pts</span><span class="pill" id="hR">🌱 0</span><span class="pill" id="hV">🍒 0</span><span class="pill" id="hT">⏱ 0 s</span></div>
</header>
<main id="tela"></main>
<div class="ranking" id="rankBox"><h3>Ranking Global</h3><ol id="rankList"><li><span>Carregando o ranking...</span></li></ol><p class="small" id="rankNote"></p></div>
</div>
<script>
const $=id=>document.getElementById(id);
const rr=(a,b)=>a+Math.random()*(b-a);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let actx=null;function beep(f,d,v){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.setValueAtTime(v||.05,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(e){}}
/* Ciência: tucanos e outras aves grandes comem frutos e espalham sementes grandes (Galetti et al. 2013, Science, via Revista Pesquisa FAPESP);
   o tucano-toco dispersa sementes do manduvi no Pantanal (Agência FAPESP, 2008). Velocidade, vidas e pontos são regras do jogo. */
const FASES=[
 {nome:'Frutos na mata',v:150,gap:165,dur:60,meta:4,txt:'Voe entre as copas, coma frutos e solte as sementes nas clareiras. Cada semente que cai numa clareira vira muda.'},
 {nome:'Clareiras para recuperar',v:175,gap:160,dur:60,meta:6,txt:'A mata tem mais clareiras degradadas, e as árvores ficam mais próximas. Guarde sementes para soltar na hora certa.'},
 {nome:'Manduvi no Pantanal',v:200,gap:152,dur:65,meta:7,txt:'No Pantanal, o tucano-toco come frutos e espalha sementes do manduvi, a árvore onde a arara-azul faz ninho.'}
];
const PERG=[
 {q:'Por que aves grandes, como os tucanos, são importantes para a regeneração da floresta?',o:['Conseguem engolir frutos grandes e espalhar sementes grandes','Afastam os insetos que comem as folhas das árvores','Fazem ninhos que protegem as mudas do sol forte']},
 {q:'Num estudo publicado na Science, o que aconteceu com o palmito-juçara onde as aves grandes desapareceram?',o:['As palmeiras passaram a produzir sementes menores','As palmeiras deixaram de dar frutos por completo','As sementes ficaram maiores e mais pesadas']},
 {q:'Segundo pesquisa divulgada pela Agência FAPESP, o tucano-toco dispersa sementes de qual árvore usada pela arara-azul para fazer ninho?',o:['Manduvi','Acuri','Ipê-amarelo']}
];
let S,cv,cx,raf=null,last=0,W=760,H=460,alvoY=null,tec={};
function hud(){$('hud').style.display='flex';$('hF').textContent='Fase '+(S.f+1)+'/3';$('hP').textContent=(S.tot+S.fp)+' pts';
 if(S.g){$('hR').textContent='🌱 '+S.g.mudas+'/'+FASES[S.f].meta;$('hV').textContent='🍒 '+S.g.sem+'/3 · ❤️ '+S.g.vidas;$('hT').textContent='⏱ '+Math.max(0,Math.ceil(S.g.dur-S.g.t))+' s';}}
function inicio(){parar();$('hud').style.display='none';$('rankBox').style.display='block';
 $('tela').innerHTML=`<div class="card"><h2>Voe entre as árvores e plante a floresta</h2>
 <table class="tab"><tr><td>🐦</td><td>Você é um tucano-toco. Toque ou arraste para cima e para baixo para mudar a altura do voo. No teclado, use as setas.</td></tr>
 <tr><td>🌳</td><td>Passe pelo vão entre as copas de cima e as árvores de baixo. Bater num galho tira uma vida. São 3 vidas.</td></tr>
 <tr><td>🍒</td><td>Coma os frutos para guardar sementes. Cabem até 3.</td></tr>
 <tr><td>🌱</td><td>Sobre uma clareira de terra marrom, toque em Soltar semente ou aperte Espaço. Semente que cai na clareira vira muda: +10.</td></tr></table>
 <p class="small" style="margin-top:8px">🎯 Meta: plantar a quantidade de mudas da fase antes do tempo acabar.</p>
 <div class="row" style="margin-top:12px"><button class="btn" onclick="novo()">Começar →</button></div></div>`;}
function novo(){S={f:0,tot:0,fp:0};salvo=false;$('rankBox').style.display='none';fase();}
function fase(){const F=FASES[S.f];S.fp=0;S.g=null;hud();
 $('tela').innerHTML=`<div class="card"><h2>Fase ${S.f+1}: ${F.nome}</h2><p>${F.txt}</p><p class="small" style="margin-top:6px">🎯 Meta: ${F.meta} mudas em ${F.dur} s, sem perder as 3 vidas.</p><div class="row" style="margin-top:12px"><button class="btn" id="bg">Levantar voo →</button></div></div>`;
 $('bg').onclick=jogar;}
const CHAO=()=>H-36;
function jogar(){$('tela').innerHTML=`<div class="card"><canvas id="cv"></canvas><div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="bs">🌱 Soltar semente</button></div><p class="small" style="margin-top:8px;text-align:center">Arraste para cima e para baixo. Espaço também solta a semente.</p></div>`;
 cv=$('cv');if(cv.clientWidth<520){W=440;H=560;}else{W=760;H=460;}cv.width=W;cv.height=H;cx=cv.getContext('2d');
 S.g={t:0,dur:FASES[S.f].dur,y:H*.45,vy:0,asa:0,sem:1,vidas:3,inv:0,mudas:0,obs:[],frutos:[],clar:[],quedas:[],plantas:[],prox:W*.6,x0:0,fim:false,msg:'',msgT:0,perdidas:0};alvoY=null;
 const pos=e=>{const r=cv.getBoundingClientRect();return (e.clientY-r.top)*H/r.height;};
 cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);alvoY=pos(e);e.preventDefault();};
 cv.onpointermove=e=>{if(e.buttons)alvoY=pos(e);};
 $('bs').onclick=soltar;hud();last=performance.now();parar();raf=requestAnimationFrame(loop);}
document.addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')||e.key===' '){tec[e.key]=1;if(S&&S.g&&!S.g.fim){e.preventDefault();if(e.key===' ')soltar();}}});
document.addEventListener('keyup',e=>{tec[e.key]=0;});
function msg(t){S.g.msg=t;S.g.msgT=2;}
function soltar(){const g=S.g;if(!g||g.fim)return;if(g.sem<=0){msg('Sem sementes. Coma um fruto primeiro.');return;}g.sem--;g.quedas.push({x:W*.25,y:g.y+10,vy:40});beep(520,.06);}
function gerar(){const g=S.g,F=FASES[S.f];
 if(Math.random()<(S.f===0?.3:.38)&&!(g.ult==='c')){const L=rr(260,380);g.clar.push({x:W+20,w:L});g.ult='c';g.prox=L+rr(60,110);
  if(Math.random()<.7)g.frutos.push({x:W+20+rr(40,L-40),y:rr(H*.25,CHAO()-80),r:9,man:S.f===2});return;}
 g.ult='a';const topo=rr(40,CHAO()-F.gap-90);const base=topo+F.gap;
 g.obs.push({x:W+60,topo,base,c:Math.random()});
 const lado=Math.random()<.5;g.frutos.push({x:W+60+rr(-10,10),y:lado?topo+16:base-16,r:9,man:S.f===2});
 g.prox=rr(150,230)*(1-S.f*.08);}
function bate(x,y,r){const g=S.g;for(const o of g.obs){if(Math.abs(o.x-x)>80)continue;
 const e1=((x-o.x)/(58+r))**2+((y-(o.topo-20))/(48+r))**2,e2=((x-o.x)/(58+r))**2+((y-(o.base+30))/(48+r))**2;
 if(e1<1||e2<1)return true;if(Math.abs(o.x-x)<8+r&&(y<o.topo-20||y>o.base+30))return true;}return false;}
function update(dt){const g=S.g;if(!g||g.fim)return;const F=FASES[S.f];g.t+=dt;g.msgT-=dt;g.inv-=dt;g.asa+=dt*12;
 const dx=F.v*dt;g.x0+=dx;
 if(tec.ArrowUp){alvoY=Math.max(20,(alvoY??g.y)-260*dt);}if(tec.ArrowDown){alvoY=Math.min(CHAO()-14,(alvoY??g.y)+260*dt);}
 if(alvoY!=null){const d=alvoY-g.y;g.vy+=(Math.max(-260,Math.min(260,d*6))-g.vy)*Math.min(1,dt*8);}else g.vy+=(30-g.vy)*Math.min(1,dt*2);
 g.y=Math.max(16,Math.min(CHAO()-14,g.y+g.vy*dt));
 g.prox-=dx;if(g.prox<=0)gerar();
 for(const a of [g.obs,g.frutos,g.clar,g.plantas])for(const o of a)o.x-=dx;
 g.obs=g.obs.filter(o=>o.x>-80);g.frutos=g.frutos.filter(o=>o.x>-20&&!o.comido);g.clar=g.clar.filter(c=>c.x+c.w>-20);g.plantas=g.plantas.filter(p=>p.x>-30);
 const bx=W*.25;
 for(const f of g.frutos)if(Math.hypot(f.x-bx-14,f.y-g.y)<22){f.comido=1;if(g.sem<3){g.sem++;S.fp+=2;beep(900,.06);}else msg('O papo está cheio. Solte uma semente numa clareira.');}
 if(g.inv<=0&&bate(bx,g.y,12)){g.vidas--;g.inv=1.5;beep(140,.3,.07);msg('💥 Bateu num galho! −1 vida.');if(g.vidas<=0){terminar();return;}}
 for(const q of g.quedas){q.vy+=520*dt;q.y+=q.vy*dt;q.x-=dx;
  if(q.y>=CHAO()-4){q.fim=1;const c=g.clar.find(c=>q.x>c.x+8&&q.x<c.x+c.w-8);
   if(c){g.mudas++;S.fp+=10;g.plantas.push({x:q.x,t:0});beep(1050,.12);msg('🌱 A semente caiu na clareira e virou muda! +10.');}
   else{g.perdidas++;msg('A semente caiu na mata fechada. Solte sobre a terra marrom.');}}}
 g.quedas=g.quedas.filter(q=>!q.fim);for(const p of g.plantas)p.t+=dt;
 if(g.mudas>=F.meta&&g.t>=8||g.t>=g.dur)terminar();}
function tucano(x,y,asa,pisca){cx.save();cx.translate(x,y);cx.scale(1.3,1.3);if(pisca&&Math.floor(performance.now()/100)%2){cx.globalAlpha=.4;}
 cx.fillStyle='#111';cx.beginPath();cx.moveTo(-34,-2);cx.lineTo(-20,-6);cx.lineTo(-20,6);cx.closePath();cx.fill();
 cx.beginPath();cx.ellipse(-6,2,18,11,-.1,0,7);cx.fill();
 cx.fillStyle='#d32f2f';cx.beginPath();cx.ellipse(-20,9,5,3,0,0,7);cx.fill();
 cx.fillStyle='#fff';cx.beginPath();cx.ellipse(6,4,8,7,0,0,7);cx.fill();cx.fillStyle='#111';cx.beginPath();cx.arc(7,-5,8,0,7);cx.fill();
 cx.fillStyle='#ff8f00';cx.beginPath();cx.moveTo(12,-10);cx.quadraticCurveTo(38,-12,46,-1);cx.quadraticCurveTo(36,3,12,3);cx.closePath();cx.fill();
 cx.fillStyle='#ffca28';cx.beginPath();cx.moveTo(12,-10);cx.quadraticCurveTo(30,-12,38,-7);cx.lineTo(14,-4);cx.closePath();cx.fill();
 cx.fillStyle='#111';cx.beginPath();cx.moveTo(40,-8);cx.quadraticCurveTo(47,-4,46,-1);cx.quadraticCurveTo(43,1,39,1);cx.closePath();cx.fill();
 cx.fillStyle='#4fc3f7';cx.beginPath();cx.arc(9,-6,3.6,0,7);cx.fill();cx.fillStyle='#111';cx.beginPath();cx.arc(9.5,-6,1.6,0,7);cx.fill();
 const a=Math.sin(asa)*.9;cx.fillStyle='#212121';cx.save();cx.translate(-6,-2);cx.rotate(-.3+a*.6);cx.beginPath();cx.ellipse(-8,-6,14,6,-.4,0,7);cx.fill();cx.restore();
 cx.restore();}
function copa(x,y,r,c,cima){const cores=c<.5?['#2e7d32','#43a047','#66bb6a']:['#33691e','#558b2f','#7cb342'];
 for(let j=0;j<6;j++){cx.fillStyle=cores[j%3];cx.beginPath();cx.arc(x+Math.cos(j*1.05)*r*.5,y+Math.sin(j*1.05)*r*.6,r*.62,0,7);cx.fill();}}
function desenha(){const g=S.g;if(!g||!cx)return;cx.clearRect(0,0,W,H);
 const gr=cx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#e3f2fd');gr.addColorStop(1,'#f1f8e9');cx.fillStyle=gr;cx.fillRect(0,0,W,H);
 // fundo de mata distante
 cx.fillStyle='#c5e1a5';for(let i=0;i<14;i++){const x=((i*97-g.x0*.3)%(W+120)+W+120)%(W+120)-60;cx.beginPath();cx.arc(x,CHAO()-30,48,0,7);cx.fill();}
 // chão
 cx.fillStyle='#7cb342';cx.fillRect(0,CHAO(),W,H-CHAO());
 for(const c of g.clar){cx.fillStyle='#a1887f';cx.fillRect(c.x,CHAO()-2,c.w,H-CHAO()+2);cx.fillStyle='#8d6e63';for(let i=20;i<c.w-10;i+=70){cx.fillRect(c.x+i,CHAO()-8,10,8);}
  cx.fillStyle='rgba(93,64,55,.85)';cx.font='bold 11px system-ui';cx.textAlign='center';if(c.x+c.w/2>0&&c.x+c.w/2<W)cx.fillText('clareira',c.x+c.w/2,CHAO()+20);}
 for(const p of g.plantas){const h=Math.min(26,8+p.t*10);cx.strokeStyle='#33691e';cx.lineWidth=3;cx.beginPath();cx.moveTo(p.x,CHAO());cx.lineTo(p.x,CHAO()-h);cx.stroke();cx.fillStyle='#66bb6a';cx.beginPath();cx.ellipse(p.x-6,CHAO()-h+2,7,4,-.5,0,7);cx.ellipse(p.x+6,CHAO()-h+2,7,4,.5,0,7);cx.fill();}
 for(const o of g.obs){
  cx.fillStyle='#5d4037';cx.fillRect(o.x-8,o.base+30,16,CHAO()-o.base-30);cx.fillStyle='#6d4c41';cx.fillRect(o.x-6,-10,12,o.topo-30);
  copa(o.x,o.topo-20,54,o.c,true);copa(o.x,o.base+30,54,1-o.c,false);
  cx.strokeStyle='#4e342e';cx.lineWidth=3;cx.beginPath();cx.moveTo(o.x,o.base+50);cx.lineTo(o.x+22,o.base+40);cx.stroke();}
 for(const f of g.frutos){cx.strokeStyle='#33691e';cx.lineWidth=1.5;cx.beginPath();cx.moveTo(f.x,f.y-f.r);cx.lineTo(f.x+3,f.y-f.r-6);cx.stroke();
  cx.fillStyle=f.man?'#8d6e63':'#e65100';cx.beginPath();cx.arc(f.x,f.y,f.r,0,7);cx.fill();cx.fillStyle='rgba(255,255,255,.5)';cx.beginPath();cx.arc(f.x-3,f.y-3,3,0,7);cx.fill();}
 for(const q of g.quedas){cx.fillStyle='#5d4037';cx.beginPath();cx.ellipse(q.x,q.y,4,5.5,0,0,7);cx.fill();}
 tucano(W*.25,g.y,g.asa,g.inv>0);
 if(alvoY!=null){cx.strokeStyle='rgba(46,125,50,.35)';cx.setLineDash([4,4]);cx.beginPath();cx.moveTo(W*.25+60,alvoY);cx.lineTo(W*.25+110,alvoY);cx.stroke();cx.setLineDash([]);}
 const sobre=g.clar.some(c=>W*.25>c.x&&W*.25<c.x+c.w);if(sobre&&g.sem>0){cx.fillStyle='rgba(255,255,255,.9)';cx.fillRect(W/2-120,8,240,24);cx.fillStyle='#2e7d32';cx.font='bold 13px system-ui';cx.textAlign='center';cx.fillText('🌱 Clareira embaixo! Solte a semente.',W/2,25);}
 if(g.msgT>0){cx.font='bold 13px system-ui';cx.textAlign='center';cx.fillStyle='rgba(255,255,255,.93)';cx.fillRect(0,H-30,W,24);cx.fillStyle='#1b5e20';cx.fillText(g.msg,W/2,H-13);}}
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);desenha();if(S.g&&!S.g.fim){hud();raf=requestAnimationFrame(loop);}}
function parar(){if(raf)cancelAnimationFrame(raf);raf=null;}
function terminar(){const g=S.g;if(g.fim)return;g.fim=true;parar();const F=FASES[S.f],ok=g.mudas>=F.meta&&g.vidas>0;if(ok){S.fp+=30+10*g.vidas;beep(880,.2);}hud();
 $('tela').innerHTML=`<div class="card"><h2>${ok?'A floresta agradece!':'Faltaram mudas'}</h2>
 <p>Mudas plantadas: <b>${g.mudas}</b> (meta ${F.meta}). Sementes que caíram na mata fechada: <b>${g.perdidas}</b>. Vidas restantes: <b>${Math.max(0,g.vidas)}</b>.</p>
 ${ok?`<div class="fb good">🎯 Meta cumprida! +30 e +${10*g.vidas} pelas vidas.</div>`:'<div class="fb bad">A meta não foi cumprida. Coma frutos no caminho e solte as sementes só sobre a terra marrom.</div>'}
 <div class="row" style="margin-top:12px">${ok?'<button class="btn" id="bq">Pergunta da fase →</button>':'<button class="btn" id="br">Tentar de novo</button><button class="btn ghost" id="be">Encerrar</button>'}</div></div>`;
 if(ok)$('bq').onclick=pergunta;else{$('br').onclick=fase;$('be').onclick=()=>{S.tot+=Math.max(0,S.fp);S.fp=0;final(false);};}}
function pergunta(){
 const P=PERG[S.f],ops=shuf(P.o.map((t,i)=>({t,c:i===0})));
 $('tela').innerHTML=`<div class="card"><h2>Pergunta da fase</h2><p style="margin:6px 0 4px">${P.q}</p><p class="small">Acerto +20, erro −10.</p><div class="ops">${ops.map((o,i)=>`<button data-i="${i}">${o.t}</button>`).join('')}</div><div id="pf"></div></div>`;
 document.querySelectorAll('#tela .ops button').forEach(b=>b.onclick=()=>{const o=ops[+b.dataset.i];S.fp+=o.c?20:-10;beep(o.c?880:170,.15);hud();

(async()=>{try{const a=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");const f=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");db=f.getFirestore(a.initializeApp(firebaseConfig));fs=f;carregar();}catch(e){$('rankList').innerHTML='<li><span>Ranking indisponível sem internet.</span></li>';$('rankNote').textContent='O jogo funciona normalmente. O ranking volta quando houver conexão.';}})();

async function salvar(nivel){if(salvo)return;const nome=$('pName').value.trim(),st=$('sSt');if(!nome){st.textContent='Digite seu nome primeiro.';return;}if(!db){st.textContent='Sem conexão com o ranking. O resultado não foi enviado.';return;}
 $('bS').disabled=true;try{await fs.addDoc(fs.collection(db,'games',GAME_ID,'scores'),{name:nome.slice(0,20),score:Math.max(0,S.tot),level:nivel,ts:fs.serverTimestamp()});salvo=true;st.textContent='Salvo no Ranking Global!';carregar();}catch(e){$('bS').disabled=false;st.textContent='Erro ao salvar. Tente de novo.';}}
