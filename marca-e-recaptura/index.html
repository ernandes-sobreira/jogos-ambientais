<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marca e Recaptura</title>
<style>
:root{--main:#2f6b5e;--deep:#1f4d43;--soft:#edf5f2;--line:#d3e6df;--ink:#1b2622;--mut:#56655f}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:var(--ink);line-height:1.45}
.wrap{max-width:780px;margin:0 auto;padding:12px 14px 40px}
a.hub{color:var(--deep);font-weight:700;text-decoration:none;font-size:.9rem}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
h1{font-size:1.4rem;color:var(--deep)}h2{font-size:1.15rem;color:var(--deep);margin-bottom:6px}
.hud{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--soft);color:var(--deep);border-radius:99px;padding:5px 11px;font-weight:700;font-size:.86rem}
.card{border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;background:#fff}
.btn{background:var(--main);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--deep)}.btn.ghost{background:#fff;color:var(--deep);border:2px solid var(--main)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.small{font-size:.86rem;color:var(--mut)}
canvas{width:100%;max-width:760px;margin:0 auto;display:block;border:2px solid var(--line);border-radius:16px;touch-action:none;background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:6px;justify-content:center;margin-top:10px}
.pad button{border:2px solid var(--line);background:var(--soft);border-radius:12px;font-size:1.4rem;cursor:pointer;color:var(--deep);touch-action:manipulation}
.pad button:active{background:#dcedc8}
.tab{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:8px}.tab td{border-bottom:1px solid var(--line);padding:5px 4px;vertical-align:top}
.ops{display:grid;gap:8px;margin-top:10px}
.ops button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-size:.95rem;cursor:pointer;font-family:inherit;text-align:left;color:var(--ink)}
.ops button:hover{border-color:var(--main)}.ops button:disabled{opacity:.5;cursor:default}
.fb{margin-top:10px;padding:11px 13px;border-radius:12px;font-size:.93rem}
.fb.good{background:#e8f5e9;color:#1b5e20}.fb.bad{background:#ffebee;color:#8e1b1b}
.big{font-size:2.3rem;font-weight:800;color:var(--deep)}
.ranking{border:3px solid var(--main);border-radius:18px;padding:0 16px 12px;overflow:hidden;margin-top:12px}
.ranking h3{font-size:1rem;margin:0 -16px 8px;padding:10px 16px;background:var(--main);color:#fff}
.ranking ol{list-style:none}.ranking li{display:flex;justify-content:space-between;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:.92rem}
.ranking li:last-child{border-bottom:0}.rp{display:inline-block;min-width:2.1em;font-weight:800;color:var(--deep)}
.savebox{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.savebox input{flex:1;min-width:160px;border:2px solid var(--line);border-radius:12px;padding:11px;font-size:1rem;font-family:inherit}
.pill{font-variant-numeric:tabular-nums}.card h2{letter-spacing:-.01em}.tab td:first-child{font-weight:600;white-space:nowrap;color:var(--deep);width:1%}input[type=range]{width:100%;accent-color:var(--main)}.kv{font-variant-numeric:tabular-nums}</style>
</head>
<body>
<div class="wrap">
<a class="hub" href="https://ernandes-sobreira.github.io/jogos-ambientais/">← Todos os jogos</a>
<header>
  <h1>Marca e Recaptura</h1>
  <div class="hud" id="hud" style="display:none"><span class="pill" id="hF">Fase 1 de 3</span><span class="pill" id="hP">0 pontos</span><span class="pill" id="hR"></span><span class="pill" id="hV"></span><span class="pill" id="hT"></span></div>
</header>
<main id="tela"></main>
<div class="ranking" id="rankBox"><h3>Ranking Global</h3><ol id="rankList"><li><span>Carregando o ranking...</span></li></ol><p class="small" id="rankNote"></p></div>

<script>
const $=id=>document.getElementById(id);
const rr=(a,b)=>a+Math.random()*(b-a);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let actx=null;function beep(f,d,v){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.setValueAtTime(v||.05,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(e){}}
/* ---------- biblioteca visual: estilo guia de campo + painel de dados ---------- */
const TINTA='#2b2a26',PAPEL='#fbfaf6',GRADE='rgba(43,42,38,.07)';
function papel(c,w,h,cor){c.fillStyle=cor||PAPEL;c.fillRect(0,0,w,h);c.fillStyle='rgba(120,100,70,.035)';for(let i=0;i<260;i++){const x=(i*397)%w,y=(i*211)%h;c.fillRect(x,y,1.5,1.5);}}
function grade(c,x,y,w,h,p){c.strokeStyle=GRADE;c.lineWidth=1;c.beginPath();for(let i=x;i<=x+w;i+=p){c.moveTo(i,y);c.lineTo(i,y+h);}for(let j=y;j<=y+h;j+=p){c.moveTo(x,j);c.lineTo(x+w,j);}c.stroke();}
function painel(c,x,y,w,h,tit){c.save();c.fillStyle='rgba(255,255,255,.94)';c.strokeStyle='rgba(43,42,38,.35)';c.lineWidth=1;c.beginPath();c.rect(x+.5,y+.5,w,h);c.fill();c.stroke();
 if(tit){c.fillStyle='rgba(43,42,38,.75)';c.font='600 10px system-ui';c.textAlign='left';c.fillText(tit.toUpperCase(),x+8,y+14);c.strokeStyle='rgba(43,42,38,.15)';c.beginPath();c.moveTo(x+8,y+19);c.lineTo(x+w-8,y+19);c.stroke();}c.restore();}
function txt(c,s,x,y,o){o=o||{};c.font=(o.b?'600 ':'')+(o.s||12)+'px system-ui';c.fillStyle=o.c||TINTA;c.textAlign=o.a||'left';c.fillText(s,x,y);}
function barraH(c,x,y,w,h,v,cor){c.fillStyle='rgba(43,42,38,.08)';c.fillRect(x,y,w,h);c.fillStyle=cor;c.fillRect(x,y,w*Math.max(0,Math.min(1,v)),h);}
function aviso(c,W,H,m){if(!m)return;c.font='13px system-ui';const w=Math.min(W-20,c.measureText(m).width+28);c.fillStyle='rgba(255,255,255,.95)';c.strokeStyle='rgba(43,42,38,.3)';c.fillRect(W/2-w/2,H-34,w,24);c.strokeRect(W/2-w/2+.5,H-33.5,w,24);c.fillStyle=TINTA;c.textAlign='center';c.fillText(m,W/2,H-17);}
const fmt=(v,d)=>v.toFixed(d===undefined?1:d).replace('.',',');
/* peixe de perfil, naturalista. esp: curimbata, pacu, tucunare, piraiba, aracu, dourado */
function peixe(c,x,y,L,esp,dir,ond){c.save();c.translate(x,y);c.scale(dir||1,1);const k=L/100,o=Math.sin(ond||0)*3;
 const P={curimbata:{c1:'#9aa3a6',c2:'#d9dcd8',al:22,cau:'#4a4f52'},pacu:{c1:'#5d6266',c2:'#a9a59a',al:40,cau:'#3c3f41'},tucunare:{c1:'#a9a84a',c2:'#e8e2a6',al:26,cau:'#7b7c35'},
  piraiba:{c1:'#6f7579',c2:'#c9cbc6',al:20,cau:'#4b5054'},aracu:{c1:'#a7a28c',c2:'#e6e1cf',al:22,cau:'#6b6650'},dourado:{c1:'#d39a2c',c2:'#f3d88b',al:24,cau:'#b5651d'}}[esp]||{c1:'#999',c2:'#ddd',al:22,cau:'#555'};
 const a=P.al*k;
 c.fillStyle=P.cau;c.beginPath();c.moveTo(-44*k,0);c.lineTo(-62*k,-a*.75+o);c.quadraticCurveTo(-55*k,o,-62*k,a*.75+o);c.closePath();c.fill();
 const g=c.createLinearGradient(0,-a,0,a);g.addColorStop(0,P.c1);g.addColorStop(.55,P.c2);g.addColorStop(1,'#f1f0ea');c.fillStyle=g;
 c.beginPath();c.moveTo(48*k,0);c.bezierCurveTo(40*k,-a*1.05,-20*k,-a*1.1,-46*k,-a*.25);c.lineTo(-46*k,a*.25);c.bezierCurveTo(-20*k,a*1.05,40*k,a*.9,48*k,0);c.fill();
 c.fillStyle=P.cau;c.globalAlpha=.8;c.beginPath();c.moveTo(-2*k,-a*.95);c.quadraticCurveTo(-14*k,-a*1.6,-24*k,-a*.9);c.fill();c.beginPath();c.moveTo(-16*k,a*.85);c.quadraticCurveTo(-24*k,a*1.3,-30*k,a*.75);c.fill();c.globalAlpha=1;
 c.strokeStyle='rgba(40,40,40,.25)';c.lineWidth=Math.max(.6,k);c.beginPath();c.moveTo(30*k,-a*.1);c.quadraticCurveTo(-5*k,-a*.25,-44*k,0);c.stroke();
 c.beginPath();c.moveTo(30*k,-a*.7);c.quadraticCurveTo(34*k,0,30*k,a*.6);c.stroke();
 if(esp==='tucunare'){c.fillStyle='rgba(40,45,20,.45)';for(const bx of [16,-4,-24]){c.fillRect(bx*k,-a*.9,5*k,a*1.3);}c.fillStyle='#2b2a1a';c.beginPath();c.arc(-48*k,-a*.05,4.5*k,0,7);c.fill();c.strokeStyle='#e0a33a';c.lineWidth=1.5*k;c.stroke();}
 if(esp==='aracu'){c.fillStyle='rgba(40,40,30,.5)';for(const bx of [10,-8,-26])c.beginPath(),c.arc(bx*k,-a*.15,3*k,0,7),c.fill();}
 if(esp==='piraiba'){c.strokeStyle='#3f4447';c.lineWidth=1.2*k;c.beginPath();c.moveTo(46*k,a*.1);c.quadraticCurveTo(60*k,a*.6,70*k,a*.4);c.moveTo(44*k,a*.25);c.quadraticCurveTo(54*k,a*.8,62*k,a*.9);c.stroke();}
 if(esp==='curimbata'){c.fillStyle='rgba(40,40,40,.18)';for(let i=0;i<4;i++){c.fillRect((-30+i*14)*k,-a*.55,1.2*k,a*1.1);}}
 c.fillStyle='#f4f1e6';c.beginPath();c.arc(36*k,-a*.25,4*k,0,7);c.fill();c.fillStyle='#1b1b1b';c.beginPath();c.arc(36.8*k,-a*.25,2.3*k,0,7);c.fill();
 c.restore();}
/* morcego em voo, vista frontal levemente de cima */
function morcego(c,x,y,s,bat,cor){c.save();c.translate(x,y);c.scale(s,s);const a=Math.sin(bat);cor=cor||'#4a3f38';
 c.fillStyle=cor;
 for(const sd of [-1,1]){c.save();c.scale(sd,1);c.beginPath();c.moveTo(4,-2);c.lineTo(18,-10-a*10);c.lineTo(34,-6-a*16);c.lineTo(44,2-a*14);
  c.quadraticCurveTo(36,4-a*6,32,10-a*8);c.quadraticCurveTo(26,6-a*3,20,12-a*4);c.quadraticCurveTo(14,6,6,8);c.closePath();c.globalAlpha=.88;c.fill();c.globalAlpha=1;
  c.strokeStyle='rgba(20,15,12,.6)';c.lineWidth=.8;c.beginPath();c.moveTo(18,-10-a*10);c.lineTo(32,10-a*8);c.moveTo(18,-10-a*10);c.lineTo(20,12-a*4);c.moveTo(34,-6-a*16);c.lineTo(32,10-a*8);c.stroke();c.restore();}
 c.beginPath();c.ellipse(0,2,6,9,0,0,7);c.fill();c.beginPath();c.arc(0,-8,5,0,7);c.fill();
 c.beginPath();c.moveTo(-4,-11);c.lineTo(-6,-18);c.lineTo(-1,-12);c.moveTo(4,-11);c.lineTo(6,-18);c.lineTo(1,-12);c.fill();
 c.fillStyle='#d8cfc6';c.beginPath();c.arc(-2,-8.5,.9,0,7);c.arc(2,-8.5,.9,0,7);c.fill();c.restore();}
/* mariposa vista de cima */
function mariposa(c,x,y,s,f){c.save();c.translate(x,y);c.scale(s,s);const a=.6+Math.abs(Math.sin(f))*.4;c.fillStyle='#a08c6c';
 for(const sd of [-1,1]){c.beginPath();c.ellipse(sd*7*a,-2,8*a,5,sd*.5,0,7);c.fill();c.beginPath();c.ellipse(sd*5*a,5,5*a,3.5,-sd*.4,0,7);c.fill();}
 c.fillStyle='#5d4c39';c.beginPath();c.ellipse(0,0,2,7,0,0,7);c.fill();c.strokeStyle='#5d4c39';c.lineWidth=.8;c.beginPath();c.moveTo(-1,-6);c.lineTo(-4,-11);c.moveTo(1,-6);c.lineTo(4,-11);c.stroke();c.restore();}
/* urubu-de-cabeça-preta planando, vista de baixo */
function urubu(c,x,y,s,ang){c.save();c.translate(x,y);c.rotate(ang||0);c.scale(s,s);c.fillStyle='#1f1d1b';
 c.beginPath();c.moveTo(0,-6);for(const sd of [1,-1]){}c.moveTo(-6,-2);c.quadraticCurveTo(-30,-10,-58,-4);
 for(let i=0;i<5;i++){c.lineTo(-64-i*.5,-1+i*2.2);c.lineTo(-58+i,0+i*2.4);}c.quadraticCurveTo(-30,8,-6,6);c.closePath();c.fill();
 c.beginPath();c.moveTo(6,-2);c.quadraticCurveTo(30,-10,58,-4);for(let i=0;i<5;i++){c.lineTo(64+i*.5,-1+i*2.2);c.lineTo(58-i,0+i*2.4);}c.quadraticCurveTo(30,8,6,6);c.closePath();c.fill();
 c.fillStyle='#d9d4c9';c.globalAlpha=.85;c.beginPath();c.ellipse(-50,0,7,4,0,0,7);c.ellipse(50,0,7,4,0,0,7);c.fill();c.globalAlpha=1;
 c.fillStyle='#1f1d1b';c.beginPath();c.ellipse(0,1,7,12,0,0,7);c.fill();c.beginPath();c.moveTo(-6,10);c.lineTo(0,20);c.lineTo(6,10);c.fill();
 c.fillStyle='#3b3936';c.beginPath();c.arc(0,-11,4,0,7);c.fill();c.restore();}
/* onça-pintada em silhueta lateral pequena */
function oncaSil(c,x,y,s,dir){c.save();c.translate(x,y);c.scale(s*(dir||1),s);c.fillStyle='#c9963f';c.beginPath();c.moveTo(-30,0);c.quadraticCurveTo(-28,-14,-6,-14);c.quadraticCurveTo(14,-16,24,-12);c.quadraticCurveTo(34,-14,36,-6);c.quadraticCurveTo(34,2,26,0);
 c.lineTo(24,14);c.lineTo(20,14);c.lineTo(18,2);c.lineTo(-18,4);c.lineTo(-20,14);c.lineTo(-24,14);c.lineTo(-26,2);c.quadraticCurveTo(-36,0,-46,-6);c.lineTo(-44,-9);c.quadraticCurveTo(-36,-4,-30,0);c.fill();
 c.fillStyle='rgba(40,25,10,.7)';for(let i=0;i<9;i++){c.beginPath();c.arc(-22+i*5.5,-8+(i%2)*4,1.6,0,7);c.fill();}c.restore();}
/* lobo-guará lateral */
function loboSil(c,x,y,s,dir,p){c.save();c.translate(x,y);c.scale(s*(dir||1),s);const w=Math.sin(p||0)*4;c.strokeStyle='#1d1a17';c.lineWidth=3;c.lineCap='round';
 c.beginPath();c.moveTo(14,0);c.lineTo(16+w,22);c.moveTo(10,0);c.lineTo(8-w,22);c.moveTo(-14,0);c.lineTo(-12+w,22);c.moveTo(-18,0);c.lineTo(-20-w,22);c.stroke();
 c.fillStyle='#c0662b';c.beginPath();c.ellipse(-2,-4,22,9,0,0,7);c.fill();c.beginPath();c.moveTo(14,-8);c.quadraticCurveTo(22,-22,28,-20);c.lineTo(36,-16);c.lineTo(28,-12);c.quadraticCurveTo(22,-6,16,-2);c.fill();
 c.fillStyle='#1d1a17';c.beginPath();c.moveTo(14,-10);c.quadraticCurveTo(10,-18,4,-12);c.lineTo(12,-6);c.fill();c.beginPath();c.moveTo(24,-20);c.lineTo(22,-30);c.lineTo(28,-21);c.fill();
 c.fillStyle='#eee5d6';c.beginPath();c.moveTo(-24,-6);c.quadraticCurveTo(-34,-2,-36,6);c.quadraticCurveTo(-30,0,-24,0);c.fill();c.restore();}
/* Matemática: estimador de Lincoln-Petersen, N = M·C/R (Odum e Barrett, citado em anais da UFPel; Krebs, Ecological Methodology, cap. 2).
   Pressuposto: tempo suficiente para os marcados se misturarem (EBSCO Research Starters). Tamanhos reais das populações são sorteados pelo jogo. */
const FASES=[
 {nome:'Primeira estimativa',lagos:2,lances:5,esforco:0,mistura:0,txt:'Lance a rede 5 vezes, marque todos os peixes capturados e solte. Depois de uma semana, lance a rede mais 5 vezes. Calcule N = M·C/R.'},
 {nome:'Esforço de amostragem',lagos:2,lances:0,esforco:1,mistura:0,txt:'Agora você escolhe quantos lances fazer em cada captura. Mais lances dão mais recapturas e uma estimativa mais precisa, mas gastam mais tempo de campo.'},
 {nome:'Esperar ou não esperar',lagos:2,lances:5,esforco:0,mistura:1,txt:'Você decide quanto tempo esperar antes da recaptura. Se os peixes marcados não tiverem tempo de se espalhar pela baía, a estimativa sai torta.'}
];
const PERG=[
 {q:'Foram marcados 40 peixes. Na segunda captura vieram 50 peixes, e 10 deles tinham marca. Qual é a estimativa de Lincoln-Petersen?',o:['200 peixes','90 peixes','500 peixes']},
 {q:'Por que o pesquisador espera alguns dias entre a marcação e a recaptura?',o:['Para os marcados se misturarem aos não marcados','Para as marcas ficarem mais visíveis na água','Para os peixes marcados ganharem peso e tamanho']},
 {q:'Se muitas marcas caírem dos peixes entre as duas capturas, o que acontece com a estimativa?',o:['Fica maior que a população real','Fica menor que a população real','Não muda, porque a fórmula corrige isso']}
];
let S,cv,cx,raf=null,last=0,W=760,H=460;
function hud(){$('hud').style.display='flex';$('hF').textContent='Fase '+(S.f+1)+' de 3';$('hP').textContent=(S.tot+S.fp)+' pontos';
 if(S.g){$('hR').textContent='Baía '+Math.min(S.g.lago+1,FASES[S.f].lagos)+'/'+FASES[S.f].lagos;$('hV').textContent='Cálculos certos '+S.g.calc;$('hT').textContent='Dias de campo '+S.g.dias;}}
function inicio(){parar();$('hud').style.display='none';$('rankBox').style.display='block';
 $('tela').innerHTML=`<div class="card"><h2>Quantos peixes há na baía?</h2>
 <p>Ninguém consegue contar todos os peixes de uma baía do Pantanal. O método de captura, marcação e recaptura estima o total a partir de duas amostras.</p>
 <table class="tab"><tr><td>M</td><td>Peixes capturados e marcados na primeira captura.</td></tr>
 <tr><td>C</td><td>Total de peixes na segunda captura.</td></tr><tr><td>R</td><td>Quantos da segunda captura já estavam marcados.</td></tr>
 <tr><td>N</td><td>Estimativa: N = M·C/R. A ideia é que a proporção de marcados na amostra (R/C) seja igual à da baía inteira (M/N).</td></tr></table>
 <p class="small" style="margin-top:8px">Toque na água para lançar a rede. Cálculo certo +15. Estimativa até 10% do valor real +15, até 25% +8.</p>
 <div class="row" style="margin-top:12px"><button class="btn" onclick="novo()">Começar</button></div></div>`;}
function novo(){S={f:0,tot:0,fp:0};salvo=false;$('rankBox').style.display='none';fase();}
function fase(){const F=FASES[S.f];S.fp=0;S.g=null;hud();
 $('tela').innerHTML=`<div class="card"><h2>Fase ${S.f+1}: ${F.nome}</h2><p>${F.txt}</p><p class="small" style="margin-top:6px">Meta: acertar o cálculo nas 2 baías e ter erro médio de até 25%.</p><div class="row" style="margin-top:12px"><button class="btn" id="bg">Ir a campo</button></div></div>`;$('bg').onclick=jogar;}
function noLago(x,y){const cxl=W/2,cyl=H*.47,rx=W*.44,ry=H*.38;return ((x-cxl)/rx)**2+((y-cyl)/ry)**2<1;}
function jogar(){$('tela').innerHTML=`<div class="card"><canvas id="cv"></canvas><div id="ctl" style="margin-top:10px"></div></div>`;
 cv=$('cv');if(cv.clientWidth<520){W=440;H=480;}else{W=760;H=440;}cv.width=W;cv.height=H;cx=cv.getContext('2d');
 cv.onpointerdown=e=>{const r=cv.getBoundingClientRect();lancar((e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height);};
 S.g={lago:0,calc:0,erros:[],dias:0,fim:false,msg:'',msgT:0,t:0};novoLago();hud();last=performance.now();parar();raf=requestAnimationFrame(loop);}
function novoLago(){const g=S.g,F=FASES[S.f];const N=Math.round(S.f===0?rr(70,130):rr(140,240));g.N=N;g.p=[];
 for(let i=0;i<N;i++){let x,y;do{x=rr(0,W);y=rr(0,H);}while(!noLago(x,y));g.p.push({x,y,hx:x,hy:y,a:rr(0,7),v:rr(8,18),m:0,esp:Math.random()<.5?0:1});}
 g.etapa=F.esforco?'esf1':'cap1';g.lances=0;g.maxL=F.lances||5;g.M=0;g.C=0;g.R=0;g.redes=[];g.mist=1;g.zona=null;ctl();}
function ctl(){const g=S.g,F=FASES[S.f],c=$('ctl');if(!c)return;
 if(g.etapa==='esf1'||g.etapa==='esf2')c.innerHTML=`<p class="small">Quantos lances na ${g.etapa==='esf1'?'primeira':'segunda'} captura? Cada lance custa meio dia de campo.</p><div class="ops" style="grid-template-columns:repeat(3,1fr)"><button data-n="2">2 lances</button><button data-n="4">4 lances</button><button data-n="6">6 lances</button></div>`;
 else if(g.etapa==='espera')c.innerHTML=`<p class="small">Quanto tempo esperar antes da recaptura?</p><div class="ops" style="grid-template-columns:1fr 1fr"><button data-d="1">1 dia</button><button data-d="7">7 dias</button></div>`;
 else if(g.etapa==='calc')c.innerHTML=`<p class="small">Calcule N = M·C/R com os dados da ficha e arredonde para o inteiro mais próximo.</p><div class="savebox"><input id="ni" type="number" inputmode="numeric" placeholder="Estimativa de N"><button class="btn" id="bc">Conferir</button></div>`;
 else if(g.etapa==='res')c.innerHTML=`<div class="row" style="justify-content:center"><button class="btn" id="bn">${g.lago+1<F.lagos?'Próxima baía':'Ver resultado da fase'}</button></div>`;
 else c.innerHTML=`<p class="small" style="text-align:center">${g.etapa==='cap1'?'Primeira captura: toque na água para lançar a rede':'Segunda captura: toque na água para lançar a rede'} (${g.lances}/${g.maxL}).</p>`;
 c.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{g.maxL=+b.dataset.n;g.dias+=Math.ceil(g.maxL/2);g.etapa=g.etapa==='esf1'?'cap1':'cap2';g.lances=0;ctl();hud();});
 c.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const d=+b.dataset.d;g.dias+=d;g.mist=d>=7?1:.12;soltar();ctl();hud();});
 if($('bc'))$('bc').onclick=conferir;if($('bn'))$('bn').onclick=()=>{g.lago++;if(g.lago>=F.lagos)terminar();else{novoLago();hud();}};}
function msg(t){S.g.msg=t;S.g.msgT=3;}
function lancar(x,y){const g=S.g;if(!g||g.fim||!(g.etapa==='cap1'||g.etapa==='cap2'))return;if(!noLago(x,y)){msg('Lance a rede dentro da água.');return;}if(g.lances>=g.maxL)return;
 const r=W<520?56:74;g.redes.push({x,y,r,t:0});g.lances++;beep(300,.08,.04);
 const pegos=g.p.filter(p=>!p.preso&&Math.hypot(p.x-x,p.y-y)<r);
 if(g.etapa==='cap1'){for(const p of pegos){p.preso=1;g.M++;}}
 else{for(const p of pegos){p.preso=1;g.C++;if(p.m)g.R++;}}
 if(g.lances>=g.maxL){if(g.etapa==='cap1'){g.etapa=FASES[S.f].mistura?'espera':'marcando';g.tm=1.2;g.zona=g.redes.map(n=>({x:n.x,y:n.y}));if(!FASES[S.f].mistura){g.dias+=7;g.mist=1;setTimeout(()=>{soltar();ctl();},1200);}}
  else{g.etapa='calc';}}
 ctl();hud();}
function soltar(){const g=S.g;for(const p of g.p){if(p.preso){p.preso=0;p.m=1;}}
 for(const p of g.p){if(Math.random()<g.mist||!p.m){let x,y;do{x=rr(0,W);y=rr(0,H);}while(!noLago(x,y));p.hx=x;p.hy=y;}else{p.hx=p.x;p.hy=p.y;}}
 g.redes=[];g.etapa=FASES[S.f].esforco?'esf2':'cap2';g.lances=0;if(!FASES[S.f].esforco)g.maxL=FASES[S.f].lances||5;msg(g.mist>=1?'Uma semana depois: os marcados se espalharam pela baía.':'Só um dia depois: os marcados ainda estão perto de onde foram soltos.');}
function conferir(){const g=S.g;const v=Math.round(+$('ni').value);if(!v){msg('Digite um número.');return;}
 if(g.R===0){g.etapa='res';msg('Nenhum peixe marcado foi recapturado: R = 0 e a fórmula não funciona. Faltou esforço de captura.');ctl();return;}
 const ex=Math.round(g.M*g.C/g.R),ok=Math.abs(v-ex)<=1;if(ok){g.calc++;S.fp+=15;beep(900,.1);}else{S.fp-=5;beep(170,.2);}
 const err=Math.abs(ex-g.N)/g.N;g.erros.push(err);if(err<=.1)S.fp+=15;else if(err<=.25)S.fp+=8;
 g.res={v,ex,ok,err};g.etapa='res';ctl();hud();}
function update(dt){const g=S.g;if(!g||g.fim)return;g.msgT-=dt;g.t+=dt;for(const n of g.redes)n.t+=dt;
 for(const p of g.p){if(p.preso)continue;const dx=p.hx-p.x,dy=p.hy-p.y,d=Math.hypot(dx,dy);
  if(d>4){p.a=Math.atan2(dy,dx);const v=Math.min(d,90*dt);p.x+=dx/d*v;p.y+=dy/d*v;}
  else{if(Math.random()<dt*.8)p.a+=rr(-1,1);const nx=p.x+Math.cos(p.a)*p.v*dt,ny=p.y+Math.sin(p.a)*p.v*dt;if(noLago(nx,ny)&&Math.hypot(nx-p.hx,ny-p.hy)<60){p.x=nx;p.y=ny;}else p.a+=Math.PI*.7;}}}
function peixeCima(x,y,a,L,cor,tag,f){cx.save();cx.translate(x,y);cx.rotate(a);const o=Math.sin(f)*1.5;
 cx.fillStyle=cor;cx.beginPath();cx.moveTo(L*.5,0);cx.quadraticCurveTo(L*.2,-L*.16,-L*.3,-L*.05);cx.lineTo(-L*.5,-L*.16+o);cx.lineTo(-L*.42,o*.5);cx.lineTo(-L*.5,L*.16+o);cx.lineTo(-L*.3,L*.05);cx.quadraticCurveTo(L*.2,L*.16,L*.5,0);cx.fill();
 cx.fillStyle='rgba(255,255,255,.25)';cx.beginPath();cx.ellipse(L*.1,0,L*.25,L*.04,0,0,7);cx.fill();
 if(tag){cx.fillStyle='#e8701a';cx.beginPath();cx.arc(0,0,L*.17,0,7);cx.fill();cx.strokeStyle='#fff';cx.lineWidth=1;cx.stroke();}cx.restore();}
function desenha(){const g=S.g;if(!g||!cx)return;cx.clearRect(0,0,W,H);papel(cx,W,H,'#f4f1e7');
 // margem e vegetação
 cx.fillStyle='#dfe6cf';cx.beginPath();cx.ellipse(W/2,H*.47,W*.49,H*.45,0,0,7);cx.fill();
 const gr=cx.createRadialGradient(W/2,H*.47,10,W/2,H*.47,W*.45);gr.addColorStop(0,'#9cc3c9');gr.addColorStop(1,'#bcd6d4');cx.fillStyle=gr;cx.beginPath();cx.ellipse(W/2,H*.47,W*.44,H*.38,0,0,7);cx.fill();
 cx.fillStyle='rgba(98,130,72,.55)';for(let i=0;i<26;i++){const a=i*.24,x=W/2+Math.cos(a)*W*.43,y=H*.47+Math.sin(a)*H*.37;cx.beginPath();cx.arc(x,y,9+(i%3)*3,0,7);cx.fill();}
 cx.strokeStyle='rgba(255,255,255,.35)';cx.lineWidth=1;for(let i=0;i<12;i++){const x=W/2+Math.cos(i*2.1+g.t*.1)*W*.25,y=H*.47+Math.sin(i*1.7)*H*.2;cx.beginPath();cx.moveTo(x-10,y);cx.quadraticCurveTo(x,y-3,x+10,y);cx.stroke();}
 const L=W<520?11:14;for(const p of g.p){if(p.preso)continue;peixeCima(p.x,p.y,p.a,L,p.esp?'rgba(70,80,82,.75)':'rgba(110,105,80,.7)',p.m,g.t*8+p.x);}
 for(const n of g.redes){cx.strokeStyle=`rgba(60,50,40,${Math.max(.25,1-n.t)})`;cx.lineWidth=1;cx.beginPath();cx.arc(n.x,n.y,n.r,0,7);cx.stroke();
  cx.save();cx.beginPath();cx.arc(n.x,n.y,n.r,0,7);cx.clip();cx.strokeStyle='rgba(60,50,40,.18)';for(let k=-n.r;k<=n.r;k+=7){cx.beginPath();cx.moveTo(n.x+k,n.y-n.r);cx.lineTo(n.x+k,n.y+n.r);cx.moveTo(n.x-n.r,n.y+k);cx.lineTo(n.x+n.r,n.y+k);cx.stroke();}cx.restore();}
 // ficha de campo
 const fw=W<520?150:176,fx=W-fw-8;painel(cx,fx,8,fw,108,'Ficha de campo');
 txt(cx,'M (marcados)',fx+8,42,{s:12});txt(cx,String(g.M),fx+fw-10,42,{a:'right',s:13,b:1});
 txt(cx,'C (2ª captura)',fx+8,62,{s:12});txt(cx,g.etapa==='cap2'||g.etapa==='calc'||g.etapa==='res'?String(g.C):'–',fx+fw-10,62,{a:'right',s:13,b:1});
 txt(cx,'R (recapturados)',fx+8,82,{s:12});txt(cx,g.etapa==='cap2'||g.etapa==='calc'||g.etapa==='res'?String(g.R):'–',fx+fw-10,82,{a:'right',s:13,b:1,c:'#c45a10'});
 txt(cx,'N = M·C/R',fx+8,104,{s:11,c:'rgba(43,42,38,.65)'});
 if(g.etapa==='res'&&g.res){const r=g.res;painel(cx,8,8,W<520?W-fw-24:300,108,'Resultado');
  txt(cx,'Sua conta: '+r.v+(r.ok?'  (certo)':'  (o certo é '+r.ex+')'),16,42,{s:12,b:1,c:r.ok?'#1b5e20':'#8e1b1b'});
  txt(cx,'População real: '+g.N,16,62,{s:12});txt(cx,'Erro da estimativa: '+Math.round(r.err*100)+'%',16,82,{s:12,b:1});
  txt(cx,r.err<=.1?'Ótima amostragem. +15':r.err<=.25?'Estimativa razoável. +8':'Amostra pequena ou mal misturada.',16,102,{s:11,c:'rgba(43,42,38,.7)'});}
 if(g.etapa==='res'&&!g.res){}
 aviso(cx,W,H,g.msgT>0?g.msg:'');}
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);desenha();if(S.g&&!S.g.fim){raf=requestAnimationFrame(loop);}}
function parar(){if(raf)cancelAnimationFrame(raf);raf=null;}
function terminar(){const g=S.g;if(g.fim)return;g.fim=true;parar();const F=FASES[S.f];const em=g.erros.length?g.erros.reduce((a,b)=>a+b,0)/g.erros.length:1;const ok=g.calc>=F.lagos&&em<=.25;if(ok){S.fp+=30;beep(880,.2);}hud();
 $('tela').innerHTML=`<div class="card"><h2>${ok?'Estimativas confiáveis':'Estimativas a melhorar'}</h2><p>Cálculos certos: <b>${g.calc}</b> de ${F.lagos}. Erro médio das estimativas: <b>${Math.round(em*100)}%</b>. Dias de campo: <b>${g.dias}</b>.</p>
 ${ok?'<div class="fb good">Meta cumprida. +30.</div>':'<div class="fb bad">Meta não cumprida. Confira a conta M·C/R e lembre que poucas recapturas deixam a estimativa instável.</div>'}
 <div class="row" style="margin-top:12px">${ok?'<button class="btn" id="bq">Pergunta da fase</button>':'<button class="btn" id="br">Tentar de novo</button><button class="btn ghost" id="be">Encerrar</button>'}</div></div>`;
 if(ok)$('bq').onclick=pergunta;else{$('br').onclick=fase;$('be').onclick=()=>{S.tot+=Math.max(0,S.fp);S.fp=0;final(false);};}}
function pergunta(){
 const P=PERG[S.f],ops=shuf(P.o.map((t,i)=>({t,c:i===0})));
 $('tela').innerHTML=`<div class="card"><h2>Pergunta da fase</h2><p style="margin:6px 0 4px">${P.q}</p><p class="small">Acerto +20, erro −10.</p><div class="ops">${ops.map((o,i)=>`<button data-i="${i}">${o.t}</button>`).join('')}</div><div id="pf"></div></div>`;
 document.querySelectorAll('#tela .ops button').forEach(b=>b.onclick=()=>{const o=ops[+b.dataset.i];S.fp+=o.c?20:-10;beep(o.c?880:170,.15);hud();
  document.querySelectorAll('#tela .ops button').forEach((x,j)=>{x.disabled=true;if(ops[j].c){x.style.borderColor='#2e7d32';x.style.opacity=1;}});
  $('pf').innerHTML=`<div class="fb ${o.c?'good':'bad'}">${o.c?'Correto. +20.':'Incorreto. −10. A resposta certa está marcada em verde.'}<div class="row" style="margin-top:10px"><button class="btn" id="bn">${S.f===FASES.length-1?'Ver resultado →':'Próxima fase →'}</button></div></div>`;
  $('bn').onclick=()=>{S.tot+=S.fp;S.fp=0;if(S.f===FASES.length-1)final(true);else{S.f++;fase();}};});
}
function final(tudo){
 S.g=null;parar();$('rankBox').style.display='block';const nivel=tudo?'3 fases':'Fase '+(S.f+1);
 $('tela').innerHTML=`<div class="card" style="text-align:center"><h2>${tudo?'Três baías estimadas':'Fim de jogo'}</h2><div class="big">${S.tot} pts</div>
 <div class="savebox"><input id="pName" maxlength="20" placeholder="Seu nome"><button class="btn" id="bS">Salvar no ranking</button></div><p class="small" id="sSt"></p>
 <div class="row" style="justify-content:center;margin-top:12px"><button class="btn ghost" onclick="inicio()">Jogar de novo</button></div>
 <div class="small" style="margin-top:12px;text-align:left">📚 Fontes: Anais do SIIEPE/UFPel, prática de estimativa de tamanho populacional: fórmula de Lincoln-Petersen N = M·C/R, adaptada de Odum e Barrett; Krebs, C. J., Ecological Methodology, capítulo 2: primeiro uso ecológico da marcação e recaptura por C. G. J. Petersen em 1896; Wikipedia, Mark and recapture (com base em Southwood): é preciso dar tempo para os marcados se redistribuírem na população. Os tamanhos reais das populações são sorteados pelo jogo.</div></div>`;
 $('bS').onclick=()=>salvar(nivel);
}

const GAME_ID="marca-e-recaptura";let db=null,fs=null,salvo=false;
(async()=>{try{const a=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");const f=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");db=f.getFirestore(a.initializeApp(firebaseConfig));fs=f;carregar();}catch(e){$('rankList').innerHTML='<li><span>Ranking indisponível sem internet.</span></li>';$('rankNote').textContent='O jogo funciona normalmente. O ranking volta quando houver conexão.';}})();
async function carregar(){if(!db)return;try{const q=fs.query(fs.collection(db,'games',GAME_ID,'scores'),fs.orderBy('score','desc'),fs.limit(10));const sn=await fs.getDocs(q);const r=[];sn.forEach(d=>r.push(d.data()));$('rankNote').textContent='Maior pontuação primeiro.';$('rankList').innerHTML=r.length?r.map((x,i)=>`<li><span><span class="rp">${i+1}º</span>${esc(x.name||'?')}</span><span>${(Number(x.score)||0).toLocaleString('pt-BR')} pts · ${esc(x.level||'')}</span></li>`).join(''):'<li><span>Seja o primeiro do ranking!</span></li>';}catch(e){$('rankList').innerHTML='<li><span>Não foi possível carregar o ranking.</span></li>';}}
async function salvar(nivel){if(salvo)return;const nome=$('pName').value.trim(),st=$('sSt');if(!nome){st.textContent='Digite seu nome primeiro.';return;}if(!db){st.textContent='Sem conexão com o ranking. O resultado não foi enviado.';return;}
 $('bS').disabled=true;try{await fs.addDoc(fs.collection(db,'games',GAME_ID,'scores'),{name:nome.slice(0,20),score:Math.max(0,S.tot),level:nivel,ts:fs.serverTimestamp()});salvo=true;st.textContent='Salvo no Ranking Global!';carregar();}catch(e){$('bS').disabled=false;st.textContent='Erro ao salvar. Tente de novo.';}}
window.__mr={get S(){return S},update,parar,lancar,FASES,noLago,conferir};
inicio();
