<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cisterna Cheia</title>
<style>
:root{--main:#c46a00;--deep:#8a4a00;--soft:#fff3e0;--line:#f3dcc0;--ink:#2b2117;--mut:#6d5a48;--agua:#29b6f6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:var(--ink);line-height:1.45}
.wrap{max-width:780px;margin:0 auto;padding:12px 14px 40px}
a.hub{color:var(--deep);font-weight:700;text-decoration:none;font-size:.9rem}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
h1{font-size:1.4rem;color:var(--deep)}h2{font-size:1.15rem;color:var(--deep);margin-bottom:6px}
.hud{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--soft);color:var(--deep);border-radius:99px;padding:5px 11px;font-weight:700;font-size:.86rem}
.card{border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;background:#fff}
.btn{background:var(--main);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--deep)}.btn.ghost{background:#fff;color:var(--deep);border:2px solid var(--main)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.small{font-size:.86rem;color:var(--mut)}
.meses{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin:8px 0}
.mes{text-align:center;border-radius:8px;padding:4px 0;font-size:.72rem;background:#fafafa;border:1px solid #eee}
.mes .ic{font-size:1.05rem;display:block}
.mes.now{border:2px solid var(--main);background:var(--soft);font-weight:700}
.mes.past{opacity:.45}
.painel{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center;margin:10px 0}
.tanque{position:relative;height:150px;border:3px solid #8d8d8d;border-radius:12px 12px 18px 18px;overflow:hidden;background:#f5f5f5}
.nivel{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#81d4fa,var(--agua));transition:height .5s}
.tanque span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;color:#0d3c55;font-size:.95rem;text-align:center}
.info div{margin:2px 0;font-size:.93rem}
.ops{display:grid;gap:8px;margin-top:10px}
.ops button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-size:.95rem;cursor:pointer;font-family:inherit;text-align:left;color:var(--ink)}
.ops button:hover{border-color:var(--main)}.ops button:disabled{opacity:.4;cursor:default}
.ops button small{display:block;color:var(--mut);font-size:.8rem}
.log{background:var(--soft);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:.92rem}
.fb{margin-top:10px;padding:11px 13px;border-radius:12px;font-size:.93rem}
.fb.good{background:#e8f5e9;color:#1b5e20}.fb.bad{background:#ffebee;color:#8e1b1b}
.alerta{background:#fff8e1;border-left:4px solid #ffb300;border-radius:8px;padding:8px 10px;margin-top:8px;font-size:.92rem}
.big{font-size:2.3rem;font-weight:800;color:var(--deep)}
.ranking{border:3px solid var(--main);border-radius:18px;padding:0 16px 12px;overflow:hidden;margin-top:12px}
.ranking h3{font-size:1rem;margin:0 -16px 8px;padding:10px 16px;background:var(--main);color:#fff}
.ranking ol{list-style:none}.ranking li{display:flex;justify-content:space-between;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:.92rem}
.ranking li:last-child{border-bottom:0}.rp{display:inline-block;min-width:2.1em;font-weight:800;color:var(--deep)}
.savebox{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.savebox input{flex:1;min-width:160px;border:2px solid var(--line);border-radius:12px;padding:11px;font-size:1rem;font-family:inherit}
</style>
</head>
<body>
<div class="wrap">
<a class="hub" href="https://ernandes-sobreira.github.io/jogos-ambientais/">← Todos os jogos</a>
<header>
  <h1>🌵 Cisterna Cheia</h1>
  <div class="hud" id="hud" style="display:none"><span class="pill" id="hA">Ano 1/3</span><span class="pill" id="hP">0 pts</span><span class="pill" id="hC">🚚 0</span></div>
</header>
<main id="tela"></main>
<div class="ranking" id="rankBox"><h3>Ranking Global</h3><ol id="rankList"><li><span>Carregando o ranking...</span></li></ol><p class="small" id="rankNote"></p></div>
</div>
<script>
const $=id=>document.getElementById(id);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L=n=>Math.round(n).toLocaleString('pt-BR');
let actx=null;function beep(f,d){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.setValueAtTime(.07,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(e){}}

/* Referências: cisterna de 16 mil litros para uma família de 5 pessoas beber e cozinhar
   em cerca de 240 dias sem chuva, com 14 litros por pessoa por dia (Embrapa, citando Silva et al. 1984).
   As chuvas mensais abaixo são do jogo e não são dados de uma cidade real. */
const CAP=16000,PESSOAS=5,LDIA=14,DIAS=30,NEC=PESSOAS*LDIA*DIAS; // 2.100 L por mês
const MESES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const ANOS=[
 {nome:'Ano de chuva boa',ini:3000,chuva:[90,110,120,80,30,0,0,0,0,0,10,40],galpao:false,calha:-1,meta:0,
  txt:'Choveu bem este ano. A cisterna enche e até transborda. O desafio é não gastar demais e chegar ao fim da seca com água.'},
 {nome:'Ano seco',ini:2500,chuva:[40,70,90,60,15,0,0,0,0,0,0,20],galpao:true,calha:1,meta:0,
  txt:'Choveu menos. Só o telhado da casa não basta. Você pode ligar o telhado do galpão na cisterna, mas isso toma a ação de um mês.'},
 {nome:'Seca forte',ini:4000,chuva:[30,60,70,40,5,0,0,0,0,0,0,10],galpao:true,calha:2,meta:2,
  txt:'Seca forte. Mesmo cheia, a cisterna de 16 mil litros dura cerca de 8 meses, e aqui a seca é mais longa. A meta aceita no máximo 2 meses de carro-pipa.'}
];
const TELHADO=60,GALPAO=40,DESVIO=10; // m², m², mm desviados da primeira chuva (escolhas do jogo)
const USOS={
 so:{t:'💧 Só beber e cozinhar',d:'Uso para que a cisterna foi feita.',l:0,p:0},
 roupa:{t:'👕 Lavar roupa com água da cisterna',d:'Gasta mais 1.000 litros. +5 pontos de conforto.',l:1000,p:5},
 cabra:{t:'🐐 Dar água da cisterna às cabras',d:'Gasta mais 1.500 litros. +7 pontos.',l:1500,p:7}
};
const PERG=[
 {q:'Para que foi pensada a cisterna de placas de 16 mil litros?',o:['Para a família beber e cozinhar durante a seca','Para regar a roça e dar água ao gado o ano inteiro','Para encher a caixa do banho']},
 {q:'Por que se desvia a primeira água da chuva antes de encher a cisterna?',o:['Ela lava a poeira e a sujeira do telhado','Ela é salgada demais para beber','Ela estraga o cimento das placas da cisterna']},
 {q:'Sem perdas, quanto 1 mm de chuva junta em 1 m² de telhado?',o:['1 litro','10 litros de água','100 mililitros']}
];
let S;
function hud(){$('hud').style.display='flex';$('hA').textContent='Ano '+(S.a+1)+'/3';$('hP').textContent=(S.tot+S.ap)+' pts';$('hC').textContent='🚚 '+S.pipa+' carro-pipa';}
function inicio(){
 $('hud').style.display='none';$('rankBox').style.display='block';
 $('tela').innerHTML=`<div class="card"><h2>Faça a água da chuva durar até a próxima chuva</h2>
 <p>Uma família de ${PESSOAS} pessoas vive na Caatinga com uma cisterna de ${L(CAP)} litros. Para beber e cozinhar, cada pessoa precisa de cerca de ${LDIA} litros por dia. Isso dá ${L(NEC)} litros por mês.</p>
 <p style="margin-top:6px">A cada mês, escolha uma ação. A chuva cai no telhado e vai para a cisterna. No jogo, 1 mm de chuva em 1 m² de telhado vira 1 litro.</p>
 <p class="small" style="margin-top:6px">Mês com água da cisterna vale +10. Se a água acabar, vem o carro-pipa e você perde 40. 🎯 Meta: chegar ao fim do ano dentro do limite de carro-pipa.</p>
 <div class="row" style="margin-top:12px"><button class="btn" onclick="novo()">Começar →</button></div></div>`;
}
function novo(){S={a:0,tot:0,ap:0,pipa:0,pipaTot:0};salvo=false;$('rankBox').style.display='none';ano();}
function ano(){const A=ANOS[S.a];S.m=0;S.ap=0;S.pipa=0;S.W=A.ini;S.roof=TELHADO;S.galpao=false;S.calhaOk=A.calha<0;S.desviou=null;S.sujo=false;
 S.chuva=A.chuva.map(c=>c?Math.round(c*(0.88+Math.random()*0.24)):0);S.log='';hud();
 $('tela').innerHTML=`<div class="card"><h2>Ano ${S.a+1}: ${A.nome}</h2><p>${A.txt}</p><p class="small" style="margin-top:6px">A cisterna começa com ${L(A.ini)} litros. 🎯 Meta: no máximo ${A.meta} ${A.meta===1?'mês':'meses'} de carro-pipa.</p><div class="row" style="margin-top:12px"><button class="btn" id="bg">Começar o ano →</button></div></div>`;
 $('bg').onclick=mes;}
function icone(c){return c===0?'☀️':c<40?'🌦️':'🌧️';}
function mes(){
 const A=ANOS[S.a],m=S.m,c=S.chuva[m];
 if(m===0&&S.desviou===null&&c>0)return primeira();
 let h=`<div class="card"><h2>${MESES[m]} · Ano ${S.a+1}</h2>
 <div class="meses">${MESES.map((n,i)=>`<div class="mes ${i===m?'now':i<m?'past':''}"><span class="ic">${icone(S.chuva[i])}</span>${n}</div>`).join('')}</div>
 <div class="small">Previsão: ☀️ sem chuva · 🌦️ pouca chuva · 🌧️ chuva boa</div>
 <div class="painel"><div class="tanque"><div class="nivel" style="height:${Math.max(0,S.W)/CAP*100}%"></div><span>${L(S.W)} L</span></div>
 <div class="info"><div>🏠 Telhado ligado: <b>${S.roof} m²</b></div><div>🌧️ Chuva deste mês: <b>${c} mm</b> (até ${L(c*S.roof)} L)</div><div>👨‍👩‍👧‍👦 A família vai usar <b>${L(NEC)} L</b></div><div class="small">A cisterna guarda no máximo ${L(CAP)} L. O que passar disso transborda e se perde.</div></div></div>`;
 if(m===A.calha&&!S.calhaOk)h+=`<div class="alerta">🍂 A calha entupiu de folhas. Se não limpar, só metade da chuva deste mês chega à cisterna.</div>`;
 if(S.log)h+=`<div class="log">${S.log}</div>`;
 h+=`<div class="small" style="margin-top:10px"><b>O que a família faz neste mês?</b></div><div class="ops">`;
 for(const k in USOS)h+=`<button data-u="${k}">${USOS[k].t}<small>${USOS[k].d}</small></button>`;
 if(A.galpao&&!S.galpao)h+=`<button data-u="galpao">🏚️ Ligar o telhado do galpão na cisterna<small>Mais ${GALPAO} m² de telhado a partir deste mês. Toma a ação do mês.</small></button>`;
 if(m===A.calha&&!S.calhaOk)h+=`<button data-u="calha">🧹 Limpar a calha<small>Toma a ação do mês.</small></button>`;
 h+='</div></div>';
 $('tela').innerHTML=h;
 document.querySelectorAll('.ops button').forEach(b=>b.onclick=()=>passa(b.dataset.u));
}
function primeira(){
 $('tela').innerHTML=`<div class="card"><h2>Chegou a primeira chuva do ano 🌧️</h2><p>O telhado passou meses juntando poeira, folhas e fezes de passarinho. O que fazer com a primeira água que desce pela calha?</p>
 <div class="ops"><button data-d="1">Desviar a primeira água e só depois encher a cisterna<small>Perde os primeiros ${DESVIO} mm desta chuva.</small></button><button data-d="0">Mandar toda a água direto para a cisterna<small>Aproveita a chuva inteira.</small></button></div></div>`;
 document.querySelectorAll('.ops button').forEach(b=>b.onclick=()=>{S.desviou=b.dataset.d==='1';
  if(S.desviou){S.ap+=10;beep(880,.12);S.log='✅ +10. A primeira água lavou o telhado e foi para fora. A cisterna recebe água mais limpa.';}
  else{S.ap-=30;S.sujo=true;beep(170,.3);S.log='❌ −30. A sujeira do telhado foi para dentro da cisterna. A água da família ficou com risco de causar diarreia.';}
  hud();mes();});
}
function passa(u){
 const A=ANOS[S.a],m=S.m;let c=S.chuva[m],txt=[];
 if(u==='galpao'){S.galpao=true;S.roof=TELHADO+GALPAO;txt.push(`🏚️ O galpão foi ligado. Agora são ${S.roof} m² de telhado.`);}
 if(u==='calha'){S.calhaOk=true;txt.push('🧹 Calha limpa.');}
 if(m===0&&S.desviou)c=Math.max(0,c-DESVIO);
 let ent=c*S.roof;if(m===A.calha&&!S.calhaOk){ent=ent/2;txt.push('🍂 A calha entupida desperdiçou metade da chuva.');}
 S.W+=ent;let sang=0;if(S.W>CAP){sang=S.W-CAP;S.W=CAP;}
 if(ent>0)txt.push(`🌧️ Entraram ${L(ent)} L.`);
 if(sang>0)txt.push(`💦 A cisterna transbordou e ${L(sang)} L se perderam.`);
 const uso=USOS[u]||USOS.so,gasto=NEC+uso.l;
 if(USOS[u]&&uso.p){S.ap+=uso.p;txt.push(`${uso.t.split(' ')[0]} +${uso.p}.`);}
 S.W-=gasto;
 if(S.W<0){S.W=0;S.pipa++;S.ap-=40;beep(150,.35);txt.push('🚚 A água acabou. A família esperou o carro-pipa e usou água de qualidade incerta. −40.');}
 else{S.ap+=10;txt.push(`👨‍👩‍👧‍👦 Família abastecida. +10.`);}
 S.log=txt.join(' ');S.m++;hud();
 if(S.m>=12)fimAno();else mes();
}
function fimAno(){
 const A=ANOS[S.a],ok=S.pipa<=A.meta;
 if(ok){S.ap+=30;beep(880,.2);}
 hud();
 $('tela').innerHTML=`<div class="card"><h2>Fim do ano ${S.a+1}</h2><div class="log">${S.log}</div>
 <p style="margin-top:10px">Sobraram <b>${L(S.W)} L</b> na cisterna. Meses de carro-pipa: <b>${S.pipa}</b> (meta: até ${A.meta}).</p>
 ${ok?'<div class="fb good">🎯 Meta cumprida! +30.</div>':'<div class="fb bad">A meta não foi cumprida. Tente gastar menos fora do básico e aproveitar melhor a chuva.</div>'}
 <div class="row" style="margin-top:12px">${ok?'<button class="btn" id="bq">Pergunta do ano →</button>':'<button class="btn" id="br">Tentar de novo</button><button class="btn ghost" id="be">Encerrar</button>'}</div></div>`;
 if(ok)$('bq').onclick=pergunta;else{$('br').onclick=ano;$('be').onclick=()=>{S.pipaTot+=S.pipa;S.tot+=S.ap;S.ap=0;final(false);};}
}
function pergunta(){
 const P=PERG[S.a],ops=shuf(P.o.map((t,i)=>({t,c:i===0})));
 $('tela').innerHTML=`<div class="card"><h2>Pergunta do ano</h2><p style="margin:6px 0 4px">${P.q}</p><p class="small">Acerto +20, erro −10.</p><div class="ops">${ops.map((o,i)=>`<button data-i="${i}">${o.t}</button>`).join('')}</div><div id="pf"></div></div>`;
 document.querySelectorAll('#tela .ops button').forEach(b=>b.onclick=()=>{const o=ops[+b.dataset.i];S.ap+=o.c?20:-10;beep(o.c?880:170,.15);hud();
  document.querySelectorAll('#tela .ops button').forEach((x,j)=>{x.disabled=true;if(ops[j].c){x.style.borderColor='#2e7d32';x.style.opacity=1;}});
  $('pf').innerHTML=`<div class="fb ${o.c?'good':'bad'}">${o.c?'✅ +20.':'❌ −10. A resposta certa está marcada em verde.'}<div class="row" style="margin-top:10px"><button class="btn" id="bn">${S.a===ANOS.length-1?'Ver resultado →':'Próximo ano →'}</button></div></div>`;
  $('bn').onclick=()=>{S.tot+=S.ap;S.ap=0;S.pipaTot+=S.pipa;if(S.a===ANOS.length-1)final(true);else{S.a++;ano();}};});
}
function final(tudo){
 $('rankBox').style.display='block';const nivel=tudo?'3 anos':'Ano '+(S.a+1);
 $('tela').innerHTML=`<div class="card" style="text-align:center"><div class="big">${tudo?'🏆':'🌵'}</div><h2>${tudo?'A família atravessou os três anos!':'Fim de jogo'}</h2><div class="big">${S.tot} pts</div><p class="small">${S.pipaTot} mês(es) de carro-pipa no total</p>
 <div class="savebox"><input id="pName" maxlength="20" placeholder="Seu nome"><button class="btn" id="bS">Salvar no ranking</button></div><p class="small" id="sSt"></p>
 <div class="row" style="justify-content:center;margin-top:12px"><button class="btn ghost" onclick="inicio()">Jogar de novo</button></div>
 <div class="small" style="margin-top:12px;text-align:left">📚 Fontes: Embrapa Semiárido, cisterna rural e consumo de 14 litros por pessoa por dia (citando Silva et al., 1984); cisterna de 16 mil litros para família de cinco pessoas por cerca de 8 meses sem chuva; Programa Cisternas (MDS), cisterna de placas de 16 mil litros para beber e cozinhar. As chuvas, os tamanhos de telhado e os gastos extras são do jogo. O jogo não desconta as perdas na calha; na vida real, parte da chuva se perde.</div></div>`;
 $('bS').onclick=()=>salvar(nivel);
}
const firebaseConfig={apiKey:"AIzaSyCbXi3UCVl8oLleBzGb6DqWSxbZmZU2yDQ",authDomain:"jogos-ranking.firebaseapp.com",projectId:"jogos-ranking",storageBucket:"jogos-ranking.firebasestorage.app",messagingSenderId:"958784915420",appId:"1:958784915420:web:4212d3ad278f02d600f119"};
const GAME_ID="cisterna-cheia";let db=null,fs=null,salvo=false;
(async()=>{try{const a=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");const f=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");db=f.getFirestore(a.initializeApp(firebaseConfig));fs=f;carregar();}catch(e){$('rankList').innerHTML='<li><span>Ranking indisponível sem internet.</span></li>';$('rankNote').textContent='O jogo funciona normalmente. O ranking volta quando houver conexão.';}})();
async function carregar(){if(!db)return;try{const q=fs.query(fs.collection(db,'games',GAME_ID,'scores'),fs.orderBy('score','desc'),fs.limit(10));const sn=await fs.getDocs(q);const r=[];sn.forEach(d=>r.push(d.data()));$('rankNote').textContent='Maior pontuação primeiro.';$('rankList').innerHTML=r.length?r.map((x,i)=>`<li><span><span class="rp">${i+1}º</span>${esc(x.name||'?')}</span><span>${(Number(x.score)||0).toLocaleString('pt-BR')} pts · ${esc(x.level||'')}</span></li>`).join(''):'<li><span>Seja o primeiro do ranking!</span></li>';}catch(e){$('rankList').innerHTML='<li><span>Não foi possível carregar o ranking.</span></li>';}}
async function salvar(nivel){if(salvo)return;const nome=$('pName').value.trim(),st=$('sSt');if(!nome){st.textContent='Digite seu nome primeiro.';return;}if(!db){st.textContent='Sem conexão com o ranking. O resultado não foi enviado.';return;}
 $('bS').disabled=true;try{await fs.addDoc(fs.collection(db,'games',GAME_ID,'scores'),{name:nome.slice(0,20),score:Math.max(0,S.tot),level:nivel,ts:fs.serverTimestamp()});salvo=true;st.textContent='Salvo no Ranking Global!';carregar();}catch(e){$('bS').disabled=false;st.textContent='Erro ao salvar. Tente de novo.';}}
window.__cc={get S(){return S},ANOS,passa,USOS,NEC,CAP};
inicio();
</script>
</body>
</html>
