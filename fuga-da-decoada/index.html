<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fuga da Decoada</title>
<style>
:root{--main:#00897b;--deep:#00695c;--soft:#e0f2f1;--line:#c4e6e2;--ink:#17262a;--mut:#4c6466}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:var(--ink);line-height:1.45}
.wrap{max-width:780px;margin:0 auto;padding:12px 14px 40px}
a.hub{color:var(--deep);font-weight:700;text-decoration:none;font-size:.9rem}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
h1{font-size:1.4rem;color:var(--deep)}h2{font-size:1.15rem;color:var(--deep);margin-bottom:6px}
.hud{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--soft);color:var(--deep);border-radius:99px;padding:5px 11px;font-weight:700;font-size:.86rem}
.card{border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;background:#fff}
.btn{background:var(--main);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--deep)}.btn.ghost{background:#fff;color:var(--deep);border:2px solid var(--main)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.small{font-size:.86rem;color:var(--mut)}
canvas{width:100%;max-width:760px;margin:0 auto;display:block;border:2px solid var(--line);border-radius:16px;touch-action:none;background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:6px;justify-content:center;margin-top:10px}
.pad button{border:2px solid var(--line);background:var(--soft);border-radius:12px;font-size:1.4rem;cursor:pointer;color:var(--deep);touch-action:manipulation}
.pad button:active{background:#dcedc8}
.tab{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:8px}.tab td{border-bottom:1px solid var(--line);padding:5px 4px;vertical-align:top}
.ops{display:grid;gap:8px;margin-top:10px}
.ops button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-size:.95rem;cursor:pointer;font-family:inherit;text-align:left;color:var(--ink)}
.ops button:hover{border-color:var(--main)}.ops button:disabled{opacity:.5;cursor:default}
.fb{margin-top:10px;padding:11px 13px;border-radius:12px;font-size:.93rem}
.fb.good{background:#e8f5e9;color:#1b5e20}.fb.bad{background:#ffebee;color:#8e1b1b}
.big{font-size:2.3rem;font-weight:800;color:var(--deep)}
.ranking{border:3px solid var(--main);border-radius:18px;padding:0 16px 12px;overflow:hidden;margin-top:12px}
.ranking h3{font-size:1rem;margin:0 -16px 8px;padding:10px 16px;background:var(--main);color:#fff}
.ranking ol{list-style:none}.ranking li{display:flex;justify-content:space-between;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:.92rem}
.ranking li:last-child{border-bottom:0}.rp{display:inline-block;min-width:2.1em;font-weight:800;color:var(--deep)}
.savebox{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.savebox input{flex:1;min-width:160px;border:2px solid var(--line);border-radius:12px;padding:11px;font-size:1rem;font-family:inherit}
</style>
</head>
<body>
<div class="wrap">
<a class="hub" href="https://ernandes-sobreira.github.io/jogos-ambientais/">← Todos os jogos</a>
<header>
  <h1 id="tit">Fuga da Decoada</h1>
  <div class="hud" id="hud" style="display:none"><span class="pill" id="hF">Fase 1/3</span><span class="pill" id="hP">0 pts</span><span class="pill" id="hR">🍃 0</span><span class="pill" id="hV">❤️ 3</span><span class="pill" id="hT">⏱ 0</span></div>
</header>
<main id="tela"></main>
<div class="ranking" id="rankBox"><h3>Ranking Global</h3><ol id="rankList"><li><span>Carregando o ranking...</span></li></ol><p class="small" id="rankNote"></p></div>
</div>
<script>
const $=id=>document.getElementById(id);
const rr=(a,b)=>a+Math.random()*(b-a);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let actx=null;function beep(f,d,v){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.setValueAtTime(v||.05,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(e){}}

/* A água escurece onde a vegetação alagada se decompõe. O oxigênio mostrado (de 7 a 0 mg/L)
   é uma escala do jogo ligada à cor da água, não uma medida real. */
const GC=32,GR=20;
const FASES=[
 {nome:'Começo da enchente',dur:60,meta:14,focos:4,taxa:.05,rioFalha:0,txt:'A cheia invadiu o campo e há muita comida na água rasa. Mas a vegetação alagada começa a apodrecer e a água escurece. Coma no campo e volte ao rio para respirar.'},
 {nome:'Enchente rápida',dur:70,meta:17,focos:6,taxa:.07,rioFalha:0,txt:'A água subiu depressa e cobriu mais vegetação. A decoada se espalha mais rápido.'},
 {nome:'Grande cheia',dur:80,meta:20,focos:7,taxa:.08,rioFalha:.6,txt:'Numa cheia muito grande, a água escura chega até o rio. Procure a baía de água clara ligada ao rio.'}
];
const PERG=[
 {q:'O que causa a falta de oxigênio na decoada?',o:['A decomposição da vegetação alagada pelas bactérias consome o oxigênio','O sol muito forte da seca evapora o oxigênio da água','Os peixes, que se juntam no rio e respiram todo o oxigênio']},
 {q:'Além de pouco oxigênio, o que mais muda na água durante a decoada?',o:['Ela fica escura, com mais gás carbônico e pH mais baixo','Ela fica salgada e mais fria que o normal','Ela fica mais clara e transparente que antes']},
 {q:'A decoada é causada pela poluição de alguma fábrica?',o:['Não, é um fenômeno natural do Pantanal na enchente','Sim, vem do esgoto das cidades ribeirinhas','Sim, vem do óleo dos barcos da hidrovia']}
];
let S,cv,cx,raf=null,last=0,W=768,H=480,cw,chh,inp={x:null,y:null,u:0,d:0,l:0,r:0};
function hud(){$('hud').style.display='flex';$('hF').textContent='Fase '+(S.f+1)+'/3';$('hP').textContent=(S.tot+S.fp)+' pts';
 if(S.g){$('hV').textContent='❤️ '+S.g.vidas;$('hR').textContent='🍃 '+S.g.comeu+'/'+FASES[S.f].meta;$('hT').textContent='⏱ '+Math.max(0,Math.ceil(S.g.dur-S.g.t))+' s';}}
function svgPeixe(w){return `<svg viewBox="0 0 70 30" width="${w}" height="${w*3/7}" aria-label="piraputanga" style="vertical-align:-4px"><path d="M8 15 L-4 4 L-1 15 L-4 26 Z" transform="translate(6 0)" fill="#e53935"/><ellipse cx="34" cy="15" rx="26" ry="10" fill="#b0bec5"/><path d="M14 13 Q34 9 56 13" stroke="#78909c" stroke-width="1.5" fill="none"/><circle cx="52" cy="12" r="2.6" fill="#fff"/><circle cx="52.6" cy="12" r="1.3" fill="#111"/><path d="M30 6 L36 0 L40 7 Z" fill="#e57373"/></svg>`;}
function inicio(){
 parar();$('hud').style.display='none';$('rankBox').style.display='block';
 $('tela').innerHTML=`<div class="card"><h2>Escape da decoada</h2>
 <table class="tab"><tr><td>${svgPeixe(46)}</td><td>Você é uma piraputanga. Na cheia, o campo alagado tem muita comida.</td></tr>
 <tr><td>🟫</td><td>Onde a vegetação alagada apodrece, a água escurece e perde oxigênio. É a decoada.</td></tr>
 <tr><td>🫧</td><td>Na água escura, o seu fôlego cai. Na água clara do rio, ele volta. Se o fôlego zerar, você perde uma vida.</td></tr>
 <tr><td>🍃</td><td>Cada alimento vale +5. A maior parte da comida está perto da vegetação alagada, justamente onde a água escurece primeiro.</td></tr>
 <tr><td>🖱️ 👆 ⌨️</td><td>Aponte para onde nadar, ou use as setas.</td></tr></table>
 <p class="small" style="margin-top:8px">🎯 Meta: comer a quantidade de alimento da fase antes do tempo acabar, perdendo no máximo 1 vida.</p>
 <div class="row" style="margin-top:12px"><button class="btn" onclick="novo()">Começar →</button></div></div>`;
}
function novo(){S={f:0,tot:0,fp:0};salvo=false;$('rankBox').style.display='none';fase();}
function fase(){const F=FASES[S.f];S.fp=0;S.g=null;hud();
 $('tela').innerHTML=`<div class="card"><h2>Fase ${S.f+1}: ${F.nome}</h2><p>${F.txt}</p><p class="small" style="margin-top:6px">🎯 Meta: comer ${F.meta} alimentos em ${F.dur} s, perdendo no máximo 1 vida.</p><div class="row" style="margin-top:12px"><button class="btn" id="bg">Nadar →</button></div></div>`;
 $('bg').onclick=jogar;}
function rioY(x){return GR*.18+Math.sin(x/GC*Math.PI*1.6)*GR*.08;}
function ehRio(c,r){const y=rioY(c);return r>=y-1.4&&r<=y+1.4;}
function ehBaia(c,r){return S.f===2&&Math.hypot(c-GC*.82,r-GR*.42)<2.3;}
function jogar(){const F=FASES[S.f];
 $('tela').innerHTML=`<div class="card"><canvas id="cv"></canvas><p class="small" style="margin-top:8px">Aponte para onde nadar. No teclado, use as setas. A escala de oxigênio é do jogo.</p></div>`;
 cv=$('cv');if(cv.clientWidth<520){W=448;H=448;}else{W=768;H=480;}cv.width=W;cv.height=H;cw=W/GC;chh=H/GR;cx=cv.getContext('2d');
 const d=new Float32Array(GC*GR),veg=[];
 for(let i=0;i<F.focos;i++){let c,r;do{c=Math.floor(rr(2,GC-2));r=Math.floor(rr(GR*.4,GR-2));}while(ehBaia(c,r));veg.push({c,r,ini:rr(0,F.dur*.15)});}
 S.g={t:0,dur:F.dur,vidas:3,comeu:0,fol:100,px:W*.15,py:rioY(4)*chh,vx:0,vy:0,d,veg,comida:[],olha:1,fim:false,msg:'',msgT:0,inv:0,od:7};
 for(let i=0;i<4;i++)novaComida();S.g.proxC=0;
 const pos=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height];};
 cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);[inp.x,inp.y]=pos(e);e.preventDefault();};
 cv.onpointermove=e=>{if(e.buttons||e.pointerType==='mouse')[inp.x,inp.y]=pos(e);};
 cv.onpointerup=cv.onpointercancel=e=>{if(e.pointerType!=='mouse'){inp.x=null;inp.y=null;}};
 cv.onpointerleave=()=>{inp.x=null;inp.y=null;};
 hud();last=performance.now();parar();raf=requestAnimationFrame(loop);}
const K={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r'};
document.addEventListener('keydown',e=>{if(K[e.key]&&S&&S.g){inp[K[e.key]]=1;e.preventDefault();}});
document.addEventListener('keyup',e=>{if(K[e.key])inp[K[e.key]]=0;});
function novaComida(){const g=S.g;let c,r,t=0;do{if(Math.random()<.75&&g.veg.length){const v=g.veg[Math.floor(Math.random()*g.veg.length)];c=v.c+rr(-2.5,2.5);r=v.r+rr(-2.5,2.5);}else{c=rr(1,GC-1);r=rr(GR*.35,GR-1);}t++;}while(t<50&&(ehBaia(c,r)||c<1||c>GC-1||r<1||r>GR-1));g.comida.push({x:c*cw,y:r*chh,tipo:Math.random()<.5?'inseto':'fruto',f:Math.random()*6});}
function msg(t){S.g.msg=t;S.g.msgT=2.2;}
function escuro(x,y){const g=S.g;const c=Math.max(0,Math.min(GC-1,Math.floor(x/cw))),r=Math.max(0,Math.min(GR-1,Math.floor(y/chh)));return g.d[r*GC+c];}
function update(dt){const g=S.g;if(!g||g.fim)return;const F=FASES[S.f];
 g.t+=dt;g.msgT-=dt;g.inv-=dt;
 // decoada: fonte nos focos de vegetação, difusão, renovação no rio
 const d=g.d,n=new Float32Array(d);const fr=g.t/g.dur;
 for(const v of g.veg)if(g.t>v.ini){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const c=v.c+dc,r=v.r+dr;if(c>=0&&c<GC&&r>=0&&r<GR)n[r*GC+c]=Math.min(1,n[r*GC+c]+F.taxa*8*dt);}}
 for(let r=0;r<GR;r++)for(let c=0;c<GC;c++){const i=r*GC+c;let s=0,k=0;for(const [a,b] of [[0,1],[1,0],[0,-1],[-1,0]]){const rr2=r+a,cc=c+b;if(rr2>=0&&rr2<GR&&cc>=0&&cc<GC){s+=d[rr2*GC+cc];k++;}}
  let v=n[i]+(s/k-d[i])*F.taxa*14*dt+F.taxa*.7*dt*(r>GR*.3?1:0);
  if(ehRio(c,r))v-=(1-F.rioFalha*Math.max(0,fr-.4)*2)*.5*dt;
  if(ehBaia(c,r))v-=.6*dt;
  n[i]=Math.max(0,Math.min(1,v));}
 g.d=n;
 // nado
 let ax=0,ay=0;if(inp.x!=null){const dx=inp.x-g.px,dy=inp.y-g.py,l=Math.hypot(dx,dy);if(l>5){ax=dx/l;ay=dy/l;}}
 ax+=inp.r-inp.l;ay+=inp.d-inp.u;const m=Math.hypot(ax,ay);if(m>1){ax/=m;ay/=m;}
 const sp=170;g.vx+=(ax*sp-g.vx)*Math.min(1,dt*6);g.vy+=(ay*sp-g.vy)*Math.min(1,dt*6);g.px=Math.max(10,Math.min(W-10,g.px+g.vx*dt));g.py=Math.max(10,Math.min(H-10,g.py+g.vy*dt));if(Math.abs(g.vx)>15)g.olha=Math.sign(g.vx);
 // oxigênio
 g.od=7*(1-escuro(g.px,g.py));
 if(g.od<3)g.fol-=(3-g.od)*10*dt;else g.fol=Math.min(100,g.fol+22*dt);
 if(g.fol<=0&&g.inv<=0){g.vidas--;S.fp-=20;g.fol=100;g.inv=2;g.px=W*.15;g.py=rioY(4)*chh;beep(130,.4,.07);msg('🫧 Faltou oxigênio! A piraputanga desmaiou. −20.');if(g.vidas<=0){terminar();return;}}
 // comida
 for(const c of g.comida){c.f+=dt;if(Math.hypot(c.x-g.px,c.y-g.py)<16){c.comido=true;g.comeu++;S.fp+=5;beep(800,.05);}}
 g.comida=g.comida.filter(c=>!c.comido);g.proxC-=dt;if(g.comida.length<4&&g.proxC<=0){novaComida();g.proxC=1.3;}
 if(g.comeu>=F.meta||g.t>=g.dur||g.vidas<2)terminar();}
function desenha(){const g=S.g;if(!g||!cx)return;
 if(!g.off){g.off=document.createElement('canvas');g.off.width=GC;g.off.height=GR;g.img=g.off.getContext('2d').createImageData(GC,GR);}
 const im=g.img.data;for(let r=0;r<GR;r++)for(let c=0;c<GC;c++){const v=g.d[r*GC+c];const rio=ehRio(c,r),baia=ehBaia(c,r);
  const base=rio?[129,212,250]:baia?[128,222,234]:[178,223,219];const esc=[78,52,46];const o=(r*GC+c)*4;
  for(let i=0;i<3;i++)im[o+i]=Math.round(base[i]+(esc[i]-base[i])*v);im[o+3]=255;}
 g.off.getContext('2d').putImageData(g.img,0,0);cx.imageSmoothingEnabled=true;cx.imageSmoothingQuality='high';cx.drawImage(g.off,0,0,W,H);
 // vegetação alagada
 cx.fillStyle='rgba(85,139,47,.55)';for(const v of g.veg){for(let i=0;i<5;i++){cx.beginPath();cx.ellipse(v.c*cw+cw/2+Math.cos(i*1.3)*cw,v.r*chh+chh/2+Math.sin(i*2.1)*chh,cw*.4,chh*.18,i,0,7);cx.fill();}}
 cx.fillStyle='rgba(1,87,155,.8)';cx.font='bold 12px system-ui';cx.textAlign='left';cx.fillText('rio',6,rioY(0)*chh-chh*1.2);
 if(S.f===2){cx.fillStyle='rgba(0,105,92,.9)';cx.textAlign='center';cx.fillText('baía de água clara',GC*.82*cw,(GR*.42-2.8)*chh);}
 for(const c of g.comida){if(c.tipo==='fruto'){cx.fillStyle='#8e24aa';cx.beginPath();cx.arc(c.x,c.y,4.5,0,7);cx.fill();cx.fillStyle='#43a047';cx.fillRect(c.x-1,c.y-7,2,3);}else{cx.fillStyle='#3e2723';cx.beginPath();cx.ellipse(c.x,c.y,4,2.4,0,0,7);cx.fill();cx.strokeStyle='rgba(255,255,255,.7)';cx.beginPath();cx.ellipse(c.x-2,c.y-3,3,1.5,-.5,0,7);cx.ellipse(c.x+2,c.y-3,3,1.5,.5,0,7);cx.stroke();}}
 // peixe
 cx.save();cx.translate(g.px,g.py);cx.scale(g.olha,1);cx.globalAlpha=g.inv>0&&Math.floor(g.inv*8)%2?.4:1;const k=.75;cx.scale(k,k);
 cx.fillStyle='#e53935';cx.beginPath();cx.moveTo(-22,0);cx.lineTo(-36,-10);cx.lineTo(-32,0);cx.lineTo(-36,10);cx.closePath();cx.fill();
 cx.fillStyle='#b0bec5';cx.beginPath();cx.ellipse(0,0,26,10,0,0,7);cx.fill();cx.fillStyle='#e57373';cx.beginPath();cx.moveTo(-4,-9);cx.lineTo(2,-16);cx.lineTo(6,-8);cx.fill();
 cx.fillStyle='#fff';cx.beginPath();cx.arc(17,-3,2.6,0,7);cx.fill();cx.fillStyle='#111';cx.beginPath();cx.arc(17.6,-3,1.3,0,7);cx.fill();cx.restore();
 if(g.od<3){cx.fillStyle='rgba(255,255,255,.8)';for(let i=0;i<3;i++){cx.beginPath();cx.arc(g.px+8*g.olha,g.py-14-i*7-(performance.now()/60%7),2+i*.6,0,7);cx.fill();}}
 // painel
 cx.fillStyle='rgba(255,255,255,.88)';cx.fillRect(8,H-44,210,36);cx.fillStyle='#17262a';cx.font='bold 12px system-ui';cx.textAlign='left';cx.fillText('Oxigênio aqui: '+g.od.toFixed(1)+' mg/L',14,H-30);
 cx.fillStyle='#ddd';cx.fillRect(14,H-22,190,8);cx.fillStyle=g.fol<30?'#e53935':'#29b6f6';cx.fillRect(14,H-22,1.9*g.fol,8);cx.fillStyle='#17262a';cx.font='10px system-ui';cx.fillText('fôlego',160,H-30);
 if(g.msgT>0){cx.font='bold 14px system-ui';cx.textAlign='center';cx.fillStyle='rgba(255,255,255,.9)';cx.fillRect(0,4,W,24);cx.fillStyle='#00695c';cx.fillText(g.msg,W/2,21);}}
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);desenha();hud();if(S.g&&!S.g.fim)raf=requestAnimationFrame(loop);}
function parar(){if(raf)cancelAnimationFrame(raf);raf=null;}
function terminar(){const g=S.g;if(g.fim)return;g.fim=true;parar();const F=FASES[S.f],ok=g.comeu>=F.meta&&g.vidas>=2;
 const sobra=Math.max(0,Math.ceil(g.dur-g.t));if(ok){S.fp+=30+sobra;beep(880,.2);}hud();
 $('tela').innerHTML=`<div class="card"><h2>${ok?'A piraputanga escapou da decoada':'A decoada venceu desta vez'}</h2>
 <p>Alimentos: <b>${g.comeu}</b> de ${F.meta}. Vidas perdidas: <b>${3-g.vidas}</b> (máximo 1).</p>
 ${ok?`<div class="fb good">🎯 Meta cumprida! +30 e +${sobra} pelo tempo que sobrou.</div>`:'<div class="fb bad">A meta não foi cumprida. Faça idas rápidas ao campo e volte à água clara antes de o fôlego acabar.</div>'}
 <div class="row" style="margin-top:12px">${ok?'<button class="btn" id="bq">Pergunta da fase →</button>':'<button class="btn" id="br">Tentar de novo</button><button class="btn ghost" id="be">Encerrar</button>'}</div></div>`;
 if(ok)$('bq').onclick=pergunta;else{$('br').onclick=fase;$('be').onclick=()=>{S.tot+=Math.max(0,S.fp);S.fp=0;final(false);};}}
function pergunta(){
 const P=PERG[S.f],ops=shuf(P.o.map((t,i)=>({t,c:i===0})));
 $('tela').innerHTML=`<div class="card"><h2>Pergunta da fase</h2><p style="margin:6px 0 4px">${P.q}</p><p class="small">Acerto +20, erro −10.</p><div class="ops">${ops.map((o,i)=>`<button data-i="${i}">${o.t}</button>`).join('')}</div><div id="pf"></div></div>`;
 document.querySelectorAll('#tela .ops button').forEach(b=>b.onclick=()=>{const o=ops[+b.dataset.i];S.fp+=o.c?20:-10;beep(o.c?880:170,.15);hud();
  document.querySelectorAll('#tela .ops button').forEach((x,j)=>{x.disabled=true;if(ops[j].c){x.style.borderColor='#2e7d32';x.style.opacity=1;}});
