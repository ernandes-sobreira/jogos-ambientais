<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Detetive da Água</title>
<style>
:root{--main:#00838f;--deep:#005662;--soft:#e0f7fa;--line:#cde9ec;--ink:#1c2b2d;--mut:#5a6d70;--bad:#c62828;--good:#2e7d32}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:var(--ink);line-height:1.45}
.wrap{max-width:780px;margin:0 auto;padding:12px 14px 40px}
.wrap>*{min-width:0}
a.hub{color:var(--deep);font-weight:700;text-decoration:none;font-size:.9rem}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
h1{font-size:1.4rem;color:var(--deep)}
h2{font-size:1.15rem;color:var(--deep);margin-bottom:6px}
.hud{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--soft);color:var(--deep);border-radius:99px;padding:5px 11px;font-weight:700;font-size:.86rem}
.card{border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;background:#fff}
.btn{background:var(--main);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--deep)}.btn.ghost{background:#fff;color:var(--deep);border:2px solid var(--main)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.small{font-size:.86rem;color:var(--mut)}
.caso{background:var(--soft);border-radius:14px;padding:12px 14px;margin:8px 0}
.rio{position:relative;margin-top:10px;padding-left:22px}
.rio:before{content:'';position:absolute;left:6px;top:4px;bottom:4px;width:8px;border-radius:6px;background:linear-gradient(#81d4fa,#4fc3f7)}
.ponto{border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin:6px 0;background:#fff;cursor:pointer}
.ponto.sel{border-color:var(--main);box-shadow:0 0 0 3px #b2ebf2}
.ponto b{color:var(--deep)}
.meds{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.med{font-size:.8rem;border-radius:8px;padding:3px 8px;font-weight:700}
.med.ok{background:#e8f5e9;color:#1b5e20}.med.ruim{background:#ffebee;color:#b71c1c}
.susp{margin:4px 0 4px 10px;font-size:.92rem;color:var(--ink);background:#fff8e1;border-left:4px solid #ffb300;border-radius:8px;padding:6px 10px}
.kit{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.kit button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px;font-size:.9rem;cursor:pointer;font-family:inherit;text-align:left;color:var(--ink)}
.kit button:hover{border-color:var(--main)}.kit button:disabled{opacity:.4;cursor:default}
.acc{display:grid;gap:8px;margin-top:10px}
.acc button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-size:.95rem;cursor:pointer;font-family:inherit;text-align:left;color:var(--ink)}
.acc button:hover{border-color:#ff8f00}.acc button.errado{border-color:var(--bad);background:#ffebee;text-decoration:line-through}
.fb{margin-top:10px;padding:11px 13px;border-radius:12px;font-size:.93rem;display:none}
.fb.good{display:block;background:#e8f5e9;color:#1b5e20}.fb.bad{display:block;background:#ffebee;color:#8e1b1b}
.big{font-size:2.3rem;font-weight:800;color:var(--deep)}
.qm{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;border:2px solid var(--main);color:var(--deep);background:#fff;font-weight:800;cursor:pointer;font-size:.85rem;margin-left:6px}
.memo{display:none;background:#f1fafb;border-radius:12px;padding:10px 12px;margin-top:8px;font-size:.88rem;color:var(--mut)}.memo.on{display:block}
table.lim{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:6px}table.lim td{border-bottom:1px solid var(--line);padding:4px}
.ranking{border:3px solid var(--main);border-radius:18px;padding:0 16px 12px;overflow:hidden;margin-top:12px}
.ranking h3{font-size:1rem;margin:0 -16px 8px;padding:10px 16px;background:var(--main);color:#fff}
.ranking ol{list-style:none}.ranking li{display:flex;justify-content:space-between;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:.92rem}
.ranking li:last-child{border-bottom:0}.rp{display:inline-block;min-width:2.1em;font-weight:800;color:var(--deep)}
.savebox{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.savebox input{flex:1;min-width:160px;border:2px solid var(--line);border-radius:12px;padding:11px;font-size:1rem;font-family:inherit}
</style>
</head>
<body>
<div class="wrap">
<a class="hub" href="https://ernandes-sobreira.github.io/jogos-ambientais/">← Todos os jogos</a>
<header>
  <h1>🔎 Detetive da Água</h1>
  <div class="hud" id="hud" style="display:none"><span class="pill" id="hF">Caso 1/3</span><span class="pill" id="hP">0 pts</span><span class="pill" id="hK">🧪 0</span></div>
</header>
<main id="tela"></main>
<div class="ranking" id="rankBox"><h3>Ranking Global</h3><ol id="rankList"><li><span>Carregando o ranking...</span></li></ol><p class="small" id="rankNote"></p></div>
</div>
<script>
const $=id=>document.getElementById(id);
const rr=(a,b)=>a+Math.random()*(b-a);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let actx=null;function beep(f,d){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.setValueAtTime(.07,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(e){}}

/* Limites da Resolução CONAMA 357/2005 para águas doces de classe 2.
   Fósforo: limite para ambiente lótico (rio). Os valores medidos no jogo são simulados. */
const PAR={
 od:{n:'Oxigênio dissolvido',u:'mg/L',dec:1,lim:'mínimo 5',ruim:v=>v<5,limpo:[6.2,7.6],sujo:[1.8,3.6]},
 dbo:{n:'DBO (matéria orgânica)',u:'mg/L',dec:1,lim:'máximo 5',ruim:v=>v>5,limpo:[1.5,3.8],sujo:[9,16]},
 col:{n:'Coliformes fecais',u:'por 100 mL',dec:0,lim:'máximo 1.000',ruim:v=>v>1000,limpo:[80,600],sujo:[5000,24000]},
 fos:{n:'Fósforo total',u:'mg/L',dec:2,lim:'máximo 0,10',ruim:v=>v>0.1,limpo:[0.02,0.07],sujo:[0.25,0.7]},
 nit:{n:'Nitrato',u:'mg/L de N',dec:1,lim:'máximo 10',ruim:v=>v>10,limpo:[0.2,1.8],sujo:[12,19]},
 tur:{n:'Turbidez',u:'UNT',dec:0,lim:'máximo 100',ruim:v=>v>100,limpo:[8,45],sujo:[240,650]}
};
/* Cada suspeito altera alguns parâmetros. */
const SUS={
 esgoto:{n:'Esgoto da cidade sem tratamento',ic:'🏙️',afeta:['od','dbo','col','fos'],e:'Esgoto sem tratamento leva matéria orgânica, fezes e fósforo. As bactérias que decompõem essa matéria consomem o oxigênio da água.'},
 lavoura:{n:'Lavoura com adubo na beira do rio',ic:'🌾',afeta:['fos','nit'],e:'Adubo carregado pela chuva leva fósforo e nitrogênio para o rio. O excesso faz as algas crescerem demais.'},
 garimpo:{n:'Garimpo no barranco',ic:'⛏️',afeta:['tur'],e:'O garimpo revolve o barranco e solta muito sedimento, que deixa a água turva e soterra o fundo do rio.'},
 frigorifico:{n:'Frigorífico com despejo irregular',ic:'🏭',afeta:['od','dbo','col'],e:'Sangue e restos de abate são matéria orgânica. A decomposição consome o oxigênio da água e traz bactérias fecais.'},
 mata:{n:'Mata ciliar preservada',ic:'🌳',afeta:[],e:''},
 pesca:{n:'Ponto de pesca esportiva',ic:'🎣',afeta:[],e:''}
};
const CASOS=[
 {nome:'Peixes boiando',ic:'🐟',kits:6,meta:1,pts:4,susp:[['mata',0],['esgoto',1]],culpa:'esgoto',
  txt:'Pescadores encontraram peixes mortos no ponto mais baixo do rio. Eles parecem ter morrido sem ar. Descubra de onde veio o problema.'},
 {nome:'Água verde',ic:'🟢',kits:5,outros:['garimpo'],meta:1,pts:4,susp:[['pesca',0],['lavoura',1],['garimpo',2]],culpa:'lavoura',
  txt:'Depois das chuvas, a água ficou verde, cheia de algas. Mais de um vizinho suja o rio, mas só um está mandando nutrientes demais.'},
 {nome:'Rio barrento',ic:'🟤',kits:5,meta:1,pts:5,outros:['frigorifico','lavoura'],susp:[['mata',0],['frigorifico',1],['garimpo',2],['lavoura',3]],culpa:'garimpo',
  txt:'Na estação seca, o rio ficou barrento de repente e os peixes sumiram do trecho de baixo. Quatro vizinhos são suspeitos e mais de um suja a água. Ache quem deixou o rio barrento.'}
];
const PERG=[
 {q:'Por que o esgoto sem tratamento faz os peixes morrerem sem ar?',o:['Bactérias decompõem a matéria orgânica e consomem o oxigênio','O calor do esgoto aquece a água até expulsar quase todo o ar dela','O fósforo do esgoto entope as brânquias dos peixes']},
 {q:'O que acontece quando sobra fósforo e nitrogênio no rio?',o:['As algas crescem demais','A água fica salgada e os peixes de rio não conseguem mais viver nela','O rio fica mais limpo porque as plantas filtram tudo']},
 {q:'Qual medida mostra o sedimento solto pelo garimpo?',o:['Turbidez','Nitrato da água comparado com o limite','Coliformes fecais']}
];
let S;
function hud(){$('hud').style.display='flex';$('hF').textContent=CASOS[S.f].ic+' Caso '+(S.f+1)+'/3';$('hP').textContent=(S.tot+S.fp)+' pts';$('hK').textContent='🧪 '+S.kits+' kits';}
function memo(id,t){return `<button class="qm" onclick="$('${id}').classList.toggle('on')">?</button><div class="memo" id="${id}">${t}</div>`;}
function fmt(v,d){return v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});}
function inicio(){
 $('hud').style.display='none';$('rankBox').style.display='block';
 $('tela').innerHTML=`<div class="card"><h2>Ache quem está poluindo o rio</h2>
 <p>Em cada caso você tem poucos kits de análise. Escolha um ponto do rio e o que medir. Compare com o limite legal e descubra entre quais pontos a água piorou. O culpado é o vizinho desse trecho.</p>
 <p class="small" style="margin-top:6px">Você só pode acusar depois de 2 medições. Acusar certo vale +50, e cada kit que sobrar vale +10. Acusar errado tira 30. 🎯 Meta: resolver cada caso com no máximo 1 acusação errada.</p>
 <div class="row" style="margin-top:12px"><button class="btn" onclick="novo()">Começar →</button></div></div>`;
}
function novo(){S={f:0,tot:0,fp:0,erros:0};salvo=false;$('rankBox').style.display='none';caso();}
function gera(C){
 /* Ponto i fica abaixo dos suspeitos com posição < i. Vários vizinhos podem poluir, mas só um causa o problema do caso. */
 const fontes=[C.culpa].concat(C.outros||[]).map(n=>({af:SUS[n].afeta,pos:C.susp.find(s=>s[0]===n)[1]}));
 const v=[];for(let i=0;i<C.pts;i++){const o={};for(const k in PAR){const p=PAR[k];
  const f=fontes.filter(f=>f.pos<i&&f.af.includes(k));let x=rr(p.limpo[0],p.limpo[1]);
  if(f.length){x=rr(p.sujo[0],p.sujo[1]);const longe=i-Math.max(...f.map(f=>f.pos))-1;if(longe>0)x=k==='od'?Math.min(x+0.4*longe,4.6):Math.max(x*Math.pow(0.88,longe),p.sujo[0]*0.8);}
  o[k]=x;}v.push(o);}
 return v;
}
function caso(){const C=CASOS[S.f];S.kits=C.kits;S.fp=0;S.ef=0;S.v=gera(C);S.med=Array.from({length:C.pts},()=>({}));S.sel=null;S.acusados=[];S.resolvido=false;hud();desenha();}
function desenha(msg){
 const C=CASOS[S.f];
 let h=`<div class="card"><h2>Caso ${S.f+1}: ${C.nome}</h2><div class="caso">${C.txt}</div>
 <div class="small">O rio corre de cima para baixo. ${memo('mL',`Limites da Resolução CONAMA 357/2005 para rio de classe 2:<table class="lim">${Object.values(PAR).map(p=>`<tr><td>${p.n}</td><td><b>${p.lim}</b> ${p.u}</td></tr>`).join('')}</table><br>Os valores medidos no jogo são simulados para o caso.`)}</div><div class="rio">`;
 for(let i=0;i<C.pts;i++){
  const m=S.med[i];
  h+=`<div class="ponto ${S.sel===i?'sel':''}" data-i="${i}"><b>📍 Ponto ${i+1}</b>${i===0?' <span class="small">(nascente, o mais alto)</span>':''}${i===C.pts-1?' <span class="small">(onde o problema apareceu)</span>':''}
  <div class="meds">${Object.keys(m).map(k=>`<span class="med ${PAR[k].ruim(m[k])?'ruim':'ok'}">${PAR[k].n}: ${fmt(m[k],PAR[k].dec)}</span>`).join('')||'<span class="small">Nada medido ainda. Toque para escolher.</span>'}</div></div>`;
  C.susp.filter(s=>s[1]===i).forEach(s=>{h+=`<div class="susp">${SUS[s[0]].ic} ${SUS[s[0]].n}</div>`;});
 }
 h+='</div>';
 if(S.sel!=null&&!S.resolvido){h+=`<div class="small" style="margin-top:10px"><b>Medir no ponto ${S.sel+1}</b> (gasta 1 kit):</div><div class="kit">${Object.entries(PAR).map(([k,p])=>`<button data-k="${k}" ${S.kits<1||S.med[S.sel][k]!=null?'disabled':''}>${p.n}<br><span class="small">${p.lim}</span></button>`).join('')}</div>`;}
 const usados=CASOS[S.f].kits-S.kits;
 if(!S.resolvido&&usados<2)h+=`<div class="small" style="margin-top:12px">🔒 Para acusar, faça pelo menos 2 medições (faltam ${2-usados}).</div>`;
 if(!S.resolvido&&usados>=2)h+=`<div class="small" style="margin-top:12px"><b>Acusar</b>:</div><div class="acc">${C.susp.map(s=>`<button data-s="${s[0]}" class="${S.acusados.includes(s[0])?'errado':''}" ${S.acusados.includes(s[0])?'disabled':''}>${SUS[s[0]].ic} ${SUS[s[0]].n}</button>`).join('')}</div>`;
 h+=(msg||'')+'</div>';
 $('tela').innerHTML=h;
 document.querySelectorAll('.ponto').forEach(p=>p.onclick=()=>{if(S.resolvido)return;S.sel=+p.dataset.i;desenha();});
 document.querySelectorAll('.kit button').forEach(b=>b.onclick=()=>medir(b.dataset.k));
 document.querySelectorAll('.acc button').forEach(b=>b.onclick=()=>acusar(b.dataset.s));
}
function medir(k){if(S.kits<1)return;S.kits--;S.med[S.sel][k]=S.v[S.sel][k];beep(600,.08);hud();desenha();}
function acusar(s){
 const C=CASOS[S.f];if(S.resolvido||C.kits-S.kits<2)return;
 if(s===C.culpa){S.resolvido=true;const b=50+S.kits*10;S.fp+=b;beep(880,.15);hud();
  const ok=S.ef<=C.meta;
  desenha(`<div class="fb good">✅ Culpado encontrado! +50 e +${S.kits*10} pelos kits que sobraram. ${SUS[s].e}
  <div class="row" style="margin-top:10px">${ok?'<button class="btn" id="bp">Pergunta do caso →</button>':'<button class="btn" id="bp">Refazer o caso</button>'}</div></div>`);
  $('bp').onclick=()=>{if(ok)pergunta();else caso();};
 }else{S.fp-=30;S.ef++;S.erros++;S.acusados.push(s);beep(170,.3);hud();
  const C2=CASOS[S.f],pista=!SUS[s].afeta.length?'Esse vizinho não lança nada no rio.':(C2.outros||[]).includes(s)?'Esse vizinho também suja o rio, mas a marca dele não explica o problema deste caso.':'Os dados não mostram a marca desse vizinho no trecho certo.';
  desenha(`<div class="fb bad">❌ −30. ${pista} ${S.ef>C.meta?'Você passou da meta de erros deste caso.':''}</div>`);}
}
function pergunta(){
 const P=PERG[S.f],ops=shuf(P.o.map((t,i)=>({t,c:i===0})));
 $('tela').innerHTML=`<div class="card"><h2>Pergunta do caso</h2><p style="margin:6px 0 4px">${P.q}</p><p class="small">Acerto +20, erro −10.</p><div class="acc">${ops.map((o,i)=>`<button data-i="${i}">${o.t}</button>`).join('')}</div><div id="pf"></div></div>`;
 document.querySelectorAll('#tela .acc button').forEach(b=>b.onclick=()=>{const o=ops[+b.dataset.i];S.fp+=o.c?20:-10;beep(o.c?880:170,.15);hud();
  document.querySelectorAll('#tela .acc button').forEach((x,j)=>{x.disabled=true;if(ops[j].c)x.style.borderColor='#2e7d32';});
  $('pf').innerHTML=`<div class="fb ${o.c?'good':'bad'}">${o.c?'✅ +20.':'❌ −10. A resposta certa está marcada em verde.'} <div class="row" style="margin-top:10px"><button class="btn" id="bn">${S.f===CASOS.length-1?'Ver resultado →':'Próximo caso →'}</button></div></div>`;
  $('bn').onclick=()=>{S.tot+=S.fp;S.fp=0;if(S.f===CASOS.length-1)final();else{S.f++;caso();}};});
}
function final(){
 $('rankBox').style.display='block';const nivel='Três casos';
 $('tela').innerHTML=`<div class="card" style="text-align:center"><div class="big">🏆</div><h2>Você desvendou os três casos!</h2><div class="big">${S.tot} pts</div><p class="small">${S.erros} acusação(ões) errada(s)</p>
 <div class="savebox"><input id="pName" maxlength="20" placeholder="Seu nome"><button class="btn" id="bS">Salvar no ranking</button></div><p class="small" id="sSt"></p>
 <div class="row" style="justify-content:center;margin-top:12px"><button class="btn ghost" onclick="inicio()">Jogar de novo</button></div>
 <p class="small" style="margin-top:12px;text-align:left">📚 Limites: Resolução CONAMA nº 357, de 17 de março de 2005, águas doces de classe 2. Os casos e os valores medidos são fictícios.</p></div>`;
 $('bS').onclick=()=>salvar(nivel);
}
const firebaseConfig={apiKey:"AIzaSyCbXi3UCVl8oLleBzGb6DqWSxbZmZU2yDQ",authDomain:"jogos-ranking.firebaseapp.com",projectId:"jogos-ranking",storageBucket:"jogos-ranking.firebasestorage.app",messagingSenderId:"958784915420",appId:"1:958784915420:web:4212d3ad278f02d600f119"};
const GAME_ID="detetive-da-agua";let db=null,fs=null,salvo=false;
(async()=>{try{const a=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");const f=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");db=f.getFirestore(a.initializeApp(firebaseConfig));fs=f;carregar();}catch(e){$('rankList').innerHTML='<li><span>Ranking indisponível sem internet.</span></li>';$('rankNote').textContent='O jogo funciona normalmente. O ranking volta quando houver conexão.';}})();
async function carregar(){if(!db)return;try{const q=fs.query(fs.collection(db,'games',GAME_ID,'scores'),fs.orderBy('score','desc'),fs.limit(10));const sn=await fs.getDocs(q);const r=[];sn.forEach(d=>r.push(d.data()));$('rankNote').textContent='Maior pontuação primeiro.';$('rankList').innerHTML=r.length?r.map((x,i)=>`<li><span><span class="rp">${i+1}º</span>${esc(x.name||'?')}</span><span>${(Number(x.score)||0).toLocaleString('pt-BR')} pts · ${esc(x.level||'')}</span></li>`).join(''):'<li><span>Seja o primeiro do ranking!</span></li>';}catch(e){$('rankList').innerHTML='<li><span>Não foi possível carregar o ranking.</span></li>';}}
async function salvar(nivel){if(salvo)return;const nome=$('pName').value.trim(),st=$('sSt');if(!nome){st.textContent='Digite seu nome primeiro.';return;}if(!db){st.textContent='Sem conexão com o ranking. O resultado não foi enviado.';return;}
 $('bS').disabled=true;try{await fs.addDoc(fs.collection(db,'games',GAME_ID,'scores'),{name:nome.slice(0,20),score:Math.max(0,S.tot),level:nivel,ts:fs.serverTimestamp()});salvo=true;st.textContent='Salvo no Ranking Global!';carregar();}catch(e){$('bS').disabled=false;st.textContent='Erro ao salvar. Tente de novo.';}}
window.__dt={get S(){return S},CASOS,acusar};
inicio();
</script>
</body>
</html>
