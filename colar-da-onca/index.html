<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colar da Onça</title>
<style>
:root{--main:#8a5a1e;--deep:#5f3d12;--soft:#f8f1e6;--line:#ecdcc4;--ink:#231b12;--mut:#6b5d4b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:var(--ink);line-height:1.45}
.wrap{max-width:780px;margin:0 auto;padding:12px 14px 40px}
a.hub{color:var(--deep);font-weight:700;text-decoration:none;font-size:.9rem}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
h1{font-size:1.4rem;color:var(--deep)}h2{font-size:1.15rem;color:var(--deep);margin-bottom:6px}
.hud{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--soft);color:var(--deep);border-radius:99px;padding:5px 11px;font-weight:700;font-size:.86rem}
.card{border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;background:#fff}
.btn{background:var(--main);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--deep)}.btn.ghost{background:#fff;color:var(--deep);border:2px solid var(--main)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.small{font-size:.86rem;color:var(--mut)}
canvas{width:100%;max-width:760px;margin:0 auto;display:block;border:2px solid var(--line);border-radius:16px;touch-action:none;background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:6px;justify-content:center;margin-top:10px}
.pad button{border:2px solid var(--line);background:var(--soft);border-radius:12px;font-size:1.4rem;cursor:pointer;color:var(--deep);touch-action:manipulation}
.pad button:active{background:#dcedc8}
.tab{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:8px}.tab td{border-bottom:1px solid var(--line);padding:5px 4px;vertical-align:top}
.ops{display:grid;gap:8px;margin-top:10px}
.ops button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-size:.95rem;cursor:pointer;font-family:inherit;text-align:left;color:var(--ink)}
.ops button:hover{border-color:var(--main)}.ops button:disabled{opacity:.5;cursor:default}
.fb{margin-top:10px;padding:11px 13px;border-radius:12px;font-size:.93rem}
.fb.good{background:#e8f5e9;color:#1b5e20}.fb.bad{background:#ffebee;color:#8e1b1b}
.big{font-size:2.3rem;font-weight:800;color:var(--deep)}
.ranking{border:3px solid var(--main);border-radius:18px;padding:0 16px 12px;overflow:hidden;margin-top:12px}
.ranking h3{font-size:1rem;margin:0 -16px 8px;padding:10px 16px;background:var(--main);color:#fff}
.ranking ol{list-style:none}.ranking li{display:flex;justify-content:space-between;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:.92rem}
.ranking li:last-child{border-bottom:0}.rp{display:inline-block;min-width:2.1em;font-weight:800;color:var(--deep)}
.savebox{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.savebox input{flex:1;min-width:160px;border:2px solid var(--line);border-radius:12px;padding:11px;font-size:1rem;font-family:inherit}
.pill{font-variant-numeric:tabular-nums}.card h2{letter-spacing:-.01em}.tab td:first-child{font-weight:600;white-space:nowrap;color:var(--deep);width:1%}input[type=range]{width:100%;accent-color:var(--main)}.kv{font-variant-numeric:tabular-nums}</style>
</head>
<body>
<div class="wrap">
<a class="hub" href="https://ernandes-sobreira.github.io/jogos-ambientais/">← Todos os jogos</a>

</header>
<main id="tela"></main>

<script>
const $=id=>document.getElementById(id);
const rr=(a,b)=>a+Math.random()*(b-a);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let actx=null;function beep(f,d,v){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.setValueAtTime(v||.05,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(e){}}
/* ---------- biblioteca visual: estilo guia de campo + painel de dados ---------- */
const TINTA='#2b2a26',PAPEL='#fbfaf6',GRADE='rgba(43,42,38,.07)';
function papel(c,w,h,cor){c.fillStyle=cor||PAPEL;c.fillRect(0,0,w,h);c.fillStyle='rgba(120,100,70,.035)';for(let i=0;i<260;i++){const x=(i*397)%w,y=(i*211)%h;c.fillRect(x,y,1.5,1.5);}}
function grade(c,x,y,w,h,p){c.strokeStyle=GRADE;c.lineWidth=1;c.beginPath();for(let i=x;i<=x+w;i+=p){c.moveTo(i,y);c.lineTo(i,y+h);}for(let j=y;j<=y+h;j+=p){c.moveTo(x,j);c.lineTo(x+w,j);}c.stroke();}
function painel(c,x,y,w,h,tit){c.save();c.fillStyle='rgba(255,255,255,.94)';c.strokeStyle='rgba(43,42,38,.35)';c.lineWidth=1;c.beginPath();c.rect(x+.5,y+.5,w,h);c.fill();c.stroke();
 if(tit){c.fillStyle='rgba(43,42,38,.75)';c.font='600 10px system-ui';c.textAlign='left';c.fillText(tit.toUpperCase(),x+8,y+14);c.strokeStyle='rgba(43,42,38,.15)';c.beginPath();c.moveTo(x+8,y+19);c.lineTo(x+w-8,y+19);c.stroke();}c.restore();}
function txt(c,s,x,y,o){o=o||{};c.font=(o.b?'600 ':'')+(o.s||12)+'px system-ui';c.fillStyle=o.c||TINTA;c.textAlign=o.a||'left';c.fillText(s,x,y);}
function barraH(c,x,y,w,h,v,cor){c.fillStyle='rgba(43,42,38,.08)';c.fillRect(x,y,w,h);c.fillStyle=cor;c.fillRect(x,y,w*Math.max(0,Math.min(1,v)),h);}
function aviso(c,W,H,m){if(!m)return;c.font='13px system-ui';const w=Math.min(W-20,c.measureText(m).width+28);c.fillStyle='rgba(255,255,255,.95)';c.strokeStyle='rgba(43,42,38,.3)';c.fillRect(W/2-w/2,H-34,w,24);c.strokeRect(W/2-w/2+.5,H-33.5,w,24);c.fillStyle=TINTA;c.textAlign='center';c.fillText(m,W/2,H-17);}
const fmt=(v,d)=>v.toFixed(d===undefined?1:d).replace('.',',');
/* peixe de perfil, naturalista. esp: curimbata, pacu, tucunare, piraiba, aracu, dourado */
function peixe(c,x,y,L,esp,dir,ond){c.save();c.translate(x,y);c.scale(dir||1,1);const k=L/100,o=Math.sin(ond||0)*3;
 const P={curimbata:{c1:'#9aa3a6',c2:'#d9dcd8',al:22,cau:'#4a4f52'},pacu:{c1:'#5d6266',c2:'#a9a59a',al:40,cau:'#3c3f41'},tucunare:{c1:'#a9a84a',c2:'#e8e2a6',al:26,cau:'#7b7c35'},
  piraiba:{c1:'#6f7579',c2:'#c9cbc6',al:20,cau:'#4b5054'},aracu:{c1:'#a7a28c',c2:'#e6e1cf',al:22,cau:'#6b6650'},dourado:{c1:'#d39a2c',c2:'#f3d88b',al:24,cau:'#b5651d'}}[esp]||{c1:'#999',c2:'#ddd',al:22,cau:'#555'};
 const a=P.al*k;
 c.fillStyle=P.cau;c.beginPath();c.moveTo(-44*k,0);c.lineTo(-62*k,-a*.75+o);c.quadraticCurveTo(-55*k,o,-62*k,a*.75+o);c.closePath();c.fill();
 const g=c.createLinearGradient(0,-a,0,a);g.addColorStop(0,P.c1);g.addColorStop(.55,P.c2);g.addColorStop(1,'#f1f0ea');c.fillStyle=g;
 c.beginPath();c.moveTo(48*k,0);c.bezierCurveTo(40*k,-a*1.05,-20*k,-a*1.1,-46*k,-a*.25);c.lineTo(-46*k,a*.25);c.bezierCurveTo(-20*k,a*1.05,40*k,a*.9,48*k,0);c.fill();
 c.fillStyle=P.cau;c.globalAlpha=.8;c.beginPath();c.moveTo(-2*k,-a*.95);c.quadraticCurveTo(-14*k,-a*1.6,-24*k,-a*.9);c.fill();c.beginPath();c.moveTo(-16*k,a*.85);c.quadraticCurveTo(-24*k,a*1.3,-30*k,a*.75);c.fill();c.globalAlpha=1;
 c.strokeStyle='rgba(40,40,40,.25)';c.lineWidth=Math.max(.6,k);c.beginPath();c.moveTo(30*k,-a*.1);c.quadraticCurveTo(-5*k,-a*.25,-44*k,0);c.stroke();
 c.beginPath();c.moveTo(30*k,-a*.7);c.quadraticCurveTo(34*k,0,30*k,a*.6);c.stroke();
 if(esp==='tucunare'){c.fillStyle='rgba(40,45,20,.45)';for(const bx of [16,-4,-24]){c.fillRect(bx*k,-a*.9,5*k,a*1.3);}c.fillStyle='#2b2a1a';c.beginPath();c.arc(-48*k,-a*.05,4.5*k,0,7);c.fill();c.strokeStyle='#e0a33a';c.lineWidth=1.5*k;c.stroke();}
 if(esp==='aracu'){c.fillStyle='rgba(40,40,30,.5)';for(const bx of [10,-8,-26])c.beginPath(),c.arc(bx*k,-a*.15,3*k,0,7),c.fill();}
 if(esp==='piraiba'){c.strokeStyle='#3f4447';c.lineWidth=1.2*k;c.beginPath();c.moveTo(46*k,a*.1);c.quadraticCurveTo(60*k,a*.6,70*k,a*.4);c.moveTo(44*k,a*.25);c.quadraticCurveTo(54*k,a*.8,62*k,a*.9);c.stroke();}
 if(esp==='curimbata'){c.fillStyle='rgba(40,40,40,.18)';for(let i=0;i<4;i++){c.fillRect((-30+i*14)*k,-a*.55,1.2*k,a*1.1);}}
 c.fillStyle='#f4f1e6';c.beginPath();c.arc(36*k,-a*.25,4*k,0,7);c.fill();c.fillStyle='#1b1b1b';c.beginPath();c.arc(36.8*k,-a*.25,2.3*k,0,7);c.fill();
 c.restore();}
/* morcego em voo, vista frontal levemente de cima */
function morcego(c,x,y,s,bat,cor){c.save();c.translate(x,y);c.scale(s,s);const a=Math.sin(bat);cor=cor||'#4a3f38';
 c.fillStyle=cor;
 for(const sd of [-1,1]){c.save();c.scale(sd,1);c.beginPath();c.moveTo(4,-2);c.lineTo(18,-10-a*10);c.lineTo(34,-6-a*16);c.lineTo(44,2-a*14);
  c.quadraticCurveTo(36,4-a*6,32,10-a*8);c.quadraticCurveTo(26,6-a*3,20,12-a*4);c.quadraticCurveTo(14,6,6,8);c.closePath();c.globalAlpha=.88;c.fill();c.globalAlpha=1;
  c.strokeStyle='rgba(20,15,12,.6)';c.lineWidth=.8;c.beginPath();c.moveTo(18,-10-a*10);c.lineTo(32,10-a*8);c.moveTo(18,-10-a*10);c.lineTo(20,12-a*4);c.moveTo(34,-6-a*16);c.lineTo(32,10-a*8);c.stroke();c.restore();}
 c.beginPath();c.ellipse(0,2,6,9,0,0,7);c.fill();c.beginPath();c.arc(0,-8,5,0,7);c.fill();
 c.beginPath();c.moveTo(-4,-11);c.lineTo(-6,-18);c.lineTo(-1,-12);c.moveTo(4,-11);c.lineTo(6,-18);c.lineTo(1,-12);c.fill();
 c.fillStyle='#d8cfc6';c.beginPath();c.arc(-2,-8.5,.9,0,7);c.arc(2,-8.5,.9,0,7);c.fill();c.restore();}
/* mariposa vista de cima */
function mariposa(c,x,y,s,f){c.save();c.translate(x,y);c.scale(s,s);const a=.6+Math.abs(Math.sin(f))*.4;c.fillStyle='#a08c6c';
 for(const sd of [-1,1]){c.beginPath();c.ellipse(sd*7*a,-2,8*a,5,sd*.5,0,7);c.fill();c.beginPath();c.ellipse(sd*5*a,5,5*a,3.5,-sd*.4,0,7);c.fill();}
 c.fillStyle='#5d4c39';c.beginPath();c.ellipse(0,0,2,7,0,0,7);c.fill();c.strokeStyle='#5d4c39';c.lineWidth=.8;c.beginPath();c.moveTo(-1,-6);c.lineTo(-4,-11);c.moveTo(1,-6);c.lineTo(4,-11);c.stroke();c.restore();}
/* urubu-de-cabeça-preta planando, vista de baixo */
function urubu(c,x,y,s,ang){c.save();c.translate(x,y);c.rotate(ang||0);c.scale(s,s);c.fillStyle='#1f1d1b';
 c.beginPath();c.moveTo(0,-6);for(const sd of [1,-1]){}c.moveTo(-6,-2);c.quadraticCurveTo(-30,-10,-58,-4);
 for(let i=0;i<5;i++){c.lineTo(-64-i*.5,-1+i*2.2);c.lineTo(-58+i,0+i*2.4);}c.quadraticCurveTo(-30,8,-6,6);c.closePath();c.fill();
 c.beginPath();c.moveTo(6,-2);c.quadraticCurveTo(30,-10,58,-4);for(let i=0;i<5;i++){c.lineTo(64+i*.5,-1+i*2.2);c.lineTo(58-i,0+i*2.4);}c.quadraticCurveTo(30,8,6,6);c.closePath();c.fill();
 c.fillStyle='#d9d4c9';c.globalAlpha=.85;c.beginPath();c.ellipse(-50,0,7,4,0,0,7);c.ellipse(50,0,7,4,0,0,7);c.fill();c.globalAlpha=1;
 c.fillStyle='#1f1d1b';c.beginPath();c.ellipse(0,1,7,12,0,0,7);c.fill();c.beginPath();c.moveTo(-6,10);c.lineTo(0,20);c.lineTo(6,10);c.fill();
 c.fillStyle='#3b3936';c.beginPath();c.arc(0,-11,4,0,7);c.fill();c.restore();}
/* onça-pintada em silhueta lateral pequena */
function oncaSil(c,x,y,s,dir){c.save();c.translate(x,y);c.scale(s*(dir||1),s);c.fillStyle='#c9963f';c.beginPath();c.moveTo(-30,0);c.quadraticCurveTo(-28,-14,-6,-14);c.quadraticCurveTo(14,-16,24,-12);c.quadraticCurveTo(34,-14,36,-6);c.quadraticCurveTo(34,2,26,0);
 c.lineTo(24,14);c.lineTo(20,14);c.lineTo(18,2);c.lineTo(-18,4);c.lineTo(-20,14);c.lineTo(-24,14);c.lineTo(-26,2);c.quadraticCurveTo(-36,0,-46,-6);c.lineTo(-44,-9);c.quadraticCurveTo(-36,-4,-30,0);c.fill();
 c.fillStyle='rgba(40,25,10,.7)';for(let i=0;i<9;i++){c.beginPath();c.arc(-22+i*5.5,-8+(i%2)*4,1.6,0,7);c.fill();}c.restore();}
/* lobo-guará lateral */
function loboSil(c,x,y,s,dir,p){c.save();c.translate(x,y);c.scale(s*(dir||1),s);const w=Math.sin(p||0)*4;c.strokeStyle='#1d1a17';c.lineWidth=3;c.lineCap='round';
 c.beginPath();c.moveTo(14,0);c.lineTo(16+w,22);c.moveTo(10,0);c.lineTo(8-w,22);c.moveTo(-14,0);c.lineTo(-12+w,22);c.moveTo(-18,0);c.lineTo(-20-w,22);c.stroke();
 c.fillStyle='#c0662b';c.beginPath();c.ellipse(-2,-4,22,9,0,0,7);c.fill();c.beginPath();c.moveTo(14,-8);c.quadraticCurveTo(22,-22,28,-20);c.lineTo(36,-16);c.lineTo(28,-12);c.quadraticCurveTo(22,-6,16,-2);c.fill();
 c.fillStyle='#1d1a17';c.beginPath();c.moveTo(14,-10);c.quadraticCurveTo(10,-18,4,-12);c.lineTo(12,-6);c.fill();c.beginPath();c.moveTo(24,-20);c.lineTo(22,-30);c.lineTo(28,-21);c.fill();
 c.fillStyle='#eee5d6';c.beginPath();c.moveTo(-24,-6);c.quadraticCurveTo(-34,-2,-36,6);c.quadraticCurveTo(-30,0,-24,0);c.fill();c.restore();}
/* Matemática e geografia: o Mínimo Polígono Convexo (MPC) é o menor polígono convexo que contém uma porcentagem dos pontos (Int J Geogr Inf Sci, 2018).
   Colares GPS de onças registram posições a cada quatro horas (Revista Pesquisa FAPESP). Os pontos de cada onça são simulados pelo jogo. */
const FASES=[
 {nome:'Os extremos do polígono',n:3,meta:2,tipo:'hull',pts:18,txt:'O colar registrou a posição da onça a cada 4 horas. Toque nos pontos que formam a borda do Mínimo Polígono Convexo: os pontos mais externos, que um elástico tocaria se envolvesse todos.'},
 {nome:'Medir a área',n:3,meta:2,tipo:'area',pts:30,txt:'O polígono já está desenhado. Cada quadrado da grade tem 1 km por 1 km. Conte os quadrados inteiros, junte os pedaços e estime a área em km². Erro de até 15% vale ponto.'},
 {nome:'A excursão',n:3,meta:2,tipo:'out',pts:34,txt:'Esta onça fez uma excursão rara para longe da sua área de uso. Toque nos pontos da excursão. Tirar esses pontos (MPC 95%) mostra como o MPC 100% pode exagerar a área.'}
];
const PERG=[
 {q:'O que é o Mínimo Polígono Convexo de uma onça monitorada?',o:['O menor polígono convexo que envolve as localizações registradas','O círculo cujo centro é a toca e o raio é a maior distância','A soma das distâncias percorridas pela onça em um ano']},
 {q:'Uma área desenhada numa grade ocupa 34 quadrados inteiros e 12 metades. Se cada quadrado tem 1 km², qual é a área aproximada?',o:['40 km²','46 km²','34 km²']},
 {q:'Por que o MPC com 100% dos pontos é criticado?',o:['Pode incluir grandes áreas que o animal não usa','Sempre subestima a área usada pelo animal','Só pode ser calculado com menos de 10 pontos']}
];
let S,cv,cx,raf=null,last=0,W=760,H=480;
function hud(){$('hud').style.display='flex';$('hF').textContent='Fase '+(S.f+1)+' de 3';$('hP').textContent=(S.tot+S.fp)+' pontos';
 if(S.g){$('hR').textContent='Onça '+Math.min(S.g.i+1,FASES[S.f].n)+'/'+FASES[S.f].n;$('hV').textContent='Acertos '+S.g.ok+'/'+FASES[S.f].meta;$('hT').textContent='Escala 1 quadrado = 1 km²';}}
function inicio(){parar();$('hud').style.display='none';$('rankBox').style.display='block';
 $('tela').innerHTML=`<div class="card"><h2>Área de vida pelo colar GPS</h2>
 <p>Pesquisadores colocam colares com GPS em onças-pintadas do Pantanal. Cada ponto é uma posição registrada. Com esses pontos se estima a área de vida do animal.</p>
 <table class="tab"><tr><td>Fase 1</td><td>Encontrar os pontos da borda do Mínimo Polígono Convexo.</td></tr><tr><td>Fase 2</td><td>Medir a área do polígono contando quadrados de 1 km².</td></tr><tr><td>Fase 3</td><td>Reconhecer uma excursão e ver como ela infla a área.</td></tr></table>
 <p class="small" style="margin-top:8px">Os pontos e a paisagem são simulados pelo jogo. O método é o usado em estudos de área de vida.</p>
 <div class="row" style="margin-top:12px"><button class="btn" onclick="novo()">Começar</button></div></div>`;}
function novo(){S={f:0,tot:0,fp:0};salvo=false;$('rankBox').style.display='none';fase();}
function fase(){const F=FASES[S.f];S.fp=0;S.g=null;hud();
 $('tela').innerHTML=`<div class="card"><h2>Fase ${S.f+1}: ${F.nome}</h2><p>${F.txt}</p><p class="small" style="margin-top:6px">Meta: acertar ${F.meta} de ${F.n} onças.</p><div class="row" style="margin-top:12px"><button class="btn" id="bg">Abrir o mapa</button></div></div>`;$('bg').onclick=jogar;}
const CEL=()=>W<520?26:32;
function hull(P){const p=P.slice().sort((a,b)=>a.x-b.x||a.y-b.y);const cr=(o,a,b)=>(a.x-o.x)*(b.y-o.y)-(a.y-o.y)*(b.x-o.x);const lo=[],up=[];
 for(const q of p){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],q)<=0)lo.pop();lo.push(q);}for(const q of p.slice().reverse()){while(up.length>=2&&cr(up[up.length-2],up[up.length-1],q)<=0)up.pop();up.push(q);}
 return lo.slice(0,-1).concat(up.slice(0,-1));}
function areaPx(h){let a=0;for(let i=0;i<h.length;i++){const p=h[i],q=h[(i+1)%h.length];a+=p.x*q.y-q.x*p.y;}return Math.abs(a)/2;}
function jogar(){$('tela').innerHTML=`<div class="card"><canvas id="cv"></canvas><div id="ctl" style="margin-top:10px"></div></div>`;
 cv=$('cv');if(cv.clientWidth<520){W=440;H=500;}else{W=760;H=480;}cv.width=W;cv.height=H;cx=cv.getContext('2d');
 cv.onpointerdown=e=>{const r=cv.getBoundingClientRect();toque((e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height);};

function novaOnca(){const g=S.g,F=FASES[S.f];g.sel=new Set();g.anim=0;g.res=null;g.mapa=mapa();
 const cxn=rr(W*.38,W*.6),cyn=rr(H*.4,H*.6),rx=rr(160,220)*(W<520?.55:1),ry=rr(110,150)*(W<520?.9:1);const pts=[];let u=0,v=0;
 for(let k=0;k<F.pts;k++){u+=rr(-.45,.45);v+=rr(-.45,.45);const d=Math.hypot(u,v);if(d>1){u/=d*1.15;v/=d*1.15;}pts.push({x:cxn+u*rx,y:cyn+v*ry,ex:0});}

function mapa(){const m={rios:[],matas:[],baias:[]};for(let i=0;i<2;i++){const y0=rr(H*.1,H*.9);m.rios.push([[-10,y0],[W*.3,y0+rr(-80,80)],[W*.7,y0+rr(-80,80)],[W+10,y0+rr(-60,60)]]);}

function ctl(){const g=S.g,F=FASES[S.f],c=$('ctl');if(!c)return;

 else if(F.tipo==='area')c.innerHTML=`<div class="savebox"><input id="ai" type="number" inputmode="decimal" placeholder="Área em km²"><button class="btn" id="bc">Conferir área</button></div>`;

function conferir(){const g=S.g,F=FASES[S.f];let ok=false;
 if(F.tipo==='hull'){const certos=new Set(g.h.map(p=>g.pts.indexOf(p)));let tp=0;for(const i of g.sel)if(certos.has(i))tp++;const fp=g.sel.size-tp,fn=certos.size-tp;
  ok=fn===0&&fp<=1;S.fp+=tp*3-fp*2-fn*2;g.res={txt:`Borda correta: ${certos.size} pontos. Você acertou ${tp}, marcou ${fp} internos e esqueceu ${fn}.`};}
 else if(F.tipo==='area'){const real=areaPx(g.h)/(g.cel*g.cel),v=+String($('ai').value).replace(',','.');if(!v){msg('Digite a área.');return;}const err=Math.abs(v-real)/real;ok=err<=.15;S.fp+=ok?20:-5;

 else{const certos=new Set(g.pts.map((p,i)=>p.ex?i:-1).filter(i=>i>=0));let tp=0;for(const i of g.sel)if(certos.has(i))tp++;const fp=g.sel.size-tp;ok=tp>=2&&fp===0;S.fp+=tp*5-fp*4;

 const n=Math.floor(g.anim);cx.strokeStyle='rgba(122,46,31,.35)';cx.lineWidth=1;cx.beginPath();for(let i=0;i<n;i++){const p=g.pts[i];i?cx.lineTo(p.x,p.y):cx.moveTo(p.x,p.y);}cx.stroke();
