<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninho de Jacaré</title>
<style>
:root{--main:#5d7a1f;--deep:#3e5414;--soft:#f3f7e6;--line:#dfe8c4;--ink:#222a14;--mut:#5c6648}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:var(--ink);line-height:1.45}
.wrap{max-width:780px;margin:0 auto;padding:12px 14px 40px}
a.hub{color:var(--deep);font-weight:700;text-decoration:none;font-size:.9rem}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
h1{font-size:1.4rem;color:var(--deep)}h2{font-size:1.15rem;color:var(--deep);margin-bottom:6px}
.hud{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--soft);color:var(--deep);border-radius:99px;padding:5px 11px;font-weight:700;font-size:.86rem}
.card{border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;background:#fff}
.btn{background:var(--main);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--deep)}.btn.ghost{background:#fff;color:var(--deep);border:2px solid var(--main)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.small{font-size:.86rem;color:var(--mut)}
canvas{width:100%;max-width:760px;margin:0 auto;display:block;border:2px solid var(--line);border-radius:16px;touch-action:none;background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:6px;justify-content:center;margin-top:10px}
.pad button{border:2px solid var(--line);background:var(--soft);border-radius:12px;font-size:1.4rem;cursor:pointer;color:var(--deep);touch-action:manipulation}
.pad button:active{background:#dcedc8}
.tab{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:8px}.tab td{border-bottom:1px solid var(--line);padding:5px 4px;vertical-align:top}
.ops{display:grid;gap:8px;margin-top:10px}
.ops button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-size:.95rem;cursor:pointer;font-family:inherit;text-align:left;color:var(--ink)}
.ops button:hover{border-color:var(--main)}.ops button:disabled{opacity:.5;cursor:default}
.fb{margin-top:10px;padding:11px 13px;border-radius:12px;font-size:.93rem}
.fb.good{background:#e8f5e9;color:#1b5e20}.fb.bad{background:#ffebee;color:#8e1b1b}
.big{font-size:2.3rem;font-weight:800;color:var(--deep)}
.ranking{border:3px solid var(--main);border-radius:18px;padding:0 16px 12px;overflow:hidden;margin-top:12px}
.ranking h3{font-size:1rem;margin:0 -16px 8px;padding:10px 16px;background:var(--main);color:#fff}
.ranking ol{list-style:none}.ranking li{display:flex;justify-content:space-between;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:.92rem}
.ranking li:last-child{border-bottom:0}.rp{display:inline-block;min-width:2.1em;font-weight:800;color:var(--deep)}
.savebox{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.savebox input{flex:1;min-width:160px;border:2px solid var(--line);border-radius:12px;padding:11px;font-size:1rem;font-family:inherit}
</style>
</head>
<body>
<div class="wrap">
<a class="hub" href="https://ernandes-sobreira.github.io/jogos-ambientais/">← Todos os jogos</a>
<header>
  <h1>🥚 Ninho de Jacaré</h1>
  <div class="hud" id="hud" style="display:none"><span class="pill" id="hF">Fase 1/3</span><span class="pill" id="hP">0 pts</span><span class="pill" id="hR">🥚 30</span><span class="pill" id="hV">⚡ 100%</span><span class="pill" id="hT">📅 dia 0</span></div>
</header>
<main id="tela"></main>
<div class="ranking" id="rankBox"><h3>Ranking Global</h3><ol id="rankList"><li><span>Carregando o ranking...</span></li></ol><p class="small" id="rankNote"></p></div>
</div>
<script>
const $=id=>document.getElementById(id);
const rr=(a,b)=>a+Math.random()*(b-a);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let actx=null;function beep(f,d,v){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.setValueAtTime(v||.05,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(e){}}

/* No jogo, 1 segundo vale 1 dia de incubação. O limite de 31,5 °C e o período de definição do sexo
   seguem a Embrapa Pantanal; a temperatura de cada dia, a fome e o calor da fêmea são regras do jogo. */
const DIAS=70,DEFINE=40,LIMITE=31.5,OVOS=30;
const PRED={
 teiu:{n:'Teiú',cor:'#546e7a',v:60,come:2},
 quati:{n:'Quati',cor:'#a1887f',v:70,come:2},
 lobinho:{n:'Lobinho',cor:'#8d6e63',v:84,come:3},
 porco:{n:'Porco-monteiro',cor:'#5d4037',v:48,come:5}
};
const LOCAIS={
 mata:{n:'Mata',base:30.8,amp:.9,pred:2.0,cheia:0,sombra:.55,txt:'Na mata, a temperatura do ninho varia pouco e a sombra deixa a fêmea esquentar devagar. Os predadores aparecem mais e a água fica longe.'},
 flutuante:{n:'Vegetação flutuante',base:31.6,amp:2.2,pred:1.4,cheia:.6,sombra:1,txt:'Na vegetação flutuante, o ninho esquenta e esfria mais. A água fica perto e há menos predadores, mas a água pode subir.'}
};
const FASES=[
 {nome:'Ninho na mata',local:'mata',meta:21,txt:'A fêmea fez o ninho de folhas e gravetos na mata e fica de guarda. Mas ela também precisa ir à água comer e se refrescar. Escolha a hora certa de sair.'},
 {nome:'Ninho na vegetação flutuante',local:'flutuante',meta:21,txt:'Agora o ninho está sobre a vegetação flutuante, perto da água. Repare como a temperatura muda e o que isso faz com os filhotes.'},
 {nome:'Você escolhe o lugar',local:null,meta:19,txt:'Escolha onde construir o ninho. Cada lugar tem vantagens e riscos.'}
];
const PERG=[
 {q:'O que decide se um filhote de jacaré-do-pantanal vai ser macho ou fêmea?',o:['A temperatura em que o ovo foi incubado','O tamanho da mãe na hora da postura','A quantidade de chuva no dia da eclosão']},
 {q:'O que os filhotes de jacaré fazem quando estão prontos para sair do ovo?',o:['Emitem sons parecidos com piados para avisar a mãe','Ficam em silêncio para não atrair predadores','Quebram o ninho e correm sozinhos para longe da água']},
 {q:'Quais são as principais causas de morte dos ovos de jacaré no Pantanal, segundo a Embrapa?',o:['Inundação e predação dos ninhos','Frio intenso e falta de chuva','Pisoteio do gado e chuva de granizo']}
];
let S,cv,cx,raf=null,last=0,W=760,H=480,inp={x:null,y:null},tec={};
const VERT=()=>W<520;
function noAgua(x,y){return VERT()?y>H*.72+Math.sin(x*.03)*8:x<W*.27+Math.sin(y*.03)*8;}
function ninhoPos(){const L=S.local;if(VERT())return L==='mata'?[W*.55,H*.24]:[W*.5,H*.6];return L==='mata'?[W*.64,H*.46]:[W*.42,H*.5];}
const NX=()=>S.g.nx,NY=()=>S.g.ny;
function hud(){$('hud').style.display='flex';$('hF').textContent='Fase '+(S.f+1)+'/3';$('hP').textContent=(S.tot+S.fp)+' pts';
 if(S.g){$('hR').textContent='🥚 '+S.g.ovos;$('hV').textContent='⚡ '+Math.round(S.g.en)+'%';$('hT').textContent='📅 dia '+Math.min(DIAS,Math.floor(S.g.t));}}
function inicio(){
 parar();$('hud').style.display='none';$('rankBox').style.display='block';
 $('tela').innerHTML=`<div class="card"><h2>Proteja o ninho do jacaré-do-pantanal</h2>
 <table class="tab"><tr><td>🐊</td><td>Você é a fêmea do jacaré. Toque ou arraste no campo para ela ir até lá. No teclado, use as setas. Chegar perto de um predador espanta o bicho: +5.</td></tr>
 <tr><td>⚡</td><td>Ficar parada no ninho gasta energia. Ela precisa ir à água pegar peixes e insetos aquáticos. Com pouca energia, fica lenta, e sem energia não consegue espantar ninguém.</td></tr>
 <tr><td>☀️</td><td>O jacaré não produz o próprio calor. No sol o corpo esquenta, e na água ele se refresca. Muito quente, ela fica lenta e sem forças para espantar.</td></tr>
 <tr><td>🌿</td><td>Os predadores chegam em ondas. Na calmaria entre uma onda e outra, aproveite para ir à água.</td></tr>
 <tr><td>🌡️</td><td>Nos primeiros ${DEFINE} dias, a temperatura do ninho define o sexo dos filhotes. Acima de ${LIMITE} °C nascem principalmente machos. Abaixo, fêmeas.</td></tr>
 <tr><td>🐣</td><td>No dia ${DIAS} os filhotes piam dentro dos ovos. Vá até o ninho para abrir e leve os filhotes até a água.</td></tr></table>
 <p class="small" style="margin-top:8px">Cada segundo é um dia. Filhote que chega à eclosão +5. Abrir o ninho +20. Levar os filhotes à água +20. 🎯 Meta: chegar à eclosão com a quantidade de ovos da fase.</p>
 <div class="row" style="margin-top:12px"><button class="btn" onclick="novo()">Começar →</button></div></div>`;
}
function novo(){S={f:0,tot:0,fp:0};salvo=false;$('rankBox').style.display='none';fase();}
function fase(){const F=FASES[S.f];S.fp=0;S.g=null;hud();
 if(!F.local){$('tela').innerHTML=`<div class="card"><h2>Fase 3: ${F.nome}</h2><p>${F.txt}</p>
  <div class="ops"><button data-l="mata"><b>🌳 Mata</b><br><span class="small">${LOCAIS.mata.txt}</span></button><button data-l="flutuante"><b>🌿 Vegetação flutuante</b><br><span class="small">${LOCAIS.flutuante.txt}</span></button></div>
  <p class="small" style="margin-top:8px">🎯 Meta: chegar à eclosão com pelo menos ${F.meta} ovos.</p></div>`;
  document.querySelectorAll('.ops button').forEach(b=>b.onclick=()=>{S.local=b.dataset.l;jogar();});return;}
 S.local=F.local;
 $('tela').innerHTML=`<div class="card"><h2>Fase ${S.f+1}: ${F.nome}</h2><p>${F.txt}</p><p class="small" style="margin-top:6px">${LOCAIS[F.local].txt} 🎯 Meta: chegar à eclosão com pelo menos ${F.meta} ovos.</p><div class="row" style="margin-top:12px"><button class="btn" id="bg">Começar a incubação →</button></div></div>`;
 $('bg').onclick=jogar;}
function jogar(){const L=LOCAIS[S.local];
 $('tela').innerHTML=`<div class="card"><canvas id="cv"></canvas><p class="small" style="margin-top:8px;text-align:center">Toque ou arraste para guiar a fêmea. Setas do teclado também funcionam.</p></div>`;
 cv=$('cv');if(cv.clientWidth<520){W=440;H=600;}else{W=760;H=480;}cv.width=W;cv.height=H;cx=cv.getContext('2d');
 S.g={t:0,ovos:OVOS,mx:0,my:0,vx:0,vy:0,ang:0,passo:0,en:100,cal:20,preds:[],comida:[],prox:3,temps:[],quente:0,dias:0,cheia:null,fim:false,msg:'',msgT:0,espantados:0,temp:L.base,chuva:0,estado:'inc',tEst:0,filhotes:[],abriu:false,levou:false,rast:[]};
 const [nx,ny]=ninhoPos();S.g.nx=nx;S.g.ny=ny;S.g.mx=nx+(VERT()?0:-50);S.g.my=ny+(VERT()?50:0);S.g.ang=VERT()?Math.PI/2:Math.PI;inp.x=null;inp.y=null;
 for(let i=0;i<6;i++)S.g.comida.push(novaComida());
 const pos=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height];};
 cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);[inp.x,inp.y]=pos(e);e.preventDefault();};
 cv.onpointermove=e=>{if(e.buttons)[inp.x,inp.y]=pos(e);};
 hud();last=performance.now();parar();raf=requestAnimationFrame(loop);}
document.addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')){tec[e.key]=1;if(S&&S.g&&!S.g.fim)e.preventDefault();}});
document.addEventListener('keyup',e=>{tec[e.key]=0;});
function msg(t){S.g.msg=t;S.g.msgT=2.4;}
function novaComida(){let x,y,k=0;do{x=rr(10,W-10);y=rr(10,H-10);k++;}while(!noAgua(x,y)||(k<50&&(VERT()?y>H-14:x<14)));
 const peixe=Math.random()<.55,a=rr(0,7);return {x,y,peixe,vx:Math.cos(a)*(peixe?40:8),vy:Math.sin(a)*(peixe?40:8),f:rr(0,6)};}
function spawn(){const g=S.g;const tipos=Object.keys(PRED);const k=tipos[Math.floor(Math.random()*tipos.length)];let x,y;
 if(VERT()){const l=Math.floor(Math.random()*3);x=l===0?-20:l===1?W+20:rr(0,W);y=l===2?-20:rr(0,H*.6);}
 else{const l=Math.floor(Math.random()*3);x=l===0?W+20:rr(W*.35,W);y=l===1?-20:l===2?H+20:rr(0,H);}
 g.preds.push({k,x,y,foge:0,f:rr(0,6)});}
function cabeca(){const g=S.g;return [g.mx+Math.cos(g.ang)*24,g.my+Math.sin(g.ang)*24];}
function update(dt){const g=S.g;if(!g||g.fim)return;const L=LOCAIS[S.local];
 const dia0=Math.floor(g.t);if(g.estado==='inc')g.t+=dt;g.msgT-=dt;
 // temperatura do ninho
 if(Math.random()<dt*.08)g.chuva=rr(2,5);g.chuva-=dt;
 const alvo=L.base+L.amp*Math.sin(g.t*1.3)+(g.chuva>0?-L.amp*1.2:0);g.temp+=(alvo-g.temp)*Math.min(1,dt*1.5);
 if(Math.floor(g.t)>dia0&&g.t<=DEFINE){g.dias++;if(g.temp>LIMITE)g.quente++;g.temps.push(g.temp);}
 // movimento da fêmea
 const agua=noAgua(g.mx,g.my);let dx=0,dy=0;
 const kx=(tec.ArrowRight?1:0)-(tec.ArrowLeft?1:0),ky=(tec.ArrowDown?1:0)-(tec.ArrowUp?1:0);
 if(kx||ky){dx=kx;dy=ky;inp.x=null;}else if(inp.x!=null){dx=inp.x-g.mx;dy=inp.y-g.my;const d=Math.hypot(dx,dy);if(d<6){dx=0;dy=0;inp.x=null;}}
 let vmax=agua?175:150;if(g.en<30)vmax*=.6;if(g.en<=0)vmax*=.55;if(g.cal>=100)vmax*=.45;
 const d=Math.hypot(dx,dy);let tvx=0,tvy=0;if(d>0){const fre=inp.x!=null&&!(kx||ky)?Math.min(1,d/50):1;tvx=dx/d*vmax*fre;tvy=dy/d*vmax*fre;}
 const ac=Math.min(1,dt*7);g.vx+=(tvx-g.vx)*ac;g.vy+=(tvy-g.vy)*ac;
 g.mx=Math.max(12,Math.min(W-12,g.mx+g.vx*dt));g.my=Math.max(12,Math.min(H-12,g.my+g.vy*dt));
 const sp=Math.hypot(g.vx,g.vy);if(sp>8){const alvoA=Math.atan2(g.vy,g.vx);let da=alvoA-g.ang;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;g.ang+=da*Math.min(1,dt*8);}
 g.passo+=sp*dt*.09;
 // fome e calor
 g.en=Math.max(0,g.en-dt*(1.1+.7*sp/175));
 const sol=.75+.25*Math.sin(g.t*.35);
 if(agua)g.cal=Math.max(0,g.cal-dt*22);else g.cal=Math.min(100,g.cal+dt*3.4*sol*L.sombra);
 if(g.cal>=100&&g.msgT<=0)msg('☀️ A fêmea esquentou demais e ficou lenta. Leve ela até a água.');
 else if(g.en<=0&&g.msgT<=0)msg('⚡ Sem energia, ela mal anda. Vá à água comer.');
 // comida na água
 const [hx,hy]=cabeca();
 for(const c of g.comida){c.f+=dt*8;if(Math.random()<dt*.8){const a=rr(0,7),v=c.peixe?40:8;c.vx=Math.cos(a)*v;c.vy=Math.sin(a)*v;}
  const nx=c.x+c.vx*dt,ny=c.y+c.vy*dt;if(noAgua(nx,ny)&&nx>6&&nx<W-6&&ny>6&&ny<H-6){c.x=nx;c.y=ny;}else{c.vx=-c.vx;c.vy=-c.vy;}
  if(Math.hypot(c.x-hx,c.y-hy)<20){c.comido=1;g.en=Math.min(100,g.en+(c.peixe?22:9));beep(c.peixe?760:980,.06);}}
 g.comida=g.comida.filter(c=>!c.comido);while(g.comida.length<6&&Math.random()<dt*1.2)g.comida.push(novaComida());
 // predadores
 if(g.estado==='inc'&&(g.t%12)<7.5){g.prox-=dt;if(g.prox<=0){spawn();if(Math.random()<.2+S.f*.1)spawn();g.prox=rr(1.6,3)/L.pred*(1-S.f*.08);}}
 for(const p of g.preds){const P=PRED[p.k];p.f+=dt*10;
  const fraca=g.en<=0||g.cal>=100;
  if(!p.foge&&fraca&&Math.hypot(p.x-g.mx,p.y-g.my)<44&&g.msgT<=0)msg('😩 Fraca demais para espantar. Ela precisa comer e se refrescar na água.');
  if(!p.foge&&!fraca&&(Math.hypot(p.x-g.mx,p.y-g.my)<44||Math.hypot(p.x-hx,p.y-hy)<36)){p.foge=1;g.espantados++;S.fp+=5;beep(600,.08);}
  if(p.foge){const ex=p.x-g.mx,ey=p.y-g.my,dd=Math.hypot(ex,ey)||1;p.x+=ex/dd*P.v*1.7*dt;p.y+=ey/dd*P.v*1.7*dt;}
  else{const ex=NX()-p.x,ey=NY()-p.y,dd=Math.hypot(ex,ey);if(dd<26){g.ovos=Math.max(0,g.ovos-P.come);p.foge=1;beep(150,.3,.07);msg(`${P.n} comeu ${P.come} ovo(s)!`);}else{p.x+=ex/dd*P.v*dt;p.y+=ey/dd*P.v*dt;}}}
 g.preds=g.preds.filter(p=>p.x>-70&&p.x<W+70&&p.y>-70&&p.y<H+70);
 // cheia
 if(L.cheia&&!g.cheia&&g.t>20&&g.estado==='inc'&&Math.random()<dt*L.cheia*.04){g.cheia=4;const perde=Math.min(g.ovos,Math.floor(rr(3,7)));g.ovos-=perde;beep(200,.4);msg(`🌊 A água subiu e encharcou parte do ninho: ${perde} ovos perdidos.`);}
 if(g.cheia)g.cheia-=dt;
 if(g.ovos<=0){terminar();return;}
 // eclosão
 if(g.estado==='inc'&&g.t>=DIAS){g.estado='chamado';g.tEst=12;g.preds.forEach(p=>p.foge=1);msg('🐣 Os filhotes estão piando! Vá até o ninho para abrir.');beep(1200,.1);}
 else if(g.estado==='chamado'){g.tEst-=dt;if(Math.random()<dt*3)beep(1500+Math.random()*300,.04,.02);
  if(Math.hypot(g.mx-NX(),g.my-NY())<42){g.estado='leva';g.tEst=15;g.abriu=true;S.fp+=20;beep(900,.15);msg('Ninho aberto! +20. Leve os filhotes até a água.');
   const n=Math.min(g.ovos,14);for(let i=0;i<n;i++)g.filhotes.push({x:NX()+rr(-14,14),y:NY()+rr(-10,10),f:rr(0,6),d:22+i*7});}
  else if(g.tEst<=0)terminar();}
 else if(g.estado==='leva'){g.tEst-=dt;g.rast.unshift([g.mx,g.my]);if(g.rast.length>200)g.rast.pop();
  for(const fi of g.filhotes){fi.f+=dt*12;const idx=Math.min(g.rast.length-1,Math.floor(fi.d/3));const [tx,ty]=g.rast[idx]||[g.mx,g.my];const ex=tx-fi.x,ey=ty-fi.y,dd=Math.hypot(ex,ey);if(dd>2){const v=Math.min(dd,140*dt);fi.x+=ex/dd*v;fi.y+=ey/dd*v;}}
  const chegaram=g.filhotes.filter(fi=>noAgua(fi.x,fi.y)).length;
  if(chegaram>=g.filhotes.length*.8){g.levou=true;S.fp+=20;beep(1000,.2);terminar();}else if(g.tEst<=0)terminar();}}
/* ---------- desenho ---------- */
function jacare(x,y,ang,s,passo,nada){cx.save();cx.translate(x,y);cx.rotate(ang);cx.scale(s,s);
 const ond=Math.sin(passo*2);
 if(nada){cx.strokeStyle='rgba(255,255,255,.55)';cx.lineWidth=1.5;for(let k=0;k<2;k++){cx.beginPath();cx.ellipse(-10,0,58+k*12+((passo*8)%8),20+k*6,0,0,7);cx.stroke();}}
 // cauda
 const pts=[];for(let i=0;i<=10;i++){const u=i/10;pts.push([-26-u*62,Math.sin(passo*2-u*2.4)*(3+u*9)]);}
