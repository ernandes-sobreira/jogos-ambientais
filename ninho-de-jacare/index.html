<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninho de Jacaré</title>
<style>
:root{--main:#5d7a1f;--deep:#3e5414;--soft:#f3f7e6;--line:#dfe8c4;--ink:#222a14;--mut:#5c6648}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:var(--ink);line-height:1.45}
.wrap{max-width:780px;margin:0 auto;padding:12px 14px 40px}
a.hub{color:var(--deep);font-weight:700;text-decoration:none;font-size:.9rem}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
h1{font-size:1.4rem;color:var(--deep)}h2{font-size:1.15rem;color:var(--deep);margin-bottom:6px}
.hud{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--soft);color:var(--deep);border-radius:99px;padding:5px 11px;font-weight:700;font-size:.86rem}
.card{border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;background:#fff}
.btn{background:var(--main);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--deep)}.btn.ghost{background:#fff;color:var(--deep);border:2px solid var(--main)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.small{font-size:.86rem;color:var(--mut)}
canvas{width:100%;max-width:760px;margin:0 auto;display:block;border:2px solid var(--line);border-radius:16px;touch-action:none;background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:6px;justify-content:center;margin-top:10px}
.pad button{border:2px solid var(--line);background:var(--soft);border-radius:12px;font-size:1.4rem;cursor:pointer;color:var(--deep);touch-action:manipulation}
.pad button:active{background:#dcedc8}
.tab{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:8px}.tab td{border-bottom:1px solid var(--line);padding:5px 4px;vertical-align:top}
.ops{display:grid;gap:8px;margin-top:10px}
.ops button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-size:.95rem;cursor:pointer;font-family:inherit;text-align:left;color:var(--ink)}
.ops button:hover{border-color:var(--main)}.ops button:disabled{opacity:.5;cursor:default}
.fb{margin-top:10px;padding:11px 13px;border-radius:12px;font-size:.93rem}
.fb.good{background:#e8f5e9;color:#1b5e20}.fb.bad{background:#ffebee;color:#8e1b1b}
.big{font-size:2.3rem;font-weight:800;color:var(--deep)}
.ranking{border:3px solid var(--main);border-radius:18px;padding:0 16px 12px;overflow:hidden;margin-top:12px}
.ranking h3{font-size:1rem;margin:0 -16px 8px;padding:10px 16px;background:var(--main);color:#fff}
.ranking ol{list-style:none}.ranking li{display:flex;justify-content:space-between;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:.92rem}
.ranking li:last-child{border-bottom:0}.rp{display:inline-block;min-width:2.1em;font-weight:800;color:var(--deep)}
.savebox{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.savebox input{flex:1;min-width:160px;border:2px solid var(--line);border-radius:12px;padding:11px;font-size:1rem;font-family:inherit}
</style>
</head>
<body>
<div class="wrap">
<a class="hub" href="https://ernandes-sobreira.github.io/jogos-ambientais/">← Todos os jogos</a>
<header>
  <h1>🥚 Ninho de Jacaré</h1>
  <div class="hud" id="hud" style="display:none"><span class="pill" id="hF">Fase 1/3</span><span class="pill" id="hP">0 pts</span><span class="pill" id="hR">🥚 30</span><span class="pill" id="hT">📅 dia 0</span></div>
</header>
<main id="tela"></main>
<div class="ranking" id="rankBox"><h3>Ranking Global</h3><ol id="rankList"><li><span>Carregando o ranking...</span></li></ol><p class="small" id="rankNote"></p></div>
</div>
<script>
const $=id=>document.getElementById(id);
const rr=(a,b)=>a+Math.random()*(b-a);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let actx=null;function beep(f,d,v){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.setValueAtTime(v||.05,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(e){}}

/* No jogo, 1 segundo vale 1 dia de incubação. O limite de 31,5 °C e o período de definição do sexo
   seguem a Embrapa Pantanal; a temperatura de cada dia é simulada pelo jogo. */
const DIAS=70,DEFINE=40,LIMITE=31.5,OVOS=30;
const PRED={
 teiu:{n:'Teiú',cor:'#455a64',v:62,come:2,r:14},
 quati:{n:'Quati',cor:'#a1887f',v:72,come:2,r:13},
 lobinho:{n:'Lobinho',cor:'#8d6e63',v:88,come:3,r:14},
 porco:{n:'Porco-monteiro',cor:'#5d4037',v:48,come:5,r:18}
};
const LOCAIS={
 mata:{n:'Mata',base:30.8,amp:.9,pred:2.6,cheia:0,txt:'Na mata, a temperatura do ninho varia pouco, mas os predadores aparecem mais.'},
 flutuante:{n:'Vegetação flutuante',base:31.6,amp:2.2,pred:1.5,cheia:.6,txt:'Na vegetação flutuante, o ninho esquenta e esfria mais com o sol e a chuva. Há menos predadores, mas a água pode subir.'}
};
const FASES=[
 {nome:'Ninho na mata',local:'mata',meta:26,txt:'A fêmea fez o ninho de folhas e gravetos na mata e fica de guarda. Afaste os predadores até os ovos eclodirem.'},
 {nome:'Ninho na vegetação flutuante',local:'flutuante',meta:23,txt:'Agora o ninho está sobre a vegetação flutuante. Repare como a temperatura muda e o que isso faz com os filhotes.'},
 {nome:'Você escolhe o lugar',local:null,meta:24,txt:'Escolha onde construir o ninho. Cada lugar tem vantagens e riscos.'}
];
const PERG=[
 {q:'O que decide se um filhote de jacaré-do-pantanal vai ser macho ou fêmea?',o:['A temperatura em que o ovo foi incubado','O tamanho da mãe na hora da postura','A quantidade de chuva no dia da eclosão']},
 {q:'No jacaré-do-pantanal, ninhos incubados acima de 31,5 °C produzem principalmente...',o:['Machos','Fêmeas','Ovos que não eclodem']},
 {q:'Quais são as principais causas de morte dos ovos de jacaré no Pantanal, segundo a Embrapa?',o:['Inundação e predação dos ninhos','Frio intenso e falta de chuva','Pisoteio do gado e chuva de granizo']}
];
let S,cv,cx,raf=null,last=0,W=760,H=460,inp={x:null,y:null};
function hud(){$('hud').style.display='flex';$('hF').textContent='Fase '+(S.f+1)+'/3';$('hP').textContent=(S.tot+S.fp)+' pts';
 if(S.g){$('hR').textContent='🥚 '+S.g.ovos;$('hT').textContent='📅 dia '+Math.min(DIAS,Math.floor(S.g.t));}}
function inicio(){
 parar();$('hud').style.display='none';$('rankBox').style.display='block';
 $('tela').innerHTML=`<div class="card"><h2>Proteja o ninho do jacaré-do-pantanal</h2>
 <table class="tab"><tr><td>🛡️</td><td>Você é a fêmea do jacaré. Ela fica perto do ninho e espanta os predadores. Aponte para onde ela deve ir.</td></tr>
 <tr><td>🥚</td><td>O ninho começa com ${OVOS} ovos. Predador que chega ao ninho come ovos.</td></tr>
 <tr><td>🌡️</td><td>Nos primeiros ${DEFINE} dias, a temperatura do ninho define o sexo dos filhotes. Acima de ${LIMITE} °C nascem principalmente machos. Abaixo, fêmeas.</td></tr>
 <tr><td>📅</td><td>No jogo, cada segundo é um dia. Os filhotes eclodem no dia ${DIAS}.</td></tr></table>
 <p class="small" style="margin-top:8px">Predador espantado +5. Filhote que eclode +5. 🎯 Meta: chegar à eclosão com a quantidade de ovos da fase.</p>
 <div class="row" style="margin-top:12px"><button class="btn" onclick="novo()">Começar →</button></div></div>`;
}
function novo(){S={f:0,tot:0,fp:0};salvo=false;$('rankBox').style.display='none';fase();}
function fase(){const F=FASES[S.f];S.fp=0;S.g=null;hud();
 if(!F.local){$('tela').innerHTML=`<div class="card"><h2>Fase 3: ${F.nome}</h2><p>${F.txt}</p>
  <div class="ops"><button data-l="mata"><b>🌳 Mata</b><br><span class="small">${LOCAIS.mata.txt}</span></button><button data-l="flutuante"><b>🌿 Vegetação flutuante</b><br><span class="small">${LOCAIS.flutuante.txt}</span></button></div>
  <p class="small" style="margin-top:8px">🎯 Meta: chegar à eclosão com pelo menos ${F.meta} ovos.</p></div>`;
  document.querySelectorAll('.ops button').forEach(b=>b.onclick=()=>{S.local=b.dataset.l;jogar();});return;}
 S.local=F.local;
 $('tela').innerHTML=`<div class="card"><h2>Fase ${S.f+1}: ${F.nome}</h2><p>${F.txt}</p><p class="small" style="margin-top:6px">${LOCAIS[F.local].txt} 🎯 Meta: chegar à eclosão com pelo menos ${F.meta} ovos.</p><div class="row" style="margin-top:12px"><button class="btn" id="bg">Começar a incubação →</button></div></div>`;
 $('bg').onclick=jogar;}
function jogar(){const L=LOCAIS[S.local];
 $('tela').innerHTML=`<div class="card"><canvas id="cv"></canvas><p class="small" style="margin-top:8px">Aponte para onde a fêmea deve ir. Ela espanta o predador que estiver perto.</p></div>`;
 cv=$('cv');if(cv.clientWidth<520){W=440;H=460;}else{W=760;H=460;}cv.width=W;cv.height=H;cx=cv.getContext('2d');
 S.g={t:0,ovos:OVOS,mx:W/2+60,my:H/2,olha:-1,preds:[],prox:3,temps:[],quente:0,dias:0,cheia:null,fim:false,msg:'',msgT:0,espantados:0,temp:L.base,chuva:0};
 const pos=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height];};
 cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);[inp.x,inp.y]=pos(e);e.preventDefault();};
 cv.onpointermove=e=>{if(e.buttons||e.pointerType==='mouse')[inp.x,inp.y]=pos(e);};
 hud();last=performance.now();parar();raf=requestAnimationFrame(loop);}
function msg(t){S.g.msg=t;S.g.msgT=2.2;}
const NX=()=>W/2,NY=()=>H/2;
function spawn(){const g=S.g;const tipos=Object.keys(PRED);const k=tipos[Math.floor(Math.random()*tipos.length)];const lado=Math.floor(Math.random()*4);
 const x=lado===0?-20:lado===1?W+20:rr(0,W),y=lado===2?-20:lado===3?H+20:rr(0,H);g.preds.push({k,x,y,foge:0});}
function update(dt){const g=S.g;if(!g||g.fim)return;const L=LOCAIS[S.local];
 const dia0=Math.floor(g.t);g.t+=dt;g.msgT-=dt;
 // temperatura do ninho: ciclo de sol e chuva
 if(Math.random()<dt*.08)g.chuva=rr(2,5);g.chuva-=dt;
 const alvo=L.base+L.amp*Math.sin(g.t*1.3)+(g.chuva>0?-L.amp*1.2:0);g.temp+=(alvo-g.temp)*Math.min(1,dt*1.5);
 if(Math.floor(g.t)>dia0&&g.t<=DEFINE){g.dias++;if(g.temp>LIMITE)g.quente++;g.temps.push(g.temp);if(g.temps.length>DEFINE)g.temps.shift();}
 // fêmea
 if(inp.x!=null){const dx=inp.x-g.mx,dy=inp.y-g.my,d=Math.hypot(dx,dy);if(d>4){const v=Math.min(d,130*dt);g.mx+=dx/d*v;g.my+=dy/d*v;if(Math.abs(dx)>4)g.olha=Math.sign(dx);}}
 // predadores
 g.prox-=dt;if(g.prox<=0){spawn();if(Math.random()<.25+S.f*.1)spawn();g.prox=rr(1.4,2.8)/L.pred*(1-S.f*.1);}
 for(const p of g.preds){const P=PRED[p.k];
  if(Math.hypot(p.x-g.mx,p.y-g.my)<40&&!p.foge){p.foge=1;g.espantados++;S.fp+=5;beep(600,.08);}
  if(p.foge){const dx=p.x-NX(),dy=p.y-NY(),d=Math.hypot(dx,dy)||1;p.x+=dx/d*P.v*1.6*dt;p.y+=dy/d*P.v*1.6*dt;}
  else{const dx=NX()-p.x,dy=NY()-p.y,d=Math.hypot(dx,dy);if(d<30){g.ovos=Math.max(0,g.ovos-P.come);p.foge=1;beep(150,.3,.07);msg(`${P.n} comeu ${P.come} ovo(s)!`);}else{p.x+=dx/d*P.v*dt;p.y+=dy/d*P.v*dt;}}}
 g.preds=g.preds.filter(p=>p.x>-60&&p.x<W+60&&p.y>-60&&p.y<H+60);
 // cheia na vegetação flutuante
 if(L.cheia&&!g.cheia&&g.t>20&&Math.random()<dt*L.cheia*.04){g.cheia=4;const perde=Math.min(g.ovos,Math.floor(rr(3,7)));g.ovos-=perde;beep(200,.4);msg(`🌊 A água subiu e encharcou parte do ninho: ${perde} ovos perdidos.`);}
 if(g.cheia)g.cheia-=dt;
 if(g.ovos<=0||g.t>=DIAS)terminar();}
function corpoJacare(x,y,s,olha){cx.save();cx.translate(x,y);cx.scale(olha,1);const k=s/100;cx.scale(k,k);
 cx.fillStyle='#4e5a2a';cx.beginPath();cx.moveTo(-95,0);cx.quadraticCurveTo(-60,-6,-30,-12);cx.lineTo(-30,12);cx.quadraticCurveTo(-60,6,-95,0);cx.fill();
 cx.fillStyle='#5f6d34';cx.beginPath();cx.ellipse(0,0,36,17,0,0,7);cx.fill();
 cx.beginPath();cx.moveTo(30,-10);cx.quadraticCurveTo(70,-8,80,-3);cx.lineTo(80,3);cx.quadraticCurveTo(70,8,30,10);cx.fill();
 cx.fillStyle='#3f4a20';for(let i=0;i<7;i++){cx.beginPath();cx.ellipse(-26+i*8,0,2.6,6,0,0,7);cx.fill();}
 cx.fillStyle='#3f4a20';for(const [lx,ly] of [[-18,-17],[-18,17],[20,-15],[20,15]]){cx.beginPath();cx.ellipse(lx,ly+(ly>0?6:-6),5,8,0,0,7);cx.fill();}
 cx.fillStyle='#d4c33a';cx.beginPath();cx.arc(36,-7,3,0,7);cx.arc(36,7,3,0,7);cx.fill();cx.fillStyle='#111';cx.beginPath();cx.ellipse(36,-7,.9,2.4,0,0,7);cx.ellipse(36,7,.9,2.4,0,0,7);cx.fill();cx.restore();}
function desenhaPred(p){const P=PRED[p.k];cx.save();cx.translate(p.x,p.y);const ang=p.foge?Math.atan2(p.y-NY(),p.x-NX()):Math.atan2(NY()-p.y,NX()-p.x);cx.rotate(ang);
 cx.fillStyle=P.cor;if(p.k==='teiu'){cx.beginPath();cx.ellipse(0,0,14,6,0,0,7);cx.fill();cx.beginPath();cx.moveTo(-12,0);cx.lineTo(-34,0);cx.lineWidth=4;cx.strokeStyle=P.cor;cx.stroke();cx.fillStyle='#eceff1';for(let i=0;i<4;i++)cx.fillRect(-8+i*5,-4,2,8);}
 else if(p.k==='quati'){cx.beginPath();cx.ellipse(0,0,13,7,0,0,7);cx.fill();cx.beginPath();cx.moveTo(12,-3);cx.lineTo(22,0);cx.lineTo(12,3);cx.fill();cx.strokeStyle='#5d4037';cx.lineWidth=4;cx.setLineDash([4,3]);cx.beginPath();cx.moveTo(-12,0);cx.lineTo(-30,-6);cx.stroke();cx.setLineDash([]);}
 else if(p.k==='lobinho'){cx.beginPath();cx.ellipse(0,0,14,7,0,0,7);cx.fill();cx.beginPath();cx.moveTo(12,-5);cx.lineTo(22,0);cx.lineTo(12,5);cx.fill();cx.fillStyle='#4e342e';cx.beginPath();cx.ellipse(-18,0,8,3,0,0,7);cx.fill();}
 else{cx.beginPath();cx.ellipse(0,0,18,10,0,0,7);cx.fill();cx.fillStyle='#8d6e63';cx.beginPath();cx.ellipse(17,0,5,4,0,0,7);cx.fill();}
 cx.restore();cx.fillStyle='rgba(40,40,40,.8)';cx.font='bold 10px system-ui';cx.textAlign='center';cx.fillText(P.n,p.x,p.y-16);}
function desenha(){const g=S.g;if(!g||!cx)return;const L=LOCAIS[S.local];
 cx.clearRect(0,0,W,H);
 if(S.local==='mata'){cx.fillStyle='#dcedc8';cx.fillRect(0,0,W,H);cx.fillStyle='rgba(56,142,60,.25)';for(let i=0;i<26;i++){const x=(i*137)%W,y=(i*89)%H;cx.beginPath();cx.arc(x,y,26,0,7);cx.fill();}}
 else{cx.fillStyle='#b3e5fc';cx.fillRect(0,0,W,H);cx.fillStyle='#aed581';for(let i=0;i<40;i++){const x=(i*97)%W,y=(i*61)%H;cx.beginPath();cx.ellipse(x,y,18,10,i,0,7);cx.fill();}
  cx.fillStyle='#9ccc65';cx.beginPath();cx.ellipse(NX(),NY(),120,90,0,0,7);cx.fill();}
 if(g.cheia>0){cx.fillStyle='rgba(41,182,246,.35)';cx.fillRect(0,0,W,H);}
 // ninho
 cx.fillStyle='#8d6e63';cx.beginPath();cx.ellipse(NX(),NY(),40,30,0,0,7);cx.fill();cx.strokeStyle='#5d4037';cx.lineWidth=2;for(let i=0;i<14;i++){const a=i*.45;cx.beginPath();cx.moveTo(NX()+Math.cos(a)*34,NY()+Math.sin(a)*24);cx.lineTo(NX()+Math.cos(a+.6)*22,NY()+Math.sin(a+.6)*14);cx.stroke();}
 cx.fillStyle='#fffde7';const vis=Math.min(g.ovos,12);for(let i=0;i<vis;i++){cx.beginPath();cx.ellipse(NX()-18+(i%4)*12,NY()-8+Math.floor(i/4)*9,5,4,0,0,7);cx.fill();}
 for(const p of g.preds)desenhaPred(p);
 corpoJacare(g.mx,g.my,70,g.olha);
 // termômetro
 const tx=14,ty=14,th=140;cx.fillStyle='rgba(255,255,255,.9)';cx.fillRect(tx-6,ty-6,140,th+50);cx.fillStyle='#eee';cx.fillRect(tx,ty,14,th);
 const tmin=27,tmax=35,yy=t=>ty+th-(t-tmin)/(tmax-tmin)*th;cx.fillStyle=g.temp>LIMITE?'#e53935':'#1e88e5';cx.fillRect(tx,yy(g.temp),14,ty+th-yy(g.temp));
 cx.strokeStyle='#111';cx.setLineDash([3,2]);cx.beginPath();cx.moveTo(tx-2,yy(LIMITE));cx.lineTo(tx+20,yy(LIMITE));cx.stroke();cx.setLineDash([]);
 cx.fillStyle='#222';cx.font='bold 12px system-ui';cx.textAlign='left';cx.fillText(g.temp.toFixed(1)+' °C',tx+22,yy(g.temp)+4);cx.font='10px system-ui';cx.fillText('31,5 °C',tx+22,yy(LIMITE)-4);
 const pm=g.dias?g.quente/g.dias:0;cx.font='11px system-ui';cx.fillText(g.t<=DEFINE?'definindo o sexo: dia '+Math.min(DEFINE,Math.floor(g.t))+'/'+DEFINE:'sexo já definido',tx,ty+th+16);
 cx.fillText('previsão: '+Math.round(pm*100)+'% machos',tx,ty+th+32);
 if(g.msgT>0){cx.font='bold 14px system-ui';cx.textAlign='center';cx.fillStyle='rgba(255,255,255,.9)';cx.fillRect(0,H-30,W,24);cx.fillStyle='#3e5414';cx.fillText(g.msg,W/2,H-13);}}
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);desenha();hud();if(S.g&&!S.g.fim)raf=requestAnimationFrame(loop);}
function parar(){if(raf)cancelAnimationFrame(raf);raf=null;}
function terminar(){const g=S.g;if(g.fim)return;g.fim=true;parar();const F=FASES[S.f],ok=g.ovos>=F.meta&&g.t>=DIAS;
 const pm=g.dias?g.quente/g.dias:0;const machos=Math.round(g.ovos*pm),femeas=g.ovos-machos;
 if(g.t>=DIAS)S.fp+=5*g.ovos;if(ok){S.fp+=30;beep(880,.2);}hud();
 $('tela').innerHTML=`<div class="card"><h2>${ok?'Os filhotes eclodiram!':'O ninho não vingou como devia'}</h2>
 <p>Local: <b>${LOCAIS[S.local].n}</b>. Ovos que chegaram à eclosão: <b>${g.ovos}</b> de ${OVOS} (meta: ${F.meta}). Predadores espantados: <b>${g.espantados}</b>.</p>
 <p style="margin-top:6px">🌡️ Em ${g.quente} dos ${g.dias} primeiros dias o ninho ficou acima de 31,5 °C. Estimativa do jogo: <b>${machos} machos</b> e <b>${femeas} fêmeas</b>.</p>
 ${ok?`<div class="fb good">🎯 Meta cumprida! +${5*g.ovos} pelos filhotes e +30.</div>`:'<div class="fb bad">A meta não foi cumprida. Fique entre o ninho e os predadores e reaja logo a quem chega mais rápido.</div>'}
 <div class="row" style="margin-top:12px">${ok?'<button class="btn" id="bq">Pergunta da fase →</button>':'<button class="btn" id="br">Tentar de novo</button><button class="btn ghost" id="be">Encerrar</button>'}</div></div>`;
 if(ok)$('bq').onclick=pergunta;else{$('br').onclick=fase;$('be').onclick=()=>{S.tot+=Math.max(0,S.fp);S.fp=0;final(false);};}}
function pergunta(){
 const P=PERG[S.f],ops=shuf(P.o.map((t,i)=>({t,c:i===0})));

  $('bn').onclick=()=>{S.tot+=S.fp;S.fp=0;if(S.f===FASES.length-1)final(true);else{S.f++;fase();}};});
}
function final(tudo){
 S.g=null;$('rankBox').style.display='block';const nivel=tudo?'3 fases':'Fase '+(S.f+1);

 $('bS').onclick=()=>salvar(nivel);
