<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bio-Verdade!</title>
<style>
  :root{
    --ink:#0f2f44; --soft:#4b6a7d; --line:#dbe7ee; --ok:#16a34a; --err:#dc2626;
    --t50:#f0fdf4; --t100:#dcfce7; --t300:#86efac; --t500:#22c55e; --main:#16a34a; --deep:#15803d; --dark:#166534; --glow:rgba(22,163,74,.25);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    min-height:100vh;color:var(--ink);background:#ffffff;
    display:flex;flex-direction:column;align-items:center;padding:12px 14px 40px;
  }
  .top{width:100%;max-width:1040px;display:flex;justify-content:flex-start}
  .hub{display:inline-flex;align-items:center;gap:6px;color:var(--deep);text-decoration:none;
    font-weight:600;font-size:.9rem;padding:7px 12px;border-radius:20px;border:1.5px solid var(--line)}
  .hub:hover{background:var(--tint)}
  .hub svg{width:14px;height:14px}
  header{text-align:center;max-width:720px;margin-top:6px}
  h1{font-size:clamp(1.45rem,5vw,2.2rem);display:flex;align-items:center;justify-content:center;gap:10px}
  h1 svg{width:.95em;height:.95em}
  h1 .spark{color:var(--main)}
  .sub{color:var(--soft);font-size:.95rem;margin:4px 0 12px}
  .levels{display:flex;gap:8px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
  .levels button{border:2px solid var(--line);background:#fff;color:var(--ink);padding:8px 16px;border-radius:30px;
    font-size:.92rem;cursor:pointer;transition:.2s;font-weight:600;font-family:inherit}
  .levels button{border-color:var(--main);color:var(--deep)}
  .levels button:hover{background:var(--tint)}
  .levels button.active{background:var(--main);border-color:var(--main);color:#fff;box-shadow:0 4px 12px var(--glow)}
  .hud{display:flex;gap:8px;justify-content:center;align-items:center;margin:4px 0 12px;font-size:.9rem;flex-wrap:wrap}
  .hud span{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:30px;color:#fff;font-weight:600}
  .hud b{font-size:1.05rem;font-weight:800}
  .hud .h1{background:#16a34a} .hud .h2{background:#f97316} .hud .h3{background:#7c3aed} .hud .h4{background:#0ea5e9}

  .card{width:min(680px,100%);background:#fff;border:3px solid var(--main);border-radius:22px;
    padding:0 0 20px;box-shadow:0 12px 30px var(--glow);overflow:hidden}
  #stage{padding:0 20px}
  .strip{display:flex;gap:5px;justify-content:center;align-items:flex-end;flex-wrap:wrap;min-height:54px;
    padding:10px 10px 8px;background:linear-gradient(180deg,#e0f2fe 0%,#f0f9ff 62%,var(--pale) 62%,var(--pale) 100%)}
  .slot{width:36px;height:36px;display:flex;align-items:center;justify-content:center}
  .slot svg{width:100%;height:100%}
  .slot.empty{align-items:flex-end;padding-bottom:3px}
  .slot.empty::after{content:"";width:11px;height:11px;border-radius:50%;background:#fff;border:3px solid var(--main);opacity:.45}
  .slot.now::after{opacity:1;background:var(--acc);border-color:#fff;box-shadow:0 0 0 3px var(--acc);animation:pulse 1.1s infinite}
  @keyframes pulse{50%{transform:scale(1.25)}}
  .slot.pop svg{animation:grow .45s cubic-bezier(.3,1.5,.5,1)}
  @keyframes grow{from{transform:scale(.2) translateY(8px);opacity:0}to{transform:none;opacity:1}}
  .qhead{margin:0 -20px 16px;padding:14px 20px 16px;background:linear-gradient(135deg,var(--main),var(--deep));color:#fff}
  .qnum{display:inline-block;font-size:.74rem;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
    background:rgba(255,255,255,.22);padding:3px 10px;border-radius:20px}
  .qtext{font-size:1.22rem;font-weight:700;line-height:1.35;margin-top:8px}
  .opts{display:grid;gap:9px}
  .opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:#fff;border:2px solid var(--line);
    border-radius:14px;padding:11px 14px;font-size:1rem;line-height:1.35;color:var(--ink);cursor:pointer;
    font-family:inherit;transition:border-color .15s,background .15s,transform .15s}
  .opt{--c:#0ea5e9;--ct:#f0f9ff;border-color:var(--c);background:var(--ct);font-weight:500}
  .opt:nth-child(2){--c:#f97316;--ct:#fff7ed} .opt:nth-child(3){--c:#8b5cf6;--ct:#f5f3ff} .opt:nth-child(4){--c:#ec4899;--ct:#fdf2f8}
  .opt .k{flex:none;width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;
    font-weight:800;display:flex;align-items:center;justify-content:center;font-size:1rem}
  .opt:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(15,47,68,.14)}
  .opt:disabled{cursor:default}
  .opt.right{border-color:var(--ok);background:#dcfce7;font-weight:700}
  .opt.right .k{background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--err);background:#fee2e2;animation:shake .3s}
  .opt.wrong .k{background:var(--err);color:#fff}
  .opt.dim{opacity:.5;background:#fff;border-color:var(--line)} .opt.dim .k{background:#94a3b8}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .fb{margin-top:14px;border-radius:14px;padding:12px 14px;font-size:.96rem;line-height:1.45;background:#fffbeb;
    border:2px dashed #fcd34d;min-height:52px;color:#92400e}
  .fb.ok{background:#dcfce7;border:2px solid var(--ok);color:var(--ink)}
  .fb.no{background:#fee2e2;border:2px solid var(--err);color:var(--ink)}
  .fb b{display:block;margin-bottom:2px}
  .fb.ok>b{color:#166534;font-size:1.05rem} .fb.no>b{color:#b91c1c;font-size:1.05rem}
  .fb .more{margin-top:8px;padding:8px 10px;border-radius:10px;background:#fff} .fb .more b{color:#166534}
  .fb .more{margin-top:6px}
  .btn{background:var(--main);color:#fff;border:0;padding:11px 20px;border-radius:12px;font-weight:700;cursor:pointer;
    font-size:1rem;font-family:inherit}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:#fff;color:var(--deep);border:2px solid var(--line)}
  .next{display:none;margin:14px auto 0;background:var(--acc);font-size:1.05rem;padding:12px 26px;box-shadow:0 5px 14px rgba(15,47,68,.2)}
  .next.show{display:block}

  .end{text-align:center;padding-top:16px}
  .end h2{font-size:1.5rem;margin:6px 0 4px;color:var(--deep)}
  .end p{color:var(--soft)}
  .stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
  .stat{background:#16a34a;border-radius:14px;padding:9px 16px;font-weight:800;font-size:1.2rem;color:#fff;min-width:84px}
  .stat:nth-child(2){background:#7c3aed} .stat:nth-child(3){background:#f97316} .stat:nth-child(4){background:#0ea5e9}
  .stat span{display:block;font-size:.72rem;font-weight:600;color:#fff;opacity:.92}
  .savebox{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
  .savebox input{padding:10px 12px;border-radius:10px;border:2px solid var(--line);font-size:1rem;width:220px;font-family:inherit}
  .review{text-align:left;margin-top:16px;border-top:2px solid var(--line);padding-top:12px}
  .review h3{font-size:1rem;margin-bottom:6px}
  .review li{list-style:none;padding:8px 0;border-bottom:1px solid var(--line);font-size:.93rem;line-height:1.4}
  .review li:last-child{border-bottom:0}
  .review .a{color:#166534;font-weight:700}

  .ranking{margin-top:16px;width:min(680px,100%);background:#fff;border:3px solid #fbbf24;border-radius:18px;padding:0 16px 12px;overflow:hidden}
  .ranking h3{font-size:1.02rem;margin:0 -16px 8px;padding:10px 16px;background:#fbbf24;color:#451a03}
  .ranking h3 span{color:#fff;background:#b45309;padding:2px 10px;border-radius:20px;font-size:.88rem}
  .ranking li:nth-child(1) .pos{color:#b45309} .ranking li:nth-child(1){font-weight:700}
  .ranking ol{list-style:none}
  .ranking li{display:flex;justify-content:space-between;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:.93rem}
  .ranking li:last-child{border-bottom:0}
  .ranking .pos{display:inline-block;min-width:2.1em;font-weight:800;color:var(--deep)}
  .note{font-size:.8rem;color:var(--soft);margin-top:6px}
  footer{margin-top:22px;font-size:.8rem;color:var(--soft);text-align:center;line-height:1.6}
  footer .credit{font-weight:700;color:var(--ink)}


  /* ---- cor unica por jogo: todos os destaques sao tons da mesma cor ---- */
  :root{--tint:var(--t100);--pale:var(--t300);--acc:var(--dark)}
  .hub:hover{background:var(--t50)}
  .levels button{border-color:var(--t300)}
  .hud .h1{background:var(--t500)} .hud .h2{background:var(--main)} .hud .h3{background:var(--deep)} .hud .h4{background:var(--dark)}
  .strip{background:linear-gradient(180deg,var(--t50) 0%,var(--t100) 62%,var(--t300) 62%,var(--t300) 100%)}
  .qhead{background:linear-gradient(135deg,var(--main),var(--dark))}
  .opt,.opt:nth-child(2),.opt:nth-child(3),.opt:nth-child(4){--c:var(--main);--ct:var(--t50);border-color:var(--t300)}
  .opt:not(:disabled):hover{border-color:var(--main);background:var(--t100)}
  .fb{background:var(--t50);border:2px dashed var(--t300);color:var(--deep)}
  .next{background:var(--deep)}
  .stat{background:var(--t500)} .stat:nth-child(2){background:var(--main)} .stat:nth-child(3){background:var(--deep)} .stat:nth-child(4){background:var(--dark)}
  .ranking{border-color:var(--main)}
  .ranking h3{background:var(--main);color:#fff}
  .ranking h3 span{background:var(--dark);color:#fff}
  .ranking li:nth-child(1) .pos{color:var(--deep)}
  @media(max-width:560px){
    body{padding:8px 8px 32px}
    .sub{display:none}
    h1{margin-bottom:8px}
    .hub{padding:4px 10px;font-size:.82rem}
    .levels button{padding:7px 12px;font-size:.85rem}
    .hud{gap:10px;font-size:.86rem;margin:2px 0 8px}
    .card{padding:0 0 14px;border-radius:18px}
    .qtext{font-size:1.05rem;margin-bottom:10px}
    .opt{padding:9px 10px;font-size:.94rem;gap:9px}
    .opt .k{width:28px;height:28px;font-size:.86rem}
    .slot{width:27px;height:27px}
    .strip{min-height:44px;padding:8px 6px 6px}
    .qhead{margin:0 -12px 12px;padding:10px 12px 12px}
    #stage{padding:0 12px}
    .hud span{padding:4px 9px;font-size:.78rem} .hud b{font-size:.92rem} .hud{gap:5px}
    .fb{font-size:.9rem}
  }
  @media(prefers-reduced-motion:reduce){.slot.pop svg,.opt.wrong{animation:none}}
  .vf{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
  .vfb{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 10px;border-radius:16px;border:3px solid;font-weight:800;font-size:1.15rem;font-family:inherit;cursor:pointer;transition:transform .12s,background .15s}
  .vfb svg{width:38px;height:38px}
  .vfb.v{border-color:#16a34a;background:#f0fdf4;color:#166534} .vfb.f{border-color:#dc2626;background:#fef2f2;color:#991b1b}
  .vfb:hover:not(:disabled){transform:translateY(-2px)}
  .vfb:disabled{cursor:default}
  .vfb.right{box-shadow:0 0 0 4px #86efac} .vfb.wrong{box-shadow:0 0 0 4px #fca5a5;animation:shake .3s} .vfb.dim{opacity:.45}
  .fix{margin-top:8px;padding:8px 10px;border-radius:10px;background:#fff;border-left:4px solid var(--ok)} .fix b{color:#166534}
  .lost{position:absolute;right:12px;top:12px;background:#dc2626;color:#fff;font-weight:900;border-radius:999px;padding:3px 10px;animation:lost 1.4s ease-out forwards;pointer-events:none}
  @keyframes lost{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}
  #stage{position:relative}
  @media(prefers-reduced-motion:reduce){.vfb.wrong,.lost{animation:none}}

</style>
</head>

/* pontos por acerto, igual a versao anterior do jogo */
/* igual a versao anterior: 10 por acerto mais 2 por acerto seguido; agora o erro tira 5 */
function pointsFor(streak){ return 10 + (streak>1 ? (streak-1)*2 : 0); }
const PENALTY = 5;
const END_MSG = [[100, "Especialista em biomas!", "Você acertou todas."], [75, "Muito bem", "Reveja as poucas que escaparam."], [50, "No caminho", "Leia as explicações abaixo e tente de novo."], [0, "Hora de explorar mais", "Leia as explicações abaixo e jogue outra vez."]];
const levelVal = k => ({basico:'Básico', intermediario:'Intermediário', dificil:'Difícil', avancado:'Avançado', carbonauta:'🛰️ Carbonauta'})[k];
const PEN = typeof PENALTY!=='undefined' ? PENALTY : 0;

const KEYS = Object.keys(LEVELS);
let level = KEYS[0], qs = [], qi = 0, order = [], answered = false;
let hits = 0, streak = 0, maxStreak = 0, score = 0, results = [], misses = [];
let startTime = null, timerInt = null, elapsed = 0, scoreSaved = false;
let db = null, fsFns = null;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function buildLevels(){
  $('levels').innerHTML = KEYS.map(k=>`<button data-lvl="${k}" onclick="setLevel('${k}')">${LEVELS[k].label}</button>`).join('');
}
function setLevel(l){
  level = l;
  document.querySelectorAll('.levels button').forEach(b=>b.classList.toggle('active',b.dataset.lvl===l));
  $('rankLevel').textContent = LEVELS[l].label;
  restart();
  loadRanking();
}
function restart(){
  clearInterval(timerInt); timerInt=null; startTime=null; elapsed=0;
  qs = shuffle(LEVELS[level].qs); qi=0; hits=0; streak=0; maxStreak=0; score=0; results=[]; misses=[]; scoreSaved=false;
  hud(); $('timer').textContent='0s';
  renderQ();
}
function hud(){ $('hits').textContent=hits; $('streak').textContent=streak; $('score').textContent=score; }
function strip(pop){
  $('strip').innerHTML = qs.map((_,i)=>{
    if(i<results.length) return `<span class="slot${pop&&i===results.length-1?' pop':''}">${results[i]?TOKEN_OK:TOKEN_NO}</span>`;
    return `<span class="slot empty${i===qi?' now':''}"></span>`;
  }).join('');
}
function startTimer(){
  if(timerInt) return;
  startTime = Date.now();
  timerInt = setInterval(()=>{elapsed=Math.floor((Date.now()-startTime)/1000);$('timer').textContent=elapsed+'s';},500);
}
const ICON_V = '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="#16a34a"/><path d="M12 21l6 6 11-13" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICON_F = '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="#dc2626"/><path d="M13 13l14 14M27 13L13 27" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>';
function renderQ(){
  if(qi>=qs.length){ renderEnd(); return; }
  const q = qs[qi];
  answered = false;
  strip(false);
  $('stage').innerHTML = `
    <div class="qhead"><div class="qnum">Afirmação ${qi+1} de ${qs.length}</div>
    <div class="qtext">${q.s}</div></div>
    <div class="vf"><button class="vfb v" data-a="1" onclick="answer(true)">${ICON_V}Verdadeiro</button><button class="vfb f" data-a="0" onclick="answer(false)">${ICON_F}Falso</button></div>
    <div class="fb" id="fb" aria-live="polite">Verdadeiro ou falso? ${PEN?'Errar tira '+PEN+' pontos. ':''}O tempo começa a contar na primeira resposta.</div>
    <button class="btn next" id="next" onclick="nextQ()"></button>`;
}
function answer(a){
  if(answered) return;
  answered = true; startTimer();
  const q = qs[qi], ok = a===q.v;
  document.querySelectorAll('.vfb').forEach(b=>{ const bv = b.dataset.a==='1'; b.disabled = true;
    if(bv===q.v) b.classList.add('right'); else if(bv===a) b.classList.add('wrong'); else b.classList.add('dim'); });
  let lost = 0;
  if(ok){ streak++; maxStreak=Math.max(maxStreak,streak); score+=pointsFor(streak); hits++; }
  else { streak=0; misses.push(q); lost = Math.min(PEN, score); score -= lost;
    if(lost){ const t=document.createElement('span'); t.className='lost'; t.textContent='-'+lost; $('stage').appendChild(t); setTimeout(()=>t.remove(),1500); } }
  results.push(ok); hud(); strip(true);
  const fb = $('fb');
  fb.className = 'fb '+(ok?'ok':'no');
  const head = ok ? (q.v ? 'Certo, é verdadeira.' : 'Certo, é falsa.') : (q.v ? 'Errou, ela é verdadeira.' : 'Errou, ela é falsa.') + (lost ? ' Perdeu '+lost+' pontos.' : '');
  fb.innerHTML = `<b>${head}</b>${q.fb}${!q.v && q.fix ? `<div class="fix"><b>O certo é:</b> ${q.fix}</div>` : ''}`;
  const nb = $('next');
  nb.textContent = qi+1>=qs.length ? 'Ver resultado' : 'Próxima afirmação';
  nb.classList.add('show'); nb.focus({preventScroll:true});
}
function nextQ(){ qi++; renderQ(); window.scrollTo({top:0,behavior:'smooth'}); }

function renderEnd(){
  clearInterval(timerInt); timerInt=null;
  strip(false);
  const total = qs.length, pct = Math.round(hits/total*100);
  const m = END_MSG.find(x=>pct>=x[0]);
  $('stage').innerHTML = `
    <div class="end">
      <h2>${m[1]}</h2>
      <p>${m[2]}</p>
      <div class="stats">
        <div class="stat">${hits}/${total}<span>Acertos</span></div>
        <div class="stat">${score}<span>Pontos</span></div>
        <div class="stat">${maxStreak}<span>Maior sequência</span></div>
        <div class="stat">${elapsed}s<span>Tempo</span></div>
      </div>
      <div class="savebox">
        <input id="playerName" maxlength="20" placeholder="Seu nome (até 20 letras)">
        <button class="btn" id="saveBtn" onclick="saveScore()">Salvar no ranking</button>
      </div>
      <p id="saveStatus" style="margin-top:8px;font-size:.85rem"></p>
      <button class="btn ghost" style="margin-top:10px" onclick="restart()">Jogar de novo</button>
      ${misses.length?`<div class="review"><h3>Para rever (${misses.length})</h3><ul>${misses.map(q=>`<li>${q.s}<br><span class="a">${q.v?'Verdadeira':'Falsa'}</span>${!q.v&&q.fix?' · O certo é: '+q.fix:''}<br>${q.fb}</li>`).join('')}</ul></div>`:''}
    </div>`;
}

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  const k = e.key.toLowerCase();
  if(!answered && qi<qs.length && (k==='v'||k==='f')) answer(k==='v');
});

async function initFirebase(){
  try{
    const appM=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const fsM=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    db=fsM.getFirestore(appM.initializeApp(firebaseConfig)); fsFns=fsM;
    loadRanking();
  }catch(e){
    $('rankList').innerHTML='<li><span>Ranking indisponível sem internet.</span></li>';
    $('rankNote').textContent='O jogo funciona normalmente. O ranking volta quando houver conexão.';
  }
}
async function saveScore(){
  if(scoreSaved) return;
  const name=$('playerName').value.trim(), st=$('saveStatus');
  if(!name){st.textContent='Digite seu nome primeiro.';return;}
  if(!db){st.textContent='Sem conexão com o ranking. Seu resultado não foi enviado.';return;}
  try{
    $('saveBtn').disabled=true;
    /* o nivel e gravado do mesmo jeito da versao anterior, para o ranking antigo continuar valendo */
    await fsFns.addDoc(fsFns.collection(db,'games',GAME_ID,'scores'),
      {name:name.slice(0,20),score:score,level:levelVal(level),seconds:elapsed,hits:hits,total:qs.length,ts:fsFns.serverTimestamp()});
    scoreSaved=true; st.textContent='Salvo no Ranking Global!'; loadRanking();
  }catch(e){ $('saveBtn').disabled=false; st.textContent='Erro ao salvar. Verifique a internet e tente de novo.'; }
}
async function loadRanking(){
  if(!db) return;
  const list=$('rankList'), asked=level;
  try{
    /* filtra por nivel no servidor e ordena aqui: cada nivel tem o seu ranking completo */
    const q=fsFns.query(fsFns.collection(db,'games',GAME_ID,'scores'),fsFns.where('level','==',levelVal(asked)),fsFns.limit(1000));
    const snap=await fsFns.getDocs(q);
    if(asked!==level) return;
    const rows=[]; snap.forEach(d=>rows.push(d.data()));
    rows.sort((a,b)=>((Number(b.score)||0)-(Number(a.score)||0))||((Number(a.seconds)||0)-(Number(b.seconds)||0)));
    if(!rows.length){list.innerHTML='<li><span>Seja o primeiro do ranking!</span></li>';return;}
    list.innerHTML=rows.slice(0,10).map((r,i)=>
      `<li><span><span class="pos">${i+1}º</span>${esc(r.name||'?')}</span><span>${Number(r.score)||0} pts · ${Number(r.seconds)||0}s</span></li>`).join('');
  }catch(e){ list.innerHTML='<li><span>Não foi possível carregar o ranking.</span></li>'; }
}

buildLevels();
setLevel(KEYS[0]);
initFirebase();
</script>
