<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Língua Ligeira</title>
<style>
:root{--main:#6d4c41;--deep:#4e342e;--soft:#efebe9;--line:#e0d6d1;--ink:#2a1f1b;--mut:#6d5f59}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:var(--ink);line-height:1.45}
.wrap{max-width:780px;margin:0 auto;padding:12px 14px 40px}
a.hub{color:var(--deep);font-weight:700;text-decoration:none;font-size:.9rem}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
h1{font-size:1.4rem;color:var(--deep)}h2{font-size:1.15rem;color:var(--deep);margin-bottom:6px}
.hud{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--soft);color:var(--deep);border-radius:99px;padding:5px 11px;font-weight:700;font-size:.86rem}
.card{border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;background:#fff}
.btn{background:var(--main);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--deep)}.btn.ghost{background:#fff;color:var(--deep);border:2px solid var(--main)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.small{font-size:.86rem;color:var(--mut)}
canvas{width:100%;max-width:760px;margin:0 auto;display:block;border:2px solid var(--line);border-radius:16px;touch-action:none;background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:6px;justify-content:center;margin-top:10px}
.pad button{border:2px solid var(--line);background:var(--soft);border-radius:12px;font-size:1.4rem;cursor:pointer;color:var(--deep);touch-action:manipulation}
.pad button:active{background:#dcedc8}
.tab{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:8px}.tab td{border-bottom:1px solid var(--line);padding:5px 4px;vertical-align:top}
.ops{display:grid;gap:8px;margin-top:10px}
.ops button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-size:.95rem;cursor:pointer;font-family:inherit;text-align:left;color:var(--ink)}
.ops button:hover{border-color:var(--main)}.ops button:disabled{opacity:.5;cursor:default}
.fb{margin-top:10px;padding:11px 13px;border-radius:12px;font-size:.93rem}
.fb.good{background:#e8f5e9;color:#1b5e20}.fb.bad{background:#ffebee;color:#8e1b1b}
.big{font-size:2.3rem;font-weight:800;color:var(--deep)}
.ranking{border:3px solid var(--main);border-radius:18px;padding:0 16px 12px;overflow:hidden;margin-top:12px}
.ranking h3{font-size:1rem;margin:0 -16px 8px;padding:10px 16px;background:var(--main);color:#fff}
.ranking ol{list-style:none}.ranking li{display:flex;justify-content:space-between;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:.92rem}
.ranking li:last-child{border-bottom:0}.rp{display:inline-block;min-width:2.1em;font-weight:800;color:var(--deep)}
.savebox{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.savebox input{flex:1;min-width:160px;border:2px solid var(--line);border-radius:12px;padding:11px;font-size:1rem;font-family:inherit}
.lamber{display:block;width:100%;max-width:420px;margin:10px auto 0;padding:16px;font-size:1.2rem;border-radius:16px;border:0;background:#c2185b;color:#fff;font-weight:800;font-family:inherit;touch-action:manipulation;cursor:pointer}.lamber:disabled{background:#d7ccc8;color:#8d6e63}
</style>
</head>
<body>
<div class="wrap">
<a class="hub" href="https://ernandes-sobreira.github.io/jogos-ambientais/">← Todos os jogos</a>
<header>
  <h1 id="tit">Língua Ligeira</h1>
  <div class="hud" id="hud" style="display:none"><span class="pill" id="hF">Fase 1/3</span><span class="pill" id="hP">0 pts</span><span class="pill" id="hR">🐜 0</span><span class="pill" id="hV">⚠️ 0</span><span class="pill" id="hT">⏱ 0</span></div>
</header>
<main id="tela"></main>
<div class="ranking" id="rankBox"><h3>Ranking Global</h3><ol id="rankList"><li><span>Carregando o ranking...</span></li></ol><p class="small" id="rankNote"></p></div>
</div>
<script>
const $=id=>document.getElementById(id);
const TAM=new Image();TAM.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 0 260 110"><path d="M46 54 C24 26 -26 26 -38 48 C-38 70 2 86 44 78 Z" fill="#4e4540"/><path d="M-30 46 C-10 38 20 42 40 56 M-32 58 C-8 54 18 60 40 66 M-26 68 C-4 68 18 72 40 74" stroke="#6d625a" stroke-width="2" fill="none"/><path d="M40 52 C56 36 110 34 134 44 C146 50 148 70 138 78 C120 88 70 88 50 80 C40 74 36 62 40 52 Z" fill="#8a7d72"/><rect x="58" y="74" width="12" height="26" rx="5" fill="#3e3632"/><rect x="74" y="76" width="11" height="24" rx="5" fill="#2f2926"/><rect x="118" y="74" width="13" height="26" rx="5" fill="#e8e2d8"/><rect x="118" y="82" width="13" height="6" fill="#2f2926"/><rect x="104" y="76" width="11" height="24" rx="5" fill="#d8d1c6"/><path d="M134 46 C150 44 164 48 176 54 L214 62 C216 64 214 66 212 66 L176 66 C162 70 148 72 138 72 Z" fill="#8a7d72"/><path d="M150 70 C130 64 110 52 96 44 L104 40 C118 48 138 58 156 62 Z" fill="#1b1716"/><path d="M156 61 C140 57 122 48 106 39 L110 37 C126 46 142 54 158 57 Z" fill="#f2ede4"/><path d="M150 71 C132 68 112 58 96 48 L95 52 C110 62 130 72 148 75 Z" fill="#f2ede4"/><circle cx="168" cy="54" r="2.4" fill="#111"/><ellipse cx="160" cy="47" rx="4" ry="3" fill="#6d625a"/><path d="M212 64 Q218 72 214 78" stroke="#c2185b" stroke-width="1.5" fill="none" opacity="0"/></svg>');
const rr=(a,b)=>a+Math.random()*(b-a);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let actx=null;function beep(f,d,v){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.setValueAtTime(v||.05,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(e){}}

/* Escala do jogo: cada ninho dura poucos segundos. Os soldados vão aparecendo enquanto o tamanduá come,
   como a defesa da colônia que faz o tamanduá real sair depois de cerca de 40 s. */
const FASES=[
 {nome:'Cupinzeiro',tipo:'cupim',dur:60,meta:95,vel:45,n:26,soldRit:.32,txt:'O tamanduá abriu um cupinzeiro. Toque nos cupins para a língua buscar cada um. Os soldados, de cabeça grande e escura, mordem: não lamba os soldados.'},
 {nome:'Formigueiro',tipo:'formiga',dur:60,meta:70,vel:80,n:24,soldRit:.4,txt:'Formigas correm mais que cupins. Mire bem. Quando os soldados ficarem muitos, vá para o próximo ninho.'},
 {nome:'Campo aberto',tipo:'misto',dur:70,meta:75,vel:95,n:24,soldRit:.5,txt:'Ninhos de cupim e de formiga se alternam e a defesa chega mais rápido. Coma depressa e mude de ninho na hora certa.'}
];
const PERG=[
 {q:'Por que o tamanduá-bandeira come pouco tempo em cada ninho de formiga ou cupim?',o:['Para escapar da defesa dos soldados e não acabar com a colônia','Porque a língua dele cansa depois de poucas lambidas','Porque os cupins fogem do ninho quando ele chega']},
 {q:'Quantas vezes por minuto a língua do tamanduá-bandeira pode entrar e sair do ninho, segundo o Zoológico Nacional Smithsonian?',o:['Até 150 vezes','Até 15 vezes','Até 1.500 vezes']},
 {q:'Segundo a National Geographic Brasil, em que bioma o tamanduá-bandeira vem sofrendo as maiores reduções de população?',o:['No Cerrado','No Pantanal','Na Amazônia']}
];
let S,cv,cx,raf=null,last=0,W=760,H=460;
function hud(){$('hud').style.display='flex';$('hF').textContent='Fase '+(S.f+1)+'/3';$('hP').textContent=(S.tot+S.fp)+' pts';
 if(S.g){$('hR').textContent='🐜 '+S.g.comidos+'/'+FASES[S.f].meta;$('hV').textContent='⚠️ '+S.g.mordidas+' mordidas';$('hT').textContent='⏱ '+Math.max(0,Math.ceil(S.g.dur-S.g.t))+' s';}}
function inicio(){
 parar();$('hud').style.display='none';$('rankBox').style.display='block';
 $('tela').innerHTML=`<div class="card"><h2>Lamba os insetos um a um</h2>
 <table class="tab"><tr><td><img src="${TAM.src}" width="90" alt="tamanduá-bandeira"></td><td>O tamanduá-bandeira não tem dentes. Ele abre o ninho com as garras e pega os insetos com a língua comprida e pegajosa.</td></tr>
 <tr><td>👆</td><td>Toque num inseto: a língua sai e busca. Inseto pego +2. A língua precisa voltar antes da próxima lambida.</td></tr>
 <tr><td>⚔️</td><td>Soldados têm cabeça grande e escura. Lamber um soldado é mordida no focinho: −10.</td></tr>
 <tr><td>🪵</td><td>Gravetos no ninho bloqueiam a língua. Mire por outro caminho.</td></tr>
 <tr><td>🐛</td><td>De vez em quando aparece uma câmara de larvas. Lamba rápido: +10 e conta 3 insetos.</td></tr>
 <tr><td>➡️</td><td>Com o tempo chegam mais soldados. Troque de ninho antes que eles dominem: +10 pela colônia que continua viva.</td></tr></table>
 <p class="small" style="margin-top:8px">🎯 Meta: comer a quantidade de insetos da fase no tempo, com no máximo 3 mordidas.</p>
 <div class="row" style="margin-top:12px"><button class="btn" onclick="novo()">Começar →</button></div></div>`;
}
function novo(){S={f:0,tot:0,fp:0};salvo=false;$('rankBox').style.display='none';fase();}
function fase(){const F=FASES[S.f];S.fp=0;S.g=null;hud();
 $('tela').innerHTML=`<div class="card"><h2>Fase ${S.f+1}: ${F.nome}</h2><p>${F.txt}</p><p class="small" style="margin-top:6px">🎯 Meta: ${F.meta} insetos em ${F.dur} s, com no máximo 3 mordidas.</p><div class="row" style="margin-top:12px"><button class="btn" id="bg">Abrir o ninho →</button></div></div>`;
 $('bg').onclick=jogar;}
function boca(){return [W<520?W*.25:W*.21,H*.5];}
function corta(ax,ay,bx,by,s){const [cx1,cy1,dx1,dy1]=s;const r=(bx-ax)*(dy1-cy1)-(by-ay)*(dx1-cx1);if(Math.abs(r)<1e-6)return null;const t=((cx1-ax)*(dy1-cy1)-(cy1-ay)*(dx1-cx1))/r,u=((cx1-ax)*(by-ay)-(cy1-ay)*(bx-ax))/r;return t>0&&t<1&&u>0&&u<1?t:null;}
function novoNinho(){const g=S.g,F=FASES[S.f];g.ninhoN++;g.tNinho=0;g.trocando=0;
 g.tipoN=F.tipo==='misto'?(g.ninhoN%2?'formiga':'cupim'):F.tipo;
 g.ins=[];for(let i=0;i<F.n;i++)g.ins.push(novoInseto('op'));g.soldProx=1.2;g.larva=null;g.larvaProx=rr(3,6);
 g.gal=[];const cx0=W*.62,cy0=H*.55;for(let i=0;i<S.f+1;i++){const x=cx0+rr(-.18,.1)*W,y=cy0+rr(-.25,.25)*H,a=rr(-1.2,1.2),l=rr(55,90);g.gal.push([x-Math.cos(a)*l/2,y-Math.sin(a)*l/2,x+Math.cos(a)*l/2,y+Math.sin(a)*l/2]);}}
function novoInseto(t){const g=S.g,F=FASES[S.f];const cx0=W*.62,cy0=H*.55;const a=rr(0,7),r=rr(0,1);
 const vel=(g.tipoN==='formiga'?F.vel:F.vel*.65)*rr(.7,1.3);const ang=rr(0,7);
 return {x:cx0+Math.cos(a)*r*W*.3,y:cy0+Math.sin(a)*r*H*.32,vx:Math.cos(ang)*vel,vy:Math.sin(ang)*vel,t,vel,f:Math.random()*6,vivo:true};}
function jogar(){const F=FASES[S.f];
 $('tela').innerHTML=`<div class="card"><canvas id="cv"></canvas><div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="bt">➡️ Próximo ninho</button></div><p class="small" style="margin-top:8px;text-align:center">Toque nos insetos. No teclado, clique com o mouse e use N para trocar de ninho.</p></div>`;
 cv=$('cv');if(cv.clientWidth<520){W=440;H=440;}else{W=760;H=460;}cv.width=W;cv.height=H;cx=cv.getContext('2d');
 S.g={t:0,dur:F.dur,comidos:0,mordidas:0,ninhoN:0,ling:null,cd:0,fim:false,msg:'',msgT:0,pegos:[]};novoNinho();
 cv.onpointerdown=e=>{const r=cv.getBoundingClientRect();lamber((e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height);e.preventDefault();};
 $('bt').onclick=trocar;hud();last=performance.now();parar();raf=requestAnimationFrame(loop);}
document.addEventListener('keydown',e=>{if(S&&S.g&&!S.g.fim&&(e.key==='n'||e.key==='N'))trocar();});
function msg(t){S.g.msg=t;S.g.msgT=1.8;}
function trocar(){const g=S.g;if(!g||g.fim||g.trocando>0)return;const sold=g.ins.filter(i=>i.vivo&&i.t==='sold').length,tot=g.ins.filter(i=>i.vivo).length;
 if(g.tNinho>2&&sold<tot*.5){S.fp+=10;msg('🌱 Saiu a tempo: a colônia continua viva. +10.');beep(900,.1);}
 g.trocando=1;g.ling=null;}
function lamber(x,y){const g=S.g;if(!g||g.fim||g.trocando>0||g.ling||g.cd>0)return;const [bx,by]=boca();if(x<bx+10)return;
 let lim=1;const [ax,ay]=boca();for(const sg of g.gal){const t=corta(ax,ay,x,y,sg);if(t!=null&&t<lim)lim=t;}
 g.ling={tx:ax+(x-ax)*lim,ty:ay+(y-ay)*lim,p:0,ida:true,pegou:[],bateu:lim<1};beep(700,.03,.02);}
function update(dt){const g=S.g;if(!g||g.fim)return;const F=FASES[S.f];
 g.t+=dt;g.msgT-=dt;g.cd-=dt;
 if(g.trocando>0){g.trocando-=dt/1.1;if(g.trocando<=0){novoNinho();}if(g.t>=g.dur)terminar();return;}
 g.tNinho+=dt;
 // soldados chegam cada vez mais
 g.soldProx-=dt;if(g.soldProx<=0){const n=1+Math.floor(g.tNinho*F.soldRit*.5);for(let i=0;i<n;i++)g.ins.push(novoInseto('sold'));g.soldProx=rr(.8,1.4);}
 g.larvaProx-=dt;if(!g.larva&&g.larvaProx<=0){const cx1=W*.62,cy1=H*.55,a=rr(0,7),r=rr(0,.8);g.larva={x:cx1+Math.cos(a)*r*W*.28,y:cy1+Math.sin(a)*r*H*.3,t:4};}
 if(g.larva){g.larva.t-=dt;if(g.larva.t<=0){g.larva=null;g.larvaProx=rr(4,7);}}
 // operárias saem de dentro do ninho
 if(g.ins.filter(i=>i.vivo&&i.t==='op').length<F.n*.6&&Math.random()<dt*3)g.ins.push(novoInseto('op'));
 const cx0=W*.62,cy0=H*.55;
 for(const i of g.ins){if(!i.vivo)continue;i.f+=dt*12;
  if(Math.random()<dt*1.5){const a=rr(0,7);i.vx=Math.cos(a)*i.vel;i.vy=Math.sin(a)*i.vel;}
  if(i.t==='sold'&&g.ling){const dx=g.ling.tx-i.x,dy=g.ling.ty-i.y,d=Math.hypot(dx,dy)||1;i.vx+=dx/d*40*dt;i.vy+=dy/d*40*dt;}
  i.x+=i.vx*dt;i.y+=i.vy*dt;
  const ex=(i.x-cx0)/(W*.34),ey=(i.y-cy0)/(H*.38);if(ex*ex+ey*ey>1){i.vx=-i.vx;i.vy=-i.vy;i.x+=i.vx*dt*2;i.y+=i.vy*dt*2;}}
 // língua
 if(g.ling){const L=g.ling,[bx,by]=boca();const dist=Math.hypot(L.tx-bx,L.ty-by);const sp=1400/Math.max(120,dist);
  if(L.ida){L.p+=sp*dt;if(L.p>=1){L.p=1;L.ida=false;
    if(L.bateu){msg('🪵 A língua bateu no graveto. Mire por outro lado.');beep(220,.08);g.cd=.35;}
    else{for(const i of g.ins){if(i.vivo&&Math.hypot(i.x-L.tx,i.y-L.ty)<16){i.vivo=false;L.pegou.push(i);}}
    if(g.larva&&Math.hypot(g.larva.x-L.tx,g.larva.y-L.ty)<22){g.comidos+=3;S.fp+=10;g.larva=null;g.larvaProx=rr(4,7);beep(1300,.12);msg('🐛 Câmara de larvas! +10 e conta 3 insetos.');}}
    const sold=L.pegou.filter(i=>i.t==='sold').length,ops=L.pegou.length-sold;
    if(sold){g.mordidas+=1;S.fp-=10;beep(150,.3,.07);msg('⚔️ Mordida de soldado no focinho! −10.');g.cd=.6;}
    if(ops){g.comidos+=ops;S.fp+=2*ops;beep(900+ops*60,.05);}}}
  else{L.p-=sp*1.3*dt;for(const i of L.pegou){i.x=bx+(L.tx-bx)*L.p;i.y=by+(L.ty-by)*L.p;}if(L.p<=0){g.ling=null;g.cd=Math.max(g.cd,.08);}}}
 g.ins=g.ins.filter(i=>i.vivo||(g.ling&&g.ling.pegou.includes(i)));
 if(g.comidos>=F.meta||g.t>=g.dur||g.mordidas>3)terminar();}
function desenhaInseto(i){const g=S.g;cx.save();cx.translate(i.x,i.y);cx.rotate(Math.atan2(i.vy,i.vx));
 const formiga=g.tipoN==='formiga',sold=i.t==='sold';const s=sold?1.35:1;cx.scale(s,s);
 cx.strokeStyle=formiga?'#3e2723':'#795548';cx.lineWidth=1;for(let k=-1;k<=1;k++){const w=Math.sin(i.f+k)*2;cx.beginPath();cx.moveTo(k*3,0);cx.lineTo(k*3+w,-6);cx.moveTo(k*3,0);cx.lineTo(k*3-w,6);cx.stroke();}
 if(formiga){cx.fillStyle=sold?'#b71c1c':'#4e342e';cx.beginPath();cx.ellipse(-6,0,4.5,3.2,0,0,7);cx.fill();cx.beginPath();cx.ellipse(0,0,2.6,2,0,0,7);cx.fill();cx.beginPath();cx.ellipse(5,0,sold?4:3,sold?3.4:2.6,0,0,7);cx.fill();}
 else{cx.fillStyle='#fff3e0';cx.beginPath();cx.ellipse(-3,0,6,3.6,0,0,7);cx.fill();cx.strokeStyle='#d7ccc8';cx.stroke();cx.fillStyle=sold?'#3e2723':'#bf8f5b';cx.beginPath();cx.ellipse(5,0,sold?5:3,sold?3.6:2.6,0,0,7);cx.fill();}
 if(sold){cx.strokeStyle='#1b0f0b';cx.lineWidth=1.6;cx.beginPath();cx.moveTo(8,-2);cx.quadraticCurveTo(13,-3,12,1);cx.moveTo(8,2);cx.quadraticCurveTo(13,3,12,-1);cx.stroke();}
 cx.restore();}
function desenha(){const g=S.g;if(!g||!cx)return;
 cx.clearRect(0,0,W,H);cx.fillStyle='#f5ecd7';cx.fillRect(0,0,W,H);
 const cx0=W*.62,cy0=H*.55;
 // ninho aberto
 const gr=cx.createRadialGradient(cx0,cy0,10,cx0,cy0,W*.36);gr.addColorStop(0,'#8d6e63');gr.addColorStop(.6,'#a1887f');gr.addColorStop(1,'#d7ccc8');cx.fillStyle=gr;cx.beginPath();cx.ellipse(cx0,cy0,W*.36,H*.41,0,0,7);cx.fill();
 cx.fillStyle='rgba(62,39,35,.45)';for(let k=0;k<14;k++){const a=k*.9,r=(k%5)/5;cx.beginPath();cx.ellipse(cx0+Math.cos(a)*r*W*.25,cy0+Math.sin(a)*r*H*.28,10,6,a,0,7);cx.fill();}
 cx.fillStyle='#5d4037';cx.font='bold 12px system-ui';cx.textAlign='center';cx.fillText(g.tipoN==='formiga'?'formigueiro aberto':'cupinzeiro aberto',cx0,cy0-H*.43+12);
 // gravetos e larvas
 for(const sg of g.gal){cx.strokeStyle='#5d4037';cx.lineWidth=7;cx.lineCap='round';cx.beginPath();cx.moveTo(sg[0],sg[1]);cx.lineTo(sg[2],sg[3]);cx.stroke();cx.strokeStyle='#8d6e63';cx.lineWidth=3;cx.beginPath();cx.moveTo(sg[0],sg[1]-1);cx.lineTo(sg[2],sg[3]-1);cx.stroke();
  const mx=(sg[0]+sg[2])/2,my=(sg[1]+sg[3])/2;cx.strokeStyle='#5d4037';cx.lineWidth=3;cx.beginPath();cx.moveTo(mx,my);cx.lineTo(mx+8,my-12);cx.stroke();}
 if(g.larva){const L=g.larva,pul=1+Math.sin(performance.now()/120)*.12;cx.strokeStyle='rgba(255,193,7,.9)';cx.lineWidth=3;cx.beginPath();cx.arc(L.x,L.y,20*pul,0,7);cx.stroke();
  cx.fillStyle='#fffde7';for(let k=0;k<7;k++){const a=k*.9;cx.beginPath();cx.ellipse(L.x+Math.cos(a)*(k?8:0),L.y+Math.sin(a)*(k?6:0),5,3.4,a,0,7);cx.fill();cx.strokeStyle='#e0c97a';cx.lineWidth=1;cx.stroke();}
