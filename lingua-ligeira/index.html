<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Língua Ligeira</title>
<style>
:root{--main:#6d4c41;--deep:#4e342e;--soft:#efebe9;--line:#e0d6d1;--ink:#2a1f1b;--mut:#6d5f59}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:var(--ink);line-height:1.45}
.wrap{max-width:780px;margin:0 auto;padding:12px 14px 40px}
a.hub{color:var(--deep);font-weight:700;text-decoration:none;font-size:.9rem}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
h1{font-size:1.4rem;color:var(--deep)}h2{font-size:1.15rem;color:var(--deep);margin-bottom:6px}
.hud{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--soft);color:var(--deep);border-radius:99px;padding:5px 11px;font-weight:700;font-size:.86rem}
.card{border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;background:#fff}
.btn{background:var(--main);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--deep)}.btn.ghost{background:#fff;color:var(--deep);border:2px solid var(--main)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.small{font-size:.86rem;color:var(--mut)}
canvas{width:100%;max-width:760px;margin:0 auto;display:block;border:2px solid var(--line);border-radius:16px;touch-action:none;background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:6px;justify-content:center;margin-top:10px}
.pad button{border:2px solid var(--line);background:var(--soft);border-radius:12px;font-size:1.4rem;cursor:pointer;color:var(--deep);touch-action:manipulation}
.pad button:active{background:#dcedc8}
.tab{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:8px}.tab td{border-bottom:1px solid var(--line);padding:5px 4px;vertical-align:top}
.ops{display:grid;gap:8px;margin-top:10px}
.ops button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-size:.95rem;cursor:pointer;font-family:inherit;text-align:left;color:var(--ink)}
.ops button:hover{border-color:var(--main)}.ops button:disabled{opacity:.5;cursor:default}
.fb{margin-top:10px;padding:11px 13px;border-radius:12px;font-size:.93rem}
.fb.good{background:#e8f5e9;color:#1b5e20}.fb.bad{background:#ffebee;color:#8e1b1b}
.big{font-size:2.3rem;font-weight:800;color:var(--deep)}
.ranking{border:3px solid var(--main);border-radius:18px;padding:0 16px 12px;overflow:hidden;margin-top:12px}
.ranking h3{font-size:1rem;margin:0 -16px 8px;padding:10px 16px;background:var(--main);color:#fff}
.ranking ol{list-style:none}.ranking li{display:flex;justify-content:space-between;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:.92rem}
.ranking li:last-child{border-bottom:0}.rp{display:inline-block;min-width:2.1em;font-weight:800;color:var(--deep)}
.savebox{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.savebox input{flex:1;min-width:160px;border:2px solid var(--line);border-radius:12px;padding:11px;font-size:1rem;font-family:inherit}
.lamber{display:block;width:100%;max-width:420px;margin:10px auto 0;padding:16px;font-size:1.2rem;border-radius:16px;border:0;background:#c2185b;color:#fff;font-weight:800;font-family:inherit;touch-action:manipulation;cursor:pointer}.lamber:disabled{background:#d7ccc8;color:#8d6e63}
</style>
</head>
<body>
<div class="wrap">
<a class="hub" href="https://ernandes-sobreira.github.io/jogos-ambientais/">← Todos os jogos</a>
<header>
  <h1 id="tit">Língua Ligeira</h1>
  <div class="hud" id="hud" style="display:none"><span class="pill" id="hF">Fase 1/3</span><span class="pill" id="hP">0 pts</span><span class="pill" id="hR">🐜 0</span><span class="pill" id="hV">⚠️ 0</span><span class="pill" id="hT">⏱ 0</span></div>
</header>
<main id="tela"></main>
<div class="ranking" id="rankBox"><h3>Ranking Global</h3><ol id="rankList"><li><span>Carregando o ranking...</span></li></ol><p class="small" id="rankNote"></p></div>
</div>
<script>
const $=id=>document.getElementById(id);
const TAM=new Image();TAM.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 0 260 110"><path d="M46 54 C24 26 -26 26 -38 48 C-38 70 2 86 44 78 Z" fill="#4e4540"/><path d="M-30 46 C-10 38 20 42 40 56 M-32 58 C-8 54 18 60 40 66 M-26 68 C-4 68 18 72 40 74" stroke="#6d625a" stroke-width="2" fill="none"/><path d="M40 52 C56 36 110 34 134 44 C146 50 148 70 138 78 C120 88 70 88 50 80 C40 74 36 62 40 52 Z" fill="#8a7d72"/><rect x="58" y="74" width="12" height="26" rx="5" fill="#3e3632"/><rect x="74" y="76" width="11" height="24" rx="5" fill="#2f2926"/><rect x="118" y="74" width="13" height="26" rx="5" fill="#e8e2d8"/><rect x="118" y="82" width="13" height="6" fill="#2f2926"/><rect x="104" y="76" width="11" height="24" rx="5" fill="#d8d1c6"/><path d="M134 46 C150 44 164 48 176 54 L214 62 C216 64 214 66 212 66 L176 66 C162 70 148 72 138 72 Z" fill="#8a7d72"/><path d="M150 70 C130 64 110 52 96 44 L104 40 C118 48 138 58 156 62 Z" fill="#1b1716"/><path d="M156 61 C140 57 122 48 106 39 L110 37 C126 46 142 54 158 57 Z" fill="#f2ede4"/><path d="M150 71 C132 68 112 58 96 48 L95 52 C110 62 130 72 148 75 Z" fill="#f2ede4"/><circle cx="168" cy="54" r="2.4" fill="#111"/><ellipse cx="160" cy="47" rx="4" ry="3" fill="#6d625a"/><path d="M212 64 Q218 72 214 78" stroke="#c2185b" stroke-width="1.5" fill="none" opacity="0"/></svg>');
const rr=(a,b)=>a+Math.random()*(b-a);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let actx=null;function beep(f,d,v){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.setValueAtTime(v||.05,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(e){}}

/* Escala do jogo: o dia inteiro dura poucos segundos e cada lambida rende poucos insetos.
   O alarme dos soldados enche em cerca de 6 s, que representam os cerca de 40 s de uma visita real. */
const MUNDO=2000,ALARME=6;
const FASES=[
 {nome:'Campo de murundus',dur:75,meta:620,montes:9,regen:16,fogo:false,txt:'O tamanduá-bandeira visita um cupinzeiro, come depressa e vai para o próximo antes que os soldados reajam. Toque em LAMBER bem rápido e saia antes de o alarme encher.'},
 {nome:'Seca no campo',dur:80,meta:560,montes:7,regen:26,fogo:false,txt:'Na seca há menos cupinzeiros perto. Um cupinzeiro visitado há pouco rende menos. Espalhe as visitas.'},
 {nome:'Fogo no campo',dur:85,meta:500,montes:8,regen:22,fogo:true,txt:'Uma frente de fogo avança pelo campo. No dia a dia o tamanduá anda devagar, arrastando as patas: fique longe das chamas e continue comendo.'}
];
const PERG=[
 {q:'Por que o tamanduá-bandeira come pouco tempo em cada ninho de formiga ou cupim?',o:['Para escapar da defesa dos soldados e não acabar com a colônia','Porque a língua dele cansa depois de poucas lambidas','Porque os cupins fogem do ninho quando ele chega']},
 {q:'Quantas vezes por minuto a língua do tamanduá-bandeira pode entrar e sair do ninho, segundo o Zoológico Nacional Smithsonian?',o:['Até 150 vezes','Até 15 vezes','Até 1.500 vezes']},
 {q:'Segundo a National Geographic Brasil, em que bioma o tamanduá-bandeira vem sofrendo as maiores reduções de população?',o:['No Cerrado','No Pantanal','Na Amazônia']}
];
let S,cv,cx,raf=null,last=0,W=760,H=380;
function hud(){$('hud').style.display='flex';$('hF').textContent='Fase '+(S.f+1)+'/3';$('hP').textContent=(S.tot+S.fp)+' pts';
 if(S.g){$('hR').textContent='🐜 '+S.g.insetos+'/'+FASES[S.f].meta;$('hV').textContent='⚠️ '+S.g.picadas+' ataques';$('hT').textContent='⏱ '+Math.max(0,Math.ceil(S.g.dur-S.g.t))+' s';}}
function inicio(){
 parar();$('hud').style.display='none';$('rankBox').style.display='block';
 $('tela').innerHTML=`<div class="card"><h2>Coma como um tamanduá-bandeira</h2>
 <table class="tab"><tr><td><img src="${TAM.src}" width="90" alt="tamanduá-bandeira"></td><td>O tamanduá-bandeira não tem dentes. Ele abre o cupinzeiro com as garras e lambe os insetos com a língua comprida e pegajosa.</td></tr>
 <tr><td>👆</td><td>Toque num cupinzeiro para andar até ele. Lá, toque em LAMBER o mais rápido que puder.</td></tr>
 <tr><td>🚨</td><td>Enquanto ele come, o alarme da colônia sobe. Se encher, os soldados atacam: −20, e o tamanduá sai.</td></tr>
 <tr><td>🌱</td><td>Sair antes do alarme encher vale +10: a colônia continua viva para outra visita.</td></tr></table>
 <p class="small" style="margin-top:8px">🎯 Meta: comer a quantidade de insetos da fase com no máximo 2 ataques de soldados.</p>
 <div class="row" style="margin-top:12px"><button class="btn" onclick="novo()">Começar →</button></div></div>`;
}
function novo(){S={f:0,tot:0,fp:0};salvo=false;$('rankBox').style.display='none';fase();}
function fase(){const F=FASES[S.f];S.fp=0;S.g=null;hud();
 $('tela').innerHTML=`<div class="card"><h2>Fase ${S.f+1}: ${F.nome}</h2><p>${F.txt}</p><p class="small" style="margin-top:6px">🎯 Meta: ${F.meta} insetos em ${F.dur} s, com no máximo 2 ataques.</p><div class="row" style="margin-top:12px"><button class="btn" id="bg">Começar o dia →</button></div></div>`;
 $('bg').onclick=jogar;}
const CHAO=()=>H-70;
function jogar(){const F=FASES[S.f];
 $('tela').innerHTML=`<div class="card"><canvas id="cv"></canvas><button class="lamber" id="lb" disabled>👅 LAMBER</button><p class="small" style="margin-top:8px;text-align:center">Toque num cupinzeiro para andar. No teclado: setas para andar e espaço para lamber.</p></div>`;
 cv=$('cv');if(cv.clientWidth<520){W=440;H=360;}else{W=760;H=380;}cv.width=W;cv.height=H;cx=cv.getContext('2d');
 const montes=[];const gap=(MUNDO-200)/F.montes;for(let i=0;i<F.montes;i++)montes.push({x:160+i*gap+rr(-50,50),cheio:1,alarme:0,h:rr(46,70),tipo:i%3===2?'formiga':'cupim'});
 S.g={t:0,dur:F.dur,px:80,alvo:null,montes,atual:null,insetos:0,picadas:0,cam:0,olha:1,fim:false,msg:'',msgT:0,fogoX:-200,lamb:0,lingua:0,flicks:[]};
 cv.onpointerdown=e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width+S.g.cam;let best=null,bd=60;for(const m of S.g.montes){const d=Math.abs(m.x-x);if(d<bd){bd=d;best=m;}}if(best)ir(best);else{S.g.alvo={x};S.g.atual=null;}};
 $('lb').onpointerdown=e=>{e.preventDefault();lamber();};
 hud();last=performance.now();parar();raf=requestAnimationFrame(loop);}
let kE=0,kD=0;
document.addEventListener('keydown',e=>{if(!S||!S.g||S.g.fim)return;if(e.key===' '){lamber();e.preventDefault();}if(e.key==='ArrowLeft')kE=1;if(e.key==='ArrowRight')kD=1;});
document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft')kE=0;if(e.key==='ArrowRight')kD=0;});
function ir(m){const g=S.g;g.alvo={x:m.x-70*(m.x>g.px?1:-1),m};g.atual=null;}
function msg(t){S.g.msg=t;S.g.msgT=2;}
function sair(bom){const g=S.g,m=g.atual;if(!m)return;if(bom&&m.visitou>0){S.fp+=10;msg('🌱 Saiu a tempo: a colônia continua viva. +10.');beep(900,.1);}g.atual=null;m.alarme=0;m.visitou=0;}
function lamber(){const g=S.g;if(!g||g.fim||!g.atual)return;const m=g.atual;if(m.cheio<=0.02){msg('Este ninho está quase vazio. Procure outro.');return;}
 const ganho=Math.max(1,Math.round(4*m.cheio));g.insetos+=ganho;S.fp+=ganho>2?1:0;m.cheio=Math.max(0,m.cheio-.025);m.visitou=(m.visitou||0)+1;g.lingua=.12;beep(500+ganho*40,.02,.02);
 g.flicks.push({x:m.x,y:CHAO()-m.h*.6,t:.5,n:ganho});hud();
 if(g.insetos>=FASES[S.f].meta)terminar();}
function update(dt){const g=S.g;if(!g||g.fim)return;const F=FASES[S.f];
 g.t+=dt;g.msgT-=dt;g.lingua-=dt;
 if(kE||kD){g.alvo={x:g.px+(kD-kE)*80};if(g.atual)sair(true);}
 if(g.alvo){const dx=g.alvo.x-g.px;if(Math.abs(dx)>3){if(g.atual)sair(true);g.px+=Math.sign(dx)*Math.min(Math.abs(dx),110*dt);g.olha=Math.sign(dx);}else{if(g.alvo.m){g.atual=g.alvo.m;g.olha=g.atual.x>g.px?1:-1;}g.alvo=null;}}
 // tecla: chegar perto de um ninho
 if(!g.atual&&!g.alvo){for(const m of g.montes){if(Math.abs(m.x-(g.px+70*g.olha))<20){g.atual=m;break;}}}
 for(const m of g.montes){if(m!==g.atual){m.cheio=Math.min(1,m.cheio+dt/F.regen);m.alarme=Math.max(0,m.alarme-dt*.8);}}
 if(g.atual){const m=g.atual;if(m.visitou>0)m.alarme+=dt;if(m.alarme>=ALARME){g.picadas++;S.fp-=20;beep(160,.35,.07);msg('🐜 Os soldados atacaram o focinho! −20.');m.cheio=Math.max(0,m.cheio-.3);sair(false);g.alvo={x:g.px-90*g.olha};}}
 $('lb').disabled=!g.atual;
 for(const f of g.flicks)f.t-=dt;g.flicks=g.flicks.filter(f=>f.t>0);
 if(F.fogo){g.fogoX+=dt*(18+g.t*.25);if(g.px<g.fogoX+40){g.picadas+=0;S.fp-=1;if(g.msgT<0)msg('🔥 O fogo está perto! Afaste-se das chamas.');g.px=Math.max(g.px,g.fogoX+40);if(g.atual&&g.atual.x<g.fogoX+40)sair(false);}
  for(const m of g.montes)if(m.x<g.fogoX)m.cheio=Math.min(m.cheio,.15);}
 g.cam+=((g.px-W*.4)-g.cam)*Math.min(1,dt*4);g.cam=Math.max(0,Math.min(MUNDO-W,g.cam));
 if(g.t>=g.dur||g.picadas>2)terminar();}
function desenhaMonte(m){const b=CHAO();cx.fillStyle=m.tipo==='cupim'?'#a1887f':'#bcaaa4';cx.beginPath();cx.moveTo(m.x-32,b);cx.quadraticCurveTo(m.x-26,b-m.h*.7,m.x-6,b-m.h);cx.quadraticCurveTo(m.x+6,b-m.h-6,m.x+14,b-m.h*.8);cx.quadraticCurveTo(m.x+28,b-m.h*.5,m.x+32,b);cx.fill();
 cx.fillStyle='rgba(78,52,46,.35)';for(let i=0;i<4;i++){cx.beginPath();cx.arc(m.x-14+i*9,b-m.h*(.3+i*.12),2.5,0,7);cx.fill();}
 cx.fillStyle='#4e342e';cx.font='bold 10px system-ui';cx.textAlign='center';cx.fillText(m.tipo==='cupim'?'cupinzeiro':'formigueiro',m.x,b+14);
 cx.fillStyle='#e0e0e0';cx.fillRect(m.x-22,b-m.h-20,44,5);cx.fillStyle='#8bc34a';cx.fillRect(m.x-22,b-m.h-20,44*m.cheio,5);
 if(m.alarme>0){cx.fillStyle='#ffe0e0';cx.fillRect(m.x-22,b-m.h-12,44,5);cx.fillStyle=m.alarme/ALARME>.7?'#e53935':'#ff9800';cx.fillRect(m.x-22,b-m.h-12,44*Math.min(1,m.alarme/ALARME),5);}}
function desenha(){const g=S.g;if(!g||!cx)return;const F=FASES[S.f];
 cx.clearRect(0,0,W,H);const sky=cx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#e3f2fd');sky.addColorStop(1,'#fff8e1');cx.fillStyle=sky;cx.fillRect(0,0,W,H);
 cx.save();cx.translate(-g.cam,0);
 cx.fillStyle=S.f===0?'#c5e1a5':'#e6ee9c';cx.fillRect(0,CHAO(),MUNDO,H-CHAO());
 cx.strokeStyle='rgba(104,159,56,.5)';for(let x=0;x<MUNDO;x+=14){cx.beginPath();cx.moveTo(x,CHAO()+4);cx.lineTo(x+3,CHAO()-6);cx.stroke();}
 for(const m of g.montes)desenhaMonte(m);
 if(F.fogo){const fx=g.fogoX;cx.fillStyle='rgba(97,97,97,.5)';cx.fillRect(0,CHAO(),Math.max(0,fx),H-CHAO());const gr=cx.createLinearGradient(fx-120,0,fx+60,0);gr.addColorStop(0,'rgba(158,158,158,0)');gr.addColorStop(1,'rgba(158,158,158,.45)');cx.fillStyle=gr;cx.fillRect(fx-120,0,180,CHAO());cx.font='30px system-ui';cx.textAlign='center';for(let y=0;y<3;y++)cx.fillText('🔥',fx,CHAO()-4-y*26);}
 // tamanduá
 if(TAM.complete){const w=W<500?170:210,h=w*110/260;cx.save();cx.translate(g.px,CHAO()-h*.44);cx.scale(g.olha,1);const bob=g.alvo?Math.sin(g.t*14)*1.5:0;cx.drawImage(TAM,-w*.5,-h*.5+bob,w,h);
  if(g.atual&&g.lingua>0){cx.strokeStyle='#c2185b';cx.lineWidth=2.5;cx.beginPath();cx.moveTo(w*.42,h*.12);cx.lineTo(w*.42+(Math.abs(g.atual.x-g.px)-w*.38),h*.05);cx.stroke();}cx.restore();}
 for(const f of g.flicks){cx.fillStyle='rgba(78,52,46,'+(f.t*2)+')';cx.font='bold 12px system-ui';cx.textAlign='center';cx.fillText('+'+f.n,f.x,f.y-(.5-f.t)*40);}
 cx.restore();
 if(g.msgT>0){cx.font='bold 14px system-ui';cx.textAlign='center';cx.fillStyle='rgba(255,255,255,.9)';cx.fillRect(0,4,W,24);cx.fillStyle='#4e342e';cx.fillText(g.msg,W/2,21);}
 cx.fillStyle='rgba(255,255,255,.85)';cx.fillRect(W-170,H-20,160,10);cx.fillStyle='#6d4c41';cx.fillRect(W-170+160*g.px/MUNDO-2,H-20,4,10);if(F.fogo){cx.fillStyle='#e53935';cx.fillRect(W-170,H-20,Math.max(0,160*g.fogoX/MUNDO),10);}}
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);desenha();if(S.g&&!S.g.fim){hud();raf=requestAnimationFrame(loop);}}
function parar(){if(raf)cancelAnimationFrame(raf);raf=null;}
function terminar(){const g=S.g;if(g.fim)return;g.fim=true;parar();const F=FASES[S.f],ok=g.insetos>=F.meta&&g.picadas<=2;
 const sobra=Math.max(0,Math.ceil(g.dur-g.t));if(ok){S.fp+=30+sobra;beep(880,.2);}hud();
 $('tela').innerHTML=`<div class="card"><h2>${ok?'O tamanduá comeu bem hoje':'O dia não rendeu'}</h2>
 <p>Insetos: <b>${g.insetos}</b> de ${F.meta}. Ataques de soldados: <b>${g.picadas}</b> (máximo 2).</p>
 ${ok?`<div class="fb good">🎯 Meta cumprida! +30 e +${sobra} pelo tempo que sobrou.</div>`:'<div class="fb bad">A meta não foi cumprida. Lamba rápido, saia antes do alarme ficar vermelho e passe para outro ninho.</div>'}
 <div class="row" style="margin-top:12px">${ok?'<button class="btn" id="bq">Pergunta da fase →</button>':'<button class="btn" id="br">Tentar de novo</button><button class="btn ghost" id="be">Encerrar</button>'}</div></div>`;
 if(ok)$('bq').onclick=pergunta;else{$('br').onclick=fase;$('be').onclick=()=>{S.tot+=Math.max(0,S.fp);S.fp=0;final(false);};}}
function pergunta(){
 const P=PERG[S.f],ops=shuf(P.o.map((t,i)=>({t,c:i===0})));
 $('tela').innerHTML=`<div class="card"><h2>Pergunta da fase</h2><p style="margin:6px 0 4px">${P.q}</p><p class="small">Acerto +20, erro −10.</p><div class="ops">${ops.map((o,i)=>`<button data-i="${i}">${o.t}</button>`).join('')}</div><div id="pf"></div></div>`;
 document.querySelectorAll('#tela .ops button').forEach(b=>b.onclick=()=>{const o=ops[+b.dataset.i];S.fp+=o.c?20:-10;beep(o.c?880:170,.15);hud();
  document.querySelectorAll('#tela .ops button').forEach((x,j)=>{x.disabled=true;if(ops[j].c){x.style.borderColor='#2e7d32';x.style.opacity=1;}});
  $('pf').innerHTML=`<div class="fb ${o.c?'good':'bad'}">${o.c?'✅ +20.':'❌ −10. A resposta certa está marcada em verde.'}<div class="row" style="margin-top:10px"><button class="btn" id="bn">${S.f===FASES.length-1?'Ver resultado →':'Próxima fase →'}</button></div></div>`;
  $('bn').onclick=()=>{S.tot+=S.fp;S.fp=0;if(S.f===FASES.length-1)final(true);else{S.f++;fase();}};});
}
function final(tudo){
 S.g=null;$('rankBox').style.display='block';const nivel=tudo?'3 fases':'Fase '+(S.f+1);
 $('tela').innerHTML=`<div class="card" style="text-align:center"><div class="big">${tudo?'🏆':'<img src="'+TAM.src+'" width="150" alt="tamanduá-bandeira">'}</div><h2>${tudo?'Tamanduá bem alimentado!':'Fim de jogo'}</h2><div class="big">${S.tot} pts</div>
 <div class="savebox"><input id="pName" maxlength="20" placeholder="Seu nome"><button class="btn" id="bS">Salvar no ranking</button></div><p class="small" id="sSt"></p>
 <div class="row" style="justify-content:center;margin-top:12px"><button class="btn ghost" onclick="inicio()">Jogar de novo</button></div>
 <div class="small" style="margin-top:12px;text-align:left">📚 Fontes: Smithsonian's National Zoo, língua que entra e sai até 150 vezes por minuto e consumo de cerca de 140 insetos por ninho a cada visita; Zoológico de Leipzig, visita de cerca de 40 segundos por ninho para evitar os soldados, o que impede que a colônia inteira seja eliminada; National Geographic Brasil, cerca de 30 mil formigas e cupins por dia e reduções drásticas no Cerrado, com populações relativamente estáveis no Pantanal e na Amazônia; Smithsonian, andar lento e arrastado no dia a dia. A duração do dia, os rendimentos e a velocidade do fogo são regras do jogo.</div></div>`;
 $('bS').onclick=()=>salvar(nivel);
}

const GAME_ID="lingua-ligeira";let db=null,fs=null,salvo=false;
(async()=>{try{const a=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");const f=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");db=f.getFirestore(a.initializeApp(firebaseConfig));fs=f;carregar();}catch(e){$('rankList').innerHTML='<li><span>Ranking indisponível sem internet.</span></li>';$('rankNote').textContent='O jogo funciona normalmente. O ranking volta quando houver conexão.';}})();
async function carregar(){if(!db)return;try{const q=fs.query(fs.collection(db,'games',GAME_ID,'scores'),fs.orderBy('score','desc'),fs.limit(10));const sn=await fs.getDocs(q);const r=[];sn.forEach(d=>r.push(d.data()));$('rankNote').textContent='Maior pontuação primeiro.';$('rankList').innerHTML=r.length?r.map((x,i)=>`<li><span><span class="rp">${i+1}º</span>${esc(x.name||'?')}</span><span>${(Number(x.score)||0).toLocaleString('pt-BR')} pts · ${esc(x.level||'')}</span></li>`).join(''):'<li><span>Seja o primeiro do ranking!</span></li>';}catch(e){$('rankList').innerHTML='<li><span>Não foi possível carregar o ranking.</span></li>';}}
async function salvar(nivel){if(salvo)return;const nome=$('pName').value.trim(),st=$('sSt');if(!nome){st.textContent='Digite seu nome primeiro.';return;}if(!db){st.textContent='Sem conexão com o ranking. O resultado não foi enviado.';return;}
 $('bS').disabled=true;try{await fs.addDoc(fs.collection(db,'games',GAME_ID,'scores'),{name:nome.slice(0,20),score:Math.max(0,S.tot),level:nivel,ts:fs.serverTimestamp()});salvo=true;st.textContent='Salvo no Ranking Global!';carregar();}catch(e){$('bS').disabled=false;st.textContent='Erro ao salvar. Tente de novo.';}}
window.__ll={get S(){return S},update,lamber,ir,parar,FASES};

inicio();
