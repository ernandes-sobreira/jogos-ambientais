<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pistas na Mata</title>
<style>
:root{--main:#558b2f;--deep:#33691e;--soft:#f1f8e9;--line:#dcedc8;--ink:#1f2a12;--mut:#55624a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:var(--ink);line-height:1.45}
.wrap{max-width:780px;margin:0 auto;padding:12px 14px 40px}
a.hub{color:var(--deep);font-weight:700;text-decoration:none;font-size:.9rem}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
h1{font-size:1.4rem;color:var(--deep)}h2{font-size:1.15rem;color:var(--deep);margin-bottom:6px}
.hud{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--soft);color:var(--deep);border-radius:99px;padding:5px 11px;font-weight:700;font-size:.86rem}
.card{border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;background:#fff}
.btn{background:var(--main);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--deep)}.btn.ghost{background:#fff;color:var(--deep);border:2px solid var(--main)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.small{font-size:.86rem;color:var(--mut)}
canvas{width:100%;max-width:760px;margin:0 auto;display:block;border:2px solid var(--line);border-radius:16px;touch-action:none;background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:6px;justify-content:center;margin-top:10px}
.pad button{border:2px solid var(--line);background:var(--soft);border-radius:12px;font-size:1.4rem;cursor:pointer;color:var(--deep);touch-action:manipulation}
.pad button:active{background:#dcedc8}
.tab{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:8px}.tab td{border-bottom:1px solid var(--line);padding:5px 4px;vertical-align:top}
.ops{display:grid;gap:8px;margin-top:10px}
.ops button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-size:.95rem;cursor:pointer;font-family:inherit;text-align:left;color:var(--ink)}
.ops button:hover{border-color:var(--main)}.ops button:disabled{opacity:.5;cursor:default}
.fb{margin-top:10px;padding:11px 13px;border-radius:12px;font-size:.93rem}
.fb.good{background:#e8f5e9;color:#1b5e20}.fb.bad{background:#ffebee;color:#8e1b1b}
.big{font-size:2.3rem;font-weight:800;color:var(--deep)}
.ranking{border:3px solid var(--main);border-radius:18px;padding:0 16px 12px;overflow:hidden;margin-top:12px}
.ranking h3{font-size:1rem;margin:0 -16px 8px;padding:10px 16px;background:var(--main);color:#fff}
.ranking ol{list-style:none}.ranking li{display:flex;justify-content:space-between;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:.92rem}
.ranking li:last-child{border-bottom:0}.rp{display:inline-block;min-width:2.1em;font-weight:800;color:var(--deep)}
.savebox{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.savebox input{flex:1;min-width:160px;border:2px solid var(--line);border-radius:12px;padding:11px;font-size:1rem;font-family:inherit}
</style>
</head>
<body>
<div class="wrap">
<a class="hub" href="https://ernandes-sobreira.github.io/jogos-ambientais/">← Todos os jogos</a>
<header>
  <h1>🐾 Pistas na Mata</h1>
  <div class="hud" id="hud" style="display:none"><span class="pill" id="hF">Fase 1/3</span><span class="pill" id="hP">0 pts</span><span class="pill" id="hR">🐾 0</span><span class="pill" id="hV">🔎 0</span><span class="pill" id="hT">⏱ 0 s</span></div>
</header>
<main id="tela"></main>
<div class="ranking" id="rankBox"><h3>Ranking Global</h3><ol id="rankList"><li><span>Carregando o ranking...</span></li></ol><p class="small" id="rankNote"></p></div>
</div>
<script>
const $=id=>document.getElementById(id);
const rr=(a,b)=>a+Math.random()*(b-a);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let actx=null;function beep(f,d,v){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.setValueAtTime(v||.05,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(e){}}
/* Critérios das pegadas: Prist, Silva e Papi, Guia de rastros de mamíferos neotropicais de médio e grande porte (ICMBio).
   Tamanhos em cm seguem o guia. Mapa, tempo e pontos são regras do jogo. */
const SP={
 onca:{n:'Onça-pintada',cm:[11,11.5],dica:'Quatro dedos arredondados, sem marca de unha, e almofada grande em forma de trapézio. Cerca de 11 cm.'},
 cachorro:{n:'Cachorro-do-mato',cm:[5,4.2],dica:'Quatro dedos alongados com marca de unha logo à frente e almofada pequena. Pegada simétrica e pequena, cerca de 5 cm.'},
 quati:{n:'Quati',cm:[9,4.5],dica:'Cinco dedos longos e finos com unhas. A pata de trás é comprida e o calcanhar marca forte.'},
 maopelada:{n:'Mão-pelada',cm:[7,6.8],dica:'Cinco dedos finos e abertos com unhas, parecendo uma mãozinha.'},
 anta:{n:'Anta',cm:[13.5,13],dica:'Três dedos largos e arredondados, o do meio maior, e almofada em trapézio. Pegada grande, cerca de 13 cm.'},
 capivara:{n:'Capivara',cm:[10.5,9.5],dica:'Três dedos grossos unidos por uma membrana entre eles.'},
 veado:{n:'Veado-mateiro',cm:[5.2,4.1],dica:'Dois cascos formando um triângulo pontudo, cerca de 5 cm.'},
 queixada:{n:'Queixada',cm:[4.5,5],dica:'Dois dedos elípticos bem afastados um do outro. Isso separa a queixada dos veados.'},
 tamandua:{n:'Tamanduá-bandeira',cm:[10,6.5],dica:'Pata de trás com almofada comprida e cinco dedos curtos e largos, parecida com o pé de uma criança.'},
 paca:{n:'Paca',cm:[4.5,3.5],dica:'Na pata de trás marcam três dedos centrais grandes, paralelos e com unhas.'}
};
const FASES=[
 {nome:'Rastros de carnívoros',sp:['onca','cachorro','quati','maopelada'],n:6,meta:4,dur:110,txt:'Siga pela mata e encontre pegadas no chão. Repare no número de dedos, nas unhas e no tamanho.'},
 {nome:'Cascos e dedos largos',sp:['anta','capivara','veado','queixada'],n:7,meta:5,dur:110,txt:'Agora aparecem animais de casco e de dedos largos. Conte os dedos e veja se eles estão juntos ou afastados.'},
 {nome:'Trilha completa',sp:['onca','cachorro','quati','anta','capivara','veado','queixada','tamandua','paca'],n:8,meta:6,dur:120,txt:'Todos os rastros podem aparecer. Tem lama que atrasa e o tempo é curto.'}
];
const PERG=[
 {q:'Uma pegada tem quatro dedos e nenhuma marca de unha. Segundo o guia de rastros, esse padrão é típico de qual grupo?',o:['Felinos, como a onça-pintada','Canídeos, como o cachorro-do-mato','Procionídeos, como o quati']},
 {q:'Como separar a pegada de uma queixada da pegada de um veado?',o:['Na queixada os dois dedos ficam bem afastados','A queixada deixa cinco dedos com unhas','O veado deixa três dedos unidos por membrana']},
 {q:'Por que o pesquisador não deve pisar em cima de uma pegada antes de registrar?',o:['Porque o rastro se apaga e a informação se perde','Porque a pegada pode transmitir doenças pelo sapato','Porque o animal sente o cheiro e abandona a área']}
];
const MW=1500,MH=1100;
let S,cv,cx,raf=null,last=0,W=760,H=480,inp={x:null,y:null},tec={};
function hud(){$('hud').style.display='flex';$('hF').textContent='Fase '+(S.f+1)+'/3';$('hP').textContent=(S.tot+S.fp)+' pts';
 if(S.g){$('hR').textContent='🐾 '+S.g.certos+'/'+FASES[S.f].meta;$('hV').textContent='🔎 '+S.g.vistos+'/'+FASES[S.f].n;$('hT').textContent='⏱ '+Math.max(0,Math.ceil(S.g.dur-S.g.t))+' s';}}
function inicio(){parar();$('hud').style.display='none';$('rankBox').style.display='block';
 $('tela').innerHTML=`<div class="card"><h2>Ande pela mata e desvende as pistas</h2>
 <table class="tab"><tr><td>🚶</td><td>Toque ou arraste no mapa para andar. No teclado, use as setas. Árvores bloqueiam o caminho e a lama atrasa.</td></tr>
 <tr><td>🔎</td><td>Quando chegar perto de uma pista, ela brilha. Pare ao lado dela para examinar com a lupa e diga de qual animal é a pegada. Acerto +20, erro −10.</td></tr>
 <tr><td>⚠️</td><td>Não pise em cima da pegada! Se passar por cima, o rastro se apaga: −5.</td></tr>
 <tr><td>📏</td><td>A lupa mostra uma régua em centímetros. O tamanho ajuda a separar animais parecidos.</td></tr></table>
 <p class="small" style="margin-top:8px">🎯 Meta: acertar a quantidade de pegadas da fase dentro do tempo.</p>
 <div class="row" style="margin-top:12px"><button class="btn" onclick="novo()">Começar →</button></div></div>`;}
function novo(){S={f:0,tot:0,fp:0};salvo=false;$('rankBox').style.display='none';fase();}
function fase(){const F=FASES[S.f];S.fp=0;S.g=null;hud();
 $('tela').innerHTML=`<div class="card"><h2>Fase ${S.f+1}: ${F.nome}</h2><p>${F.txt}</p><p class="small" style="margin-top:6px">🎯 Meta: acertar ${F.meta} de ${F.n} pegadas em ${F.dur} s.</p><div class="row" style="margin-top:12px"><button class="btn" id="bg">Entrar na trilha →</button></div></div>`;
 $('bg').onclick=jogar;}
function livre(x,y,r,g){if(x<r||y<r||x>MW-r||y>MH-r)return false;for(const a of g.arv)if(Math.hypot(a.x-x,a.y-y)<a.r+r)return false;return true;}
function gerar(){const F=FASES[S.f];const g={t:0,dur:F.dur,px:120,py:MH/2,vx:0,vy:0,ang:0,passo:0,arv:[],lama:[],pistas:[],certos:0,erros:0,vistos:0,pisadas:0,fim:false,msg:'',msgT:0,exame:null,parado:0,trilha:[]};
 // trilha sinuosa
 for(let x=60;x<=MW-60;x+=40)g.trilha.push([x,MH/2+Math.sin(x/170)*260+Math.sin(x/61)*40]);
 let k=0;while(g.arv.length<70&&k<3000){k++;const x=rr(40,MW-40),y=rr(40,MH-40),r=rr(18,34);if(Math.hypot(x-120,y-MH/2)<120)continue;if(g.trilha.some(([tx,ty])=>Math.hypot(tx-x,ty-y)<r+30))continue;if(g.arv.some(a=>Math.hypot(a.x-x,a.y-y)<a.r+r+26))continue;g.arv.push({x,y,r,c:Math.random()});}
 for(let i=0;i<(S.f===2?9:5);i++){const [tx,ty]=g.trilha[Math.floor(rr(4,g.trilha.length-2))];g.lama.push({x:tx+rr(-40,40),y:ty+rr(-30,30),rx:rr(40,70),ry:rr(22,36)});}
 const lista=[];for(let i=0;i<F.n;i++)lista.push(F.sp[i%F.sp.length]);
 const tipos=shuf(lista);k=0;
 while(g.pistas.length<F.n&&k<4000){k++;const x=rr(200,MW-60),y=rr(60,MH-60);if(!livre(x,y,26,g))continue;if(g.pistas.some(p=>Math.hypot(p.x-x,p.y-y)<190))continue;g.pistas.push({x,y,sp:tipos[g.pistas.length],ang:rr(0,7),st:0});}
 return g;}
function jogar(){$('tela').innerHTML=`<div class="card"><div style="position:relative"><canvas id="cv"></canvas><div id="lupa"></div></div><p class="small" style="margin-top:8px;text-align:center">Toque ou arraste para andar. Pare ao lado da pista para examinar.</p></div>`;
 cv=$('cv');if(cv.clientWidth<520){W=440;H=560;}else{W=760;H=480;}cv.width=W;cv.height=H;cx=cv.getContext('2d');S.g=gerar();inp.x=null;
 const pos=e=>{const r=cv.getBoundingClientRect(),g=S.g;return [(e.clientX-r.left)*W/r.width+cam()[0],(e.clientY-r.top)*H/r.height+cam()[1]];};
 cv.onpointerdown=e=>{if(S.g.exame)return;cv.setPointerCapture(e.pointerId);[inp.x,inp.y]=pos(e);e.preventDefault();};
 cv.onpointermove=e=>{if(e.buttons&&!S.g.exame)[inp.x,inp.y]=pos(e);};
 hud();last=performance.now();parar();raf=requestAnimationFrame(loop);}
document.addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')){tec[e.key]=1;if(S&&S.g&&!S.g.fim)e.preventDefault();}});
document.addEventListener('keyup',e=>{tec[e.key]=0;});
function cam(){const g=S.g;return [Math.max(0,Math.min(MW-W,g.px-W/2)),Math.max(0,Math.min(MH-H,g.py-H/2))];}
function msg(t){S.g.msg=t;S.g.msgT=2.4;}
function update(dt){const g=S.g;if(!g||g.fim||g.exame)return;g.t+=dt;g.msgT-=dt;
 const kx=(tec.ArrowRight?1:0)-(tec.ArrowLeft?1:0),ky=(tec.ArrowDown?1:0)-(tec.ArrowUp?1:0);let dx=0,dy=0;
 if(kx||ky){dx=kx;dy=ky;inp.x=null;}else if(inp.x!=null){dx=inp.x-g.px;dy=inp.y-g.py;if(Math.hypot(dx,dy)<5){dx=0;dy=0;inp.x=null;}}
 const naLama=g.lama.some(l=>((g.px-l.x)/l.rx)**2+((g.py-l.y)/l.ry)**2<1);let vmax=naLama?55:135;
 const d=Math.hypot(dx,dy);let tvx=0,tvy=0;if(d>0){const fr=inp.x!=null&&!(kx||ky)?Math.min(1,d/40):1;tvx=dx/d*vmax*fr;tvy=dy/d*vmax*fr;}
 const ac=Math.min(1,dt*8);g.vx+=(tvx-g.vx)*ac;g.vy+=(tvy-g.vy)*ac;
 let nx=g.px+g.vx*dt,ny=g.py+g.vy*dt;if(livre(nx,g.py,12,g))g.px=nx;else g.vx*=-.2;if(livre(g.px,ny,12,g))g.py=ny;else g.vy*=-.2;
 const sp=Math.hypot(g.vx,g.vy);if(sp>8)g.ang=Math.atan2(g.vy,g.vx);g.passo+=sp*dt*.12;
 if(naLama&&g.msgT<=0&&sp>20)msg('🟫 Lama! Aqui você anda devagar.');
 // pistas
 let perto=null;for(const p of g.pistas){if(p.st)continue;const dd=Math.hypot(p.x-g.px,p.y-g.py);
  if(dd<11&&sp>25){p.st=2;g.pisadas++;g.vistos++;S.fp-=5;beep(160,.25,.06);msg('👣 Você pisou na pegada e o rastro se apagou. −5.');continue;}
  if(dd<40)perto=p;}
 if(perto&&sp<22){g.parado+=dt;if(g.parado>.45){examinar(perto);g.parado=0;}}else g.parado=0;
 const F=FASES[S.f];if(g.certos>=F.meta&&g.pistas.every(p=>p.st)||g.t>=g.dur||g.pistas.every(p=>p.st))terminar();}
/* desenho da pegada na escala da régua */
function pegada(c,sp,x0,y0,k){c.save();c.translate(x0,y0);c.fillStyle='#4e342e';c.strokeStyle='#4e342e';c.lineCap='round';
 const el=(x,y,rx,ry,a)=>{c.beginPath();c.ellipse(x*k,y*k,rx*k,ry*k,a||0,0,7);c.fill();};
 const unha=(x,y,x2,y2)=>{c.lineWidth=Math.max(1.5,.25*k);c.beginPath();c.moveTo(x*k,y*k);c.lineTo(x2*k,y2*k);c.stroke();};
 if(sp==='onca'){c.beginPath();c.moveTo(-2.6*k,1.3*k);c.quadraticCurveTo(0,.6*k,2.6*k,1.3*k);c.quadraticCurveTo(3.9*k,1.6*k,3.6*k,3.4*k);c.quadraticCurveTo(3.4*k,5.4*k,2.2*k,5.2*k);c.quadraticCurveTo(1.1*k,4.6*k,0,5.5*k);c.quadraticCurveTo(-1.1*k,4.6*k,-2.2*k,5.2*k);c.quadraticCurveTo(-3.4*k,5.4*k,-3.6*k,3.4*k);c.quadraticCurveTo(-3.9*k,1.6*k,-2.6*k,1.3*k);c.fill();
  el(-4.3,-1.3,1.3,1.6,-.3);el(-1.5,-3.5,1.35,1.75);el(1.6,-3.6,1.35,1.75);el(4.3,-1.6,1.3,1.6,.3);}
 else if(sp==='cachorro'){el(0,1.1,1.1,1,0);el(-.9,-.9,.55,.85);el(.9,-.9,.55,.85);el(-1.6,.1,.5,.7,-.3);el(1.6,.1,.5,.7,.3);
  unha(-.95,-1.8,-1,-2.3);unha(.95,-1.8,1,-2.3);unha(-1.7,-.7,-1.9,-1.1);unha(1.7,-.7,1.9,-1.1);}
 else if(sp==='quati'){c.beginPath();c.moveTo(-1.6,0);c.ellipse(0,1.6*k,1.5*k,3.2*k,0,0,7);c.fill();for(let i=0;i<5;i++){const a=-1.2+i*.6,x=Math.sin(a)*2.2,y=-2.2-Math.cos(a)*1.4;el(x,y,.35,.9,a*.6);unha(x+Math.sin(a)*.8,y-1,x+Math.sin(a)*1.1,y-1.6);}}
 else if(sp==='maopelada'){el(0,1.4,1.8,1.5);for(let i=0;i<5;i++){const a=-1.25+i*.62,x=Math.sin(a)*2.4,y=-.3-Math.cos(a)*1.8;c.save();c.translate(x*k,y*k);c.rotate(a);c.beginPath();c.ellipse(0,0,.32*k,1.25*k,0,0,7);c.fill();c.lineWidth=Math.max(1.5,.22*k);c.beginPath();c.moveTo(0,-1.2*k);c.lineTo(0,-1.8*k);c.stroke();c.restore();}}
 else if(sp==='anta'){c.beginPath();c.moveTo(-3.4*k,1.6*k);c.lineTo(3.4*k,1.6*k);c.lineTo(2.4*k,5.6*k);c.lineTo(-2.4*k,5.6*k);c.closePath();c.fill();el(0,-3.6,2.5,2.6);el(-4.6,-.8,2,2.3,-.4);el(4.6,-.8,2,2.3,.4);el(-5.9,3,.8,1,0);}
 else if(sp==='capivara'){c.globalAlpha=.55;c.beginPath();c.moveTo(-3.6*k,-.5*k);c.quadraticCurveTo(0,-1.8*k,3.6*k,-.5*k);c.lineTo(2.4*k,2.6*k);c.lineTo(-2.4*k,2.6*k);c.closePath();c.fill();c.globalAlpha=1;
  el(0,-2.6,1.4,2.6);el(-2.9,-1.4,1.3,2.4,-.35);el(2.9,-1.4,1.3,2.4,.35);el(0,2.8,2.2,1.2);}
 else if(sp==='veado'){for(const sd of [-1,1]){c.beginPath();c.moveTo(sd*.2*k,2.5*k);c.quadraticCurveTo(sd*2.2*k,2.4*k,sd*1.7*k,.2*k);c.quadraticCurveTo(sd*1.2*k,-1.8*k,sd*.35*k,-2.7*k);c.quadraticCurveTo(sd*.15*k,0,sd*.2*k,2.5*k);c.fill();}}
 else if(sp==='queixada'){el(-1.5,0,.95,2.1,.12);el(1.5,0,.95,2.1,-.12);}
 else if(sp==='tamandua'){el(0,1.4,2.3,3.4);for(let i=0;i<5;i++){const x=-2.4+i*1.2;el(x,-2.9+Math.abs(i-2)*.35,.55,.75);}}
 else if(sp==='paca'){el(0,.9,1.3,1.1);el(-1,-1.1,.5,1);el(0,-1.4,.55,1.05);el(1,-1.1,.5,1);unha(-1,-2.1,-1,-2.6);unha(0,-2.45,0,-3);unha(1,-2.1,1,-2.6);}
 c.restore();}
function examinar(p){const g=S.g;g.exame=p;inp.x=null;g.vx=g.vy=0;const F=FASES[S.f];
 const outros=shuf(Object.keys(SP).filter(k=>k!==p.sp&&(F.sp.includes(k))));const ops=shuf([p.sp,outros[0],outros[1]]);
 const L=$('lupa');L.style.cssText='position:absolute;inset:0;background:rgba(255,255,255,.96);border-radius:16px;padding:12px;overflow:auto';
 L.innerHTML=`<h2 style="text-align:center">🔎 De quem é esta pegada?</h2><canvas id="lc" width="300" height="250" style="max-width:300px;border:2px solid var(--line);border-radius:12px;background:#f3e9d8"></canvas>
 <div class="ops" id="lo">${ops.map(k=>`<button data-k="${k}">${SP[k].n}</button>`).join('')}</div><div id="lf"></div>`;
 const lc=$('lc').getContext('2d');lc.fillStyle='#e8d9bf';for(let i=0;i<70;i++){lc.beginPath();lc.arc((i*53)%300,(i*37)%250,2,0,7);lc.fill();}
 const k=14;pegada(lc,p.sp,150,118,k);
