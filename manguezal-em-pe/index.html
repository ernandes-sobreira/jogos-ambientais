<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manguezal em Pé</title>
<style>
:root{--main:#1565c0;--deep:#0d47a1;--soft:#e3f2fd;--line:#cfe1f5;--ink:#1a2430;--mut:#55657a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:var(--ink);line-height:1.45}
.wrap{max-width:780px;margin:0 auto;padding:12px 14px 40px}
a.hub{color:var(--deep);font-weight:700;text-decoration:none;font-size:.9rem}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
h1{font-size:1.4rem;color:var(--deep)}h2{font-size:1.15rem;color:var(--deep);margin-bottom:6px}
.hud{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--soft);color:var(--deep);border-radius:99px;padding:5px 11px;font-weight:700;font-size:.86rem}
.card{border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;background:#fff}
.btn{background:var(--main);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--deep)}.btn.ghost{background:#fff;color:var(--deep);border:2px solid var(--main)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.small{font-size:.86rem;color:var(--mut)}
canvas{width:100%;display:block;border:2px solid var(--line);border-radius:16px;touch-action:manipulation;background:#fff}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tools button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px;font-size:.88rem;cursor:pointer;font-family:inherit;color:var(--ink);text-align:center}
.tools button b{display:block;font-size:1.3rem}
.tools button.sel{border-color:var(--main);box-shadow:0 0 0 3px #bbdefb;background:var(--soft)}
.tools button:disabled{opacity:.45}
.tab{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:8px}.tab td{border-bottom:1px solid var(--line);padding:5px 4px;vertical-align:top}
.ops{display:grid;gap:8px;margin-top:10px}
.ops button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-size:.95rem;cursor:pointer;font-family:inherit;text-align:left;color:var(--ink)}
.ops button:hover{border-color:var(--main)}.ops button:disabled{opacity:.5;cursor:default}
.fb{margin-top:10px;padding:11px 13px;border-radius:12px;font-size:.93rem}
.fb.good{background:#e8f5e9;color:#1b5e20}.fb.bad{background:#ffebee;color:#8e1b1b}
.big{font-size:2.3rem;font-weight:800;color:var(--deep)}
.ranking{border:3px solid var(--main);border-radius:18px;padding:0 16px 12px;overflow:hidden;margin-top:12px}
.ranking h3{font-size:1rem;margin:0 -16px 8px;padding:10px 16px;background:var(--main);color:#fff}
.ranking ol{list-style:none}.ranking li{display:flex;justify-content:space-between;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:.92rem}
.ranking li:last-child{border-bottom:0}.rp{display:inline-block;min-width:2.1em;font-weight:800;color:var(--deep)}
.savebox{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.savebox input{flex:1;min-width:160px;border:2px solid var(--line);border-radius:12px;padding:11px;font-size:1rem;font-family:inherit}
</style>
</head>
<body>
<div class="wrap">
<a class="hub" href="https://ernandes-sobreira.github.io/jogos-ambientais/">← Todos os jogos</a>
<header>
  <h1>🌿 Manguezal em Pé</h1>
  <div class="hud" id="hud" style="display:none"><span class="pill" id="hF">Fase 1/3</span><span class="pill" id="hP">0 pts</span><span class="pill" id="hR">🪙 0</span><span class="pill" id="hV">🌳 100%</span><span class="pill" id="hT">⏱ 0</span></div>
</header>
<main id="tela"></main>
<div class="ranking" id="rankBox"><h3>Ranking Global</h3><ol id="rankList"><li><span>Carregando o ranking...</span></li></ol><p class="small" id="rankNote"></p></div>
</div>
<script>
const $=id=>document.getElementById(id);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let actx=null;function beep(f,d){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.setValueAtTime(.06,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(e){}}

/* Ameaças e defensores. Os números de vida, velocidade e dano são regras do jogo. */
const AM={
 onda:{ic:'🌊',n:'Onda de ressaca',hp:6,v:.55,dano:10},
 lixo:{ic:'🗑️',n:'Lixo boiando',hp:4,v:.32,dano:5},
 aterro:{ic:'🚛',n:'Caminhão de aterro',hp:10,v:.26,dano:20},
 serra:{ic:'🪚',n:'Corte do mangue',hp:6,v:.38,dano:15}
};
const DEF={
 muda:{ic:'🌱',ad:'🌳',n:'Mangue-vermelho',custo:30,alvo:['onda'],alc:1.3,dps:1.4,dpsAd:4,cresce:12,d:'Raízes seguram ondas. Cresce com o tempo.'},
 mutirao:{ic:'🧤',n:'Mutirão de limpeza',custo:40,alvo:['lixo'],alc:2.5,dps:3,d:'Recolhe o lixo.'},
 fiscal:{ic:'👮',n:'Fiscal ambiental',custo:50,alvo:['aterro','serra'],alc:3,dps:2.6,d:'Para aterro e corte ilegal.'}
};
const FASES=[
 {nome:'Maré calma',dur:60,int:4,tipos:'fixo',lista:['onda','lixo','aterro'],meta:60,txt:'Cada faixa recebe sempre o mesmo tipo de ameaça. O mar traz ondas, o rio traz lixo e a estrada traz caminhões de aterro.'},
 {nome:'Ressaca',dur:75,int:3.4,tipos:'misto',lista:['onda','lixo','aterro'],meta:60,txt:'Agora qualquer ameaça pode vir por qualquer faixa. Cada defensor só para um tipo de ameaça.'},
 {nome:'Pressão na costa',dur:90,int:2.9,tipos:'misto',lista:['onda','lixo','aterro','serra'],meta:55,txt:'Chega o corte ilegal do mangue, e as ameaças vêm mais rápido.'}
];
const LANES=3,COLS=7;
const LNOME=['Mar','Rio','Estrada'];
const PERG=[
 {q:'Segundo o Código Florestal, que parte do manguezal é Área de Preservação Permanente?',o:['Toda a sua extensão','Só os primeiros 30 metros a partir do mar','Apenas a parte dentro de unidades de conservação']},
 {q:'Como o manguezal ajuda a proteger a costa?',o:['Raízes e galhos reduzem a altura e a energia das ondas','A lama do fundo esquenta a água e acalma o mar','Os caranguejos cavam tocas que puxam a água para baixo']},
 {q:'Segundo o Atlas dos Manguezais do Brasil (ICMBio, 2018), quanto do manguezal brasileiro foi destruído desde o começo do século 20?',o:['Cerca de 25%','Cerca de 5%','Mais de 80%']}
];
let S,cv,cx,raf=null,last=0,sel='muda';
function hud(){$('hud').style.display='flex';$('hF').textContent='Fase '+(S.f+1)+'/3';$('hP').textContent=(S.tot+S.fp)+' pts';
 if(S.g){$('hR').textContent='🪙 '+Math.floor(S.g.rec);$('hV').textContent='🌳 '+Math.max(0,Math.round(S.g.vida))+'%';$('hT').textContent='⏱ '+Math.max(0,Math.ceil(S.g.dur-S.g.t))+' s';}
 document.querySelectorAll('.tools button').forEach(b=>{b.disabled=!S.g||S.g.rec<DEF[b.dataset.d].custo;});}
function inicio(){
 parar();$('hud').style.display='none';$('rankBox').style.display='block';
 $('tela').innerHTML=`<div class="card"><h2>Defenda o manguezal</h2>
 <p>Ameaças chegam pela direita em três faixas: mar, rio e estrada. Coloque defensores nas casas da faixa. Cada defensor só para um tipo de ameaça.</p>
 <table class="tab">${Object.values(DEF).map(d=>`<tr><td>${d.ic} <b>${d.n}</b></td><td>${d.d} Custa ${d.custo} 🪙.</td></tr>`).join('')}</table>
 <p class="small" style="margin-top:8px">Você ganha moedas com o tempo e a cada ameaça parada (+5 pontos). Ameaça que chega ao mangue tira vida dele. 🎯 Meta: terminar a fase com o mangue acima do mínimo.</p>
 <div class="row" style="margin-top:12px"><button class="btn" onclick="novo()">Começar →</button></div></div>`;
}
function novo(){S={f:0,tot:0,fp:0};salvo=false;$('rankBox').style.display='none';fase();}
function fase(){const F=FASES[S.f];S.fp=0;S.g=null;hud();
 $('tela').innerHTML=`<div class="card"><h2>Fase ${S.f+1}: ${F.nome}</h2><p>${F.txt}</p><p class="small" style="margin-top:6px">Duração: ${F.dur} s. 🎯 Meta: mangue com pelo menos ${F.meta}% de vida no fim.</p><div class="row" style="margin-top:12px"><button class="btn" id="bg">Jogar →</button></div></div>`;
 $('bg').onclick=jogar;}
function jogar(){
 const F=FASES[S.f];
 S.g={t:0,dur:F.dur,rec:120,vida:100,ams:[],defs:[],prox:1.5,parados:0,fim:false,raios:[]};
 $('tela').innerHTML=`<div class="card"><canvas id="cv" width="760" height="330"></canvas>
 <div class="tools">${Object.entries(DEF).map(([k,d])=>`<button data-d="${k}" class="${k===sel?'sel':''}"><b>${d.ic}</b>${d.n}<br><span class="small">${d.custo} 🪙</span></button>`).join('')}</div>
 <p class="small" style="margin-top:8px">Escolha um defensor e toque numa casa vazia da faixa.</p></div>`;
 cv=$('cv');if(cv.clientWidth<520)cv.width=440;cx=cv.getContext('2d');
 document.querySelectorAll('.tools button').forEach(b=>b.onclick=()=>{sel=b.dataset.d;document.querySelectorAll('.tools button').forEach(x=>x.classList.toggle('sel',x===b));});
 cv.onclick=e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*cv.width/r.width,y=(e.clientY-r.top)*cv.height/r.height;
  const {cw,lh,top}=geo();const c=Math.floor(x/cw),l=Math.floor((y-top)/lh);if(l>=0&&l<LANES)colocar(l,c,sel);};
 hud();last=performance.now();parar();raf=requestAnimationFrame(loop);
}
function geo(){return {cw:cv?cv.width/COLS:760/COLS,lh:100,top:30};}
function colocar(l,c,k){const g=S.g;if(!g||g.fim)return false;const d=DEF[k];
 if(c<1||c>=COLS||l<0||l>=LANES)return false;if(g.defs.some(x=>x.l===l&&x.c===c))return false;if(g.rec<d.custo){beep(170,.15);return false;}
 g.rec-=d.custo;g.defs.push({k,l,c,idade:0});beep(660,.07);hud();return true;}
function spawn(){const g=S.g,F=FASES[S.f];const l=Math.floor(Math.random()*LANES);
 const tipo=F.tipos==='fixo'?F.lista[l]:F.lista[Math.floor(Math.random()*F.lista.length)];
 const a=AM[tipo];g.ams.push({tipo,l,x:COLS+.2,hp:a.hp,max:a.hp,v:a.v*(1+S.f*.08)});}
function update(dt){const g=S.g;if(!g||g.fim)return;const F=FASES[S.f];
 g.t+=dt;g.rec+=5*dt;g.raios=[];
 if(g.t<g.dur){g.prox-=dt;if(g.prox<=0){spawn();g.prox=F.int*(.75+Math.random()*.5);}}
 for(const d of g.defs){d.idade+=dt;const D=DEF[d.k];
  const dps=d.k==='muda'?(d.idade>=D.cresce?D.dpsAd:D.dps):D.dps;
  const alvo=g.ams.filter(a=>a.l===d.l&&a.hp>0&&D.alvo.includes(a.tipo)&&a.x>=d.c-.3&&a.x<=d.c+D.alc).sort((a,b)=>a.x-b.x)[0];
  if(alvo){alvo.hp-=dps*dt;g.raios.push([d,alvo]);}}
 for(const a of g.ams){if(a.hp<=0&&!a.morto){a.morto=true;g.parados++;S.fp+=5;g.rec+=6;beep(880,.05);}
  if(!a.morto){a.x-=a.v*dt;if(a.x<.6){a.morto=true;a.chegou=true;g.vida-=AM[a.tipo].dano;beep(140,.25);}}}
 g.ams=g.ams.filter(a=>!a.morto);
 if(g.t>=g.dur&&g.ams.length===0)terminar();
 if(g.vida<=0){g.vida=0;terminar();}
}
function desenha(){const g=S.g;if(!g||!cx)return;const {cw,lh,top}=geo();
 cx.clearRect(0,0,cv.width,cv.height);
 cx.fillStyle='#55657a';cx.font='bold 13px system-ui';cx.textAlign='left';cx.fillText('🌳 Manguezal e vila',6,19);cx.textAlign='right';cx.fillText('Ameaças →',cv.width-6,19);
 const cores=['#e3f2fd','#e0f2f1','#f5f0e6'];
 for(let l=0;l<LANES;l++){cx.fillStyle=cores[l];cx.fillRect(0,top+l*lh,cv.width,lh-4);
  cx.fillStyle='#7a8a9a';cx.font='11px system-ui';cx.textAlign='left';cx.fillText(LNOME[l],cw+4,top+l*lh+14);
  for(let c=1;c<COLS;c++){cx.strokeStyle='rgba(0,0,0,.08)';cx.strokeRect(c*cw,top+l*lh,cw,lh-4);}
  cx.fillStyle='#c8e6c9';cx.fillRect(0,top+l*lh,cw,lh-4);cx.font='30px system-ui';cx.textAlign='center';cx.fillText('🌳',cw/2,top+l*lh+lh/2+10);}
 cx.textAlign='center';
 for(const d of g.defs){const D=DEF[d.k];const x=d.c*cw+cw/2,y=top+d.l*lh+lh/2;
  const ic=d.k==='muda'&&d.idade>=D.cresce?D.ad:D.ic;cx.font=(d.k==='muda'&&d.idade<D.cresce?26:36)+'px system-ui';cx.fillText(ic,x,y+12);
  if(d.k==='muda'&&d.idade<D.cresce){cx.fillStyle='#a5d6a7';cx.fillRect(x-20,y+22,40*d.idade/D.cresce,4);}}
 cx.strokeStyle='rgba(21,101,192,.5)';cx.lineWidth=3;
 for(const [d,a] of g.raios){cx.beginPath();cx.moveTo(d.c*cw+cw/2,top+d.l*lh+lh/2);cx.lineTo(a.x*cw,top+a.l*lh+lh/2);cx.stroke();}
 for(const a of g.ams){const x=a.x*cw,y=top+a.l*lh+lh/2;cx.font='34px system-ui';cx.fillText(AM[a.tipo].ic,x,y+12);
  cx.fillStyle='#ef9a9a';cx.fillRect(x-18,y-30,36,4);cx.fillStyle='#c62828';cx.fillRect(x-18,y-30,36*Math.max(0,a.hp)/a.max,4);}
}
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);desenha();hud();if(S.g&&!S.g.fim)raf=requestAnimationFrame(loop);}
function parar(){if(raf)cancelAnimationFrame(raf);raf=null;}
function terminar(){const g=S.g;if(g.fim)return;g.fim=true;parar();const F=FASES[S.f];const ok=g.vida>=F.meta;
 if(ok){S.fp+=30+Math.round(g.vida);beep(880,.2);}hud();
 $('tela').innerHTML=`<div class="card"><h2>${ok?'Fase concluída':'O mangue não aguentou'}</h2>
 <p>Ameaças paradas: <b>${g.parados}</b>. Vida do mangue: <b>${Math.max(0,Math.round(g.vida))}%</b> (meta: ${F.meta}%).</p>
 ${ok?`<div class="fb good">🎯 Meta cumprida! +30 e +${Math.round(g.vida)} pela vida do mangue.</div>`:'<div class="fb bad">A meta não foi cumprida. Coloque defensores mais cedo e confira se o tipo combina com a ameaça.</div>'}
 <div class="row" style="margin-top:12px">${ok?'<button class="btn" id="bq">Pergunta da fase →</button>':'<button class="btn" id="br">Tentar de novo</button><button class="btn ghost" id="be">Encerrar</button>'}</div></div>`;
 if(ok)$('bq').onclick=pergunta;else{$('br').onclick=fase;$('be').onclick=()=>{S.tot+=Math.max(0,S.fp);S.fp=0;final(false);};}
}
function pergunta(){
 const P=PERG[S.f],ops=shuf(P.o.map((t,i)=>({t,c:i===0})));
 $('tela').innerHTML=`<div class="card"><h2>Pergunta da fase</h2><p style="margin:6px 0 4px">${P.q}</p><p class="small">Acerto +20, erro −10.</p><div class="ops">${ops.map((o,i)=>`<button data-i="${i}">${o.t}</button>`).join('')}</div><div id="pf"></div></div>`;
 document.querySelectorAll('#tela .ops button').forEach(b=>b.onclick=()=>{const o=ops[+b.dataset.i];S.fp+=o.c?20:-10;beep(o.c?880:170,.15);hud();
  document.querySelectorAll('#tela .ops button').forEach((x,j)=>{x.disabled=true;if(ops[j].c){x.style.borderColor='#2e7d32';x.style.opacity=1;}});
  $('pf').innerHTML=`<div class="fb ${o.c?'good':'bad'}">${o.c?'✅ +20.':'❌ −10. A resposta certa está marcada em verde.'}<div class="row" style="margin-top:10px"><button class="btn" id="bn">${S.f===FASES.length-1?'Ver resultado →':'Próxima fase →'}</button></div></div>`;
  $('bn').onclick=()=>{S.tot+=S.fp;S.fp=0;if(S.f===FASES.length-1)final(true);else{S.f++;fase();}};});
}
function final(tudo){
 S.g=null;$('rankBox').style.display='block';const nivel=tudo?'3 fases':'Fase '+(S.f+1);
 $('tela').innerHTML=`<div class="card" style="text-align:center"><div class="big">${tudo?'🏆':'🌿'}</div><h2>${tudo?'O manguezal ficou em pé!':'Fim de jogo'}</h2><div class="big">${S.tot} pts</div>
 <div class="savebox"><input id="pName" maxlength="20" placeholder="Seu nome"><button class="btn" id="bS">Salvar no ranking</button></div><p class="small" id="sSt"></p>
 <div class="row" style="justify-content:center;margin-top:12px"><button class="btn ghost" onclick="inicio()">Jogar de novo</button></div>
 <div class="small" style="margin-top:12px;text-align:left">📚 Fontes: Lei nº 12.651/2012 (Código Florestal), art. 4º, inciso VII; ICMBio, Atlas dos Manguezais do Brasil (2018); Ibama e MMA, Mapeamento dos Manguezais Brasileiros 2024 (1.229.644 ha); UNESCO, redução da altura das ondas pelos manguezais. Vida, velocidade e dano das ameaças são regras do jogo.</div></div>`;
 $('bS').onclick=()=>salvar(nivel);
}
const firebaseConfig={apiKey:"AIzaSyCbXi3UCVl8oLleBzGb6DqWSxbZmZU2yDQ",authDomain:"jogos-ranking.firebaseapp.com",projectId:"jogos-ranking",storageBucket:"jogos-ranking.firebasestorage.app",messagingSenderId:"958784915420",appId:"1:958784915420:web:4212d3ad278f02d600f119"};
const GAME_ID="manguezal-em-pe";let db=null,fs=null,salvo=false;
(async()=>{try{const a=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");const f=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");db=f.getFirestore(a.initializeApp(firebaseConfig));fs=f;carregar();}catch(e){$('rankList').innerHTML='<li><span>Ranking indisponível sem internet.</span></li>';$('rankNote').textContent='O jogo funciona normalmente. O ranking volta quando houver conexão.';}})();
async function carregar(){if(!db)return;try{const q=fs.query(fs.collection(db,'games',GAME_ID,'scores'),fs.orderBy('score','desc'),fs.limit(10));const sn=await fs.getDocs(q);const r=[];sn.forEach(d=>r.push(d.data()));$('rankNote').textContent='Maior pontuação primeiro.';$('rankList').innerHTML=r.length?r.map((x,i)=>`<li><span><span class="rp">${i+1}º</span>${esc(x.name||'?')}</span><span>${(Number(x.score)||0).toLocaleString('pt-BR')} pts · ${esc(x.level||'')}</span></li>`).join(''):'<li><span>Seja o primeiro do ranking!</span></li>';}catch(e){$('rankList').innerHTML='<li><span>Não foi possível carregar o ranking.</span></li>';}}
async function salvar(nivel){if(salvo)return;const nome=$('pName').value.trim(),st=$('sSt');if(!nome){st.textContent='Digite seu nome primeiro.';return;}if(!db){st.textContent='Sem conexão com o ranking. O resultado não foi enviado.';return;}
 $('bS').disabled=true;try{await fs.addDoc(fs.collection(db,'games',GAME_ID,'scores'),{name:nome.slice(0,20),score:Math.max(0,S.tot),level:nivel,ts:fs.serverTimestamp()});salvo=true;st.textContent='Salvo no Ranking Global!';carregar();}catch(e){$('bS').disabled=false;st.textContent='Erro ao salvar. Tente de novo.';}}
window.__mg={get S(){return S},update,colocar,parar,FASES,DEF};
inicio();
</script>
</body>
</html>
