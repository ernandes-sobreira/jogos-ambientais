<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Balanço do Carbono</title>
<style>
:root{--main:#00838f;--deep:#005662;--soft:#e0f7fa;--line:#b2ebf2;--ink:#10212b;--mut:#4d6370;--co2:#e53935;--ch4:#ef6c00;--ok:#2e7d32;--bad:#c62828}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:var(--ink);line-height:1.45}
.wrap{max-width:820px;margin:0 auto;padding:12px 14px 40px}
a.hub{color:var(--deep);font-weight:700;text-decoration:none;font-size:.9rem}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
h1{font-size:1.4rem;color:var(--deep);letter-spacing:-.01em}
h2{font-size:1.2rem;color:var(--deep);margin-bottom:6px;letter-spacing:-.01em}
h3{font-size:1rem;color:var(--deep);margin:14px 0 6px}
.hud{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--soft);color:var(--deep);border-radius:99px;padding:5px 12px;font-weight:700;font-size:.86rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.card{border:2px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px;background:#fff}
.btn{background:var(--main);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;touch-action:manipulation}
.btn:hover{background:var(--deep)}.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:#fff;color:var(--deep);border:2px solid var(--main)}
.btn.sm{padding:9px 14px;font-size:.92rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.small{font-size:.86rem;color:var(--mut)}
canvas.cena{width:100%;height:auto;display:block;border:2px solid var(--line);border-radius:16px;touch-action:none;background:#fff;margin-top:10px}
.top{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--main);color:#fff;border-radius:14px;padding:8px 14px;font-weight:800;font-size:1.05rem}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.tool{border:2px solid var(--line);background:#fff;color:var(--deep);border-radius:12px;padding:9px 12px;font-weight:700;font-family:inherit;font-size:.92rem;cursor:pointer;touch-action:manipulation}
.tool.on{border-color:var(--main);background:var(--soft)}
.tool:disabled{opacity:.4}
.mets{display:grid;gap:8px;margin-top:10px}
.met{display:grid;grid-template-columns:92px 1fr 52px;gap:8px;align-items:center;font-weight:700;font-size:.9rem}
.met .bar{position:relative;height:18px;background:#f1f4f5;border-radius:99px;overflow:hidden}
.met .fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;transition:width .15s}
.met .alvo{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--ink);border-radius:2px}
.met .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--mut)}
.met.co2 .fill{background:var(--co2)}.met.ch4 .fill{background:var(--ch4)}
.saldo .bar{background:linear-gradient(90deg,#e8f5e9 50%,#ffebee 50%)}
.saldo .zero{position:absolute;left:50%;top:-3px;bottom:-3px;width:3px;background:var(--ink)}
.saldo .fill{border-radius:0}
.obj{display:flex;gap:10px;align-items:flex-start;background:#fff8e1;border:2px solid #ffe082;border-radius:14px;padding:10px 12px;margin-top:10px;font-size:.95rem}
.obj b{color:#8d6e00;white-space:nowrap}
.acao{display:flex;gap:10px;align-items:center;background:var(--soft);border-left:5px solid var(--main);border-radius:0 12px 12px 0;padding:9px 12px;margin-top:8px;font-weight:600;font-size:.95rem;min-height:42px}
.acao .dedo{font-size:1.25rem;animation:pulo 1s ease-in-out infinite}
@keyframes pulo{50%{transform:translateX(4px)}}
.help{width:34px;height:34px;border-radius:50%;border:2px solid var(--main);background:#fff;color:var(--deep);font-weight:800;font-size:1rem;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(16,33,43,.35);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal .card{max-width:460px;width:100%}
.intro{text-align:center;padding:26px 18px}
.intro .ic{font-size:3rem;line-height:1}
.intro .n{color:var(--mut);font-weight:700;font-size:.85rem;margin-top:8px}
.passos{display:grid;gap:8px;margin:16px auto;max-width:420px;text-align:left}
.passos div{display:flex;gap:12px;align-items:center;background:var(--soft);border-radius:12px;padding:10px 14px;font-weight:600}
.passos b{font-size:1.3rem;min-width:1.6em;text-align:center}
.res{text-align:center}
.res .big{font-size:2.6rem;font-weight:800;color:var(--deep);line-height:1.1}
.res .ok{color:var(--ok);font-weight:800}.res .no{color:var(--bad);font-weight:800}
.pensa{background:var(--soft);border-radius:14px;padding:12px 14px;margin:14px auto;max-width:520px;text-align:left}
.pensa b{color:var(--deep)}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.box{border:2px dashed var(--line);border-radius:14px;padding:10px;min-height:110px;cursor:pointer}
.box h4{font-size:.92rem;color:var(--deep);margin-bottom:6px}
.box.alvo{border-color:var(--main);background:var(--soft)}
.cards{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;min-height:48px}
.ct{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 11px;font-weight:700;font-size:.9rem;cursor:pointer;box-shadow:0 2px 0 var(--line);font-family:inherit;color:var(--ink);transition:transform .5s}
.ct.sel{border-color:var(--main);background:var(--soft);transform:translateY(-2px)}
.ct.certo{border-color:var(--ok);background:#e8f5e9}.ct.errado{border-color:var(--bad);background:#ffebee}
.ct.movido{animation:voa .8s ease}
@keyframes voa{0%{transform:translateY(-30px) scale(1.1);opacity:.3}100%{transform:none;opacity:1}}
.capa{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:center}
.capa canvas{width:100%;height:auto;display:block;border-radius:16px;background:var(--soft)}
.opts{display:grid;gap:8px;margin-top:6px}
.opts .l{font-size:.8rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer}
.sw button.on{box-shadow:0 0 0 3px var(--deep)}
.sw .tx{width:auto;height:auto;border-radius:10px;padding:6px 10px;font-weight:700;font-size:.85rem;background:#fff;color:var(--deep);font-family:inherit;border:0}
input.nome{border:2px solid var(--line);border-radius:12px;padding:11px;font-size:1rem;font-family:inherit;width:100%}
input[type=range]{width:100%;accent-color:var(--main)}
.tab{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:6px}
.tab th{text-align:left;background:var(--soft);color:var(--deep);padding:7px 6px}
.tab td{border-bottom:1px solid var(--line);padding:7px 6px;vertical-align:top}
.guia p,.guia li{font-size:.95rem;margin-bottom:6px}
.guia ul,.guia ol{padding-left:20px}
.hab{border-left:5px solid var(--main);background:var(--soft);padding:10px 14px;border-radius:0 12px 12px 0;font-size:.95rem}
.ref li{font-size:.86rem;color:var(--mut)}
.ranking{border:3px solid var(--main);border-radius:18px;padding:0 16px 12px;overflow:hidden;margin-top:12px}
.ranking h3{font-size:1rem;margin:0 -16px 8px;padding:10px 16px;background:var(--main);color:#fff}
.ranking ol{list-style:none}.ranking li{display:flex;justify-content:space-between;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:.92rem}
.ranking li:last-child{border-bottom:0}.rp{display:inline-block;min-width:2.1em;font-weight:800;color:var(--deep)}
.savebox{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.savebox input{flex:1;min-width:160px;border:2px solid var(--line);border-radius:12px;padding:11px;font-size:1rem;font-family:inherit}
.rel{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.rel canvas{width:120px;height:120px;border-radius:50%;background:var(--soft)}
.mini{width:100%;max-width:420px;height:auto;display:block;margin:10px auto 0}
@media (max-width:620px){.wrap{padding:10px 8px 30px}.card{padding:12px;border-radius:16px}.capa{grid-template-columns:1fr}.met{grid-template-columns:70px 1fr 44px;font-size:.82rem}.chip{font-size:.95rem}.rel{grid-template-columns:80px 1fr}.rel canvas{width:80px;height:80px}}
@media print{a.hub,header .hud,.ranking,.noprint{display:none!important}.card{border:1px solid #ccc;break-inside:avoid}body{font-size:12px}}
</style>
</head>
<body>
<div class="wrap">
<a class="hub" href="https://ernandes-sobreira.github.io/jogos-ambientais/">← Todos os jogos</a>
<header>
  <h1>Balanço do Carbono</h1>
  <div class="hud" id="hud" style="display:none"><span class="pill" id="hF"></span><span class="pill" id="hP"></span></div>
</header>
<main id="tela"></main>
<div class="ranking" id="rankBox"><h3>Ranking Global</h3><ol id="rankList"><li><span>Carregando o ranking...</span></li></ol><p class="small" id="rankNote"></p></div>
</div>
<script>
const $=id=>document.getElementById(id);
const rr=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const W=760,H=372;
function hex(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function mix(a,b,t){const A=hex(a),B=hex(b);return`rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`;}

/* ================= AVATAR ================= */
const PELES=['#f6d3b8','#e3b18b','#c68a5e','#94603e','#5d3b26'];
const CABS=['#1b1b1b','#4e342e','#8d6e63','#d4a85a','#b5532f'];
const CAMISAS=['#00838f','#2e7d32','#f9a825','#c62828','#6a1b9a','#37474f'];
const ESTILOS=[['curto','Curto'],['cacheado','Cacheado'],['longo','Longo'],['coque','Coque'],['raspado','Raspado']];
const CHAPEUS=[['nenhum','Sem'],['bone','Boné'],['campo','Chapéu']];
let A={pele:2,cab:0,estilo:'cacheado',camisa:0,chapeu:'campo',nome:''};
try{const s=JSON.parse(localStorage.getItem('bc_avatar')||'null');if(s)A=Object.assign(A,s);}catch(e){}
function salvaA(){try{localStorage.setItem('bc_avatar',JSON.stringify(A));}catch(e){}}
function avatar(c,x,y,s,a,prancheta){
 c.save();c.translate(x,y);c.scale(s,s);
 const pele=PELES[a.pele],cab=CABS[a.cab],cam=CAMISAS[a.camisa];
 if(a.estilo==='longo'){c.fillStyle=cab;c.beginPath();c.ellipse(0,-39,12.5,15,0,0,7);c.fill();c.fillRect(-12.5,-40,25,22);}
 if(a.estilo==='cacheado'){c.fillStyle=cab;c.beginPath();c.ellipse(0,-40,15,14.5,0,0,7);c.fill();}
 c.fillStyle=cam;c.beginPath();c.moveTo(-16,0);c.quadraticCurveTo(-17,-21,-6,-25);c.lineTo(6,-25);c.quadraticCurveTo(17,-21,16,0);c.closePath();c.fill();
 c.fillStyle='rgba(0,0,0,.12)';c.fillRect(-1,-24,2,24);
 c.fillStyle=pele;c.fillRect(-3.5,-29,7,6);
 if(prancheta){c.fillStyle='#8d6e63';c.fillRect(4,-19,13,16);c.fillStyle='#fff';c.fillRect(5.5,-17,10,12);c.strokeStyle='#90a4ae';c.lineWidth=.8;for(let i=0;i<4;i++){c.beginPath();c.moveTo(7,-14+i*2.6);c.lineTo(14,-14+i*2.6);c.stroke();}}
 c.strokeStyle=cam;c.lineWidth=6;c.lineCap='round';c.beginPath();c.moveTo(-11,-20);c.lineTo(-4,-9);c.stroke();
 c.fillStyle=pele;c.beginPath();c.arc(-3,-8,3,0,7);c.fill();
 c.fillStyle=pele;c.beginPath();c.ellipse(0,-39,9.5,11,0,0,7);c.fill();
 c.beginPath();c.arc(-9.4,-38,2.3,0,7);c.arc(9.4,-38,2.3,0,7);c.fill();
 c.fillStyle=cab;
 if(a.estilo==='curto'){c.beginPath();c.ellipse(0,-44.5,10,6.8,0,Math.PI,0);c.fill();c.fillRect(-10,-46,2.8,7);c.fillRect(7.2,-46,2.8,7);}
 if(a.estilo==='cacheado'){for(let i=0;i<13;i++){const an=Math.PI*(.8+i*1.4/12);c.beginPath();c.arc(Math.cos(an)*12,-41+Math.sin(an)*11.5,4.2,0,7);c.fill();}}
 if(a.estilo==='longo'){c.beginPath();c.ellipse(0,-44.5,10.6,7.2,0,Math.PI,0);c.fill();}
 if(a.estilo==='coque'){c.beginPath();c.ellipse(0,-44.5,10,6.4,0,Math.PI,0);c.fill();c.beginPath();c.arc(0,-53,5.2,0,7);c.fill();}
 if(a.estilo==='raspado'){c.globalAlpha=.5;c.beginPath();c.ellipse(0,-44,9.8,6.2,0,Math.PI,0);c.fill();c.globalAlpha=1;}
 c.fillStyle='#2b2a26';c.beginPath();c.arc(-3.4,-39,1.25,0,7);c.arc(3.4,-39,1.25,0,7);c.fill();
 c.strokeStyle='#2b2a26';c.lineWidth=1;c.beginPath();c.arc(0,-35.6,2.6,.25,Math.PI-.25);c.stroke();
 if(a.chapeu==='bone'){c.fillStyle=cam;c.beginPath();c.ellipse(0,-46,10.6,5.8,0,Math.PI,0);c.fill();c.fillRect(-10.6,-47,21.2,2.6);c.beginPath();c.ellipse(8.5,-46.2,8,2.2,0,0,7);c.fill();}
 if(a.chapeu==='campo'){c.fillStyle='#d7c49e';c.beginPath();c.ellipse(0,-46,16.5,3.6,0,0,7);c.fill();c.beginPath();c.ellipse(0,-48,9.2,6.4,0,Math.PI,0);c.fill();c.fillStyle='#8d6e63';c.fillRect(-9.2,-49,18.4,1.9);}
 c.restore();
}
function pernas(c,x,y,s,a){c.save();c.translate(x,y);c.scale(s,s);c.fillStyle='#455a64';c.fillRect(-11,0,9,20);c.fillRect(2,0,9,20);c.fillStyle='#3e2723';c.fillRect(-12,18,11,4);c.fillRect(1,18,11,4);c.restore();}

/* ================= CENA ================= */
function chao(x){
 if(x<210)return 226+x*.02;
 if(x<258){const t=(x-210)/48;return 230.2+(262-230.2)*(1-Math.cos(Math.PI*t))/2;}
 if(x<540)return 262+(x-258)/282*58;
 if(x<600){const t=(x-540)/60;return 320+(242-320)*(1-Math.cos(Math.PI*t))/2;}
 return 242-(x-600)*.03;
}
const VEGX=[[26,'mata'],[70,'caranda'],[114,'mata'],[158,'caranda'],[200,'mata'],[618,'mata'],[650,'caranda'],[682,'mata'],[714,'caranda'],[746,'mata']];
function novaCena(op){
 return Object.assign({t:0,hora:null,nivel:1,mol:[],bub:[],puf:[],fum:[],atm:{co2:0,ch4:0},canoa:450,aceiros:[],
  veg:VEGX.map(([x,t])=>({x,t,b:chao(x),vivo:true,muda:false,fogo:0,queim:false,cham:false,est:10,rel:0})),
  src:null,snk:null,marcas:false,pe:null,camara:null},op||{});
}
function sup(G){return 262-G.nivel*16;}
function ceu(G){if(G.hora==null)return 1;const h=G.hora%24;return clamp(Math.sin(Math.PI*(h-6)/12)*1.5+.35,0,1);}
function sol(G){if(G.hora==null)return Math.max(0,1);const h=G.hora%24;return Math.max(0,Math.sin(Math.PI*(h-6)/12));}
function drawCena(c,G){
 const s=ceu(G);
 const g=c.createLinearGradient(0,0,0,250);g.addColorStop(0,mix('#9ea9d6','#cbeef8',s));g.addColorStop(1,mix('#d9def2','#f6fcfd',s));
 c.fillStyle=g;c.fillRect(0,0,W,H);
 if(G.hora!=null){const h=G.hora%24;
  if(h>=6&&h<=18){const a=Math.PI*(h-6)/12,x=60+640*(h-6)/12,y=160-Math.sin(a)*130;c.fillStyle='rgba(255,213,79,.35)';c.beginPath();c.arc(x,y,24,0,7);c.fill();c.fillStyle='#ffca28';c.beginPath();c.arc(x,y,15,0,7);c.fill();}
  else{const hh=h<6?h+24:h,a=Math.PI*(hh-18)/12,x=60+640*(hh-18)/12,y=160-Math.sin(a)*120;c.fillStyle='#f5f5f5';c.beginPath();c.arc(x,y,12,0,7);c.fill();c.fillStyle=mix('#9ea9d6','#cbeef8',s);c.beginPath();c.arc(x+5,y-3,10,0,7);c.fill();}
 }else{c.fillStyle='rgba(255,213,79,.35)';c.beginPath();c.arc(700,46,24,0,7);c.fill();c.fillStyle='#ffca28';c.beginPath();c.arc(700,46,15,0,7);c.fill();}
 /* nuvens e capoes ao longe */
 c.fillStyle='rgba(255,255,255,.75)';for(let i=0;i<3;i++){const x=((i*260+G.t*6)%(W+160))-80,y=40+i*22;c.beginPath();c.ellipse(x,y,46,11,0,0,7);c.ellipse(x+26,y-7,26,10,0,0,7);c.fill();}
 c.fillStyle=mix('#9fb7a3','#b9dcc0',s);for(let x=-10;x<W+20;x+=26){const y=chao(Math.min(W,Math.max(0,x)))-6-((x*37)%11);c.beginPath();c.arc(x,Math.min(y,232),14+((x*13)%7),0,7);c.fill();}
 c.fillRect(0,224,W,14);
 /* solo */
 c.beginPath();c.moveTo(0,H);for(let x=0;x<=W;x+=6)c.lineTo(x,chao(x));c.lineTo(W,H);c.closePath();
 const gs=c.createLinearGradient(0,230,0,H);gs.addColorStop(0,'#a1887f');gs.addColorStop(.35,'#bfa58a');gs.addColorStop(1,'#d7c3a8');c.fillStyle=gs;c.fill();
 c.strokeStyle='#5d4037';c.lineWidth=12;c.globalAlpha=.55;c.beginPath();for(let x=0;x<=W;x+=6){const y=chao(x)+6;x?c.lineTo(x,y):c.moveTo(x,y);}c.stroke();c.globalAlpha=1;
 c.strokeStyle='#7cb342';c.lineWidth=1.4;for(let x=4;x<W;x+=9){if(x>212&&x<598)continue;const y=chao(x);for(const d of[-2,0,2]){c.beginPath();c.moveTo(x+d,y);c.lineTo(x+d*2+((x*7)%3-1),y-5-((x*11)%4));c.stroke();}}
 c.fillStyle='rgba(93,64,55,.18)';for(let i=0;i<70;i++){const x=(i*137)%W,y=chao(x)+18+((i*71)%150);if(y<H-4){c.beginPath();c.arc(x,y,1.6,0,7);c.fill();}}
 /* agua */
 const ys=sup(G);let xa=210,xb=600;for(let x=210;x<300;x++){if(chao(x)>ys){xa=x;break;}}for(let x=600;x>480;x--){if(chao(x)>ys){xb=x;break;}}
 c.beginPath();c.moveTo(xa,ys);c.lineTo(xb,ys);for(let x=xb;x>=xa;x-=4)c.lineTo(x,chao(x));c.closePath();
 const ga=c.createLinearGradient(0,ys,0,330);ga.addColorStop(0,'#b3e5fc');ga.addColorStop(1,'#4fc3f7');c.fillStyle=ga;c.fill();
 c.strokeStyle='#3e2723';c.lineWidth=6;c.globalAlpha=.45;c.beginPath();for(let x=xa;x<=xb;x+=4){const y=chao(x)-2;x===xa?c.moveTo(x,y):c.lineTo(x,y);}c.stroke();c.globalAlpha=1;
 c.strokeStyle='rgba(255,255,255,.8)';c.lineWidth=1.5;for(let i=0;i<5;i++){const x=xa+20+i*60+Math.sin(G.t+i)*6;c.beginPath();c.moveTo(x,ys+4);c.lineTo(x+18,ys+4);c.stroke();}
 if(G.aguape!==false){aguape(c,370,ys,true);aguape(c,500,ys,false);}
 /* aceiros */
 for(const k of G.aceiros){const v1=G.veg[k],v2=G.veg[k+1],x=(v1.x+v2.x)/2,y=chao(x);c.fillStyle='#d7b98e';c.beginPath();c.ellipse(x,y+1,11,5,0,0,7);c.fill();c.strokeStyle='#6d4c41';c.lineWidth=2;c.setLineDash([4,3]);c.beginPath();c.moveTo(x,y-46);c.lineTo(x,y);c.stroke();c.setLineDash([]);c.fillStyle='#6d4c41';c.beginPath();c.moveTo(x,y-46);c.lineTo(x+10,y-42);c.lineTo(x,y-38);c.fill();}
 /* raizes */

function regiao(x,y,G){
 const ys=sup(G);
 if(x>200&&x<268&&y>chao(232)-34&&y<chao(232)+4)return'animais';
 for(const v of G.veg)if(v.vivo&&Math.abs(x-v.x)<20&&y>v.b-72&&y<v.b+2)return'plantas';
 for(const ax of[370,500])if(Math.abs(x-ax)<34&&y>ys-26&&y<ys+8)return'plantas';
 if(x>226&&x<570&&y>ys-4&&y<chao(x)+16)return'lodo';
 if(y>chao(x)-2)return'solo';
 return'ar';
}
function f1(){
 G=novaCena({canoa:470});ceuMol(G,'co2',14);G.i=0;G.err=0;G.pts=0;G.anim=null;G.marca=null;G.atomo={x:520,y:92,k:'co2'};
 G.onde='ar';telaJogo('','Passo 1 de 7');poeChip();
 G.tap=(x,y)=>{if(G.anim||G.i>=VIAGEM.length)return;const r=regiao(x,y,G),P=VIAGEM[G.i];
  if(r===P.para){G.onde=P.para;G.pts+=G.err===0?20:10;acao(`Isso! ${P.p} leva o carbono para <b>${NOMES[P.para]}</b>.`);G.err=0;G.anim={x0:G.atomo.x,y0:G.atomo.y,x1:P.to[0],y1:P.to[1],t:0,k:P.k};G.marca={x,y,ok:true,r,t:1};}
  else{G.err++;G.pts-=5;G.marca={x,y,ok:false,r,t:1};acao(`Não é <b>${NOMES[r]}</b>. Tente outro lugar. Pense: depois de <b>${P.p}</b>, onde o carbono fica?`);}
  S.fp=G.pts;hud();};
 G.upd=dt=>{if(G.marca){G.marca.t-=dt;if(G.marca.t<=0)G.marca=null;}
  if(G.anim){const a=G.anim;a.t+=dt/1.1;const t=Math.min(1,a.t),e=t*t*(3-2*t);G.atomo.x=a.x0+(a.x1-a.x0)*e;G.atomo.y=a.y0+(a.y1-a.y0)*e-Math.sin(Math.PI*t)*40;
   if(a.k&&t>.5)G.atomo.k=a.k;if(!a.k&&t>.5)G.atomo.k=null;
   if(a.t>=1){G.anim=null;G.i++;if(G.i>=VIAGEM.length){setTimeout(()=>fimFase(G.pts,true,'O mesmo átomo passou pelo ar, pela planta, pela capivara, pelo solo e pelo lodo. Ele nunca sumiu.','Se o carbono não some, por que o CO₂ do ar pode aumentar?'),900);}else{poeChip();$('info').textContent=`Passo ${G.i+1} de 7`;}}}};
 G.extra=c=>{const a=G.atomo;c.save();c.fillStyle='rgba(236,64,122,.22)';c.beginPath();c.arc(a.x,a.y,18+Math.sin(G.t*4)*3,0,7);c.fill();
  if(a.k==='co2'){c.fillStyle='#e53935';c.beginPath();c.arc(a.x-14,a.y,7,0,7);c.arc(a.x+14,a.y,7,0,7);c.fill();}
  if(a.k==='ch4'){c.fillStyle='#fff';c.strokeStyle='#90a4ae';for(const[dx,dy]of[[-10,-10],[10,-10],[-10,10],[10,10]]){c.beginPath();c.arc(a.x+dx,a.y+dy,4.5,0,7);c.fill();c.stroke();}}
  c.fillStyle='#ec407a';c.beginPath();c.arc(a.x,a.y,9.5,0,7);c.fill();c.fillStyle='#fff';c.font='800 12px system-ui';c.textAlign='center';c.textBaseline='middle';c.fillText('C',a.x,a.y+.5);c.textBaseline='alphabetic';
  if(G.marca){const m=G.marca;c.globalAlpha=Math.min(1,m.t*2);c.font='700 13px system-ui';const tx=(m.ok?'✓ ':'✗ ')+NOMES[m.r],w=c.measureText(tx).width+18;c.fillStyle=m.ok?'#2e7d32':'#c62828';c.beginPath();c.roundRect(m.x-w/2,m.y-34,w,24,12);c.fill();c.fillStyle='#fff';c.fillText(tx,m.x,m.y-17);}
  c.restore();};

function f2(){
 G=novaCena({hora:6,canoa:470});G.veg.forEach((v,i)=>{v.vivo=(i===2||i===7);});G.marcas=true;
 G.mudas=8;G.atm={co2:100,ch4:0};G.meta=88;G.tent=0;G.roda=false;G.hist=[];ceuMol(G,'co2',25);

 acao('Toque nos círculos + para plantar mudas. Depois aperte <b>▶ Rodar 3 dias</b>.');
 const n=()=>G.veg.filter(v=>v.vivo).length;
 G.src=()=>{const r=Math.random();if(r<.45)return pontoSolo();if(r<.6)return[232,chao(232)-18];const vv=vivos(G);return copa(vv[Math.floor(Math.random()*vv.length)]);};
 G.snk=()=>{const vv=vivos(G);return copa(vv[Math.floor(Math.random()*vv.length)]);};
 G.tap=(x,y)=>{if(G.roda)return;let best=null,bd=26;G.veg.forEach(v=>{const d=Math.hypot(x-v.x,y-(v.b-14));if(d<bd){bd=d;best=v;}});if(!best)return;
  if(!best.vivo&&G.mudas>0){best.vivo=true;best.muda=true;best.cresce=.2;G.mudas--;}else if(best.muda){best.vivo=false;best.muda=false;G.mudas++;}
  $('pM').textContent=`🌱 ${G.mudas} mudas`;};
 $('bR').onclick=()=>{G.roda=true;G.marcas=false;G.hora=6;G.atm.co2=100;G.hist=[[0,100]];$('bR').disabled=true;G.tent++;};
 G.upd=dt=>{G.veg.forEach(v=>{if(v.muda&&v.cresce<1)v.cresce=Math.min(1,v.cresce+dt*2);});
  if(!G.roda)return;const dh=dt*4;G.hora+=dh;const nn=n(),sl=sol(G);
  acao(sl>0?'☀️ Dia: as plantas fazem fotossíntese e tiram CO₂ do ar.':'🌙 Noite: sem luz não há fotossíntese, mas todos respiram. O CO₂ sobe.');
  const fl=(0.24*nn+0.8)-1.2*nn*sl;G.atm.co2=clamp(G.atm.co2+fl*dh,5,158);poeMed('mCO2',G.atm.co2);
  const h=G.hora-6,dia=Math.floor(h/24)+1,hh=Math.floor(G.hora%24);$('info').textContent=`Dia ${Math.min(3,dia)} · ${hh}h`;
  if(!G.hist.length||h-G.hist[G.hist.length-1][0]>=.5)G.hist.push([h,G.atm.co2]);
  if(G.hora>=78){G.roda=false;fim2();}};
 rodar();
}
function grafico(h,meta){const cv=document.createElement('canvas');cv.className='mini';cv.width=840;cv.height=260;const c=cv.getContext('2d');c.scale(2,2);const w=420,hh=130,px=x=>34+x/72*(w-44),py=v=>hh-20-v/160*(hh-30);
 c.fillStyle='#f6fbfc';c.fillRect(34,10,w-44,hh-30);for(let d=0;d<3;d++){c.fillStyle='rgba(159,168,218,.25)';c.fillRect(px(d*24+12),10,px(24)-px(12),hh-30);}
 c.strokeStyle='#10212b';c.setLineDash([5,4]);c.beginPath();c.moveTo(34,py(meta));c.lineTo(w-10,py(meta));c.stroke();c.setLineDash([]);
 c.strokeStyle='#e53935';c.lineWidth=2.5;c.beginPath();h.forEach(([x,v],i)=>i?c.lineTo(px(x),py(v)):c.moveTo(px(x),py(v)));c.stroke();
 c.fillStyle='#4d6370';c.font='11px system-ui';c.textAlign='center';for(let d=0;d<3;d++){c.fillText('dia '+(d+1),px(d*24+6),hh-6);c.fillText('noite',px(d*24+18),hh-6);}
 c.textAlign='right';c.fillText('CO₂',30,py(150));return cv;}
function fim2(){

   $('bR').onclick=()=>{G.roda=true;G.marcas=false;G.hora=6;G.atm.co2=100;G.hist=[[0,100]];$('bR').disabled=true;G.tent++;};};
  S.fp=0;return;}
 const sobra=G.mudas;S.fichas=Math.min(4,sobra);const pts=Math.max(40,100-20*(G.tent-1))+10*sobra;

const PONTOS=[
 {x:290,nome:'Baía rasa aberta',ch4:3,co2:0,cls:'muito',como:'bolhas'},
 {x:370,nome:'Rasa com aguapé',ch4:3,co2:-2,cls:'muito',como:'planta'},
 {x:500,nome:'Funda com aguapé',ch4:1,co2:-3,cls:'pouco',como:'pouco'},
 {x:700,nome:'Campo seco',ch4:0,co2:1,cls:'pouco',como:'nada',terra:true}];
function f3(){
 G=novaCena({canoa:450});ceuMol(G,'co2',14);G.med=PONTOS.map(()=>null);G.atual=-1;G.tm=0;G.pts=0;G.ir=null;
 telaJogo('🫧 Bolhas na baía','0 de 4 medidos');

 G.tap=(x,y)=>{if(G.ir||G.atual>=0)return;PONTOS.forEach((p,i)=>{const py=p.terra?chao(p.x)-70:sup(G)-58;if(Math.hypot(x-p.x,y-py)<26&&!G.med[i]){G.ir={i};G.camara=null;}});};
 G.upd=dt=>{
  {const k=G.med.findIndex(m=>!m);acao(G.atual>=0||G.ir?'Medindo... veja o que sai da água ou do solo.':k>=0?`Toque no número <b>${k+1}</b> para levar a câmara até lá.`:'Pronto! Agora vamos separar os lugares.');}
  if(G.ir){const p=PONTOS[G.ir.i];if(p.terra){G.canoa=null;G.pe=G.pe==null?600:G.pe;const d=p.x-14-G.pe;G.pe+=Math.sign(d)*Math.min(Math.abs(d),120*dt);if(Math.abs(d)<1){G.atual=G.ir.i;G.ir=null;G.tm=0;G.camara={x:p.x+16,terra:true};}}
   else{if(G.pe!=null){G.pe=null;G.canoa=560;}const d=p.x-40-G.canoa;G.canoa+=Math.sign(d)*Math.min(Math.abs(d),120*dt);if(Math.abs(d)<1){G.atual=G.ir.i;G.ir=null;G.tm=0;G.camara={x:p.x}; }}}
  if(G.atual>=0){const p=PONTOS[G.atual];G.tm+=dt;
   if(p.como==='bolhas'&&Math.random()<.35)bolha(G,p.x);
   if(p.como==='planta'&&Math.random()<.25)G.puf.push({x:p.x+rr(-22,22),y:sup(G)-14,r:3,a:1});
   if(p.como==='pouco'&&Math.random()<.04)bolha(G,p.x);
   if(G.tm>2.6){G.med[G.atual]=true;G.pts+=10;S.fp=G.pts;hud();G.atual=-1;G.camara=null;const n=G.med.filter(Boolean).length;$('info').textContent=`${n} de 4 medidos`;if(n===4)setTimeout(classif3,700);}}
 };
 G.extra=c=>{c.save();PONTOS.forEach((p,i)=>{const py=p.terra?chao(p.x)-70:sup(G)-58;
  if(!G.med[i]){c.fillStyle=G.atual===i?'#ffca28':CORES.main;c.beginPath();c.arc(p.x,py,15,0,7);c.fill();c.fillStyle='#fff';c.font='800 15px system-ui';c.textAlign='center';c.fillText(i+1,p.x,py+5);}
  else{leitura(c,p,py-58);}});
  if(G.atual>=0){const p=PONTOS[G.atual],py=(p.terra?chao(p.x):sup(G))-100;const f=Math.min(1,G.tm/2.6);c.fillStyle='#fff';c.strokeStyle=CORES.main;c.lineWidth=2;c.beginPath();c.roundRect(p.x-40,py,80,12,6);c.fill();c.stroke();c.fillStyle=CORES.main;c.beginPath();c.roundRect(p.x-40,py,80*f,12,6);c.fill();}
  c.restore();};
 rodar();
}
function leitura(c,p,py){c.fillStyle='rgba(255,255,255,.95)';c.strokeStyle='#b2ebf2';c.lineWidth=2;c.beginPath();c.roundRect(p.x-34,py-30,68,48,10);c.fill();c.stroke();
 c.font='700 10px system-ui';c.textAlign='left';c.fillStyle='#ef6c00';c.fillText('CH₄',p.x-28,py-15);for(let k=0;k<3;k++){c.fillStyle=k<p.ch4?'#ef6c00':'#eceff1';c.fillRect(p.x-2+k*10,py-23,8,10);}
 c.fillStyle='#e53935';c.fillText('CO₂',p.x-28,py+6);c.font='700 13px system-ui';c.fillText(p.co2<0?'⬇ entra':p.co2>0?'⬆ sai':'·',p.x-2,py+7);}
function classif3(){
