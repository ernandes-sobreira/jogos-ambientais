<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Energia da Cidade</title>
<style>
:root{--main:#455a64;--deep:#263238;--soft:#eceff1;--line:#cfd8dc;--ink:#10212b;--mut:#4d6370;--co2:#e53935;--ch4:#ef6c00;--ok:#2e7d32;--bad:#c62828}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:var(--ink);line-height:1.45}
.wrap{max-width:820px;margin:0 auto;padding:12px 14px 40px}
a.hub{color:var(--deep);font-weight:700;text-decoration:none;font-size:.9rem}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
h1{font-size:1.4rem;color:var(--deep);letter-spacing:-.01em}
h2{font-size:1.2rem;color:var(--deep);margin-bottom:6px;letter-spacing:-.01em}
h3{font-size:1rem;color:var(--deep);margin:14px 0 6px}
.hud{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--soft);color:var(--deep);border-radius:99px;padding:5px 12px;font-weight:700;font-size:.86rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.card{border:2px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px;background:#fff}
.btn{background:var(--main);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;touch-action:manipulation}
.btn:hover{background:var(--deep)}.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:#fff;color:var(--deep);border:2px solid var(--main)}
.btn.sm{padding:9px 14px;font-size:.92rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.small{font-size:.86rem;color:var(--mut)}
canvas.cena{width:100%;height:auto;display:block;border:2px solid var(--line);border-radius:16px;touch-action:none;background:#fff;margin-top:10px}
.top{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--main);color:#fff;border-radius:14px;padding:8px 14px;font-weight:800;font-size:1.05rem}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.tool{border:2px solid var(--line);background:#fff;color:var(--deep);border-radius:12px;padding:9px 12px;font-weight:700;font-family:inherit;font-size:.92rem;cursor:pointer;touch-action:manipulation}
.tool.on{border-color:var(--main);background:var(--soft)}
.tool:disabled{opacity:.4}
.mets{display:grid;gap:8px;margin-top:10px}
.met{display:grid;grid-template-columns:92px 1fr 52px;gap:8px;align-items:center;font-weight:700;font-size:.9rem}
.met .bar{position:relative;height:18px;background:#f1f4f5;border-radius:99px;overflow:hidden}
.met .fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;transition:width .15s}
.met .alvo{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--ink);border-radius:2px}
.met .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--mut)}
.met.co2 .fill{background:var(--co2)}.met.ch4 .fill{background:var(--ch4)}
.saldo .bar{background:linear-gradient(90deg,#e8f5e9 50%,#ffebee 50%)}
.saldo .zero{position:absolute;left:50%;top:-3px;bottom:-3px;width:3px;background:var(--ink)}
.saldo .fill{border-radius:0}
.obj{display:flex;gap:10px;align-items:flex-start;background:#fff8e1;border:2px solid #ffe082;border-radius:14px;padding:10px 12px;margin-top:10px;font-size:.95rem}
.obj b{color:#8d6e00;white-space:nowrap}
.acao{display:flex;gap:10px;align-items:center;background:var(--soft);border-left:5px solid var(--main);border-radius:0 12px 12px 0;padding:9px 12px;margin-top:8px;font-weight:600;font-size:.95rem;min-height:42px}
.acao .dedo{font-size:1.25rem;animation:pulo 1s ease-in-out infinite}
@keyframes pulo{50%{transform:translateX(4px)}}
.help{width:34px;height:34px;border-radius:50%;border:2px solid var(--main);background:#fff;color:var(--deep);font-weight:800;font-size:1rem;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(16,33,43,.35);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal .card{max-width:460px;width:100%}
.intro{text-align:center;padding:26px 18px}
.intro .ic{font-size:3rem;line-height:1}
.intro .n{color:var(--mut);font-weight:700;font-size:.85rem;margin-top:8px}
.passos{display:grid;gap:8px;margin:16px auto;max-width:420px;text-align:left}
.passos div{display:flex;gap:12px;align-items:center;background:var(--soft);border-radius:12px;padding:10px 14px;font-weight:600}
.passos b{font-size:1.3rem;min-width:1.6em;text-align:center}
.res{text-align:center}
.res .big{font-size:2.6rem;font-weight:800;color:var(--deep);line-height:1.1}
.res .ok{color:var(--ok);font-weight:800}.res .no{color:var(--bad);font-weight:800}
.pensa{background:var(--soft);border-radius:14px;padding:12px 14px;margin:14px auto;max-width:520px;text-align:left}
.pensa b{color:var(--deep)}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.box{border:2px dashed var(--line);border-radius:14px;padding:10px;min-height:110px;cursor:pointer}
.box h4{font-size:.92rem;color:var(--deep);margin-bottom:6px}
.box.alvo{border-color:var(--main);background:var(--soft)}
.cards{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;min-height:48px}
.ct{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 11px;font-weight:700;font-size:.9rem;cursor:pointer;box-shadow:0 2px 0 var(--line);font-family:inherit;color:var(--ink);transition:transform .5s}
.ct.sel{border-color:var(--main);background:var(--soft);transform:translateY(-2px)}
.ct.certo{border-color:var(--ok);background:#e8f5e9}.ct.errado{border-color:var(--bad);background:#ffebee}
.ct.movido{animation:voa .8s ease}
@keyframes voa{0%{transform:translateY(-30px) scale(1.1);opacity:.3}100%{transform:none;opacity:1}}
.capa{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:center}
.capa canvas{width:100%;height:auto;display:block;border-radius:16px;background:var(--soft)}
.opts{display:grid;gap:8px;margin-top:6px}
.opts .l{font-size:.8rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer}
.sw button.on{box-shadow:0 0 0 3px var(--deep)}
.sw .tx{width:auto;height:auto;border-radius:10px;padding:6px 10px;font-weight:700;font-size:.85rem;background:#fff;color:var(--deep);font-family:inherit;border:0}
input.nome{border:2px solid var(--line);border-radius:12px;padding:11px;font-size:1rem;font-family:inherit;width:100%}
input[type=range]{width:100%;accent-color:var(--main)}
.tab{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:6px}
.tab th{text-align:left;background:var(--soft);color:var(--deep);padding:7px 6px}
.tab td{border-bottom:1px solid var(--line);padding:7px 6px;vertical-align:top}
.guia p,.guia li{font-size:.95rem;margin-bottom:6px}
.guia ul,.guia ol{padding-left:20px}
.hab{border-left:5px solid var(--main);background:var(--soft);padding:10px 14px;border-radius:0 12px 12px 0;font-size:.95rem}
.ref li{font-size:.86rem;color:var(--mut)}
.ranking{border:3px solid var(--main);border-radius:18px;padding:0 16px 12px;overflow:hidden;margin-top:12px}
.ranking h3{font-size:1rem;margin:0 -16px 8px;padding:10px 16px;background:var(--main);color:#fff}
.ranking ol{list-style:none}.ranking li{display:flex;justify-content:space-between;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:.92rem}
.ranking li:last-child{border-bottom:0}.rp{display:inline-block;min-width:2.1em;font-weight:800;color:var(--deep)}
.savebox{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.savebox input{flex:1;min-width:160px;border:2px solid var(--line);border-radius:12px;padding:11px;font-size:1rem;font-family:inherit}
.rel{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.rel canvas{width:120px;height:120px;border-radius:50%;background:var(--soft)}
.mini{width:100%;max-width:420px;height:auto;display:block;margin:10px auto 0}
@media (max-width:620px){.wrap{padding:10px 8px 30px}.card{padding:12px;border-radius:16px}.capa{grid-template-columns:1fr}.met{grid-template-columns:70px 1fr 44px;font-size:.82rem}.chip{font-size:.95rem}.rel{grid-template-columns:80px 1fr}.rel canvas{width:80px;height:80px}}
@media print{a.hub,header .hud,.ranking,.noprint{display:none!important}.card{border:1px solid #ccc;break-inside:avoid}body{font-size:12px}}
</style>
</head>
<body>
<div class="wrap">
<a class="hub" href="https://ernandes-sobreira.github.io/jogos-ambientais/">← Todos os jogos</a>
<header>
  <h1>Energia da Cidade</h1>
  <div class="hud" id="hud" style="display:none"><span class="pill" id="hF"></span><span class="pill" id="hP"></span></div>
</header>
<main id="tela"></main>
<div class="ranking" id="rankBox"><h3>Ranking Global</h3><ol id="rankList"><li><span>Carregando o ranking...</span></li></ol><p class="small" id="rankNote"></p></div>
</div>
<script>
const $=id=>document.getElementById(id);
const rr=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const W=760,H=372;
function hex(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function mix(a,b,t){const A=hex(a),B=hex(b);return`rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`;}

/* ================= AVATAR ================= */
const PELES=['#f6d3b8','#e3b18b','#c68a5e','#94603e','#5d3b26'];
const CABS=['#1b1b1b','#4e342e','#8d6e63','#d4a85a','#b5532f'];
const CAMISAS=['#00838f','#2e7d32','#f9a825','#c62828','#6a1b9a','#37474f'];
const ESTILOS=[['curto','Curto'],['cacheado','Cacheado'],['longo','Longo'],['coque','Coque'],['raspado','Raspado']];
const CHAPEUS=[['nenhum','Sem'],['bone','Boné'],['campo','Chapéu']];
let A={pele:2,cab:0,estilo:'cacheado',camisa:0,chapeu:'campo',nome:''};
try{const s=JSON.parse(localStorage.getItem('bc_avatar')||'null');if(s)A=Object.assign(A,s);}catch(e){}
function salvaA(){try{localStorage.setItem('bc_avatar',JSON.stringify(A));}catch(e){}}
function avatar(c,x,y,s,a,prancheta){
 c.save();c.translate(x,y);c.scale(s,s);
 const pele=PELES[a.pele],cab=CABS[a.cab],cam=CAMISAS[a.camisa];
 if(a.estilo==='longo'){c.fillStyle=cab;c.beginPath();c.ellipse(0,-39,12.5,15,0,0,7);c.fill();c.fillRect(-12.5,-40,25,22);}
 if(a.estilo==='cacheado'){c.fillStyle=cab;c.beginPath();c.ellipse(0,-40,15,14.5,0,0,7);c.fill();}
 c.fillStyle=cam;c.beginPath();c.moveTo(-16,0);c.quadraticCurveTo(-17,-21,-6,-25);c.lineTo(6,-25);c.quadraticCurveTo(17,-21,16,0);c.closePath();c.fill();
 c.fillStyle='rgba(0,0,0,.12)';c.fillRect(-1,-24,2,24);
 c.fillStyle=pele;c.fillRect(-3.5,-29,7,6);
 if(prancheta){c.fillStyle='#8d6e63';c.fillRect(4,-19,13,16);c.fillStyle='#fff';c.fillRect(5.5,-17,10,12);c.strokeStyle='#90a4ae';c.lineWidth=.8;for(let i=0;i<4;i++){c.beginPath();c.moveTo(7,-14+i*2.6);c.lineTo(14,-14+i*2.6);c.stroke();}}
 c.strokeStyle=cam;c.lineWidth=6;c.lineCap='round';c.beginPath();c.moveTo(-11,-20);c.lineTo(-4,-9);c.stroke();
 c.fillStyle=pele;c.beginPath();c.arc(-3,-8,3,0,7);c.fill();
 c.fillStyle=pele;c.beginPath();c.ellipse(0,-39,9.5,11,0,0,7);c.fill();
 c.beginPath();c.arc(-9.4,-38,2.3,0,7);c.arc(9.4,-38,2.3,0,7);c.fill();
 c.fillStyle=cab;
 if(a.estilo==='curto'){c.beginPath();c.ellipse(0,-44.5,10,6.8,0,Math.PI,0);c.fill();c.fillRect(-10,-46,2.8,7);c.fillRect(7.2,-46,2.8,7);}
 if(a.estilo==='cacheado'){for(let i=0;i<13;i++){const an=Math.PI*(.8+i*1.4/12);c.beginPath();c.arc(Math.cos(an)*12,-41+Math.sin(an)*11.5,4.2,0,7);c.fill();}}
 if(a.estilo==='longo'){c.beginPath();c.ellipse(0,-44.5,10.6,7.2,0,Math.PI,0);c.fill();}
 if(a.estilo==='coque'){c.beginPath();c.ellipse(0,-44.5,10,6.4,0,Math.PI,0);c.fill();c.beginPath();c.arc(0,-53,5.2,0,7);c.fill();}
 if(a.estilo==='raspado'){c.globalAlpha=.5;c.beginPath();c.ellipse(0,-44,9.8,6.2,0,Math.PI,0);c.fill();c.globalAlpha=1;}
 c.fillStyle='#2b2a26';c.beginPath();c.arc(-3.4,-39,1.25,0,7);c.arc(3.4,-39,1.25,0,7);c.fill();
 c.strokeStyle='#2b2a26';c.lineWidth=1;c.beginPath();c.arc(0,-35.6,2.6,.25,Math.PI-.25);c.stroke();
 if(a.chapeu==='bone'){c.fillStyle=cam;c.beginPath();c.ellipse(0,-46,10.6,5.8,0,Math.PI,0);c.fill();c.fillRect(-10.6,-47,21.2,2.6);c.beginPath();c.ellipse(8.5,-46.2,8,2.2,0,0,7);c.fill();}
 if(a.chapeu==='campo'){c.fillStyle='#d7c49e';c.beginPath();c.ellipse(0,-46,16.5,3.6,0,0,7);c.fill();c.beginPath();c.ellipse(0,-48,9.2,6.4,0,Math.PI,0);c.fill();c.fillStyle='#8d6e63';c.fillRect(-9.2,-49,18.4,1.9);}
 c.restore();
}
function pernas(c,x,y,s,a){c.save();c.translate(x,y);c.scale(s,s);c.fillStyle='#455a64';c.fillRect(-11,0,9,20);c.fillRect(2,0,9,20);c.fillStyle='#3e2723';c.fillRect(-12,18,11,4);c.fillRect(1,18,11,4);c.restore();}

/* ================= MODELO ================= */
const DEM=h=>55+30*Math.exp(-(((h-19.5)/2.5)**2))+12*Math.exp(-(((h-12)/3)**2));
const SOLH=h=>Math.max(0,Math.sin(Math.PI*(h-6)/12));
function dia(N,B){let bat=0,cap=B*60;const out=[];for(let d=0;d<2;d++)for(let h=0;h<24;h+=.5){const s=N*9*SOLH(h),dm=DEM(h);let sob=s-dm,usoS=Math.min(s,dm),car=0,desc=0,ter=0,perd=0;
 if(sob>=0){car=Math.min(sob,(cap-bat)/.5);bat+=car*.5;perd=sob-car;}else{desc=Math.min(-sob,bat/.5);bat-=desc*.5;ter=-sob-desc;}if(d)out.push({h,dm,s:usoS,desc,ter,perd,bat});}return out;}
function resumoDia(o){return{co2:Math.round(o.reduce((a,x)=>a+x.ter*.5,0)),perd:Math.round(o.reduce((a,x)=>a+x.perd*.5,0))};}
/* ano: 12 meses, comeca em janeiro (chuva) */
const CHUVA=[1,1,1,.8,.4,.2,.1,.1,.2,.5,.8,1];
const VENTO=[.5,.5,.55,.7,.9,1.1,1.2,1.25,1.2,1,.7,.55];
function ano(o){/* o: {hid,sol,eol,ter,novaHid,seca} */const dem=120;let R=o.Rini??150;const cap=(o.hid+(o.novaHid||0))*25,Rmax=(o.hid+(o.novaHid||0))*120;const m=[];
 for(let i=0;i<12;i++){const inflow=(o.hid+(o.novaHid||0))*22*CHUVA[i]*(o.seca?.45:1);R=Math.min(Rmax,R+inflow);const s=Math.min(dem*.45,o.sol*8),e=Math.min(dem-s,o.eol*10*VENTO[i]);let rest=dem-s-e;
  const h=Math.min(rest,cap,R);R-=h;rest-=h;const t=Math.min(rest,o.ter*30);rest-=t;m.push({s,e,h,t,ap:rest,R});}
 return{m,co2:Math.round(m.reduce((a,x)=>a+x.t,0)),ap:Math.round(m.reduce((a,x)=>a+x.ap,0))};}

/* ================= CENA ================= */
const CORES={main:'#455a64',deep:'#263238'};
function sr(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function syncMol(){}function partic(){}
const CF={s:'#f9a825',e:'#26a69a',h:'#1e88e5',t:'#757575',d:'#ab47bc',p:'#ffe082'};
function painel(c,x,y,on){c.save();c.translate(x,y);c.fillStyle='#78909c';c.fillRect(-1,-4,2,8);c.transform(1,0,-.4,1,0,0);const g=c.createLinearGradient(0,-16,0,-4);g.addColorStop(0,on?'#5c8fd6':'#3f5f8f');g.addColorStop(1,'#1d3557');c.fillStyle=g;c.fillRect(-14,-16,28,12);c.strokeStyle='rgba(255,255,255,.5)';c.lineWidth=.7;for(let i=1;i<4;i++){c.beginPath();c.moveTo(-14+i*7,-16);c.lineTo(-14+i*7,-4);c.stroke();}c.beginPath();c.moveTo(-14,-10);c.lineTo(14,-10);c.stroke();c.restore();}
function turbina(c,x,y,a,s){s=s||1;c.save();c.translate(x,y);c.scale(s,s);c.fillStyle='#eceff1';c.beginPath();c.moveTo(-2.5,0);c.lineTo(-1.2,-60);c.lineTo(1.2,-60);c.lineTo(2.5,0);c.fill();c.translate(0,-60);c.rotate(a);c.fillStyle='#fafafa';c.strokeStyle='#b0bec5';c.lineWidth=.6;for(let i=0;i<3;i++){c.rotate(Math.PI*2/3);c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(4,-14,1,-30);c.lineTo(-1.5,-29);c.quadraticCurveTo(-2,-14,0,0);c.fill();c.stroke();}c.fillStyle='#cfd8dc';c.beginPath();c.arc(0,0,3,0,7);c.fill();c.restore();}
function barragem(c,x,y,nivel){c.fillStyle='#90caf9';c.fillRect(x-90,y-10-nivel*40,80,10+nivel*40);c.fillStyle='#9e9e9e';c.beginPath();c.moveTo(x-12,y);c.lineTo(x-10,y-58);c.lineTo(x+6,y-58);c.lineTo(x+16,y);c.fill();c.fillStyle='#bdbdbd';c.fillRect(x-10,y-58,16,5);
 c.fillStyle='#64b5f6';c.fillRect(x+16,y-8,70,8);}
function termica(c,x,y,f,t){c.fillStyle='#8d6e63';c.fillRect(x-30,y-30,48,30);c.fillStyle='#bcaaa4';c.fillRect(x+6,y-70,12,40);c.fillStyle='#c62828';c.fillRect(x+6,y-70,12,4);c.fillRect(x+6,y-58,12,3);
 for(let i=0;i<Math.round(f*7);i++){const k=(t*.5+i/7)%1;c.fillStyle=`rgba(97,97,97,${.45*(1-k)})`;c.beginPath();c.arc(x+12+k*40,y-76-k*60,6+k*14,0,7);c.fill();}}
function cidade(c,x,y,noite){const B=[[0,40],[18,62],[38,50],[56,80],[78,56],[96,70],[116,46]];B.forEach(([dx,h],i)=>{c.fillStyle=noite?'#37474f':'#90a4ae';c.fillRect(x+dx,y-h,16,h);for(let r=0;r<Math.floor(h/10);r++)for(let k=0;k<2;k++){c.fillStyle=noite?(sr(i*9+r*3+k)>.3?'#ffe082':'#455a64'):'#cfd8dc';c.fillRect(x+dx+3+k*6,y-h+4+r*10,4,5);}});}
function fundo(c,G,noite){const g=c.createLinearGradient(0,0,0,230);g.addColorStop(0,noite?'#7986cb':'#cbeef8');g.addColorStop(1,noite?'#c5cae9':'#f6fcfd');c.fillStyle=g;c.fillRect(0,0,W,H);
 c.fillStyle='#c5e1a5';c.fillRect(0,230,W,H-230);c.fillStyle='#aed581';c.fillRect(0,230,W,6);}
function drawCena(c,G){if(G.desenha)G.desenha(c);}
/* ================= TELA / LOOP ================= */
let G=null,S=null,raf=0,ultimo=0,cx=null;
function laco(ts){const dt=Math.min(.05,(ts-ultimo)/1000||0);ultimo=ts;if(G){G.t+=dt;if(G.upd)G.upd(dt);syncMol(G,dt);partic(G,dt);if(cx)drawCena(cx,G);if(G.extra)G.extra(cx);}raf=requestAnimationFrame(laco);}
function parar(){cancelAnimationFrame(raf);raf=0;}
function rodar(){parar();ultimo=performance.now();raf=requestAnimationFrame(laco);}

function grafDia(c,o,x0,y0,w,h){c.fillStyle='#fff';c.strokeStyle='#cfd8dc';c.lineWidth=1.5;c.beginPath();c.roundRect(x0-8,y0-8,w+16,h+28,10);c.fill();c.stroke();const mx=140,px=i=>x0+i/47*w,py=v=>y0+h-v/mx*h;
 const camada=(f,cor,base)=>{c.fillStyle=cor;c.beginPath();o.forEach((p,i)=>{const y=py(base(p)+f(p));i?c.lineTo(px(i),y):c.moveTo(px(i),y);});for(let i=o.length-1;i>=0;i--)c.lineTo(px(i),py(base(o[i])));c.closePath();c.fill();};
 camada(p=>p.s,CF.s,()=>0);camada(p=>p.desc,CF.d,p=>p.s);camada(p=>p.ter,CF.t,p=>p.s+p.desc);camada(p=>p.perd,'rgba(249,168,37,.35)',p=>p.dm);

 c.fillStyle='#4d6370';c.font='11px system-ui';c.textAlign='center';[0,6,12,18,24].forEach(hh=>c.fillText(hh+'h',x0+hh/24*w,y0+h+14));
 c.textAlign='left';c.font='700 11px system-ui';[['Sol',CF.s],['Bateria',CF.d],['Térmica (CO₂)',CF.t],['Sobra perdida','rgba(249,168,37,.35)'],['Consumo','#263238']].forEach(([n,cor],i)=>{c.fillStyle=cor;c.fillRect(x0+i*110,y0-6,10,10);c.fillStyle='#37474f';c.fillText(n,x0+i*110+14,y0+3);});}

 G.desenha=c=>{fundo(c,G,false);barragem(c,200,232,G.a?Math.max(.05,G.a.m[Math.min(11,Math.floor(G.mes))].R/360):.8);termica(c,420,232,G.a?G.a.m[Math.min(11,Math.floor(G.mes))].t/120:.3,G.t);if(G.et===2)for(let i=0;i<3;i++)turbina(c,540+i*40,232,G.t*2+i,.8);cidade(c,640,232,false);
  grafAno(c,G.a||G.base,40,262,680,80,G.a?Math.floor(G.mes)+1:12);c.fillStyle='#263238';c.font='800 13px system-ui';c.textAlign='left';c.fillText(G.a?(G.et===2?'Ano seco com 3 eólicas':'Ano seco'):'Ano normal (para comparar)',20,24);};
 const tab=(v,fn)=>`<div style="width:100%;display:grid;gap:6px">${PR.map(([k,n])=>`<div class="row" style="gap:6px"><b style="min-width:190px">${n}</b>${[['up','⬆ sobe'],['eq','➖ igual'],['dn','⬇ desce']].map(([x,t])=>`<button class="tool${v[k]===x?' on':''}" data-k="${k}" data-v="${x}">${t}</button>`).join('')}</div>`).join('')}</div>`;
 const ctrl=()=>{$('ctrl').innerHTML=tab(G.prev)+`<button class="btn sm" id="bR" ${Object.keys(G.prev).length<3?'disabled':''}>▶ Rodar o ano seco</button>`;
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{G.prev[b.dataset.k]=b.dataset.v;ctrl();});
  $('bR').onclick=()=>{G.a=ano({hid:3,sol:2,eol:0,ter:4,seca:1});G.mes=0;G.roda=true;G.et=1;$('ctrl').innerHTML='';acao('Pouca chuva: o reservatório enche menos...');};};
 G.upd=dt=>{if(!G.roda)return;G.mes+=dt*1.6;if(G.mes>=12){G.roda=false;if(G.et===1)res1();else res2();}};
 const tot=(a,k)=>a.m.reduce((s,x)=>s+x[k],0);
 const res1=()=>{const real={h:'dn',t:'up',co2:'up'};let ac=0;PR.forEach(([k])=>{if(G.prev[k]===real[k])ac++;});G.ac1=ac;
  acao(`Você acertou ${ac} de 3. Com pouca chuva a hidrelétrica gerou menos e a térmica cobriu a falta. CO₂: ${G.base.co2} no ano normal, ${G.a.co2} no ano seco.`);
  $('ctrl').innerHTML=`<div style="width:100%"><b>E se a região tiver 3 usinas eólicas no ano seco? O uso da térmica:</b><div class="row" style="margin-top:6px">${[['up','⬆ sobe'],['eq','➖ igual'],['dn','⬇ desce']].map(([x,t])=>`<button class="tool" data-p2="${x}">${t}</button>`).join('')}</div></div>`;
  document.querySelectorAll('[data-p2]').forEach(b=>b.onclick=()=>{G.prev2=b.dataset.p2;G.seco=G.a;G.a=ano({hid:3,sol:2,eol:3,ter:4,seca:1});G.mes=0;G.roda=true;G.et=2;$('ctrl').innerHTML='';acao('Rodando o ano seco com vento...');});};
 const res2=()=>{const ok2=G.prev2==='dn',ac=G.ac1+(ok2?1:0);fimFase(ac*40,ac>=3,`Você acertou ${ac} de 4. No ano seco, a térmica e o CO₂ sobem (${G.seco.co2}). Com eólicas, o CO₂ caiu para ${G.a.co2}, porque no modelo o vento é mais forte justamente na estação seca e ajuda quando falta água.`,'Por que depender de um só tipo de usina deixa a região mais frágil?');};
 ctrl();acao('O gráfico mostra um ano normal. Preveja o que muda num ano seco e aperte <b>▶ Rodar</b>.');rodar();}
/* ---------- FASE 5 ---------- */
const TIPOS=[['sol','☀️ Solar',2],['eol','🌬️ Eólica',3],['novaHid','💧 Nova hidrelétrica',4],['ter','🏭 Térmica',2]];

 G.desenha=c=>{fundo(c,G,false);for(let i=0;i<G.q.sol;i++)painel(c,30+(i%6)*30,228-Math.floor(i/6)*20,true);for(let i=0;i<G.q.eol;i++)turbina(c,230+i*28,232,G.t*2+i,.7);barragem(c,450,232,.6);if(G.q.novaHid){c.fillStyle='#c62828';c.font='700 11px system-ui';c.textAlign='center';c.fillText('nova barragem no rio do Pantanal',400,150);barragem(c,380,200,.4);}
  for(let i=0;i<G.q.ter;i++)termica(c,520+i*36,232,.6,G.t+i);cidade(c,640,232,false);const a=G.ver==='a'?G.a:G.b;if(a)grafAno(c,a,40,262,680,80,12);
  c.fillStyle='#263238';c.font='800 13px system-ui';c.textAlign='left';c.fillText(a?(G.ver==='a'?'Ano normal':'Ano seco'):'Monte a matriz e teste',20,24);};
 const custo=()=>TIPOS.reduce((s,[k,,p])=>s+G.q[k]*p,0);
 const ctrl=()=>{$('ctrl').innerHTML=TIPOS.map(([k,n,p])=>`<div class="row" style="gap:4px"><span class="pill">${n} · ${p}</span><button class="tool" data-k="${k}" data-d="-1">−</button><span class="pill">${G.q[k]}</span><button class="tool" data-k="${k}" data-d="1">+</button></div>`).join('')+`<button class="btn sm" id="bR">▶ Testar os dois anos</button>`;
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;G.q[k]=Math.max(0,Math.min(9,G.q[k]+ +b.dataset.d));G.a=null;G.b=null;ctrl();metas();});
  $('bR').onclick=()=>{G.tent++;const o={hid:2,...G.q};G.a=ano(o);G.b=ano({...o,seca:1});metas(true);};};
 const metas=(test)=>{const c2=custo(),ap=G.a?G.a.ap+G.b.ap:null,co=G.a?G.a.co2+G.b.co2:null;const M=[['⚡ Sem apagão nos dois anos',ap===0,ap==null?'teste':ap],[`🏭 CO₂ até 560 nos dois anos`,co!=null&&co<=560,co==null?'teste':co],['🪙 Custo até 24',c2<=24,c2],['🐟 Nenhuma nova barragem no Pantanal',G.q.novaHid===0,'']];
  $('info').textContent=`🪙 custo ${c2}`;$('mets').innerHTML=`<div class="row" style="margin-bottom:6px">${G.a?`<button class="tool${G.ver==='a'?' on':''}" id="vA">Ano normal</button><button class="tool${G.ver==='b'?' on':''}" id="vB">Ano seco</button>`:''}</div><div class="pensa" style="margin:0;max-width:none">${M.map(([t,ok,v])=>`${ok?'✅':'⬜'} ${t} ${v!==''?`<b>(${v})</b>`:''}`).join('<br>')}</div>`;
  if($('vA')){$('vA').onclick=()=>{G.ver='a';metas();};$('vB').onclick=()=>{G.ver='b';metas();};}
  if(test){const k=M.filter(x=>x[1]).length;if(k===4){acao('Todas as metas cumpridas!');setTimeout(()=>fimFase(Math.max(80,200-25*(G.tent-1)),true,`Sua matriz: ${G.q.sol} solares, ${G.q.eol} eólicas, ${G.q.ter} térmicas e nenhuma barragem nova. Ela aguenta o ano seco sem apagão e com pouco CO₂. Misturar fontes que falham em épocas diferentes dá segurança.`,'Por que a térmica ainda aparece numa matriz limpa?'),1500);}
   else{acao(`Faltam metas: ${M.filter(x=>!x[1]).map(x=>x[0].slice(2)).join('; ')}. Ajuste e teste de novo.`);if(G.tent>=4&&!$('bDes')){$('ctrl').innerHTML+=`<button class="btn ghost sm" id="bDes">Encerrar a fase</button>`;$('bDes').onclick=()=>fimFase(k*30,false,'Uma solução era 7 solares, 2 eólicas e 2 térmicas. O sol cobre o dia, o vento ajuda na seca e a térmica fica só de reserva.','Por que a térmica ainda aparece numa matriz limpa?');}}}};
 ctrl();metas();acao('Escolha quantas usinas de cada tipo. Já existem 2 hidrelétricas. Depois aperte <b>▶ Testar os dois anos</b>.');rodar();}

/* ================= GUIA DO PROFESSOR ================= */
function guia(){parar();$('hud').style.display='none';$('rankBox').style.display='none';
 $('tela').innerHTML=`<div class="card guia">
 <div class="row top noprint"><button class="btn ghost sm" id="bVt">← Voltar</button><button class="btn sm" id="bPr">🖨️ Imprimir guia</button></div>
 <h2 style="margin-top:10px">Guia do professor · Energia da Cidade</h2>
 <p class="small">Ensino Médio · Ciências da Natureza e suas Tecnologias · Física, Química e Geografia</p>
 <h3>Habilidade da BNCC</h3>
 <div class="hab"><b>EM13CNT309.</b> Analisar questões socioambientais, políticas e econômicas relativas à dependência do mundo atual em relação aos recursos não renováveis e discutir a necessidade de introdução de alternativas e novas tecnologias energéticas e de materiais, comparando diferentes tipos de motores e processos de produção de novos materiais.</div>
 <h3>Objetivos da aula</h3>
 <ul><li>Diferenciar fontes renováveis e não renováveis.</li><li>Explicar a intermitência do sol e o papel do armazenamento.</li><li>Relacionar seca, hidrelétricas e uso de térmicas fósseis.</li><li>Planejar uma matriz com metas de custo, emissões, segurança e impacto nos rios.</li></ul>
 <h3>Roteiro de 50 minutos</h3>
 <table class="tab"><tr><th>Tempo</th><th>O que fazer</th></tr>
 <tr><td>5 min</td><td>Pergunte: de onde vem a energia da tomada da escola à noite?</td></tr>
 <tr><td>25 min</td><td>Alunos jogam em duplas e anotam a matriz final da fase 5.</td></tr>
 <tr><td>15 min</td><td>Compare as matrizes das duplas e discuta as perguntas de cada fase.</td></tr>
 <tr><td>5 min</td><td>Cada dupla escreve a frase do relatório de campo.</td></tr></table>
 <h3>Fase por fase</h3>
 <table class="tab"><tr><th>Fase</th><th>O aluno faz</th><th>Pergunta para a turma</th><th>O que explicar</th></tr>
 <tr><td>1. O que gira a turbina?</td><td>Descobre a fonte de cada usina e classifica</td><td>Renovável é sem impacto?</td><td>Toda fonte tem impacto. A diferença está em se renovar e em quanto carbono fóssil devolve ao ar.</td></tr>
 <tr><td>2. Sol e a noite</td><td>Varia o número de painéis</td><td>Por que mais painéis não acabam com a térmica?</td><td>Intermitência: o sol não cobre a noite, e a sobra do dia se perde sem armazenamento.</td></tr>
 <tr><td>3. Guardar o sol</td><td>Combina painéis e baterias com orçamento</td><td>Por que a bateria sozinha não ajuda?</td><td>Armazenamento só funciona se houver sobra para guardar.</td></tr>
 <tr><td>4. Ano seco</td><td>Prevê e testa um ano de pouca chuva</td><td>Por que depender de uma fonte é frágil?</td><td>Sistemas apoiados em hidrelétricas usam mais térmica na seca. No Nordeste, o vento tende a ser mais forte na estação seca e complementa a água.</td></tr>
 <tr><td>5. Planeje a matriz</td><td>Cumpre metas de custo, CO₂, segurança e rios</td><td>Por que a térmica ainda aparece numa matriz limpa?</td><td>Barragens alteram o regime dos rios que alimentam o Pantanal. Diversificar reduz riscos.</td></tr></table>
 <h3>Avaliação</h3>
 <p>Use o relatório de campo impresso e a frase escrita por cada dupla. Todos os instrumentos têm o mesmo peso. Observe se o aluno justifica a matriz com mais de um critério.</p>
 <h3>Sequência de 3 aulas</h3>
 <ol><li><b>Aula 1.</b> Jogo completo e discussão.</li><li><b>Aula 2.</b> Leitura guiada sobre barragens nos rios que alimentam o Pantanal (Ely et al., 2020).</li><li><b>Aula 3.</b> As duplas analisam a conta de luz da casa e propõem formas de reduzir o consumo no horário de pico.</li></ol>
 <h3>Cuidado ao explicar</h3>
 <p>Os números de geração, custo e CO₂ do jogo vêm de um modelo simples e não representam usinas reais. As usinas a bagaço são renováveis, mas também queimam e soltam CO₂ e partículas.</p>
 <h3>Referências</h3>
 <ul class="ref">
 <li>Ely P., Fantin-Cruz I., Tritico H.M., Girard P., Kaplan D. 2020. Dam-induced hydrologic alterations in the rivers feeding the Pantanal. Frontiers in Environmental Science 8: 579031. doi:10.3389/fenvs.2020.579031</li>
 <li>Silva A.R., Pimenta F.M., Assireu A.T., Spyrides M.H.C. 2016. Complementarity of Brazil's hydro and offshore wind power. Renewable and Sustainable Energy Reviews 56: 413-427. doi:10.1016/j.rser.2015.11.045</li></ul>
