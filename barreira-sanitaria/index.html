<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barreira Sanitária</title>
<style>
:root{--main:#b8860b;--deep:#7a5900;--soft:#fff8e1;--line:#f3e3b5;--ink:#2a2414;--mut:#6b5d3d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:var(--ink);line-height:1.45}
.wrap{max-width:780px;margin:0 auto;padding:12px 14px 40px}
a.hub{color:var(--deep);font-weight:700;text-decoration:none;font-size:.9rem}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
h1{font-size:1.4rem;color:var(--deep)}h2{font-size:1.15rem;color:var(--deep);margin-bottom:6px}
.hud{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--soft);color:var(--deep);border-radius:99px;padding:5px 11px;font-weight:700;font-size:.86rem}
.card{border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;background:#fff}
.btn{background:var(--main);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--deep)}.btn.ghost{background:#fff;color:var(--deep);border:2px solid var(--main)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.small{font-size:.86rem;color:var(--mut)}
canvas{width:100%;max-width:620px;margin:0 auto;display:block;border:2px solid var(--line);border-radius:16px;touch-action:none;background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:6px;justify-content:center;margin-top:10px}
.pad button{border:2px solid var(--line);background:var(--soft);border-radius:12px;font-size:1.4rem;cursor:pointer;color:var(--deep);touch-action:manipulation}
.pad button:active{background:#dcedc8}
.tab{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:8px}.tab td{border-bottom:1px solid var(--line);padding:5px 4px;vertical-align:top}
.ops{display:grid;gap:8px;margin-top:10px}
.ops button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-size:.95rem;cursor:pointer;font-family:inherit;text-align:left;color:var(--ink)}
.ops button:hover{border-color:var(--main)}.ops button:disabled{opacity:.5;cursor:default}
.fb{margin-top:10px;padding:11px 13px;border-radius:12px;font-size:.93rem}
.fb.good{background:#e8f5e9;color:#1b5e20}.fb.bad{background:#ffebee;color:#8e1b1b}
.big{font-size:2.3rem;font-weight:800;color:var(--deep)}
.ranking{border:3px solid var(--main);border-radius:18px;padding:0 16px 12px;overflow:hidden;margin-top:12px}
.ranking h3{font-size:1rem;margin:0 -16px 8px;padding:10px 16px;background:var(--main);color:#fff}
.ranking ol{list-style:none}.ranking li{display:flex;justify-content:space-between;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:.92rem}
.ranking li:last-child{border-bottom:0}.rp{display:inline-block;min-width:2.1em;font-weight:800;color:var(--deep)}
.savebox{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.savebox input{flex:1;min-width:160px;border:2px solid var(--line);border-radius:12px;padding:11px;font-size:1rem;font-family:inherit}
.cena{position:relative;max-width:620px;margin:6px auto 0}
.cena svg{width:100%;display:block}
.hs{position:absolute;transform:translate(-50%,-50%);border:3px solid var(--main);background:#fff;border-radius:50%;width:38px;height:38px;font-weight:800;color:var(--deep);cursor:pointer;font-size:1rem;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.hs:hover{background:var(--soft)}.hs.vis{border-color:#90a4ae;color:#607d8b}.hs.prob{border-color:#c62828;background:#ffebee;color:#c62828}
.achados{display:grid;gap:8px;margin-top:10px}
.ach{border:2px solid var(--line);border-radius:12px;padding:9px 11px;font-size:.92rem}
.ach.prob{border-color:#ef9a9a;background:#fff5f5}.ach.ok{border-color:#c8e6c9;background:#f6fff6}
.ach select{margin-top:6px;width:100%;padding:8px;border-radius:10px;border:2px solid var(--line);font-family:inherit;font-size:.9rem;background:#fff}
.fila{display:flex;gap:4px;flex-wrap:wrap}.fila span{font-size:1.2rem}
.relogio{height:8px;border-radius:6px;background:#eee;overflow:hidden;margin-top:6px}.relogio div{height:100%;background:var(--main);transition:width .3s}
</style>
</head>
<body>
<div class="wrap">
<a class="hub" href="https://ernandes-sobreira.github.io/jogos-ambientais/">← Todos os jogos</a>
<header>
  <h1><svg viewBox="0 0 60 40" width="40" height="27" style="vertical-align:-5px" aria-label="mexilhão-dourado"><ellipse cx="22" cy="22" rx="16" ry="8" transform="rotate(-25 22 22)" fill="#d4a017" stroke="#7a5900" stroke-width="2"/><path d="M10 27 Q22 20 34 16" stroke="#7a5900" stroke-width="1.5" fill="none"/><ellipse cx="40" cy="22" rx="14" ry="7" transform="rotate(20 40 22)" fill="#e0b52a" stroke="#7a5900" stroke-width="2"/><path d="M29 18 Q40 22 51 26" stroke="#7a5900" stroke-width="1.5" fill="none"/></svg> Barreira Sanitária</h1>
  <div class="hud" id="hud" style="display:none"><span class="pill" id="hF">Fase 1/3</span><span class="pill" id="hP">0 pts</span><span class="pill" id="hR">🚤 0</span><span class="pill" id="hV">⚠️ 0</span><span class="pill" id="hT">⏱ 0</span></div>
</header>
<main id="tela"></main>
<div class="ranking" id="rankBox"><h3>Ranking Global</h3><ol id="rankList"><li><span>Carregando o ranking...</span></li></ol><p class="small" id="rankNote"></p></div>
</div>
<script>
const $=id=>document.getElementById(id);
const rr=(a,b)=>a+Math.random()*(b-a);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let actx=null;function beep(f,d,v){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.setValueAtTime(v||.05,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(e){}}

/* Pontos de inspeção e procedimentos, conforme as orientações de prevenção do mexilhão-dourado
   (Ibama, Plano de Ação Emergencial 2004; regras para embarcações publicadas no DOU; folder de orientação). */
const PONTOS={
 casco:{n:'Casco',x:28,y:64,prob:'Crosta de pequenos mexilhões dourados grudada no casco.',ok:'Casco liso, sem incrustação.',certo:'raspar'},
 motor:{n:'Motor',x:88,y:36,prob:'Sobrou água do rio no sistema de resfriamento do motor.',ok:'Motor drenado e seco.',certo:'motor'},
 porao:{n:'Fundo do barco',x:42,y:52,prob:'Água do rio acumulada no fundo do barco.',ok:'Fundo do barco seco.',certo:'drenar'},
 viveiro:{n:'Viveiro de isca',x:70,y:54,prob:'Viveiro de isca viva cheio de água do rio.',ok:'Viveiro vazio e seco.',certo:'drenar'},
 reboque:{n:'Reboque',x:46,y:80,prob:'Aguapé enroscado no eixo do reboque.',ok:'Reboque limpo.',certo:'vegetacao'},
 redes:{n:'Redes e cordas',x:16,y:36,prob:'Redes e cordas guardadas ainda molhadas.',ok:'Redes e cordas secas.',certo:'secar'}
};
const PROC={
 raspar:'Raspar as incrustações e descartar os resíduos em terra',
 motor:'Drenar o motor e lavar o sistema de resfriamento',
 drenar:'Esvaziar a água em terra firme, longe do rio',
 vegetacao:'Retirar toda a vegetação presa no barco e no reboque',
 secar:'Lavar com água sanitária e deixar secar ao sol',
 rio:'Despejar no rio, longe da rampa',
 enxague:'Enxaguar com a água do próprio rio',
 nada:'Não precisa fazer nada'
};
const BARCOS=['Barco de pesca com reboque','Lancha de passeio','Chalana de turismo','Barco de pescador profissional','Voadeira de alumínio','Barco de isca viva'];
const FASES=[
 {nome:'Primeiro plantão',n:4,dur:150,custo:2,dica:true,meta:1,txt:'Barcos vão sair do rio Paraguai para outro rio onde o mexilhão ainda não chegou. Inspecione os pontos de cada barco, escolha o procedimento certo para cada problema e só então libere. Nesta fase, os problemas que dá para ver aparecem em vermelho.'},
 {nome:'Fila na rampa',n:6,dur:200,custo:2,dica:false,meta:1,txt:'Agora nada aparece marcado. A larva do mexilhão é invisível a olho nu: água parada no barco também é problema, mesmo sem nenhum mexilhão à vista.'},
 {nome:'Feriado prolongado',n:8,dur:250,custo:2.5,dica:false,meta:1,txt:'Muitos barcos e pouco tempo. Cada inspeção gasta mais tempo do relógio. Barco que ficar na fila no fim do plantão sai sem inspeção.'}
];
const PERG=[
 {q:'Por que esvaziar em terra a água parada no barco, mesmo sem ver nenhum mexilhão?',o:['A larva é tão pequena que não se vê a olho nu','A água do rio estraga o motor de alumínio','O peso da água deixa o barco mais lento']},
 {q:'O que fazer com os mexilhões raspados do casco?',o:['Descartar em terra, longe da água','Jogar de volta no rio onde foram tirados','Guardar no barco até chegar ao próximo rio']},
 {q:'Nas regras de prevenção publicadas para embarcações, por quanto tempo é ótimo deixar o barco secar ao tempo?',o:['Cinco dias','Uma hora','Um ano']}
];
let S,tick=null;
function hud(){$('hud').style.display='flex';$('hF').textContent='Fase '+(S.f+1)+'/3';$('hP').textContent=(S.tot+S.fp)+' pts';
 if(S.g){$('hR').textContent='🚤 '+S.g.feitos+'/'+FASES[S.f].n;$('hV').textContent='⚠️ '+S.g.risco+' risco';$('hT').textContent='⏱ '+Math.max(0,Math.ceil(S.g.resta))+' s';}}
function inicio(){
 parar();$('hud').style.display='none';$('rankBox').style.display='block';
 $('tela').innerHTML=`<div class="card"><h2>Barreira Sanitária contra o mexilhão-dourado</h2>
 <p>Você trabalha num posto de inspeção na rampa de barcos. O mexilhão-dourado já está no rio Paraguai. Os barcos que saem daqui vão para um rio onde ele ainda não chegou.</p>
 <table class="tab"><tr><td>🔎</td><td>Toque nos números para inspecionar cada ponto do barco. Cada inspeção gasta alguns segundos do plantão.</td></tr>
 <tr><td>🧽</td><td>Para cada problema, escolha o procedimento. Certo vale +10. Errado tira 10 e o problema continua.</td></tr>
 <tr><td>⚠️</td><td>Problema que sai do posto sem tratamento é risco de invasão: −25.</td></tr>
 <tr><td>⏱</td><td>Barco que fica na fila no fim do plantão sai sem inspeção: −15 e mais risco.</td></tr></table>
 <p class="small" style="margin-top:8px">🎯 Meta: atender todos os barcos deixando sair no máximo 1 problema sem tratamento.</p>
 <div class="row" style="margin-top:12px"><button class="btn" onclick="novo()">Começar →</button></div></div>`;
}
function novo(){S={f:0,tot:0,fp:0};salvo=false;$('rankBox').style.display='none';fase();}
function fase(){const F=FASES[S.f];S.fp=0;S.g=null;parar();hud();
 $('tela').innerHTML=`<div class="card"><h2>Fase ${S.f+1}: ${F.nome}</h2><p>${F.txt}</p><p class="small" style="margin-top:6px">${F.n} barcos em ${F.dur} s. 🎯 Meta: atender todos e deixar sair no máximo ${F.meta} problema sem tratamento.</p><div class="row" style="margin-top:12px"><button class="btn" id="bg">Abrir o posto →</button></div></div>`;
 $('bg').onclick=plantao;}
function gerarBarco(i){const F=FASES[S.f];const ks=Object.keys(PONTOS);
 const nprob=S.f===0?2+Math.floor(Math.random()*2):1+Math.floor(Math.random()*4);
 const probs=new Set(shuf(ks).slice(0,nprob));
 // na fase 3, alguns barcos chegam já limpos
 if(S.f===2&&Math.random()<.2)probs.clear();
 return {nome:BARCOS[i%BARCOS.length],probs,visto:{},proc:{}};}
function plantao(){const F=FASES[S.f];
 S.g={resta:F.dur,fila:Array.from({length:F.n},(_,i)=>gerarBarco(i)),feitos:0,risco:0,atual:null,fim:false,log:[]};
 proximo();parar();tick=setInterval(()=>{const g=S.g;if(!g||g.fim)return;g.resta-=.25;hud();const r=$('rel');if(r)r.style.width=Math.max(0,100*g.resta/F.dur)+'%';if(g.resta<=0)fimPlantao();},250);}
function parar(){if(tick)clearInterval(tick);tick=null;}
function svgBarco(b){const F=FASES[S.f];const crosta=b.probs.has('casco'),aguape=b.probs.has('reboque');
 return `<svg viewBox="0 0 100 100" aria-label="barco sobre reboque">
 <rect x="0" y="86" width="100" height="14" fill="#eceff1"/>
 <path d="M6 84 L92 84" stroke="#607d8b" stroke-width="2"/>
 <circle cx="24" cy="86" r="5" fill="#455a64"/><circle cx="24" cy="86" r="2" fill="#cfd8dc"/>
 <circle cx="66" cy="86" r="5" fill="#455a64"/><circle cx="66" cy="86" r="2" fill="#cfd8dc"/>
 <path d="M10 76 L82 76 L96 84" stroke="#78909c" stroke-width="2.5" fill="none"/>
 <path d="M8 46 L84 46 L78 70 Q60 76 20 74 Q12 70 8 46 Z" fill="#fafafa" stroke="#546e7a" stroke-width="1.5"/>
 <path d="M10 56 L82 56" stroke="#90a4ae" stroke-width="1"/>
 ${crosta?Array.from({length:18},(_,i)=>`<ellipse cx="${18+i*3.4}" cy="${66+(i%3)*2.2}" rx="1.8" ry="1.1" fill="${i%2?'#c9930c':'#e8b923'}" stroke="#7a5900" stroke-width=".3"/>`).join(''):''}
 <rect x="50" y="32" width="18" height="14" rx="2" fill="#eceff1" stroke="#546e7a"/><rect x="53" y="35" width="12" height="5" fill="#b3e5fc"/>
 <rect x="84" y="30" width="8" height="20" rx="2" fill="#37474f"/><rect x="86" y="50" width="3" height="18" fill="#37474f"/>
 <path d="M12 40 q6 -6 12 0 q-6 4 -12 0" fill="#a1887f"/>
 ${aguape?'<path d="M16 78 q4 -6 8 0 q3 -5 6 0" fill="#66bb6a"/><circle cx="20" cy="76" r="2" fill="#81c784"/><circle cx="27" cy="77" r="1.8" fill="#9575cd"/>':''}
 </svg>`;}
function proximo(){const g=S.g;if(g.fila.length===0){fimPlantao();return;}
 g.atual=g.fila.shift();desenha();}
function desenha(msg){const g=S.g,b=g.atual,F=FASES[S.f];if(!b)return;
 const hs=Object.entries(PONTOS).map(([k,p],i)=>{const v=b.visto[k];const cls=v?(b.probs.has(k)?'prob':'vis'):(F.dica&&b.probs.has(k)&&(k==='casco'||k==='reboque')?'prob':'');
  return `<button class="hs ${cls}" data-k="${k}" style="left:${p.x}%;top:${p.y}%" title="${p.n}">${i+1}</button>`;}).join('');
 const opts=k=>{const base=['raspar','motor','drenar','vegetacao','secar','rio','enxague'];return `<option value="">Escolha o procedimento...</option>`+shuf(base).map(o=>`<option value="${o}" ${b.proc[k]===o?'selected':''}>${PROC[o]}</option>`).join('');};
 const ach=Object.keys(b.visto).map(k=>{const p=PONTOS[k],pr=b.probs.has(k);return `<div class="ach ${pr?'prob':'ok'}"><b>${p.n}:</b> ${pr?p.prob:p.ok}${pr?`<select data-p="${k}">${opts(k)}</select>`:''}</div>`;}).join('');
 $('tela').innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">🚤 ${b.nome}</h2><div class="fila">${'🚤'.repeat(g.fila.length)}<span class="small">na fila</span></div></div>
 <div class="relogio"><div id="rel" style="width:${100*g.resta/F.dur}%"></div></div>
 <div class="cena">${svgBarco(b)}${hs}</div>
 <p class="small" style="text-align:center">Pontos: ${Object.entries(PONTOS).map(([k,p],i)=>`${i+1} ${p.n}`).join(' · ')}</p>
 <div class="achados">${ach||'<div class="small">Toque nos números para inspecionar.</div>'}</div>
 ${msg||''}
 <div class="row" style="margin-top:12px"><button class="btn" id="lib">Liberar barco →</button></div></div>`;
 document.querySelectorAll('.hs').forEach(x=>x.onclick=()=>inspecionar(x.dataset.k));
 document.querySelectorAll('.ach select').forEach(s=>s.onchange=()=>{b.proc[s.dataset.p]=s.value;});
 $('lib').onclick=liberar;}
function inspecionar(k){const g=S.g,b=g.atual,F=FASES[S.f];if(b.visto[k])return;b.visto[k]=true;g.resta-=F.custo;beep(b.probs.has(k)?300:600,.08);hud();desenha();}
function liberar(){const g=S.g,b=g.atual;let pts=0,risco=0,linhas=[];
 for(const k of b.probs){const p=PONTOS[k];
  if(!b.visto[k]){pts-=25;risco++;linhas.push(`❌ ${p.n}: não inspecionado. ${p.prob} (−25)`);}
  else if(b.proc[k]===p.certo){pts+=10;linhas.push(`✅ ${p.n}: ${PROC[p.certo]}. (+10)`);}
  else{pts-=10;risco++;pts-=25;linhas.push(`❌ ${p.n}: ${b.proc[k]?PROC[b.proc[k]]:'nenhum procedimento'} não resolve. O certo era: ${PROC[p.certo]}. (−35)`);}}
 if(!b.probs.size)linhas.push('✅ Barco sem problema. Liberado.');
 S.fp+=pts;g.risco+=risco;g.feitos++;g.atual=null;beep(risco?150:880,.18);hud();
 const F=FASES[S.f];
 $('tela').innerHTML=`<div class="card"><h2>${risco?'⚠️ Barco saiu com risco':'✅ Barco liberado com segurança'}</h2><div class="achados">${linhas.map(l=>`<div class="ach ${l.startsWith('✅')?'ok':'prob'}">${l}</div>`).join('')}</div>
 <div class="row" style="margin-top:12px"><button class="btn" id="bp">${g.fila.length?'Próximo barco →':'Fechar o plantão →'}</button></div></div>`;
 $('bp').onclick=()=>{if(g.fim)return;proximo();};}
function fimPlantao(){const g=S.g;if(!g||g.fim)return;g.fim=true;parar();const F=FASES[S.f];
 const sobra=F.n-g.feitos;let riscoFila=0;
 if(sobra>0){S.fp-=15*sobra;const pend=[...(g.atual?[g.atual]:[]),...g.fila];for(const b of pend)riscoFila+=b.probs.size;g.risco+=riscoFila;}
 const ok=sobra===0&&g.risco<=F.meta;if(ok){S.fp+=30;beep(880,.2);}hud();
 $('tela').innerHTML=`<div class="card"><h2>${ok?'Plantão sem invasão':'O mexilhão pode ter passado'}</h2>
 <p>Barcos atendidos: <b>${g.feitos}</b> de ${F.n}. Problemas que saíram sem tratamento: <b>${g.risco}</b> (meta: no máximo ${F.meta}).</p>
 ${ok?'<div class="fb good">🎯 Meta cumprida! +30.</div>':`<div class="fb bad">${sobra?`${sobra} barco(s) ficaram na fila e saíram sem inspeção. `:''}Inspecione os pontos com água parada mesmo quando não aparece mexilhão.</div>`}
 <div class="row" style="margin-top:12px">${ok?'<button class="btn" id="bq">Pergunta da fase →</button>':'<button class="btn" id="br">Tentar de novo</button><button class="btn ghost" id="be">Encerrar</button>'}</div></div>`;
 if(ok)$('bq').onclick=pergunta;else{$('br').onclick=fase;$('be').onclick=()=>{S.tot+=Math.max(0,S.fp);S.fp=0;final(false);};}
}
function pergunta(){
 const P=PERG[S.f],ops=shuf(P.o.map((t,i)=>({t,c:i===0})));
 $('tela').innerHTML=`<div class="card"><h2>Pergunta da fase</h2><p style="margin:6px 0 4px">${P.q}</p><p class="small">Acerto +20, erro −10.</p><div class="ops">${ops.map((o,i)=>`<button data-i="${i}">${o.t}</button>`).join('')}</div><div id="pf"></div></div>`;
 document.querySelectorAll('#tela .ops button').forEach(b=>b.onclick=()=>{const o=ops[+b.dataset.i];S.fp+=o.c?20:-10;beep(o.c?880:170,.15);hud();
  document.querySelectorAll('#tela .ops button').forEach((x,j)=>{x.disabled=true;if(ops[j].c){x.style.borderColor='#2e7d32';x.style.opacity=1;}});
  $('pf').innerHTML=`<div class="fb ${o.c?'good':'bad'}">${o.c?'✅ +20.':'❌ −10. A resposta certa está marcada em verde.'}<div class="row" style="margin-top:10px"><button class="btn" id="bn">${S.f===FASES.length-1?'Ver resultado →':'Próxima fase →'}</button></div></div>`;
  $('bn').onclick=()=>{S.tot+=S.fp;S.fp=0;if(S.f===FASES.length-1)final(true);else{S.f++;fase();}};});
}
function final(tudo){
 S.g=null;parar();$('rankBox').style.display='block';const nivel=tudo?'3 fases':'Fase '+(S.f+1);
 $('tela').innerHTML=`<div class="card" style="text-align:center"><div class="big">${tudo?'🏆':'🚤'}</div><h2>${tudo?'O rio vizinho continua livre do mexilhão!':'Fim de jogo'}</h2><div class="big">${S.tot} pts</div>
 <div class="savebox"><input id="pName" maxlength="20" placeholder="Seu nome"><button class="btn" id="bS">Salvar no ranking</button></div><p class="small" id="sSt"></p>
